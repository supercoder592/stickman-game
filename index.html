* 0.72, y: h.y + r * 0.8 },\n      ], 0.5);\n      shade(ctx, p, mat(M.armor), opt(h.x, h.y, r * 1.5, { ao: 0.4 }));\n      if (!flat) {\n        ctx.save();\n        ctx.clip(p);\n        ctx.fillStyle = 'rgba(10,14,20,0.92)';\n        ctx.fillRect(h.x - r * 0.9, h.y - r * 0.42, r * 1.9, r * 0.44);\n        ctx.fillStyle = withAlpha(char.accent, 0.4);\n        ctx.fillRect(h.x - r * 0.9, h.y - r * 0.36, r * 1.9, r * 0.1);\n        ctx.restore();\n      }\n      break;\n    }\n    case 'gasmask': {     // 防毒面具：兩個濾罐 + 鏡片\n      shade(ctx, poly([\n        { x: h.x - r * 0.9, y: h.y - r * 0.7 }, { x: h.x + r * 0.95, y: h.y - r * 0.6 },\n        { x: h.x + r * 0.85, y: h.y + r * 0.75 }, { x: h.x - r * 0.85, y: h.y + r * 0.6 },\n      ]), mat(M.rubber), opt(h.x, h.y, r * 1.4));\n      if (!flat) {\n        for (const s2 of [-0.3, 0.44]) {\n          const gx = h.x + r * s2, gy = h.y - r * 0.14;\n          shade(ctx, capsule(gx, gy, gx + 0.4, gy, r * 0.2), mat(M.metal), opt(gx, gy, r * 0.4));\n          bloom(ctx, gx, gy, r * 0.32, char.accent, 0.2);\n        }\n        shade(ctx, capsule(h.x + r * 0.55, h.y + r * 0.55, h.x + r * 0.9, h.y + r * 0.8, r * 0.34), mat(M.iron), opt(h.x, h.y, r));\n      }\n      break;\n    }\n    case 'hood': {        // 兜帽：布料蓋住上半臉\n      const p = poly([\n        { x: h.x - r * 1.15, y: h.y + r * 0.9 },\n        { x: h.x - r * 1.05, y: h.y - r * 0.5 },\n        { x: h.x - r * 0.1, y: h.y - r * 1.5 },\n        { x: h.x + r * 1.05, y: h.y - r * 0.5 },\n        { x: h.x + r * 0.85, y: h.y + r * 0.45 },\n        { x: h.x + r * 0.2, y: h.y + r * 0.2 },\n      ]);\n      shade(ctx, p, mat(M.cloth), opt(h.x, h.y - r * 0.3, r * 1.7, { ao: 0.5 }));\n      if (!flat) {\n        ctx.fillStyle = 'rgba(0,0,0,0.75)';\n        ctx.beginPath();\n        ctx.ellipse(h.x + r * 0.15, h.y + r * 0.02, r * 0.62, r * 0.42, 0, 0, Math.PI * 2);\n        ctx.fill();\n        bloom(ctx, h.x + r * 0.3, h.y, r * 0.34, char.accent, 0.45);\n      }\n      break;\n    }\n    case 'helmet': {      // 全罩鋼盔 + 護目鏡\n      const p = smooth([\n        { x: h.x - r * 0.92, y: h.y + r * 0.6 },\n        { x: h.x - r * 0.98, y: h.y - r * 0.3 },\n        { x: h.x - r * 0.2, y: h.y - r * 1.15 },\n        { x: h.x + r * 0.8, y: h.y - r * 0.72 },\n        { x: h.x + r * 0.98, y: h.y + r * 0.2 },\n        { x: h.x + r * 0.7, y: h.y + r * 0.8 },\n      ], 0.55);\n      shade(ctx, p, mat(M.metal), opt(h.x, h.y - r * 0.2, r * 1.6, { ao: 0.35 }));\n      if (!flat) {\n        ctx.fillStyle = 'rgba(8,10,16,0.95)';\n        ctx.fillRect(h.x - r * 0.2, h.y - r * 0.25, r * 1.2, r * 0.42);\n        bloom(ctx, h.x + r * 0.5, h.y - r * 0.05, r * 0.4, char.accent, 0.4);\n      }\n      break;\n    }\n    case 'goggles': {     // 護目鏡推在額頭上，臉看得見\n      drawHair(ctx, h, r, hair, hairColor, flat);\n      drawFace(ctx, h, r, char, flat);\n      shade(ctx, smooth([\n        { x: h.x - r * 1.0, y: h.y - r * 0.95 }, { x: h.x + r * 0.95, y: h.y - r * 0.82 },\n        { x: h.x + r * 0.9, y: h.y - r * 0.44 }, { x: h.x - r * 0.98, y: h.y - r * 0.58 },\n      ], 0.35), mat(M.strap), opt(h.x, h.y - r * 0.7, r * 0.7));\n      if (!flat) {\n        for (const s2 of [-0.3, 0.42]) {\n          const gx = h.x + r * s2, gy = h.y - r * 0.68;\n          shade(ctx, capsule(gx, gy, gx + 0.3, gy, r * 0.24), mat(M.metal), opt(gx, gy, r * 0.4));\n        }\n      }\n      break;\n    }\n    case 'horned': {      // 角盔\n      const p = smooth([\n        { x: h.x - r * 0.9, y: h.y + r * 0.5 }, { x: h.x - r * 0.95, y: h.y - r * 0.4 },\n        { x: h.x + r * 0.15, y: h.y - r * 1.12 }, { x: h.x + r * 0.95, y: h.y - r * 0.2 },\n        { x: h.x + r * 0.76, y: h.y + r * 0.72 },\n      ], 0.6);\n      shade(ctx, p, mat(M.armor), opt(h.x, h.y, r * 1.5, { ao: 0.35 }));\n      for (const s of [-1, 1]) {\n        const horn = poly([\n          { x: h.x + s * r * 0.7, y: h.y - r * 0.5 },\n          { x: h.x + s * r * 1.5, y: h.y - r * 1.4 },\n          { x: h.x + s * r * 0.9, y: h.y - r * 0.12 },\n        ]);\n        shade(ctx, horn, mat(M.bone), opt(h.x + s * r, h.y - r, r));\n      }\n      if (!flat) bloom(ctx, h.x + r * 0.45, h.y - r * 0.05, r * 0.36, char.accent, 0.4);\n      break;\n    }\n    case 'mask': {        // 半罩戰術面罩\n      shade(ctx, poly([\n        { x: h.x - r * 0.75, y: h.y - r * 0.1 }, { x: h.x + r * 0.95, y: h.y - r * 0.05 },\n        { x: h.x + r * 0.8, y: h.y + r * 0.85 }, { x: h.x - r * 0.5, y: h.y + r * 0.9 },\n      ]), mat(M.rubber), opt(h.x, h.y + r * 0.3, r));\n      if (!flat) {\n        ctx.fillStyle = 'rgba(0,0,0,0.6)';\n        ctx.fillRect(h.x - r * 0.5, h.y - r * 0.45, r * 1.3, r * 0.28);\n        bloom(ctx, h.x + r * 0.45, h.y - r * 0.3, r * 0.32, char.accent, 0.45);\n      }\n      // 頭髮\n      shade(ctx, poly([\n        { x: h.x - r * 0.9, y: h.y - r * 0.5 }, { x: h.x - r * 0.2, y: h.y - r * 1.2 },\n        { x: h.x + r * 0.8, y: h.y - r * 0.75 }, { x: h.x + r * 0.4, y: h.y - r * 0.45 },\n      ]), mat(M.cloth), opt(h.x, h.y - r * 0.7, r));\n      break;\n    }\n    case 'headband': {    // 綁頭帶：街機格鬥的經典造型，帶尾會飄\n      drawHair(ctx, h, r, hair, hairColor, flat);\n      drawFace(ctx, h, r, char, flat);\n      const band = {\n        base: char.color, light: mixColor(char.color, '#ffffff', 0.35),\n        dark: mixColor(char.color, '#000000', 0.4), spec: 0.1, rough: 0.9,\n      };\n      shade(ctx, poly([\n        { x: h.x - r * 1.02, y: h.y - r * 0.62 }, { x: h.x + r * 0.92, y: h.y - r * 0.5 },\n        { x: h.x + r * 0.88, y: h.y - r * 0.18 }, { x: h.x - r * 1.0, y: h.y - r * 0.28 },\n      ]), band, opt(h.x, h.y - r * 0.4, r));\n      if (!flat) {\n        const sway = Math.sin(t * 3.4) * r * 0.3;\n        for (const k of [0, 1]) {\n          shade(ctx, poly([\n            { x: h.x - r * 0.95, y: h.y - r * 0.55 + k * r * 0.22 },\n            { x: h.x - r * 2.3, y: h.y - r * 0.2 + sway + k * r * 0.5 },\n            { x: h.x - r * 2.25, y: h.y + r * 0.08 + sway + k * r * 0.5 },\n            { x: h.x - r * 0.95, y: h.y - r * 0.25 + k * r * 0.22 },\n          ]), band, opt(h.x - r * 1.5, h.y, r));\n        }\n      }\n      break;\n    }\n    case 'none':\n    default:\n      // 素顏：頭髮 + 臉\n      drawHair(ctx, h, r, hair, hairColor, flat);\n      drawFace(ctx, h, r, char, flat);\n      break;\n  }\n}\n\nfunction drawBackGear(ctx, char, J, M, { mat, opt, t, bulk, flat }) {\n  const style = (char.gear && char.gear.back) || 'none';\n  const c = J.chest;\n  switch (style) {\n    case 'toolbelt': {   // 背在腰後的工具：鐵管、扳手、備用指虎\n      const bx = c.x - 16 * bulk, by = c.y + 30;\n      shade(ctx, capsule(bx - 8 * bulk, by - 10, bx + 6 * bulk, by + 12, 4.2 * bulk, 3.4 * bulk),\n        mat(M.metal), opt(bx, by, 14, { ao: 0.4 }));\n      shade(ctx, capsule(bx - 3 * bulk, by - 16, bx + 9 * bulk, by + 4, 3.2 * bulk, 2.6 * bulk),\n        mat(M.darkIron), opt(bx, by, 12, { ao: 0.35 }));\n      shade(ctx, poly([\n        { x: bx - 12 * bulk, y: by + 14 }, { x: bx + 10 * bulk, y: by + 12 },\n        { x: bx + 10 * bulk, y: by + 20 }, { x: bx - 12 * bulk, y: by + 22 },\n      ]), mat(M.strap), opt(bx, by + 16, 14, { ao: 0.45 }));\n      break;\n    }\n    case 'coil': {        // 盤起來的鎖鏈（鉤索）\n      if (flat) break;\n      for (let i = 0; i < 3; i++) {\n        const rr = 11 * bulk - i * 2.4;\n        ctx.save();\n        ctx.translate(c.x - 17 * bulk, c.y + 10 + i * 2);\n        ctx.scale(1, 0.45);\n        shade(ctx, capsule(-rr, 0, rr, 0, 3.4 * bulk), mat(M.metal), opt(0, 0, rr));\n        ctx.restore();\n      }\n      break;\n    }\n    case 'cloak': {       // 破布斗篷\n      const sway = Math.sin(t * 2.2) * 7;\n      const p = poly([\n        { x: c.x + 4, y: c.y - 8 },\n        { x: c.x - 12 * bulk, y: c.y - 6 },\n        { x: c.x - 30 * bulk - sway, y: c.y + 46 },\n        { x: c.x - 16 * bulk - sway * 0.6, y: c.y + 56 },\n        { x: c.x - 4, y: c.y + 40 },\n        { x: c.x + 10, y: c.y + 22 },\n      ]);\n      shade(ctx, p, mat(M.cloth), opt(c.x - 14, c.y + 20, 40, { ao: 0.5 }));\n      break;\n    }\n    case 'sheath': {      // 背後的刀鞘（雙匕）\n      for (const s of [-1, 1]) {\n        const a = { x: c.x - 6, y: c.y + 2 };\n        const bpt = { x: c.x - 26 * bulk, y: c.y - 16 * s * bulk };\n        shade(ctx, capsule(a.x, a.y, bpt.x, bpt.y, 4 * bulk, 3 * bulk), mat(M.strap), opt(a.x, a.y, 16));\n      }\n      break;\n    }\n    case 'shieldback':    // 保留的掛點：背後掛東西（目前沒有角色用）\n    default:\n      break;\n  }\n}\n\n// ------------------------------------------------------------------ 武器\n/**\n * 武器全部從「前手」長出來，並回傳刀尖／錘頭的位置（給殘影軌跡用）。\n * 每把武器的造型差異就是角色的辨識度：破壞錘一看就重、鉤爪一看就遠。\n */\nfunction drawWeapon(ctx, char, J, M, { mat, opt, bulk, flat, t, f }) {\n  const spec = char.weapon || {};\n  const h = J.handF;\n  const e = J.elbowF;\n  // hold：武器相對前臂的握持角度（重錘扛在肩上、長戟斜舉、盾牌正面朝前）\n  const ang = Math.atan2(h.y - e.y, h.x - e.x) + (spec.hold || 0);\n  const along = (d, o = 0) => ({\n    x: h.x + Math.cos(ang) * d - Math.sin(ang) * o,\n    y: h.y + Math.sin(ang) * d + Math.cos(ang) * o,\n  });\n  const metal = mat(M.metal);\n  const dark = mat(M.darkIron);\n  const wood = mat(MAT.leather);\n  const wrapM = mat(M.wrap);\n  const brass = mat(MAT.brass);\n  let tip = h;\n\n  // --- 武器細節的共用零件 ---\n  /** 纏在握把上的皮繩：一圈一圈的斜紋 */\n  const gripWrap = (d0, d1, w, turns = 5) => {\n    const a = along(d0), b2 = along(d1);\n    const path = capsule(a.x, a.y, b2.x, b2.y, w);\n    shade(ctx, path, wrapM, opt(a.x, a.y, 10, { ao: 0.3 }));\n    if (flat) return;\n    for (let i = 1; i < turns; i++) {\n      const k = i / turns;\n      creaseLine(ctx, path, [\n        along(lerp(d0, d1, k) + 1.4, -w), along(lerp(d0, d1, k) - 1.4, w),\n      ], 'rgba(60,48,34,0.55)', 1.6);\n    }\n  };\n  /** 鉚釘：金屬件固定在一起的痕跡 */\n  const rivets = (ds, off, r2 = 2) => {\n    if (flat) return;\n    for (const d of ds) {\n      const p0 = along(d, off);\n      shade(ctx, capsule(p0.x, p0.y, p0.x + 0.4, p0.y, r2 * bulk), brass, opt(p0.x, p0.y, 4));\n    }\n  };\n  /** 刃面的斜切：沿著刃長畫一條亮線，看起來才是開過鋒的 */\n  const bevel = (path, a, b2, alpha = 0.5) => {\n    if (flat) return;\n    ctx.save();\n    ctx.clip(path);\n    ctx.strokeStyle = `rgba(255,255,255,${alpha})`;\n    ctx.lineWidth = 2;\n    ctx.lineCap = 'round';\n    ctx.beginPath();\n    ctx.moveTo(a.x, a.y);\n    ctx.lineTo(b2.x, b2.y);\n    ctx.stroke();\n    ctx.restore();\n  };\n\n  switch (spec.kind) {\n    case 'hammer': {          // 破壞錘：包鐵的木柄 + 帶箍的方錘頭 + 底部的尖釘\n      const head = along(66 * bulk);\n      const tail = along(-30 * bulk);\n      shade(ctx, capsule(tail.x, tail.y, head.x, head.y, 4.6 * bulk, 4.2 * bulk), wood, opt(h.x, h.y, 30, { ao: 0.3 }));\n      gripWrap(-26 * bulk, 4 * bulk, 5.2 * bulk, 6);\n      // 柄尾的配重球\n      shade(ctx, capsule(tail.x, tail.y, tail.x + 0.5, tail.y, 5.4 * bulk), dark, opt(tail.x, tail.y, 8, { ao: 0.3 }));\n      // 錘頭：本體 + 上下兩道箍 + 中央的加強肋\n      const hw = 20 * bulk, hh = 14.5 * bulk;\n      const block = poly([\n        along(52 * bulk, -hh), along(78 * bulk, -hh * 0.88),\n        along(78 * bulk, hh * 0.88), along(52 * bulk, hh),\n      ]);\n      shade(ctx, block, metal, { ...opt(head.x, head.y, hw * 1.4), ao: 0.45 });\n      for (const d of [58, 72]) {\n        shade(ctx, poly([\n          along(d * bulk, -hh * 0.94), along((d + 3) * bulk, -hh * 0.92),\n          along((d + 3) * bulk, hh * 0.92), along(d * bulk, hh * 0.94),\n        ]), dark, opt(head.x, head.y, 14));\n      }\n      rivets([59.5, 73.5], -hh * 0.6, 1.8);\n      rivets([59.5, 73.5], hh * 0.6, 1.8);\n      // 柄與頭的接合套\n      shade(ctx, poly([along(48 * bulk, -hh * 0.62), along(53 * bulk, -hh * 0.62), along(53 * bulk, hh * 0.62), along(48 * bulk, hh * 0.62)]), dark, opt(head.x, head.y, 14));\n      if (!flat) {\n        // 撞擊面的磨亮痕跡與缺角\n        ctx.save();\n        ctx.clip(block);\n        ctx.globalAlpha = 0.5;\n        ctx.strokeStyle = 'rgba(255,255,255,0.4)';\n        ctx.lineWidth = 2.4;\n        const a1 = along(77 * bulk, -hh * 0.66), a2 = along(77 * bulk, hh * 0.66);\n        ctx.beginPath();\n        ctx.moveTo(a1.x, a1.y);\n        ctx.lineTo(a2.x, a2.y);\n        ctx.stroke();\n        ctx.globalAlpha = 0.45;\n        ctx.fillStyle = '#12141a';\n        const c1 = along(78 * bulk, -hh * 0.2), c2 = along(72 * bulk, -hh * 0.1), c3 = along(78 * bulk, hh * 0.05);\n        ctx.beginPath();\n        ctx.moveTo(c1.x, c1.y); ctx.lineTo(c2.x, c2.y); ctx.lineTo(c3.x, c3.y);\n        ctx.fill();\n        ctx.restore();\n      }\n      tip = along(80 * bulk);\n      break;\n    }\n    case 'grapple': {         // 鉤爪：護臂發射器（含排氣孔與齒輪）+ 有倒鉤的三爪 + 鎖鏈\n      const barrel = along(26 * bulk);\n      shade(ctx, capsule(h.x, h.y, barrel.x, barrel.y, 7.5 * bulk, 6.5 * bulk), dark, opt(h.x, h.y, 16, { ao: 0.3 }));\n      // 機身上的導軌\n      shade(ctx, capsule(along(8 * bulk, -6).x, along(8 * bulk, -6).y, along(25 * bulk, -6).x, along(25 * bulk, -6).y, 2.6 * bulk), metal, opt(h.x, h.y, 10));\n      // 排氣孔\n      if (!flat) {\n        for (const d of [10, 15, 20]) {\n          const v = along(d * bulk, 4.4 * bulk);\n          shade(ctx, capsule(v.x, v.y, v.x + 0.4, v.y, 1.4 * bulk), mat(M.iron), opt(v.x, v.y, 3));\n        }\n        // 捲線的齒輪\n        const g0 = along(2 * bulk, -2 * bulk);\n        shade(ctx, capsule(g0.x, g0.y, g0.x + 0.4, g0.y, 4.6 * bulk), brass, opt(g0.x, g0.y, 7));\n        for (let i = 0; i < 6; i++) {\n          const a2 = (i / 6) * Math.PI * 2 + t * 1.2;\n          const gx = g0.x + Math.cos(a2) * 5 * bulk, gy = g0.y + Math.sin(a2) * 5 * bulk;\n          shade(ctx, capsule(gx, gy, gx + 0.3, gy, 1.2 * bulk), brass, opt(gx, gy, 2));\n        }\n      }\n      // 三爪：每一爪都有倒鉤\n      for (let i = -1; i <= 1; i++) {\n        const c0 = along(26 * bulk, i * 4.5 * bulk);\n        const c1 = along(40 * bulk, i * 8 * bulk);\n        const claw = capsule(c0.x, c0.y, c1.x, c1.y, 2.8 * bulk, 1.2 * bulk);\n        shade(ctx, claw, metal, opt(c0.x, c0.y, 8));\n        bevel(claw, c0, c1, 0.45);\n        // 倒鉤\n        shade(ctx, poly([\n          along(35 * bulk, i * 6.6 * bulk), along(33 * bulk, i * 10.4 * bulk),\n          along(37.5 * bulk, i * 7.6 * bulk),\n        ]), metal, opt(c1.x, c1.y, 6));\n      }\n      if (!flat) drawChain(ctx, h, { x: h.x - 26 * bulk, y: h.y + 30 * bulk }, metal, bulk, opt, 6);\n      tip = along(42 * bulk);\n      break;\n    }\n    case 'chainsaw': {        // 鏈鋸：引擎機殼（拉繩、排氣、握把）+ 導板 + 跑動的鏈條\n      const body = along(14 * bulk);\n      shade(ctx, poly([\n        along(-10 * bulk, -11 * bulk), along(20 * bulk, -9 * bulk),\n        along(20 * bulk, 9 * bulk), along(-10 * bulk, 11 * bulk),\n      ]), dark, opt(body.x, body.y, 20, { ao: 0.4 }));\n      // 上方的護手弓\n      shade(ctx, capsule(along(-4 * bulk, -13 * bulk).x, along(-4 * bulk, -13 * bulk).y,\n        along(16 * bulk, -12 * bulk).x, along(16 * bulk, -12 * bulk).y, 2.4 * bulk), mat(M.iron), opt(body.x, body.y, 12));\n      if (!flat) {\n        // 拉繩的把手\n        const pr = along(-12 * bulk, -2 * bulk);\n        shade(ctx, capsule(pr.x, pr.y, pr.x - 5 * bulk, pr.y + 2, 2 * bulk), wrapM, opt(pr.x, pr.y, 5));\n        // 排氣口\n        for (const d of [0, 5, 10]) {\n          const v = along(d * bulk, 7 * bulk);\n          shade(ctx, capsule(v.x, v.y, v.x + 0.4, v.y, 1.5 * bulk), mat(M.iron), opt(v.x, v.y, 3));\n        }\n        // 火星塞\n        const sp = along(4 * bulk, -8 * bulk);\n        shade(ctx, capsule(sp.x, sp.y, sp.x + 0.4, sp.y, 2 * bulk), brass, opt(sp.x, sp.y, 4));\n      }\n      // 導板\n      const bar = poly([\n        along(20 * bulk, -7 * bulk), along(70 * bulk, -5 * bulk),\n        along(76 * bulk, 0), along(70 * bulk, 5 * bulk), along(20 * bulk, 7 * bulk),\n      ]);\n      shade(ctx, bar, metal, { ...opt(along(46 * bulk).x, along(46 * bulk).y, 26), ao: 0.3 });\n      if (!flat) {\n        // 導板中央的長槽\n        ctx.save();\n        ctx.clip(bar);\n        ctx.fillStyle = 'rgba(20,22,28,0.55)';\n        const s0 = along(28 * bulk, -1.6 * bulk), s1 = along(66 * bulk, -1.2 * bulk);\n        ctx.beginPath();\n        ctx.moveTo(s0.x, s0.y);\n        ctx.lineTo(s1.x, s1.y);\n        ctx.lineTo(s1.x + (s1.y - s0.y) * 0.08, s1.y - (s1.x - s0.x) * 0.08);\n        ctx.lineTo(s0.x + (s1.y - s0.y) * 0.08, s0.y - (s1.x - s0.x) * 0.08);\n        ctx.fill();\n        ctx.restore();\n        // 鋸齒：一節鏈條 + 一顆切刀，跟著時間跑\n        const phase = (t * 40) % 8;\n        for (let d = 22; d < 72; d += 8) {\n          for (const sd of [-1, 1]) {\n            const p0 = along((d + phase) * bulk, sd * 6.6 * bulk);\n            const p1 = along((d + phase + 4.4) * bulk, sd * 6.6 * bulk);\n            shade(ctx, capsule(p0.x, p0.y, p1.x, p1.y, 1.7 * bulk), mat(M.iron), opt(p0.x, p0.y, 3));\n            const q0 = along((d + phase + 1) * bulk, sd * 7.2 * bulk);\n            const q1 = along((d + phase + 3.4) * bulk, sd * 7.2 * bulk);\n            const q2 = along((d + phase + 2.2) * bulk, sd * 11 * bulk);\n            shade(ctx, poly([q0, q1, q2]), metal, opt(q0.x, q0.y, 4));\n          }\n        }\n      }\n      tip = along(78 * bulk);\n      break;\n    }\n    case 'chainscythe': {     // 鎖鏈鐮：手上握鏈 + 甩在外面的鐮刀（刃有血槽與內刃亮線）\n      const anchor = along(10 * bulk);\n      const swinging = f && (f.attack || f.lock > 0);\n      const sw = swinging ? (f.poseK || 0) * 6.0 - 1.2 : 1.15 + Math.sin(t * 1.4) * 0.12;\n      const bladeC = {\n        x: h.x + Math.cos(sw) * 64 * bulk,\n        y: h.y + Math.sin(sw) * 48 * bulk - 10,\n      };\n      if (!flat) drawChain(ctx, anchor, bladeC, metal, bulk, opt, 8);\n      const ba = Math.atan2(bladeC.y - h.y, bladeC.x - h.x);\n      const at = (d, o = 0) => ({\n        x: bladeC.x + Math.cos(ba) * d - Math.sin(ba) * o,\n        y: bladeC.y + Math.sin(ba) * d + Math.cos(ba) * o,\n      });\n      // 柄：纏繩 + 兩端的金屬箍\n      shade(ctx, capsule(at(-14 * bulk).x, at(-14 * bulk).y, at(6 * bulk).x, at(6 * bulk).y, 3.6 * bulk), wood, opt(bladeC.x, bladeC.y, 14));\n      shade(ctx, capsule(at(-12 * bulk).x, at(-12 * bulk).y, at(2 * bulk).x, at(2 * bulk).y, 4 * bulk), wrapM, opt(bladeC.x, bladeC.y, 12, { ao: 0.3 }));\n      for (const d of [-13, 3]) {\n        const r0 = at(d * bulk);\n        shade(ctx, capsule(r0.x, r0.y, r0.x + 0.4, r0.y, 4.4 * bulk), brass, opt(r0.x, r0.y, 6));\n      }\n      // 鐮刃：外弧厚、內刃薄\n      const bl = poly([\n        at(2 * bulk, 2 * bulk),\n        at(20 * bulk, -22 * bulk), at(38 * bulk, -26 * bulk),\n        at(46 * bulk, -12 * bulk), at(30 * bulk, -4 * bulk), at(10 * bulk, 6 * bulk),\n      ]);\n      shade(ctx, bl, metal, { ...opt(bladeC.x, bladeC.y, 30), ao: 0.2 });\n      bevel(bl, at(10 * bulk, -6 * bulk), at(42 * bulk, -14 * bulk), 0.55);\n      if (!flat) {\n        // 血槽\n        creaseLine(ctx, bl, [at(14 * bulk, -12 * bulk), at(36 * bulk, -18 * bulk)], 'rgba(0,0,0,0.32)', 2.4);\n      }\n      tip = at(46 * bulk, -12 * bulk);\n      break;\n    }\n    case 'daggers': {         // 雙匕：護手 + 血槽 + 纏繩握把 + 尾錘\n      for (const [hand, elbow, len] of [[J.handF, J.elbowF, 30], [J.handB, J.elbowB, 26]]) {\n        const a2 = Math.atan2(hand.y - elbow.y, hand.x - elbow.x);\n        const at = (d, o = 0) => ({\n          x: hand.x + Math.cos(a2) * d - Math.sin(a2) * o,\n          y: hand.y + Math.sin(a2) * d + Math.cos(a2) * o,\n        });\n        const tipP = at(len * bulk);\n        const blade = bladeShape(at(6 * bulk).x, at(6 * bulk).y, tipP.x, tipP.y, 4.6 * bulk);\n        shade(ctx, blade, metal, { ...opt(hand.x, hand.y, 18), ao: 0.2 });\n        bevel(blade, at(8 * bulk, 1 * bulk), at((len - 4) * bulk, 0.6 * bulk), 0.55);\n        // 護手\n        shade(ctx, poly([\n          at(4 * bulk, -5.5 * bulk), at(7 * bulk, -5 * bulk),\n          at(7 * bulk, 5 * bulk), at(4 * bulk, 5.5 * bulk),\n        ]), brass, opt(hand.x, hand.y, 8));\n        // 握把 + 尾錘\n        shade(ctx, capsule(at(-9 * bulk).x, at(-9 * bulk).y, at(3 * bulk).x, at(3 * bulk).y, 3 * bulk), wrapM, opt(hand.x, hand.y, 8, { ao: 0.3 }));\n        const pom = at(-11 * bulk);\n        shade(ctx, capsule(pom.x, pom.y, pom.x + 0.4, pom.y, 3.2 * bulk), brass, opt(pom.x, pom.y, 5));\n      }\n      tip = along(32 * bulk);\n      break;\n    }\n    case 'axe': {             // 戰斧：夾住木柄的斧頭（有鉚釘與護條）+ 背面的尖刺 + 纏繩\n      const head = along(54 * bulk);\n      shade(ctx, capsule(along(-26 * bulk).x, along(-26 * bulk).y, along(74 * bulk).x, along(74 * bulk).y, 4.4 * bulk, 3.6 * bulk), wood, opt(h.x, h.y, 26, { ao: 0.3 }));\n      gripWrap(-22 * bulk, 8 * bulk, 5 * bulk, 6);\n      // 斧刃\n      const blade = poly([\n        along(40 * bulk, -4 * bulk), along(46 * bulk, -26 * bulk),\n        along(62 * bulk, -32 * bulk), along(72 * bulk, -18 * bulk),\n        along(70 * bulk, 4 * bulk), along(50 * bulk, 10 * bulk),\n      ]);\n      shade(ctx, blade, metal, { ...opt(head.x, head.y, 34), ao: 0.25 });\n      bevel(blade, along(60 * bulk, -27 * bulk), along(68 * bulk, -2 * bulk), 0.6);\n      if (!flat) creaseLine(ctx, blade, [along(46 * bulk, -8 * bulk), along(58 * bulk, -20 * bulk)], 'rgba(0,0,0,0.3)', 2.4);\n      // 夾住木柄的護條 + 鉚釘\n      shade(ctx, poly([\n        along(38 * bulk, -7 * bulk), along(56 * bulk, -9 * bulk),\n        along(56 * bulk, 9 * bulk), along(38 * bulk, 7 * bulk),\n      ]), dark, opt(head.x, head.y, 16));\n      rivets([42, 52], -5 * bulk, 1.8);\n      rivets([42, 52], 5 * bulk, 1.8);\n      // 背面的尖刺\n      shade(ctx, poly([along(42 * bulk, 6 * bulk), along(56 * bulk, 20 * bulk), along(46 * bulk, 14 * bulk)]), dark, opt(head.x, head.y, 14));\n      tip = along(70 * bulk, -26 * bulk);\n      break;\n    }\n    case 'tristaff': {        // 三節棍：三段包鐵的木棍，用短鏈串起來，後兩節會甩\n      // 出招時甩開，平時把後兩節收在身側\n      const swinging = f && (f.attack || f.lock > 0);\n      const k = f ? (f.poseK || 0) : 0;\n      const a1 = ang + (swinging ? -1.1 + k * 4.2 : -2.0 + Math.sin(t * 1.6) * 0.12);\n      const a2 = a1 + (swinging ? 0.7 + k * 2.4 : 1.5 + Math.sin(t * 1.9 + 1) * 0.14);\n      const segLen = 30 * bulk;\n\n      /** 一節棍：木身 + 兩端的鐵箍 */\n      const segment = (from, angle, len) => {\n        const to = { x: from.x + Math.cos(angle) * len, y: from.y + Math.sin(angle) * len };\n        shade(ctx, capsule(from.x, from.y, to.x, to.y, 3.8 * bulk, 3.4 * bulk), wood,\n          opt(from.x, from.y, 16, { ao: 0.25 }));\n        for (const q of [from, to]) {\n          shade(ctx, capsule(q.x, q.y, q.x + 0.4, q.y, 4.4 * bulk), brass, opt(q.x, q.y, 6));\n        }\n        if (!flat) {\n          // 木紋\n          creaseLine(ctx, capsule(from.x, from.y, to.x, to.y, 3.8 * bulk), [\n            { x: lerp(from.x, to.x, 0.22), y: lerp(from.y, to.y, 0.22) - 1 },\n            { x: lerp(from.x, to.x, 0.78), y: lerp(from.y, to.y, 0.78) - 1 },\n          ], 'rgba(40,26,14,0.4)', 1.6);\n        }\n        return to;\n      };\n\n      // 第一節握在手上，握把纏繩\n      const p1 = { x: h.x - Math.cos(ang) * 10 * bulk, y: h.y - Math.sin(ang) * 10 * bulk };\n      const p2 = segment(p1, ang, segLen);\n      gripWrap(-8 * bulk, 8 * bulk, 4.6 * bulk, 5);\n      // 兩段連接鏈\n      const p3 = { x: p2.x + Math.cos(a1) * 7 * bulk, y: p2.y + Math.sin(a1) * 7 * bulk };\n      if (!flat) drawChain(ctx, p2, p3, metal, bulk, opt, 3);\n      const p4 = segment(p3, a1, segLen);\n      const p5 = { x: p4.x + Math.cos(a2) * 7 * bulk, y: p4.y + Math.sin(a2) * 7 * bulk };\n      if (!flat) drawChain(ctx, p4, p5, metal, bulk, opt, 3);\n      const p6 = segment(p5, a2, segLen);\n      tip = p6;\n      break;\n    }\n    case 'halberd': {         // 長戟：矛尖 + 開了月牙口的側斧 + 背鉤 + 護柄鐵條 + 纏繩\n      const tipP = along(112 * bulk);\n      const tail = along(-46 * bulk);\n      shade(ctx, capsule(tail.x, tail.y, tipP.x, tipP.y, 3.6 * bulk, 3.2 * bulk), wood, opt(h.x, h.y, 50, { ao: 0.25 }));\n      gripWrap(-14 * bulk, 16 * bulk, 4.6 * bulk, 6);\n      // 柄尾的鐵套\n      shade(ctx, capsule(tail.x, tail.y, along(-38 * bulk).x, along(-38 * bulk).y, 4 * bulk), dark, opt(tail.x, tail.y, 8));\n      // 護柄鐵條（langet）\n      for (const o of [-1, 1]) {\n        shade(ctx, capsule(along(70 * bulk, o * 3.6 * bulk).x, along(70 * bulk, o * 3.6 * bulk).y,\n          along(92 * bulk, o * 3.6 * bulk).x, along(92 * bulk, o * 3.6 * bulk).y, 1.6 * bulk), dark, opt(tipP.x, tipP.y, 16));\n      }\n      // 矛尖\n      const spear = poly([\n        along(92 * bulk, -5.5 * bulk), along(104 * bulk, -3 * bulk),\n        { x: tipP.x, y: tipP.y }, along(104 * bulk, 3 * bulk), along(92 * bulk, 5.5 * bulk),\n      ]);\n      shade(ctx, spear, metal, { ...opt(tipP.x, tipP.y, 24), ao: 0.2 });\n      bevel(spear, along(94 * bulk, -1 * bulk), along(109 * bulk, 0), 0.6);\n      // 側斧：刃上開一個月牙口\n      const axeBlade = poly([\n        along(80 * bulk, -4 * bulk), along(84 * bulk, -26 * bulk),\n        along(100 * bulk, -22 * bulk), along(103 * bulk, -12 * bulk),\n        along(94 * bulk, -14 * bulk), along(92 * bulk, -2 * bulk),\n      ]);\n      shade(ctx, axeBlade, metal, opt(along(90 * bulk, -14 * bulk).x, along(90 * bulk, -14 * bulk).y, 20));\n      bevel(axeBlade, along(86 * bulk, -24 * bulk), along(100 * bulk, -20 * bulk), 0.5);\n      // 背面的鉤\n      shade(ctx, poly([\n        along(82 * bulk, 4 * bulk), along(94 * bulk, 16 * bulk),\n        along(88 * bulk, 18 * bulk), along(80 * bulk, 8 * bulk),\n      ]), dark, opt(tipP.x, tipP.y, 18));\n      tip = tipP;\n      break;\n    }\n    case 'knuckles': {        // 鐵指虎：纏布的拳 + 四個指節環 + 護手背板 + 腕帶\n      for (const [hand, elbow, dim] of [[J.handF, J.elbowF, false], [J.handB, J.elbowB, true]]) {\n        const a2 = Math.atan2(hand.y - elbow.y, hand.x - elbow.x);\n        const back = { x: hand.x - Math.cos(a2) * 8 * bulk, y: hand.y - Math.sin(a2) * 8 * bulk };\n        const front = { x: hand.x + Math.cos(a2) * 8 * bulk, y: hand.y + Math.sin(a2) * 8 * bulk };\n        const mm = dim ? dark : metal;\n        // 拳頭：纏布\n        const fist = capsule(back.x, back.y, front.x, front.y, 7.6 * bulk, 7 * bulk);\n        shade(ctx, fist, dim ? dark : wrapM, opt(hand.x, hand.y, 16, { ao: 0.35 }));\n        if (!flat && !dim) {\n          creaseLine(ctx, fist, [\n            { x: hand.x - Math.sin(a2) * 7 * bulk, y: hand.y + Math.cos(a2) * 7 * bulk },\n            { x: hand.x + Math.sin(a2) * 7 * bulk, y: hand.y - Math.cos(a2) * 7 * bulk },\n          ], 'rgba(80,68,52,0.5)', 1.8);\n        }\n        // 四個指節環\n        for (let i = -1.5; i <= 1.5; i++) {\n          const k0 = {\n            x: front.x - Math.sin(a2) * i * 3.6 * bulk,\n            y: front.y + Math.cos(a2) * i * 3.6 * bulk,\n          };\n          const k1 = { x: k0.x + Math.cos(a2) * 2.8 * bulk, y: k0.y + Math.sin(a2) * 2.8 * bulk };\n          shade(ctx, capsule(k0.x, k0.y, k1.x, k1.y, 2.7 * bulk), mm, opt(k0.x, k0.y, 6, { ao: 0.3 }));\n          if (!flat && !dim) bevel(capsule(k0.x, k0.y, k1.x, k1.y, 2.7 * bulk), k0, k1, 0.45);\n        }\n        // 護手背板 + 鉚釘\n        const plate = poly([\n          { x: back.x - Math.sin(a2) * 6 * bulk, y: back.y + Math.cos(a2) * 6 * bulk },\n          { x: front.x - Math.sin(a2) * 5 * bulk, y: front.y + Math.cos(a2) * 5 * bulk },\n          { x: front.x - Math.sin(a2) * 1 * bulk, y: front.y + Math.cos(a2) * 1 * bulk },\n          { x: back.x - Math.sin(a2) * 2 * bulk, y: back.y + Math.cos(a2) * 2 * bulk },\n        ]);\n        shade(ctx, plate, mm, opt(hand.x, hand.y, 12));\n        if (!flat && !dim) {\n          const rv = { x: hand.x - Math.sin(a2) * 3.4 * bulk, y: hand.y + Math.cos(a2) * 3.4 * bulk };\n          shade(ctx, capsule(rv.x, rv.y, rv.x + 0.4, rv.y, 1.5 * bulk), brass, opt(rv.x, rv.y, 3));\n        }\n        // 腕帶\n        const wr = { x: back.x - Math.cos(a2) * 3 * bulk, y: back.y - Math.sin(a2) * 3 * bulk };\n        shade(ctx, capsule(wr.x, wr.y, back.x, back.y, 6.4 * bulk, 6.8 * bulk), dim ? dark : mat(M.strap), opt(wr.x, wr.y, 8, { ao: 0.3 }));\n      }\n      tip = along(16 * bulk);\n      break;\n    }\n    case 'crowbar': {         // 撬棍：六角斷面的扁鋼、彎折處有稜、一端鴨嘴一端尖爪\n      const bend = along(34 * bulk);\n      const tipP = along(52 * bulk, 16 * bulk);\n      const tail = along(-24 * bulk);\n      const shaft = capsule(tail.x, tail.y, bend.x, bend.y, 4 * bulk, 3.6 * bulk);\n      shade(ctx, shaft, dark, opt(h.x, h.y, 26, { ao: 0.3 }));\n      bevel(shaft, along(-20 * bulk, -1.4 * bulk), along(30 * bulk, -1.2 * bulk), 0.35);\n      const knee = capsule(bend.x, bend.y, tipP.x, tipP.y, 3.6 * bulk, 3 * bulk);\n      shade(ctx, knee, dark, opt(bend.x, bend.y, 16, { ao: 0.3 }));\n      bevel(knee, along(36 * bulk, -1.2 * bulk), along(50 * bulk, 14 * bulk), 0.35);\n      // 鴨嘴：末端劈開的扁頭\n      const duck = poly([\n        along(48 * bulk, 12 * bulk), along(62 * bulk, 21 * bulk),\n        along(59 * bulk, 26 * bulk), along(45 * bulk, 17 * bulk),\n      ]);\n      shade(ctx, duck, metal, opt(tipP.x, tipP.y, 14));\n      bevel(duck, along(50 * bulk, 15 * bulk), along(60 * bulk, 22 * bulk), 0.55);\n      if (!flat) {\n        // 劈開的縫\n        creaseLine(ctx, duck, [along(54 * bulk, 17 * bulk), along(61 * bulk, 22.5 * bulk)], 'rgba(10,12,16,0.8)', 2.2);\n      }\n      // 尾端的尖爪（拔釘用的 V 形開口）\n      const claw = poly([\n        along(-22 * bulk, -3.2 * bulk), along(-36 * bulk, -8 * bulk),\n        along(-35 * bulk, 1.5 * bulk), along(-22 * bulk, 3.2 * bulk),\n      ]);\n      shade(ctx, claw, metal, opt(tail.x, tail.y, 12));\n      if (!flat) creaseLine(ctx, claw, [along(-28 * bulk, -2 * bulk), along(-35 * bulk, -3 * bulk)], 'rgba(10,12,16,0.8)', 2.4);\n      // 防滑的纏帶\n      gripWrap(-6 * bulk, 12 * bulk, 4.8 * bulk, 5);\n      if (!flat) {\n        // 掉漆露出的鐵色\n        ctx.save();\n        ctx.clip(shaft);\n        ctx.globalAlpha = 0.4;\n        ctx.fillStyle = '#9aa4b4';\n        for (const d of [16, 24]) {\n          const w0 = along(d * bulk, -2 * bulk);\n          ctx.beginPath();\n          ctx.ellipse(w0.x, w0.y, 3 * bulk, 1.4 * bulk, 0, 0, Math.PI * 2);\n          ctx.fill();\n        }\n        ctx.restore();\n      }\n      tip = { x: tipP.x, y: tipP.y };\n      break;\n    }\n    default:\n      break;\n  }\n\n  // 雙手武器：後手也扶在柄上，看起來才有重量\n  if (spec.twoHand && !flat) {\n    const grip = along(-18 * bulk);\n    shade(ctx, capsule(grip.x, grip.y, grip.x + 1, grip.y + 1, 5.6 * bulk), mat(M.glove), opt(grip.x, grip.y, 9, { ao: 0.3 }));\n  }\n  // 前手的拳頭最後蓋上去，手指才是包住武器柄的\n  if (spec.kind && spec.kind !== 'knuckles') {\n    const g0 = along(-4 * bulk), g1 = along(5 * bulk);\n    shade(ctx, capsule(g0.x, g0.y, g1.x, g1.y, 5 * bulk, 4.5 * bulk), mat(M.glove), opt(h.x, h.y, 9, { ao: 0.3 }));\n  }\n\n  // 記下武器尖端（世界座標由呼叫端換算），給揮擊殘影用\n  if (f && !flat) f._tipLocal = tip;\n}\n\n/** 鎖鏈：一節一節的橢圓，比直線有份量 */\nfunction drawChain(ctx, a, b, m, bulk, opt, links = 7) {\n  const dx = b.x - a.x, dy = b.y - a.y;\n  for (let i = 0; i < links; i++) {\n    const k0 = i / links, k1 = (i + 0.72) / links;\n    const x0 = a.x + dx * k0, y0 = a.y + dy * k0 + Math.sin(k0 * 3) * 2;\n    const x1 = a.x + dx * k1, y1 = a.y + dy * k1 + Math.sin(k1 * 3) * 2;\n    shade(ctx, capsule(x0, y0, x1, y1, (i % 2 ? 2.6 : 3.2) * bulk), m, opt(x0, y0, 6));\n  }\n}\n\n// ------------------------------------------------------------------ 選單用\nexport function drawPortrait(ctx, char, x, y, scale, t, pose = 'idle', poseK = 0.35) {\n  const fake = {\n    char, x: 0, y: 0, facing: 1, pose, poseK, phase: t * 2.4,\n    animTime: t, hitFlash: 0,\n  };\n  ctx.save();\n  ctx.translate(x, y);\n  const s = scale * (char.build.scale || 1) * 1.12;\n  ctx.scale(s, s);\n  drawBody(ctx, char, poseFor(pose, poseK, t * 2.4), fake, {});\n  ctx.restore();\n}\n\n/** 畫面級：底片顆粒 + 暗角 + 色偏，最後一層疊上去 */\nexport function drawGrade(ctx, w, h, opts = {}) {\n  const { grain = 0, vignette = 0.16, shift = 0 } = opts;\n  if (grain > 0) {\n    const pat = grainPattern(ctx);\n    ctx.save();\n    ctx.globalAlpha = grain;\n    ctx.globalCompositeOperation = 'overlay';\n    ctx.fillStyle = pat;\n    ctx.fillRect(0, 0, w, h);\n    ctx.restore();\n  }\n  if (vignette > 0) {\n    const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.32, w / 2, h / 2, h * 0.92);\n    g.addColorStop(0, 'rgba(0,0,0,0)');\n    g.addColorStop(1, `rgba(0,0,0,${vignette})`);\n    ctx.fillStyle = g;\n    ctx.fillRect(0, 0, w, h);\n  }\n}\n","rig.js":"// 骨架與姿勢。\n//\n// 角色完全由程式畫出來，沒有任何圖檔：這支檔案負責「骨頭在哪裡」，\n// render.js 負責「骨頭長什麼樣」。座標是角色本地空間 —— 原點在腳底中心，\n// y 軸向上為負；面向由 render.js 用 scale(-1,1) 處理，所以這裡一律朝右。\n//\n// 角度定義：0 = 正下方，正值往前（+x）。dir(a) = (sin a, cos a)。\n\nconst L = {\n  hipY: -62,      // 髖高（腿佔身高的一半左右，才像真人）\n  torso: 30,      // 髖 → 胸\n  neck: 43,       // 髖 → 頸\n  headY: -122,    // 頭心高度（脖子只露一小截）\n  thigh: 31,\n  shin: 31,\n  upper: 25,\n  fore: 24,\n  shoulderW: 11,\n};\n\nconst dir = (a) => ({ x: Math.sin(a), y: Math.cos(a) });\n\nfunction chain(root, a1, l1, a2, l2) {\n  const d1 = dir(a1);\n  const mid = { x: root.x + d1.x * l1, y: root.y + d1.y * l1 };\n  const d2 = dir(a1 + a2);\n  const end = { x: mid.x + d2.x * l2, y: mid.y + d2.y * l2 };\n  return { mid, end };\n}\n\n/**\n * 組出一副骨架。\n * spec 用四肢的角度描述姿勢，其他（頭、胸、髖）由 lean / crouch / bob 推出來。\n */\nfunction assemble(spec) {\n  const {\n    lean = 0, crouch = 0, bob = 0, headTilt = 0,\n    armF = [0.4, 0.5], armB = [-0.4, 0.5],\n    legF = [0.25, 0.3], legB = [-0.25, 0.3],\n    armLen = 1, legLen = 1,\n  } = spec;\n\n  const hip = { x: lean * 6, y: L.hipY + crouch + bob };\n  const chestDir = dir(Math.PI + lean * 0.35);      // 往上、隨 lean 前傾\n  const chest = { x: hip.x + chestDir.x * L.torso, y: hip.y + chestDir.y * L.torso };\n  const neck = { x: hip.x + chestDir.x * L.neck, y: hip.y + chestDir.y * L.neck };\n  const head = {\n    x: neck.x + Math.sin(lean * 0.5 + headTilt) * 14,\n    y: neck.y - 15 + Math.abs(bob) * 0.2,\n  };\n\n  const shF = { x: chest.x + L.shoulderW * 0.5, y: chest.y };\n  const shB = { x: chest.x - L.shoulderW * 0.5, y: chest.y + 1 };\n\n  const aF = chain(shF, armF[0], L.upper * armLen, armF[1], L.fore * armLen);\n  const aB = chain(shB, armB[0], L.upper * armLen, armB[1], L.fore * armLen);\n  const lF = chain(hip, legF[0], L.thigh * legLen, legF[1], L.shin * legLen);\n  const lB = chain(hip, legB[0], L.thigh * legLen, legB[1], L.shin * legLen);\n\n  return {\n    hip, chest, neck, head,\n    shoulderF: shF, elbowF: aF.mid, handF: aF.end,\n    shoulderB: shB, elbowB: aB.mid, handB: aB.end,\n    kneeF: lF.mid, footF: lF.end,\n    kneeB: lB.mid, footB: lB.end,\n    lean,\n  };\n}\n\nconst sin = Math.sin;\n\n/**\n * 依狀態取得骨架。\n *   state  動作名稱\n *   k      這個動作的進度 0→1（攻擊類動作用它做出「蓄力→打出→收手」）\n *   phase  持續累加的相位（走路擺動、待機呼吸）\n */\nexport function poseFor(state, k = 0, phase = 0) {\n  // 出招的節奏：ease-in 蓄力 → 爆發 → 慢慢收。三段各自用不同的曲線，\n  // 打出去那一格才會「快」，收招才會「沉」。\n  const anticipate = (p) => p * p;                       // 蓄力：越後面越快\n  const snap = (p) => 1 - Math.pow(1 - p, 3);            // 打出：一瞬間到位\n  const settle = (p) => 1 - Math.pow(1 - p, 1.6);        // 收招：慢慢回來\n  /** 三段式的進度：k<a 蓄力（-1→0），a~b 打出（0→1），之後收回（1→0） */\n  const swingK = (a, b) => (k < a ? -anticipate(k / a)\n    : k < b ? snap((k - a) / (b - a))\n      : 1 - settle((k - b) / (1 - b)) * 0.95);\n\n  switch (state) {\n    case 'run': {\n      const s = sin(phase), c = Math.cos(phase);\n      return assemble({\n        lean: 0.56, bob: -Math.abs(c) * 4,\n        // 手臂大幅擺動、手肘跟著收放，跑起來才有推進感\n        armF: [0.25 - s * 1.25, 0.6 + Math.max(0, s) * 0.5],\n        armB: [0.25 + s * 1.25, 0.6 + Math.max(0, -s) * 0.5],\n        legF: [s * 1.05, 0.45 + Math.max(0, c) * 0.7],\n        legB: [-s * 1.05, 0.45 + Math.max(0, -c) * 0.7],\n        headTilt: -0.08,\n      });\n    }\n    case 'jump':\n      return assemble({\n        lean: 0.2, bob: -3,\n        armF: [2.1, 0.45], armB: [2.4, 0.55],\n        legF: [1.05, 1.35], legB: [-0.2, 0.75],   // 前腿收、後腿蹬\n      });\n    case 'fall':\n      return assemble({\n        lean: -0.14,\n        armF: [2.6, 0.28], armB: [2.85, 0.32],\n        legF: [0.42, 0.3], legB: [-0.7, 0.62],\n      });\n    case 'land':\n      return assemble({\n        crouch: 16, lean: 0.28,\n        armF: [1.3, 0.55], armB: [-1.05, 0.65],\n        legF: [0.75, 1.2], legB: [-0.75, 1.2],\n      });\n    case 'crouch':\n      return assemble({\n        crouch: 20, lean: 0.34,\n        armF: [0.95, 0.85], armB: [-0.5, 0.95],\n        legF: [0.85, 1.35], legB: [-0.85, 1.35],\n      });\n    case 'guard': {\n      // 武術的防禦架勢：重心後坐、兩手交疊護在身前\n      const b = sin(phase * 2.2) * 0.02;\n      return assemble({\n        crouch: 8, lean: -0.22,\n        armF: [1.32 + b, 1.62], armB: [1.5 + b, 1.7],\n        legF: [0.38, 0.62], legB: [-0.62, 0.7],\n        headTilt: 0.1,\n      });\n    }\n    case 'dash':\n      return assemble({\n        lean: 1.05, bob: -5,\n        armF: [-0.62, 0.3], armB: [-1.15, 0.34],\n        legF: [1.35, 0.42], legB: [-0.65, 1.5],\n        headTilt: -0.14,\n      });\n    case 'light1': {\n      // 直拳：身體跟著轉、後手收在下巴旁\n      const p = swingK(0.32, 0.5);\n      return assemble({\n        lean: 0.26 + Math.max(0, p) * 0.2,\n        armF: [1.45 + p * 0.28, Math.max(0.06, 1.35 - Math.max(0, p) * 1.3)],\n        armB: [-0.85 - Math.max(0, p) * 0.2, 1.25],\n        legF: [0.34 + Math.max(0, p) * 0.12, 0.42], legB: [-0.52, 0.6],\n        headTilt: -0.05,\n      });\n    }\n    case 'light2': {\n      // 後手的交叉拳：腰轉得更多\n      const p = swingK(0.3, 0.5);\n      return assemble({\n        lean: 0.34 + Math.max(0, p) * 0.26,\n        armF: [-0.55 - Math.max(0, p) * 0.35, 1.15],\n        armB: [1.42 + p * 0.3, Math.max(0.06, 1.35 - Math.max(0, p) * 1.3)],\n        legF: [0.5 + Math.max(0, p) * 0.16, 0.44], legB: [-0.62, 0.56],\n      });\n    }\n    case 'light3': {\n      // 迴旋踢：支撐腿轉、上身往後倒配重\n      const p = k < 0.3 ? anticipate(k / 0.3) : 1 - settle((k - 0.3) / 0.7) * 0.95;\n      return assemble({\n        lean: 0.22 - p * 0.72, crouch: -p * 8,\n        armF: [-0.95 - p * 0.75, 0.62], armB: [0.95 + p * 0.6, 0.72],\n        legF: [0.28 + p * 1.62, Math.max(0.04, 0.95 - p * 0.92)],\n        legB: [-0.32 - p * 0.28, 0.3],\n        headTilt: -p * 0.2,\n      });\n    }\n    case 'heavy': {\n      // 大迴旋斬：後拉得更深、劈下去整個人壓進去\n      const p = swingK(0.44, 0.62);\n      const swing = p < 0 ? -1.25 + p * 0.5 : -0.75 + p * 3.3;\n      return assemble({\n        lean: p < 0 ? -0.42 + p * 0.12 : -0.3 + p * 0.92,\n        crouch: p < 0 ? -4 : -2 + p * 12,\n        armF: [swing, 0.3], armB: [swing - 0.28, 0.46],\n        legF: [0.5 + Math.max(0, p) * 0.2, 0.48], legB: [-0.72 - Math.max(0, p) * 0.2, 0.8],\n        headTilt: p < 0 ? 0.12 : -0.1,\n      });\n    }\n    case 'cast': {\n      const p = snap(Math.min(1, k * 2.2));\n      return assemble({\n        lean: -0.28 + p * 0.56,\n        armF: [1.3 + p * 0.32, 0.22], armB: [1.05 + p * 0.34, 0.42],\n        legF: [0.42, 0.46], legB: [-0.62, 0.62],\n      });\n    }\n    case 'uppercut': {\n      // 昇龍：蹲下蓄力 → 整個人拔起來\n      const p = k < 0.22 ? -anticipate(k / 0.22) : snap((k - 0.22) / 0.4);\n      const up = Math.max(0, p);\n      return assemble({\n        lean: -0.22 - up * 0.2, crouch: p < 0 ? 12 : 10 - up * 22,\n        armF: [2.9 + up * 0.35, -0.22], armB: [-0.55, 0.85],\n        legF: [0.22 - up * 0.1, 0.24], legB: [-0.85 - up * 0.25, 1.05],\n        headTilt: -up * 0.12,\n      });\n    }\n    case 'dive':\n      return assemble({\n        lean: 0.95,\n        armF: [-1.15, 0.36], armB: [-1.65, 0.46],\n        legF: [1.55, 0.12], legB: [0.65, 0.92],\n        headTilt: -0.12,\n      });\n    case 'charge': {\n      // 蓄力：重心壓低、武器拉到身後，越蓄越緊，還會微微發抖\n      const p = Math.min(1, k * 1.4);\n      return assemble({\n        lean: -0.48 - p * 0.22, crouch: 6 + p * 8, bob: sin(k * 44) * 1.1 * p,\n        armF: [-1.55 - p * 0.55, 0.48], armB: [-1.95 - p * 0.45, 0.58],\n        legF: [0.78, 0.95], legB: [-0.9, 1.05],\n        headTilt: 0.14 * p,\n      });\n    }\n    case 'ult': {\n      const p = snap(Math.min(1, k * 3));\n      return assemble({\n        lean: -0.42 + p * 0.22, crouch: 4 - p * 8, bob: -p * 4,\n        armF: [2.6 - p * 0.65, 0.65], armB: [-2.6 + p * 0.65, 0.65],\n        legF: [0.58, 0.48], legB: [-0.68, 0.62],\n        headTilt: -0.1,\n      });\n    }\n    case 'hurt': {\n      // 被打中：頭先甩出去，身體才跟上（k 是剩餘硬直的進度）\n      const p = 1 - k;\n      return assemble({\n        lean: -0.62 * p, crouch: 5 * p, headTilt: -0.42 * p,\n        armF: [-1.35 * p - 0.18, 0.55], armB: [-1.75 * p - 0.18, 0.66],\n        legF: [0.24 - 0.38 * p, 0.38], legB: [-0.44 - 0.1 * p, 0.5],\n      });\n    }\n    case 'ko':\n      return assemble({\n        lean: -1.0, crouch: 32, headTilt: -0.7,\n        armF: [-2.3, 0.26], armB: [-2.7, 0.36],\n        legF: [1.4, 1.55], legB: [-1.3, 1.55],\n      });\n    case 'idle':\n    default: {\n      const b = sin(phase * 0.9);\n      const b2 = sin(phase * 0.9 + 0.7);\n      // 武術的預備架勢：側身、重心微沉、前手在前護著、後手收在腰側\n      return assemble({\n        lean: 0.14, bob: b * 1.6, crouch: 3,\n        armF: [0.88 + b * 0.06, 1.05 + b2 * 0.05],\n        armB: [-0.55 - b * 0.05, 1.1 + b2 * 0.04],\n        legF: [0.32, 0.36], legB: [-0.36, 0.42],\n        headTilt: b2 * 0.03,\n      });\n    }\n  }\n}\n\n/**\n * 兩副骨架之間的內插。\n * 動作切換時如果直接換一副骨架，畫面上會「啪」地跳一下；\n * 每一幀往目標靠近一點點，轉場就順了（a 越大越快跟上）。\n */\nexport function blendRig(prev, next, a) {\n  if (!prev) return next;\n  const out = {};\n  for (const key of Object.keys(next)) {\n    const v = next[key];\n    if (typeof v === 'number') {\n      out[key] = prev[key] === undefined ? v : prev[key] + (v - prev[key]) * a;\n    } else if (v && typeof v.x === 'number') {\n      const p = prev[key] || v;\n      out[key] = { x: p.x + (v.x - p.x) * a, y: p.y + (v.y - p.y) * a };\n    } else {\n      out[key] = v;\n    }\n  }\n  return out;\n}\n\nexport const RIG_LENGTHS = L;\n","screens.js":"// 選單畫面：主畫面、選角、連線大廳、結算。\n//\n// 每個畫面都是 { update(dt), draw(ctx), onPointer(x,y) }，由 main.js 切換。\n// 滑鼠／觸控靠 Taps：畫的時候順手登記可點區域，點下去就轉成和鍵盤一樣的動作。\n\nimport { ROSTER, IDS, getChar, statRatio, randomId } from './characters.js';\nimport { drawArena, drawPortrait, WORLD } from './render.js';\nimport { panel, stencil, text, measure, neonStroke, glowFill, circlePath, ngonPath, polyPath } from './gfx.js';\nimport { menuNav, isEdge, anyEdge, drainTyped } from './input.js';\nimport { clamp, withAlpha, lerp, isTouch } from './util.js';\nimport { Net } from './net.js';\n\n/** 畫面寬度（世界比畫面寬，選單與 HUD 都用畫面座標） */\nconst VIEW = WORLD.view;\n\nexport class Taps {\n  constructor() { this.zones = []; this.building = []; }\n  begin() { this.building = []; }\n  add(x, y, w, h, action) { this.building.push({ x, y, w, h, action }); }\n  commit() { this.zones = this.building; }\n  hit(px, py) {\n    for (let i = this.zones.length - 1; i >= 0; i--) {\n      const z = this.zones[i];\n      if (px >= z.x && px <= z.x + z.w && py >= z.y && py <= z.y + z.h) return z.action;\n    }\n    return null;\n  }\n}\n\n// ==================================================================\nexport class TitleScreen {\n  constructor(game) {\n    this.game = game;\n    this.t = 0;\n    this.index = 0;\n    this.taps = new Taps();\n    this.showHelp = false;\n    this.items = [\n      { label: '單機對戰', sub: '一個人打 AI', action: 'solo' },\n      { label: '雙人同機', sub: '同一個鍵盤兩個人', action: 'local' },\n      { label: '連線對戰', sub: '四位數房號配對', action: 'online' },\n      { label: '操作說明', sub: '按鍵與規則', action: 'help' },\n    ];\n  }\n\n  onEnter() { this.t = 0; }\n\n  update(dt) {\n    this.t += dt;\n    const nav = menuNav();\n    if (this.showHelp) {\n      if (nav.ok || nav.back) { this.showHelp = false; this.game.audio.play('menu'); }\n      return;\n    }\n    if (nav.up) { this.index = (this.index + this.items.length - 1) % this.items.length; this.game.audio.play('menu'); }\n    if (nav.down) { this.index = (this.index + 1) % this.items.length; this.game.audio.play('menu'); }\n    if (nav.ok) this.choose(this.items[this.index].action);\n  }\n\n  choose(action) {\n    this.game.audio.play('select');\n    if (action === 'help') { this.showHelp = true; return; }\n    if (action === 'online') { this.game.goto('lobby'); return; }\n    this.game.goto('select', { mode: action });\n  }\n\n  onPointer(x, y) {\n    const a = this.taps.hit(x, y);\n    if (this.showHelp) { this.showHelp = false; return; }\n    if (a) this.choose(a);\n  }\n\n  draw(ctx) {\n    this.taps.begin();\n    drawArena(ctx, this.t * 0.6, '#5a2a8b');\n\n    // 背景：兩位角色的剪影在對峙\n    const a = ROSTER[Math.floor(this.t / 3) % ROSTER.length];\n    const b = ROSTER[(Math.floor(this.t / 3) + 5) % ROSTER.length];\n    ctx.save();\n    ctx.globalAlpha = 0.42;\n    drawPortrait(ctx, a, 186, 636, 1.28, this.t, 'idle');\n    ctx.translate(1094, 0);\n    ctx.scale(-1, 1);\n    drawPortrait(ctx, b, 0, 636, 1.28, this.t + 1, 'idle');\n    ctx.restore();\n\n    // 標題\n    const cx = VIEW / 2;\n    const bob = Math.sin(this.t * 1.6) * 4;\n    // 刻在鋼板上的標題：先一道暗影、再一道受光的亮邊\n    text(ctx, 'STEEL CLASH', cx, 170 + bob, {\n      size: 84, color: '#0a0c11', align: 'center', weight: 900, letter: 10, shadow: null,\n    });\n    text(ctx, 'STEEL CLASH', cx, 168 + bob, {\n      size: 84, color: '#c8d2e4', align: 'center', weight: 900, letter: 10, shadow: null,\n    });\n    text(ctx, '鋼　鐵　亂　鬥', cx, 216 + bob, {\n      size: 26, color: '#c1553a', align: 'center', weight: 700, letter: 8,\n    });\n    text(ctx, '十位鬥士・近戰街機・單機或連線', cx, 248 + bob, {\n      size: 15, color: '#8b96b4', align: 'center', letter: 1,\n    });\n\n    if (this.showHelp) { this.drawHelp(ctx); this.taps.commit(); return; }\n\n    // 選單\n    this.items.forEach((item, i) => {\n      const w = 340, h = 54;\n      const x = cx - w / 2, y = 300 + i * 66;\n      const on = i === this.index;\n      panel(ctx, x, y, w, h, on ? '#c9541f' : '#4a5168', { glow: on ? 1 : 0 });\n      if (on) {\n        ctx.save();\n        ctx.globalCompositeOperation = 'lighter';\n        ctx.globalAlpha = 0.09 + 0.04 * Math.sin(this.t * 6);\n        ctx.fillStyle = '#ffb27a';\n        ctx.fillRect(x, y, w, h);\n        ctx.restore();\n        glowFill(ctx, ngonPath(x + 26, y + h / 2, 6, 3, this.t * 1.2), '#ff9a4d', 0.9);\n      }\n      text(ctx, item.label, x + 52, y + 35, { size: 24, color: on ? '#ffffff' : '#aeb7d8' });\n      text(ctx, item.sub, x + w - 16, y + 34, { size: 13, color: '#7b86ad', align: 'right' });\n      this.taps.add(x, y, w, h, item.action);\n    });\n\n    // 角色跑馬燈\n    const stripY = 600;\n    ROSTER.forEach((c, i) => {\n      const x = 90 + i * 122;\n      const wob = Math.sin(this.t * 2 + i) * 3;\n      ctx.save();\n      ctx.globalAlpha = 0.9;\n      drawPortrait(ctx, c, x, stripY + wob, 0.52, this.t + i, 'idle');\n      ctx.restore();\n      text(ctx, c.name, x, stripY + 30, { size: 14, color: c.color, align: 'center' });\n    });\n\n    text(ctx, isTouch() ? '點一下選單開始　左上角可以靜音' : '↑↓ 選擇　Enter 確定　M 靜音　H 說明', cx, 700, {\n      size: 14, color: '#6f7aa3', align: 'center',\n    });\n    this.taps.commit();\n  }\n\n  drawHelp(ctx) {\n    const w = 900, h = 440, x = (VIEW - w) / 2, y = 180;\n    panel(ctx, x, y, w, h, '#8f9bb5');\n    text(ctx, '操作說明', x + 40, y + 52, { size: 30, color: '#e2e8f4' });\n    const rows = [\n      ['移動 / 跳躍', 'A D / W（空中再按一次＝二段跳，限疾翎）'],\n      ['輕攻擊', 'J　連按三下是連段，第三段打飛'],\n      ['重攻擊', 'K　慢但有霸體，打中直接把人轟開'],\n      ['技能一 / 二', 'U / I　各自有冷卻'],\n      ['必殺', 'O　氣條滿了才能放'],\n      ['衝刺閃避', 'L　有短暫無敵，空中也能用一次'],\n      ['格擋', '往後推（遠離對手的方向）就會自動格擋'],\n      ['第二位玩家', '方向鍵移動、Numpad 1/2/4/5/6/3'],\n    ];\n    rows.forEach((r, i) => {\n      const ry = y + 100 + i * 40;\n      text(ctx, r[0], x + 44, ry, { size: 18, color: '#ffffff' });\n      text(ctx, r[1], x + 240, ry, { size: 16, color: '#9fb4ff' });\n    });\n    text(ctx, '勝負：三回合兩勝，每回合 60 秒，時間到血多的人贏。', x + 44, y + h - 40, {\n      size: 15, color: '#ffd24d',\n    });\n    this.taps.add(x, y, w, h, 'close');\n  }\n}\n\n// ==================================================================\nexport class SelectScreen {\n  constructor(game) {\n    this.game = game;\n    this.taps = new Taps();\n    this.t = 0;\n  }\n\n  onEnter(opts = {}) {\n    this.mode = opts.mode || 'solo';       // solo | local | net\n    this.net = opts.net || null;\n    this.picks = [null, null];\n    this.cursor = [0, 5];\n    this.ready = [false, false];\n    this.phase = 0;                        // solo/local：目前輪到誰選\n    this.t = 0;\n    this.foeReady = false;\n    this.mySide = this.mode === 'net' ? (this.net.isHost ? 0 : 1) : 0;\n    this.status = '';\n  }\n\n  get columns() { return 5; }\n\n  update(dt) {\n    this.t += dt;\n    const nav = menuNav();\n    if (this.mode === 'net') {\n      this.updateNet(nav);\n      return;\n    }\n    const side = this.phase;\n    if (nav.left) this.move(side, -1);\n    if (nav.right) this.move(side, 1);\n    if (nav.up) this.move(side, -this.columns);\n    if (nav.down) this.move(side, this.columns);\n    if (nav.back) {\n      if (this.phase === 1) { this.phase = 0; this.picks[0] = null; }\n      else this.game.goto('title');\n      this.game.audio.play('menu');\n    }\n    if (nav.ok) this.confirm(side);\n\n    // 第二位玩家在雙人同機時用自己的方向鍵（第一位用 WASD）\n    if (this.mode === 'local' && this.phase === 1) {\n      if (anyEdge(['ArrowLeft'])) this.move(1, -1);\n      if (anyEdge(['ArrowRight'])) this.move(1, 1);\n    }\n  }\n\n  updateNet(nav) {\n    const side = this.mySide;\n    if (nav.left) this.move(side, -1);\n    if (nav.right) this.move(side, 1);\n    if (nav.up) this.move(side, -this.columns);\n    if (nav.down) this.move(side, this.columns);\n    if (nav.back) { this.game.leaveNet(); return; }\n    if (nav.ok) {\n      this.ready[side] = !this.ready[side];\n      this.game.audio.play(this.ready[side] ? 'select' : 'menu');\n      this.pushNet();\n    }\n  }\n\n  pushNet() {\n    const side = this.mySide;\n    this.picks[side] = IDS[this.cursor[side]];\n    this.net.send({ t: 'lobby', char: this.picks[side], ready: this.ready[side] });\n    this.game.tryStartNet(this.picks, this.ready);\n  }\n\n  onNetLobby(msg) {\n    const other = this.mySide === 0 ? 1 : 0;\n    this.picks[other] = msg.char;\n    this.cursor[other] = Math.max(0, IDS.indexOf(msg.char));\n    this.ready[other] = !!msg.ready;\n    this.game.tryStartNet(this.picks, this.ready);\n  }\n\n  move(side, delta) {\n    const n = IDS.length;\n    this.cursor[side] = (this.cursor[side] + delta + n * 2) % n;\n    this.game.audio.play('menu');\n    if (this.mode === 'net') {\n      this.ready[side] = false;\n      this.pushNet();\n    }\n  }\n\n  confirm(side) {\n    const id = IDS[this.cursor[side]];\n    this.picks[side] = id;\n    this.game.audio.play('select');\n    if (this.mode === 'solo') {\n      if (this.phase === 0) {\n        this.phase = 1;\n        this.cursor[1] = Math.floor(Math.random() * IDS.length);\n      } else {\n        this.game.startBattle({ mode: 'solo', chars: [this.picks[0], this.picks[1]] });\n      }\n    } else if (this.mode === 'local') {\n      if (this.phase === 0) this.phase = 1;\n      else this.game.startBattle({ mode: 'local', chars: [this.picks[0], this.picks[1]] });\n    }\n  }\n\n  onPointer(x, y) {\n    const a = this.taps.hit(x, y);\n    if (!a) return;\n    if (a === 'back') {\n      if (this.mode === 'net') this.game.leaveNet();\n      else if (this.phase === 1) { this.phase = 0; this.picks[0] = null; }\n      else this.game.goto('title');\n      return;\n    }\n    if (a === 'ok') {\n      if (this.mode === 'net') { this.ready[this.mySide] = !this.ready[this.mySide]; this.pushNet(); }\n      else this.confirm(this.phase);\n      return;\n    }\n    if (a === 'random') {\n      const side = this.mode === 'net' ? this.mySide : this.phase;\n      this.cursor[side] = Math.floor(Math.random() * IDS.length);\n      if (this.mode === 'net') this.pushNet();\n      else this.confirm(side);\n      return;\n    }\n    if (typeof a === 'number') {\n      const side = this.mode === 'net' ? this.mySide : this.phase;\n      if (this.cursor[side] === a) {\n        if (this.mode === 'net') { this.ready[side] = !this.ready[side]; this.pushNet(); }\n        else this.confirm(side);\n      } else {\n        this.cursor[side] = a;\n        this.game.audio.play('menu');\n        if (this.mode === 'net') { this.ready[side] = false; this.pushNet(); }\n      }\n    }\n  }\n\n  draw(ctx) {\n    this.taps.begin();\n    ctx.fillStyle = '#06080f';\n    ctx.fillRect(0, 0, VIEW, WORLD.h);\n    drawArena(ctx, this.t * 0.4, '#3a2a6b');\n    ctx.fillStyle = 'rgba(4,6,14,0.72)';\n    ctx.fillRect(0, 0, VIEW, WORLD.h);\n\n    const title = this.mode === 'net' ? '選擇角色（連線）'\n      : this.mode === 'local' ? (this.phase === 0 ? '玩家 1 選擇角色' : '玩家 2 選擇角色')\n        : (this.phase === 0 ? '選擇你的角色' : '選擇對手');\n    text(ctx, title, 60, 60, { size: 30, color: '#e8edf8', letter: 2 });\n    const hint = isTouch()\n      ? (this.mode === 'net' ? '點角色卡選擇　再點一次＝準備' : '點角色卡選擇　再點一次＝確定')\n      : (this.mode === 'net'\n        ? '↑↓←→ 選擇　Enter 準備／取消　Esc 離開房間'\n        : '↑↓←→ 選擇　Enter 確定　Esc 返回');\n    text(ctx, hint, 60, 86, { size: 14, color: '#8a93c0' });\n\n    if (this.mode === 'net') {\n      const st = this.net.peerHere ? '對手已連線' : '等待對手加入…';\n      text(ctx, `房號 ${this.net.room}　${st}　延遲 ${this.net.rtt}ms`, VIEW - 60, 60, {\n        size: 16, color: '#b9c4dc', align: 'right',\n      });\n    }\n\n    // 角色卡片\n    const cardW = 200, cardH = 132, gap = 14;\n    const gridW = this.columns * cardW + (this.columns - 1) * gap;\n    const gx = (VIEW - gridW) / 2, gy = 110;\n    ROSTER.forEach((c, i) => {\n      const col = i % this.columns, row = Math.floor(i / this.columns);\n      const x = gx + col * (cardW + gap), y = gy + row * (cardH + gap);\n      const sel0 = this.cursor[0] === i && (this.mode !== 'solo' || this.phase === 0 || this.picks[0] === c.id);\n      const sel1 = this.cursor[1] === i && (this.mode === 'net' || this.phase === 1);\n      this.drawCard(ctx, c, x, y, cardW, cardH, sel0, sel1, i);\n      this.taps.add(x, y, cardW, cardH, i);\n    });\n\n    // 詳細資料\n    const side = this.mode === 'net' ? this.mySide : this.phase;\n    const cur = getChar(IDS[this.cursor[side]]);\n    this.drawDetail(ctx, cur, gx, gy + 2 * (cardH + gap) + 8, gridW);\n\n    // 底部按鈕\n    const okLabel = this.mode === 'net' ? (this.ready[this.mySide] ? '取消準備' : '準備') : '確定';\n    this.button(ctx, VIEW - 260, WORLD.h - 68, 200, 46, okLabel, '#4cff9d', 'ok');\n    this.button(ctx, 60, WORLD.h - 68, 140, 46, '返回', '#8a93c0', 'back');\n    this.button(ctx, 220, WORLD.h - 68, 140, 46, '隨機', '#ffd24d', 'random');\n\n    // 雙方選擇狀態\n    const p0 = this.picks[0] ? getChar(this.picks[0]) : null;\n    const p1 = this.picks[1] ? getChar(this.picks[1]) : null;\n    const label = (p, who, ready) => p ? `${who}：${p.name}${ready ? '（已準備）' : ''}` : `${who}：選擇中…`;\n    text(ctx, label(p0, this.mode === 'solo' ? '你' : 'P1', this.ready[0]), VIEW / 2 - 200, WORLD.h - 92, {\n      size: 16, color: '#b9c4dc', align: 'right',\n    });\n    text(ctx, 'VS', VIEW / 2, WORLD.h - 92, { size: 20, color: '#ffd24d', align: 'center' });\n    text(ctx, label(p1, this.mode === 'solo' ? '對手' : 'P2', this.ready[1]), VIEW / 2 + 200, WORLD.h - 92, {\n      size: 16, color: '#ff5ec4', align: 'left',\n    });\n\n    this.taps.commit();\n  }\n\n  drawCard(ctx, c, x, y, w, h, sel0, sel1, i) {\n    const on = sel0 || sel1;\n    const col = on ? c.color : '#39405e';\n    panel(ctx, x, y, w, h, col, { glow: on ? 1 : 0, cut: 10 });\n    if (on) {\n      ctx.save();\n      ctx.globalCompositeOperation = 'lighter';\n      ctx.globalAlpha = 0.1 + 0.05 * Math.sin(this.t * 6);\n      ctx.fillStyle = c.color;\n      ctx.fillRect(x, y, w, h);\n      ctx.restore();\n    }\n    drawPortrait(ctx, c, x + 52, y + h - 12, 0.58, this.t + i, 'idle');\n    text(ctx, c.name, x + w - 14, y + 34, { size: 22, color: on ? '#ffffff' : c.color, align: 'right' });\n    text(ctx, c.en, x + w - 14, y + 54, { size: 12, color: '#8a93c0', align: 'right' });\n    text(ctx, c.title, x + w - 14, y + h - 16, { size: 13, color: '#9fb4ff', align: 'right' });\n    if (sel0) this.cursorFrame(ctx, x, y, w, h, '#ffb45c', 'P1');\n    if (sel1) this.cursorFrame(ctx, x, y, w, h, '#ff5ec4', 'P2');\n  }\n\n  cursorFrame(ctx, x, y, w, h, color, tag) {\n    const o = tag === 'P1' ? 0 : 5;\n    const p = polyPath([\n      { x: x - 4 + o, y: y - 4 + o }, { x: x + w + 4 - o, y: y - 4 + o },\n      { x: x + w + 4 - o, y: y + h + 4 - o }, { x: x - 4 + o, y: y + h + 4 - o },\n    ]);\n    ctx.save();\n    ctx.lineWidth = 3;\n    ctx.strokeStyle = 'rgba(0,0,0,0.8)';\n    ctx.stroke(p);\n    ctx.lineWidth = 2;\n    ctx.strokeStyle = color;\n    ctx.stroke(p);\n    ctx.restore();\n    text(ctx, tag, x + w - 8 + (tag === 'P1' ? 0 : 0), y - 10, { size: 12, color, align: 'right' });\n  }\n\n  drawDetail(ctx, c, x, y, w) {\n    const h = 196;\n    panel(ctx, x, y, w, h, c.color, { glow: 0.35 });\n    drawPortrait(ctx, c, x + 82, y + h - 18, 0.92, this.t, 'idle');\n\n    text(ctx, c.name, x + 180, y + 44, { size: 30, color: c.color });\n    const nw = measure(ctx, c.name, 30);\n    text(ctx, `${c.en}・${c.title}`, x + 190 + nw, y + 42, { size: 15, color: '#9fb4ff' });\n    text(ctx, c.tagline, x + 180, y + 68, { size: 14, color: '#c3cbe8' });\n\n    // 數值條\n    const stats = [['hp', '血量'], ['speed', '移速'], ['jump', '跳躍'], ['atk', '攻擊'], ['def', '耐打']];\n    stats.forEach((s, i) => {\n      const sy = y + 92 + i * 20;\n      text(ctx, s[1], x + 180, sy + 10, { size: 13, color: '#9fb4ff' });\n      const bx = x + 228, bw = 150;\n      ctx.fillStyle = 'rgba(255,255,255,0.08)';\n      ctx.fillRect(bx, sy, bw, 10);\n      ctx.fillStyle = c.color;\n      ctx.fillRect(bx, sy, bw * statRatio(c, s[0]), 10);\n    });\n\n    // 被動與招式\n    const tx = x + 420;\n    text(ctx, `被動・${c.passive.name}`, tx, y + 44, { size: 17, color: c.accent });\n    text(ctx, c.passive.desc, tx, y + 66, { size: 13, color: '#c3cbe8' });\n    const moves = [['U', c.skills[0]], ['I', c.skills[1]], ['O', c.ult]];\n    moves.forEach((m, i) => {\n      const my = y + 100 + i * 32;\n      const key = m[0];\n      const s = m[1];\n      ctx.fillStyle = withAlpha(c.color, 0.18);\n      ctx.fillRect(tx, my - 14, 26, 22);\n      text(ctx, key, tx + 13, my + 2, { size: 13, color: c.color, align: 'center' });\n      text(ctx, s.name, tx + 36, my + 2, { size: 16, color: '#ffffff' });\n      const nw2 = measure(ctx, s.name, 16);\n      text(ctx, s.desc, tx + 46 + nw2, my + 1, { size: 12.5, color: '#9fb4ff' });\n      if (s.cd) text(ctx, `CD ${s.cd}s`, x + w - 16, my + 2, { size: 12, color: '#7b86ad', align: 'right' });\n      else text(ctx, '需要滿氣', x + w - 16, my + 2, { size: 12, color: '#ffd24d', align: 'right' });\n    });\n  }\n\n  button(ctx, x, y, w, h, label, color, action) {\n    panel(ctx, x, y, w, h, color, { glow: 0.6 });\n    text(ctx, label, x + w / 2, y + h / 2 + 7, { size: 19, color: '#ffffff', align: 'center' });\n    this.taps.add(x, y, w, h, action);\n  }\n}\n\n// ==================================================================\nexport class LobbyScreen {\n  constructor(game) {\n    this.game = game;\n    this.taps = new Taps();\n    this.t = 0;\n    this.field = 'room';                  // room | address\n    this.room = '';\n    this.address = localStorage.getItem('neon.relay') || '';\n    this.status = '';\n    this.busy = false;\n  }\n\n  onEnter() {\n    this.t = 0;\n    this.status = '';\n    this.busy = false;\n    this.room = String(1000 + Math.floor(Math.random() * 9000));\n  }\n\n  update(dt) {\n    this.t += dt;\n    // 這個畫面要打字，所以不吃 WASD 當方向鍵 —— 不然打 wss:// 的 s 會變成切換欄位\n    if (isEdge('Escape')) { this.game.goto('title'); return; }\n    if (isEdge('ArrowUp') || isEdge('ArrowDown') || isEdge('Tab')) {\n      this.field = this.field === 'room' ? 'address' : 'room';\n      this.game.audio.play('menu');\n    }\n    // 位址欄可以打空白（wss:// 網址雖然沒有空白，但別讓空白鍵變成「連線」）\n    if ((isEdge('Enter') || isEdge('NumpadEnter')) && !this.busy) { this.join(); return; }\n\n    // 真正的打字：房號只收數字，位址什麼都收\n    for (const ch of drainTyped()) {\n      if (ch === '\\b') {\n        if (this.field === 'room') this.room = this.room.slice(0, -1);\n        else this.address = this.address.slice(0, -1);\n      } else {\n        this.type(ch);\n      }\n    }\n  }\n\n  type(ch) {\n    if (this.field === 'room') {\n      if (this.room.length < 4 && /\\d/.test(ch)) this.room += ch;\n    } else if (this.address.length < 56 && ch !== ' ') {\n      this.address += ch;\n    }\n  }\n\n  async join() {\n    if (this.room.length !== 4) { this.status = '房號要四位數字'; return; }\n    this.busy = true;\n    this.status = '連線中…';\n    localStorage.setItem('neon.relay', this.address);\n    try {\n      await this.game.connectNet(this.address, this.room);\n    } catch (e) {\n      this.status = this.game.net.error || '連線失敗';\n      this.busy = false;\n    }\n  }\n\n  onPointer(x, y) {\n    const a = this.taps.hit(x, y);\n    if (!a) return;\n    if (a === 'back') { this.game.goto('title'); return; }\n    if (a === 'join') { this.join(); return; }\n    if (a === 'room' || a === 'address') { this.field = a; return; }\n    if (a.startsWith && a.startsWith('k')) {\n      const ch = a.slice(1);\n      if (ch === 'del') {\n        if (this.field === 'room') this.room = this.room.slice(0, -1);\n        else this.address = this.address.slice(0, -1);\n      } else this.type(ch);\n    }\n  }\n\n  draw(ctx) {\n    this.taps.begin();\n    drawArena(ctx, this.t * 0.4, '#2a2a6b');\n    ctx.fillStyle = 'rgba(4,6,14,0.78)';\n    ctx.fillRect(0, 0, VIEW, WORLD.h);\n\n    const cx = VIEW / 2;\n    stencil(ctx, '連線對戰', cx, 92, { size: 38, color: '#e8edf8', letter: 6 });\n    text(ctx, '兩邊輸入同一組房號就會配對，先連進來的自動當主機。', cx, 124, {\n      size: 15, color: '#8b96b4', align: 'center', letter: 1,\n    });\n\n    // 房號\n    const boxW = 92, boxH = 108;\n    const totalW = boxW * 4 + 18 * 3;\n    const bx = cx - totalW / 2;\n    for (let i = 0; i < 4; i++) {\n      const x = bx + i * (boxW + 18);\n      const y = 170;\n      const active = this.field === 'room' && i === this.room.length;\n      panel(ctx, x, y, boxW, boxH, active ? '#ffb45c' : (this.field === 'room' ? '#8f9bb5' : '#4a5168'), { glow: active ? 1 : 0.4 });\n      text(ctx, this.room[i] || '_', x + boxW / 2, y + 74, {\n        size: 56, color: this.room[i] ? '#ffffff' : '#39405e', align: 'center', weight: 900,\n      });\n      this.taps.add(x, y, boxW, boxH, 'room');\n    }\n\n    // 中繼位址\n    const ax = cx - 300, ay = 310;\n    text(ctx, '中繼伺服器位址（留空 = 跟遊戲同一台主機）', ax, ay - 12, { size: 14, color: '#9fb4ff' });\n    panel(ctx, ax, ay, 600, 48, this.field === 'address' ? '#ffb45c' : '#4a5168', { glow: this.field === 'address' ? 0.8 : 0 });\n    text(ctx, this.address || 'ws://（本機）', ax + 16, ay + 32, {\n      size: 18, color: this.address ? '#ffffff' : '#6f7aa3',\n    });\n    this.taps.add(ax, ay, 600, 48, 'address');\n\n    // 數字鍵盤（手機用）\n    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', ':'];\n    keys.forEach((k, i) => {\n      const col = i % 3, row = Math.floor(i / 3);\n      const kx = cx - 168 + col * 116, ky = 384 + row * 64;\n      panel(ctx, kx, ky, 104, 54, '#4a5168', { glow: 0 });\n      text(ctx, k === 'del' ? '←' : k, kx + 52, ky + 36, { size: 22, color: '#dfe6ff', align: 'center' });\n      this.taps.add(kx, ky, 104, 54, `k${k}`);\n    });\n\n    if (this.status) {\n      text(ctx, this.status, cx, 646, { size: 17, color: '#ffd24d', align: 'center' });\n    }\n    text(ctx, isTouch() ? '點數字鍵輸入房號　再點「連線」' : '數字鍵輸入房號　↑↓ 切換欄位　Enter 連線　Esc 返回', cx, 676, {\n      size: 14, color: '#6f7aa3', align: 'center',\n    });\n\n    panel(ctx, cx + 200, 384, 150, 54, '#5fa36a', { glow: 0.8 });\n    text(ctx, '連線', cx + 275, 420, { size: 22, color: '#ffffff', align: 'center' });\n    this.taps.add(cx + 200, 384, 150, 54, 'join');\n\n    panel(ctx, cx - 350, 384, 150, 54, '#6b748f', { glow: 0 });\n    text(ctx, '返回', cx - 275, 420, { size: 22, color: '#dfe6ff', align: 'center' });\n    this.taps.add(cx - 350, 384, 150, 54, 'back');\n\n    this.taps.commit();\n  }\n}\n\n// ==================================================================\nexport class ResultScreen {\n  constructor(game) {\n    this.game = game;\n    this.taps = new Taps();\n    this.t = 0;\n  }\n\n  onEnter(opts = {}) {\n    this.t = 0;\n    this.winner = opts.winner;\n    this.battle = opts.battle;\n    this.mode = opts.mode;\n  }\n\n  update(dt) {\n    this.t += dt;\n    const nav = menuNav();\n    if (nav.ok) this.again();\n    if (nav.back) this.game.goto('title');\n  }\n\n  again() {\n    this.game.audio.play('select');\n    if (this.mode === 'net') this.game.goto('title');\n    else this.game.goto('select', { mode: this.mode });\n  }\n\n  onPointer(x, y) {\n    const a = this.taps.hit(x, y);\n    if (a === 'again') this.again();\n    if (a === 'title') this.game.goto('title');\n  }\n\n  draw(ctx) {\n    this.taps.begin();\n    this.battle.draw(ctx);\n    ctx.fillStyle = 'rgba(4,6,14,0.78)';\n    ctx.fillRect(0, 0, VIEW, WORLD.h);\n\n    const win = this.battle.fighters[this.winner];\n    const lose = this.battle.fighters[this.winner === 0 ? 1 : 0];\n    const cx = VIEW / 2;\n\n    stencil(ctx, 'K.O.', cx, 130, { size: 92, color: win.char.color, letter: 10 });\n    text(ctx, `${win.char.name} 獲勝`, cx, 180, { size: 30, color: '#ffffff', align: 'center' });\n    text(ctx, `${this.battle.roundWins[0]} - ${this.battle.roundWins[1]}`, cx, 216, {\n      size: 22, color: '#9fb4ff', align: 'center',\n    });\n\n    // 勝者站左、敗者倒在右邊；兩邊都往外靠，武器才不會擋到字\n    const bob = Math.sin(this.t * 2) * 6;\n    drawPortrait(ctx, win.char, cx - 372, 556 + bob, 1.75, this.t, 'idle');\n    ctx.save();\n    ctx.globalAlpha = 0.45;\n    drawPortrait(ctx, lose.char, cx + 372, 556, 1.5, this.t, 'ko');\n    ctx.restore();\n\n    const stats = [\n      ['總傷害', `${Math.round(win.dmgDealt)}`, `${Math.round(lose.dmgDealt)}`],\n      ['最高連段', `${win.maxCombo}`, `${lose.maxCombo}`],\n      ['剩餘血量', `${Math.max(0, Math.round(win.hp))}`, `${Math.max(0, Math.round(lose.hp))}`],\n    ];\n    stats.forEach((s, i) => {\n      const y = 300 + i * 40;\n      text(ctx, s[1], cx - 60, y, { size: 22, color: win.char.color, align: 'right' });\n      text(ctx, s[0], cx, y, { size: 15, color: '#9fb4ff', align: 'center' });\n      text(ctx, s[2], cx + 60, y, { size: 22, color: lose.char.color, align: 'left' });\n    });\n\n    panel(ctx, cx - 230, 600, 200, 54, '#5fa36a', { glow: 0.8 });\n    text(ctx, '再打一場', cx - 130, 636, { size: 20, color: '#ffffff', align: 'center' });\n    this.taps.add(cx - 230, 600, 200, 54, 'again');\n\n    panel(ctx, cx + 30, 600, 200, 54, '#6b748f', { glow: 0 });\n    text(ctx, '回主畫面', cx + 130, 636, { size: 20, color: '#dfe6ff', align: 'center' });\n    this.taps.add(cx + 30, 600, 200, 54, 'title');\n\n    this.taps.commit();\n  }\n}\n","skills.js":"// 招式元件庫。\n//\n// 二十位角色技能 + 十招必殺，如果每一招都從零寫起會又長又不一致，\n// 所以拆成可組合的元件：彈道／場域／地刺／光束／突進／連打／天降／引力…\n// 角色資料只填 kind 與參數，視覺再用自己的顏色與形狀做出辨識度。\n//\n// 兩種元件：\n//   Entity   有自己生命週期的東西（飛行物、場域、光束）\n//   Routine  一段時間內「操控施放者」的腳本（突進、連斬、瞬移）\n\nimport {\n  TAU, circlePath, ngonPath, polyPath, crescentPath, linePath, taperPath,\n  neonStroke, glowFill, joltPath, starPath,\n} from './gfx.js';\nimport { clamp, rand, sign, rect, overlaps, easeOut, withAlpha, dist } from './util.js';\nimport { WORLD } from './render.js';\n\n// ------------------------------------------------------------------ 基底\nclass Entity {\n  constructor(o = {}) {\n    Object.assign(this, { t: 0, life: 1, dead: false, layer: 'front' }, o);\n  }\n  update(dt) {\n    this.t += dt;\n    if (this.t >= this.life) this.dead = true;\n  }\n  draw() {}\n}\n\n/** 一段時間內操控施放者的腳本 */\nclass Routine extends Entity {\n  constructor(o) { super(o); }\n  update(dt, battle) {\n    this.t += dt;\n    if (this.step) this.step(dt, this, battle);\n    if (this.t >= this.life) {\n      if (this.finish) this.finish(this, battle);\n      this.dead = true;\n    }\n  }\n}\n\nconst foeOf = (user) => user.battle.opponentOf(user);\n\n/** 對指定矩形內的敵人造成一次傷害 */\nfunction hitRect(user, r, hit) {\n  const foe = foeOf(user);\n  if (!foe || foe.dead) return false;\n  if (!overlaps(r, foe.bodyRect())) return false;\n  return user.dealDamage(foe, hit);\n}\n\nfunction hitCircle(user, x, y, radius, hit) {\n  const foe = foeOf(user);\n  if (!foe || foe.dead) return false;\n  const b = foe.bodyRect();\n  const cx = clamp(x, b.x, b.x + b.w);\n  const cy = clamp(y, b.y, b.y + b.h);\n  if (dist(x, y, cx, cy) > radius) return false;\n  return user.dealDamage(foe, hit);\n}\n\n// ------------------------------------------------------------------ 飛行物\nexport class Projectile extends Entity {\n  constructor(o) {\n    super({ layer: 'front', radius: 16, gravity: 0, homing: 0, pierce: false, ...o });\n    this.hitIds = new Set();\n    this.trail = [];\n  }\n  update(dt, battle) {\n    this.t += dt;\n    if (this.t >= this.life) { this.explode(battle); return; }\n    const foe = foeOf(this.user);\n    if (this.homing > 0 && foe && !foe.dead) {\n      const c = foe.center();\n      const want = Math.atan2(c.y - this.y, c.x - this.x);\n      const cur = Math.atan2(this.vy, this.vx);\n      let d = ((want - cur + Math.PI * 3) % TAU) - Math.PI;\n      const turn = clamp(d, -this.homing * dt, this.homing * dt);\n      const sp = Math.hypot(this.vx, this.vy);\n      this.vx = Math.cos(cur + turn) * sp;\n      this.vy = Math.sin(cur + turn) * sp;\n    }\n    this.vy += this.gravity * dt;\n    this.x += this.vx * dt;\n    this.y += this.vy * dt;\n    this.trail.unshift({ x: this.x, y: this.y });\n    if (this.trail.length > 10) this.trail.pop();\n\n    if (foe && !foe.dead && !this.hitIds.has(foe.id)) {\n      const b = foe.bodyRect();\n      const cx = clamp(this.x, b.x, b.x + b.w);\n      const cy = clamp(this.y, b.y, b.y + b.h);\n      if (dist(this.x, this.y, cx, cy) <= this.radius) {\n        this.hitIds.add(foe.id);\n        this.user.dealDamage(foe, { ...this.hit, kbDir: sign(this.vx) || this.user.facing });\n        battle.fx.spark(this.x, this.y, this.color, this.big ? 1.8 : 1);\n        battle.fx.stop(this.big ? 0.08 : 0.04);\n        if (!this.pierce) { this.explode(battle); return; }\n      }\n    }\n    if (this.x < WORLD.left - 120 || this.x > WORLD.right + 120 || this.y > WORLD.ground + 60 || this.y < -200) {\n      this.explode(battle);\n    }\n  }\n  explode(battle) {\n    if (this.dead) return;\n    this.dead = true;\n    if (this.boom) {\n      hitCircle(this.user, this.x, this.y, this.boom, { ...this.hit, dmg: this.hit.dmg * 0.6 });\n      battle.fx.ring(this.x, this.y, this.color, { r0: 10, r1: this.boom * 1.4, life: 0.3, width: 5 });\n    }\n    battle.fx.burst(this.x, this.y, this.color, { count: this.big ? 26 : 12, speed: 320, shape: 'hex', life: 0.5 });\n    if (this.big) battle.fx.quake(8, 0.2);\n  }\n  draw(ctx) {\n    const c = this.color;\n    // 尾跡\n    if (this.trail.length > 2) {\n      ctx.save();\n      ctx.globalCompositeOperation = 'lighter';\n      for (let i = 1; i < this.trail.length; i++) {\n        const a = (1 - i / this.trail.length) * 0.5;\n        ctx.strokeStyle = withAlpha(c, a);\n        ctx.lineWidth = this.radius * (1 - i / this.trail.length) * 1.2;\n        ctx.beginPath();\n        ctx.moveTo(this.trail[i - 1].x, this.trail[i - 1].y);\n        ctx.lineTo(this.trail[i].x, this.trail[i].y);\n        ctx.stroke();\n      }\n      ctx.restore();\n    }\n    const r = this.radius;\n    const ang = Math.atan2(this.vy, this.vx);\n    switch (this.shape) {\n      case 'crescent':\n        glowFill(ctx, crescentPath(this.x, this.y, r * 1.1, ang - 1.1, ang + 1.1, r * 0.5), c, 0.95);\n        glowFill(ctx, crescentPath(this.x, this.y, r * 1.1, ang - 0.9, ang + 0.9, r * 0.2), '#ffffff', 0.8);\n        break;\n      case 'shard':\n        glowFill(ctx, polyPath([\n          { x: this.x + Math.cos(ang) * r * 1.8, y: this.y + Math.sin(ang) * r * 1.8 },\n          { x: this.x + Math.cos(ang + 2.1) * r, y: this.y + Math.sin(ang + 2.1) * r },\n          { x: this.x + Math.cos(ang - 2.1) * r, y: this.y + Math.sin(ang - 2.1) * r },\n        ]), c, 0.95);\n        glowFill(ctx, circlePath(this.x, this.y, r * 0.4), '#ffffff', 0.9);\n        break;\n      case 'star':\n        glowFill(ctx, starPath(this.x, this.y, 5, r * 1.5, r * 0.6, this.t * 6), c, 0.9);\n        glowFill(ctx, circlePath(this.x, this.y, r * 0.45), '#ffffff', 0.95);\n        break;\n      case 'meteor':\n        glowFill(ctx, ngonPath(this.x, this.y, r, 6, this.t * 4), c, 0.95);\n        glowFill(ctx, circlePath(this.x, this.y, r * 0.5), '#fff27a', 0.9);\n        break;\n      default:\n        glowFill(ctx, circlePath(this.x, this.y, r * 1.5), c, 0.25);\n        glowFill(ctx, circlePath(this.x, this.y, r), c, 0.85);\n        glowFill(ctx, circlePath(this.x, this.y, r * 0.45), '#ffffff', 0.95);\n        neonStroke(ctx, circlePath(this.x, this.y, r * (1.6 + Math.sin(this.t * 14) * 0.12)), c, 2, 1.2);\n        break;\n    }\n  }\n}\n\n// ------------------------------------------------------------------ 場域\nexport class Zone extends Entity {\n  constructor(o) {\n    super({ layer: 'back', tick: 0.5, tickT: 0, ...o });\n  }\n  update(dt, battle) {\n    this.t += dt;\n    if (this.follow && !this.follow.dead) {\n      this.x = this.follow.x;\n      this.y = this.follow.y - 40;\n    }\n    if (this.t >= this.life) { this.dead = true; return; }\n    this.tickT -= dt;\n    if (this.tickT <= 0) {\n      this.tickT = this.tick;\n      hitCircle(this.user, this.x, this.y, this.radius, this.hit);\n    }\n    if (this.pull) {\n      const foe = foeOf(this.user);\n      if (foe && !foe.dead) {\n        const c = foe.center();\n        const d = dist(this.x, this.y, c.x, c.y);\n        if (d < this.radius) {\n          foe.vx += sign(this.x - c.x) * this.pull * dt;\n          if (this.lift) foe.vy = Math.min(foe.vy, this.lift);\n        }\n      }\n    }\n    if (this.push) {\n      const foe = foeOf(this.user);\n      if (foe && !foe.dead && Math.abs(foe.x - this.x) < this.radius) {\n        foe.vx = sign(foe.x - this.x) * this.push;\n      }\n    }\n    if (Math.random() < 0.5) {\n      battle.fx.particle({\n        x: this.x + rand(-this.radius, this.radius),\n        y: this.y + rand(-this.radius * 0.6, this.radius * 0.6),\n        vx: rand(-20, 20), vy: -rand(20, 70), g: -40, life: 0.8,\n        size: 3.5, color: this.color, shape: 'hex', layer: 'back',\n      });\n    }\n  }\n  draw(ctx) {\n    const k = this.t / this.life;\n    const a = clamp(Math.min(this.t * 4, 1) * (1 - Math.max(0, k - 0.8) * 5), 0, 1);\n    ctx.save();\n    ctx.globalAlpha = a;\n    for (let i = 0; i < 3; i++) {\n      const rr = this.radius * (0.55 + i * 0.22);\n      ctx.save();\n      ctx.translate(this.x, this.y);\n      ctx.scale(1, 0.55);\n      glowFill(ctx, circlePath(0, 0, rr), this.color, 0.1);\n      neonStroke(ctx, circlePath(0, 0, rr), this.color, 1.6, 1);\n      ctx.restore();\n    }\n    ctx.restore();\n  }\n}\n\n// ------------------------------------------------------------------ 地刺\nexport class SpikeRow extends Entity {\n  constructor(o) {\n    super({ layer: 'front', life: 1.6, spawned: 0, spikes: [], ...o });\n  }\n  update(dt, battle) {\n    this.t += dt;\n    const want = Math.min(this.count, Math.floor(this.t / 0.09) + 1);\n    while (this.spawned < want) {\n      const i = this.spawned++;\n      const x = this.x + this.dir * this.step * (i + 1);\n      if (x < WORLD.left || x > WORLD.right) continue;\n      this.spikes.push({ x, t: 0, h: this.height * rand(0.85, 1.2) });\n      hitCircle(this.user, x, WORLD.ground - 40, 64, this.hit);\n      battle.fx.burst(x, WORLD.ground, this.color, { count: 8, speed: 260, dir: -Math.PI / 2, spread: 1.4, shape: 'shard', life: 0.5 });\n      battle.fx.quake(4, 0.12);\n    }\n    for (const s of this.spikes) s.t += dt;\n    if (this.t >= this.life) this.dead = true;\n  }\n  draw(ctx) {\n    for (const s of this.spikes) {\n      const grow = clamp(s.t / 0.12, 0, 1);\n      const fade = clamp((this.life - this.t) / 0.4, 0, 1);\n      const h = s.h * easeOut(grow) * fade;\n      const p = this.style === 'lava'\n        ? polyPath([\n          { x: s.x - 26, y: WORLD.ground },\n          { x: s.x - 10, y: WORLD.ground - h },\n          { x: s.x + 6, y: WORLD.ground - h * 0.8 },\n          { x: s.x + 24, y: WORLD.ground },\n        ])\n        : polyPath([\n          { x: s.x - 18, y: WORLD.ground },\n          { x: s.x, y: WORLD.ground - h },\n          { x: s.x + 18, y: WORLD.ground },\n        ]);\n      glowFill(ctx, p, this.color, 0.55);\n      neonStroke(ctx, p, this.color, 2.4, 1.2);\n    }\n  }\n}\n\n// ------------------------------------------------------------------ 光束\nexport class Beam extends Entity {\n  constructor(o) { super({ layer: 'front', life: 0.6, hitDone: false, ...o }); }\n  update(dt, battle) {\n    this.t += dt;\n    if (!this.hitDone && this.t > 0.12) {\n      this.hitDone = true;\n      const y = this.y;\n      const r = this.dir > 0\n        ? rect(this.x, y - this.width / 2, WORLD.right - this.x + 100, this.width)\n        : rect(WORLD.left - 100, y - this.width / 2, this.x - WORLD.left + 100, this.width);\n      hitRect(this.user, r, { ...this.hit, kbDir: this.dir });\n      battle.fx.quake(14, 0.35);\n      battle.fx.flashScreen(0.28, this.color);\n    }\n    if (this.t >= this.life) this.dead = true;\n  }\n  draw(ctx) {\n    const k = this.t / this.life;\n    const grow = clamp(k / 0.2, 0, 1);\n    const fade = clamp((1 - k) / 0.4, 0, 1);\n    const w = this.width * grow * fade;\n    const x2 = this.dir > 0 ? WORLD.right + 100 : WORLD.left - 100;\n    ctx.save();\n    ctx.globalCompositeOperation = 'lighter';\n    const grad = ctx.createLinearGradient(this.x, 0, x2, 0);\n    grad.addColorStop(0, withAlpha(this.color, 0.95));\n    grad.addColorStop(1, withAlpha(this.color, 0.1));\n    ctx.fillStyle = grad;\n    ctx.fillRect(Math.min(this.x, x2), this.y - w / 2, Math.abs(x2 - this.x), w);\n    ctx.fillStyle = withAlpha('#ffffff', 0.9 * fade);\n    ctx.fillRect(Math.min(this.x, x2), this.y - w * 0.16, Math.abs(x2 - this.x), w * 0.32);\n    ctx.restore();\n  }\n}\n\n// ------------------------------------------------------------------ 虛影\nexport class Decoy extends Entity {\n  constructor(o) { super({ layer: 'back', life: 3.5, ...o }); }\n  update(dt) {\n    this.t += dt;\n    if (this.t >= this.life) this.dead = true;\n  }\n  draw(ctx, battle) {\n    const k = this.t / this.life;\n    const a = clamp(Math.min(this.t * 3, 1) * (1 - k) * 0.65, 0, 1);\n    ctx.save();\n    ctx.globalAlpha = a;\n    ctx.globalCompositeOperation = 'lighter';\n    battle.paintFighter(ctx, this.snap, this.color);\n    ctx.restore();\n  }\n}\n\n// ------------------------------------------------------------------ 衝擊波\nexport class Wave extends Entity {\n  constructor(o) { super({ layer: 'front', life: 0.9, hitIds: new Set(), ...o }); }\n  update(dt, battle) {\n    this.t += dt;\n    this.x += this.dir * this.speed * dt;\n    const foe = foeOf(this.user);\n    if (foe && !foe.dead && !this.hitIds.has(foe.id)) {\n      if (Math.abs(foe.x - this.x) < 46 && foe.y >= WORLD.ground - 40) {\n        this.hitIds.add(foe.id);\n        this.user.dealDamage(foe, { ...this.hit, kbDir: this.dir });\n        battle.fx.spark(foe.x, foe.y - 40, this.color, 1.5);\n      }\n    }\n    if (this.t >= this.life || this.x < WORLD.left - 80 || this.x > WORLD.right + 80) this.dead = true;\n  }\n  draw(ctx) {\n    const k = this.t / this.life;\n    const h = 90 * (1 - k * 0.5);\n    const p = polyPath([\n      { x: this.x - this.dir * 40, y: WORLD.ground },\n      { x: this.x - this.dir * 10, y: WORLD.ground - h },\n      { x: this.x + this.dir * 16, y: WORLD.ground - h * 0.7 },\n      { x: this.x + this.dir * 40, y: WORLD.ground },\n    ]);\n    glowFill(ctx, p, this.color, 0.85 * (1 - k));\n    neonStroke(ctx, p, '#ffffff', 2 * (1 - k), 1);\n  }\n}\n\n// ------------------------------------------------------------------ 鉤索\n/** 飛出去的抓鉤：帶著一條鎖鏈，勾到人就把人拉回來，沒勾到就收回 */\nexport class Hook extends Entity {\n  constructor(o) {\n    super({ layer: 'front', life: 1.2, state: 'out', ...o });\n    this.x = o.x; this.y = o.y;\n    this.startX = o.x; this.startY = o.y;\n  }\n  update(dt, battle) {\n    this.t += dt;\n    const user = this.user;\n    if (!user || user.dead) { this.dead = true; return; }\n    const hand = { x: user.x + user.facing * 30, y: user.y - 62 };\n\n    if (this.st
