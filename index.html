trokeStyle = withAlpha(color, 0.07 * glow);\n    ctx.stroke(path);\n    ctx.lineWidth = width * 2.1;\n    ctx.strokeStyle = withAlpha(color, 0.16 * glow);\n    ctx.stroke(path);\n    ctx.globalCompositeOperation = 'source-over';\n  }\n  ctx.lineWidth = width;\n  ctx.strokeStyle = color;\n  ctx.stroke(path);\n  if (width > 2.4) {\n    ctx.lineWidth = width * 0.3;\n    ctx.strokeStyle = 'rgba(255,255,255,0.8)';\n    ctx.stroke(path);\n  }\n}\n\n/** 深色實心 + 霓虹邊：角色身上每一塊板子都用這個 */\nexport function neonPlate(ctx, path, color, opts = {}) {\n  const { core = '#0a0c18', width = 3, glow = 1, alpha = 1 } = opts;\n  ctx.save();\n  ctx.globalAlpha = alpha;\n  ctx.fillStyle = core;\n  ctx.fill(path);\n  neonStroke(ctx, path, color, width, glow);\n  ctx.restore();\n}\n\n/** 純發光填色（特效用，走加法混色） */\nexport function glowFill(ctx, path, color, alpha = 0.8, bloom = 1) {\n  ctx.save();\n  ctx.globalCompositeOperation = 'lighter';\n  if (bloom > 0) {\n    ctx.globalAlpha = alpha * 0.25 * bloom;\n    ctx.fillStyle = color;\n    ctx.fill(path);\n  }\n  ctx.globalAlpha = alpha;\n  ctx.fillStyle = color;\n  ctx.fill(path);\n  ctx.restore();\n}\n\n/** 畫一段文字（街機字重＋陰影），回傳量到的寬度 */\nexport function text(ctx, str, x, y, opts = {}) {\n  const {\n    size = 20, color = '#e7ecff', align = 'left', weight = 700,\n    shadow = 'rgba(0,0,0,.75)', letter = 0, baseline = 'alphabetic', glow = 0,\n  } = opts;\n  ctx.save();\n  ctx.font = `${weight} ${size}px \"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",system-ui,sans-serif`;\n  ctx.textAlign = align;\n  ctx.textBaseline = baseline;\n  if (letter && ctx.letterSpacing !== undefined) ctx.letterSpacing = `${letter}px`;\n  if (glow > 0) {\n    ctx.globalCompositeOperation = 'lighter';\n    ctx.fillStyle = withAlpha(typeof color === 'string' && color[0] === '#' ? color : '#ffffff', 0.25 * glow);\n    ctx.fillText(str, x, y);\n    ctx.globalCompositeOperation = 'source-over';\n  }\n  if (shadow) {\n    ctx.fillStyle = shadow;\n    ctx.fillText(str, x + 2, y + 2);\n  }\n  ctx.fillStyle = color;\n  ctx.fillText(str, x, y);\n  const w = ctx.measureText(str).width;\n  ctx.restore();\n  return w;\n}\n\nexport function measure(ctx, str, size = 20, weight = 700) {\n  ctx.save();\n  ctx.font = `${weight} ${size}px \"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",system-ui,sans-serif`;\n  const w = ctx.measureText(str).width;\n  ctx.restore();\n  return w;\n}\n\n/**\n * 面板：一塊有切角的舊鋼板。\n * 深色金屬漸層 + 上緣受光的亮邊 + 下緣的暗邊 + 一道主題色的噴漆，\n * 整套 UI（HUD、選單、觸控鍵）共用同一個質感，跟角色的寫實打光對得上。\n */\nexport function platePath(x, y, w, h, cut = 12) {\n  const p = new Path2D();\n  p.moveTo(x + cut, y);\n  p.lineTo(x + w, y);\n  p.lineTo(x + w, y + h - cut);\n  p.lineTo(x + w - cut, y + h);\n  p.lineTo(x, y + h);\n  p.lineTo(x, y + cut);\n  p.closePath();\n  return p;\n}\n\nexport function panel(ctx, x, y, w, h, color = '#8f9bb5', opts = {}) {\n  const { fill = null, width = 1.6, glow = 0.8, cut = 12 } = opts;\n  const p = platePath(x, y, w, h, cut);\n  ctx.save();\n\n  // 鋼板本體\n  if (fill) {\n    ctx.fillStyle = fill;\n  } else {\n    const g = ctx.createLinearGradient(x, y, x + w * 0.25, y + h);\n    g.addColorStop(0, 'rgba(46,52,64,0.95)');\n    g.addColorStop(0.45, 'rgba(26,30,38,0.95)');\n    g.addColorStop(1, 'rgba(13,15,20,0.96)');\n    ctx.fillStyle = g;\n  }\n  ctx.fill(p);\n\n  // 斜向的刷紋\n  ctx.save();\n  ctx.clip(p);\n  ctx.globalAlpha = 0.05;\n  ctx.strokeStyle = '#cdd6e8';\n  ctx.lineWidth = 1;\n  for (let i = -h; i < w + h; i += 7) {\n    ctx.beginPath();\n    ctx.moveTo(x + i, y + h);\n    ctx.lineTo(x + i + h, y);\n    ctx.stroke();\n  }\n  // 上緣的主題色噴漆\n  ctx.globalAlpha = 0.5 + glow * 0.3;\n  ctx.fillStyle = color;\n  ctx.fillRect(x, y, w, 3);\n  ctx.globalAlpha = 0.12;\n  ctx.fillRect(x, y, w, Math.min(h * 0.34, 22));\n  ctx.restore();\n\n  // 邊緣：受光的上緣亮、背光的下緣暗\n  ctx.lineWidth = width;\n  ctx.strokeStyle = 'rgba(0,0,0,0.85)';\n  ctx.stroke(p);\n  ctx.save();\n  ctx.clip(p);\n  ctx.strokeStyle = 'rgba(210,222,245,0.28)';\n  ctx.lineWidth = 1.4;\n  ctx.translate(0.8, 0.8);\n  ctx.stroke(p);\n  ctx.restore();\n\n  ctx.restore();\n  return p;\n}\n\n/** 鏤空模板字：工業感的標題與數字 */\nexport function stencil(ctx, str, x, y, opts = {}) {\n  const { size = 30, color = '#e8edf8', align = 'center', weight = 900, letter = 2, alpha = 1 } = opts;\n  ctx.save();\n  ctx.globalAlpha = alpha;\n  text(ctx, str, x, y, { size, color, align, weight, letter, shadow: 'rgba(0,0,0,0.85)' });\n  ctx.restore();\n}\n","hud.js":"// 對戰 HUD：血條、氣條、計時、回合數、技能冷卻、連段數與大字幕。\n\nimport { panel, platePath, stencil, text, measure, neonStroke, circlePath, polyPath } from './gfx.js';\nimport { WORLD } from './render.js';\nimport { clamp, withAlpha, lerp, isTouch } from './util.js';\nimport { MAX_METER } from './combat.js';\nimport { WINS_NEEDED } from './battle.js';\n\n/** 畫面寬度（世界比畫面寬，選單與 HUD 都用畫面座標） */\nconst VIEW = WORLD.view;\n\nconst BAR_W = 470;\nconst BAR_H = 26;\n\nconst ghost = [1, 1];\n\nexport function drawHud(ctx, battle, opts = {}) {\n  const { localSides = [0] } = opts;\n  const t = battle.time;\n\n  battle.fighters.forEach((f, i) => {\n    const ratio = clamp(f.hp / f.maxHp, 0, 1);\n    ghost[i] = ghost[i] < ratio ? ratio : Math.max(ratio, ghost[i] - 0.006);\n    drawFighterBar(ctx, f, i, ratio, ghost[i], battle, t);\n  });\n\n  drawTimer(ctx, battle);\n\n  // 本機玩家的技能格（雙人同機時兩邊都畫）。\n  // 手機上冷卻已經畫在觸控鍵上了，底下這排就不重複佔位置。\n  if (!isTouch()) localSides.forEach((side, idx) => {\n    const f = battle.fighters[side];\n    if (!f) return;\n    const x = localSides.length > 1 ? (side === 0 ? 24 : VIEW - 24 - 258) : 24;\n    drawSkillBar(ctx, f, x, WORLD.h - 76, t);\n  });\n\n  if (battle.comboT > 0 && battle.comboShown >= 3) {\n    const side = battle.comboSide;\n    const f = battle.fighters[side];\n    const x = side === 0 ? 210 : VIEW - 210;\n    const a = clamp(battle.comboT, 0, 1);\n    const pop = 1 + Math.max(0, 0.25 - (1.2 - battle.comboT)) * 2;\n    ctx.save();\n    ctx.translate(x, 210);\n    ctx.scale(pop, pop);\n    stencil(ctx, `${battle.comboShown}`, 0, 0, {\n      size: 56, color: withAlpha(f.char.accent, a), letter: 0,\n    });\n    text(ctx, 'COMBO', 0, 26, { size: 18, color: withAlpha('#ffffff', a * 0.8), align: 'center' });\n    ctx.restore();\n  }\n\n  drawBanner(ctx, battle);\n  if (battle.state === 'intro') drawCountdown(ctx, battle);\n}\n\nfunction drawFighterBar(ctx, f, side, ratio, ghostRatio, battle, t) {\n  const right = side === 1;\n  const x = right ? VIEW - 40 - BAR_W : 40;\n  const y = 42;\n  const c = f.char.color;\n\n  // 外框：斜切的鋼製血條槽\n  const frame = polyPath(right ? [\n    { x: x + BAR_W, y }, { x: x + BAR_W, y: y + BAR_H },\n    { x: x + 16, y: y + BAR_H }, { x, y: y + BAR_H / 2 }, { x: x + 16, y },\n  ] : [\n    { x, y }, { x: x + BAR_W - 16, y }, { x: x + BAR_W, y: y + BAR_H / 2 },\n    { x: x + BAR_W - 16, y: y + BAR_H }, { x, y: y + BAR_H },\n  ]);\n  const slot = ctx.createLinearGradient(x, y, x, y + BAR_H);\n  slot.addColorStop(0, 'rgba(10,11,16,0.96)');\n  slot.addColorStop(1, 'rgba(26,29,37,0.96)');\n  ctx.fillStyle = slot;\n  ctx.fill(frame);\n\n  // 血量（受傷後殘影條先退）\n  ctx.save();\n  ctx.clip(frame);\n  const gw = BAR_W * ghostRatio;\n  const hw = BAR_W * ratio;\n  ctx.fillStyle = 'rgba(150,26,38,0.85)';\n  ctx.fillRect(right ? x + BAR_W - gw : x, y, gw, BAR_H);\n  const grad = ctx.createLinearGradient(x, y, x, y + BAR_H);\n  grad.addColorStop(0, withAlpha(c, 0.95));\n  grad.addColorStop(0.45, c);\n  grad.addColorStop(1, 'rgba(0,0,0,0.55)');\n  ctx.fillStyle = grad;\n  ctx.fillRect(right ? x + BAR_W - hw : x, y, hw, BAR_H);\n  // 血條表面的高光\n  ctx.fillStyle = 'rgba(255,255,255,0.14)';\n  ctx.fillRect(right ? x + BAR_W - hw : x, y + 2, hw, 3);\n  // 斜線紋理\n  ctx.globalAlpha = 0.16;\n  ctx.strokeStyle = '#000';\n  ctx.lineWidth = 6;\n  for (let i = -BAR_H; i < BAR_W + BAR_H; i += 16) {\n    ctx.beginPath();\n    ctx.moveTo(x + i, y + BAR_H);\n    ctx.lineTo(x + i + BAR_H, y);\n    ctx.stroke();\n  }\n  ctx.restore();\n  ctx.save();\n  ctx.lineWidth = 2;\n  ctx.strokeStyle = 'rgba(0,0,0,0.9)';\n  ctx.stroke(frame);\n  ctx.lineWidth = 1.2;\n  ctx.strokeStyle = 'rgba(205,218,242,0.3)';\n  ctx.stroke(frame);\n  ctx.restore();\n\n  // 氣條\n  const my = y + BAR_H + 6;\n  const mw = BAR_W * 0.62;\n  const mx = right ? x + BAR_W - mw : x;\n  ctx.fillStyle = 'rgba(12,14,19,0.95)';\n  ctx.fillRect(mx, my, mw, 9);\n  ctx.strokeStyle = 'rgba(0,0,0,0.8)';\n  ctx.lineWidth = 1;\n  ctx.strokeRect(mx + 0.5, my + 0.5, mw - 1, 8);\n  const meter = clamp(f.meter / MAX_METER, 0, 1);\n  const full = meter >= 1;\n  ctx.fillStyle = full ? '#fff27a' : withAlpha(f.char.accent, 0.9);\n  const fw = mw * meter;\n  ctx.fillRect(right ? mx + mw - fw : mx, my, fw, 9);\n  if (full) {\n    ctx.save();\n    ctx.globalCompositeOperation = 'lighter';\n    ctx.globalAlpha = 0.4 + 0.3 * Math.sin(t * 8);\n    ctx.fillStyle = '#fff27a';\n    ctx.fillRect(mx, my - 2, mw, 13);\n    ctx.restore();\n    text(ctx, '必殺 READY', right ? mx + mw : mx, my + 30, {\n      size: 13, color: '#ffd76a', align: right ? 'right' : 'left', letter: 2,\n    });\n  }\n\n  // 名牌\n  const label = `${f.char.name}`;\n  const sub = `${f.char.en}・${f.char.title}`;\n  text(ctx, label, right ? x + BAR_W : x, y - 10, {\n    size: 22, color: c, align: right ? 'right' : 'left', letter: 1,\n  });\n  const lw = measure(ctx, label, 22);\n  text(ctx, sub, right ? x + BAR_W - lw - 10 : x + lw + 10, y - 11, {\n    size: 12, color: '#93a0cc', align: right ? 'right' : 'left',\n  });\n\n  // 回合勝利點數\n  for (let i = 0; i < WINS_NEEDED; i++) {\n    const px = right ? x + BAR_W - 12 - i * 22 : x + 12 + i * 22;\n    const won = battle.roundWins[side] > i;\n    const p = circlePath(px, y + BAR_H + 30, 7);\n    ctx.fillStyle = won ? c : 'rgba(255,255,255,0.08)';\n    ctx.fill(p);\n    ctx.lineWidth = 1.6;\n    ctx.strokeStyle = won ? 'rgba(255,255,255,0.55)' : 'rgba(150,163,190,0.5)';\n    ctx.stroke(p);\n  }\n\n  // 狀態圖示\n  const chips = [];\n  if (f.bleed > 0) chips.push([`流血 ${f.bleed}`, '#d1342f']);\n  if (f.stagger > 0) chips.push(['暈眩', '#e8d27a']);\n  if (f.slow > 0) chips.push(['腿傷', '#9fb4ff']);\n  if (f.marked > 0) chips.push(['標記', '#38e1b0']);\n  if (f.dr > 0 && f.drTime > 0) chips.push(['護盾', '#7ef1ff']);\n  chips.slice(0, 4).forEach((chip, i) => {\n    const w = 58;\n    const cx = right ? x + BAR_W - w - i * (w + 6) : x + i * (w + 6);\n    const cy = y + BAR_H + 44;\n    ctx.fillStyle = withAlpha(chip[1], 0.18);\n    ctx.fillRect(cx, cy, w, 18);\n    ctx.strokeStyle = withAlpha(chip[1], 0.7);\n    ctx.lineWidth = 1;\n    ctx.strokeRect(cx + 0.5, cy + 0.5, w - 1, 17);\n    text(ctx, chip[0], cx + w / 2, cy + 13, { size: 11, color: chip[1], align: 'center' });\n  });\n}\n\nfunction drawTimer(ctx, battle) {\n  const cx = VIEW / 2;\n  const secs = Math.ceil(battle.timer);\n  const urgent = secs <= 10 && battle.state === 'fight';\n  panel(ctx, cx - 52, 26, 104, 72, urgent ? '#c8323f' : '#8f9bb5', { cut: 14, glow: urgent ? 1 : 0.4 });\n  stencil(ctx, String(secs).padStart(2, '0'), cx, 86, {\n    size: 46, color: urgent ? '#ff6b78' : '#e9eef8', letter: 3,\n  });\n  text(ctx, `ROUND ${battle.round}`, cx, 118, { size: 12, color: '#8d97b0', align: 'center', letter: 3 });\n}\n\nfunction drawSkillBar(ctx, f, x, y, t) {\n  const slots = [\n    { key: 'U', s: f.char.skills[0], cd: f.cds[0], max: f.char.skills[0].cd },\n    { key: 'I', s: f.char.skills[1], cd: f.cds[1], max: f.char.skills[1].cd },\n    { key: 'O', s: f.char.ult, cd: 0, max: 0, ult: true },\n  ];\n  slots.forEach((slot, i) => {\n    const sx = x + i * 88;\n    const w = 80, h = 52;\n    const ready = slot.ult ? f.meter >= MAX_METER : slot.cd <= 0;\n    const col = slot.ult ? '#fff27a' : f.char.color;\n    panel(ctx, sx, y, w, h, ready ? col : '#4a5168', { glow: ready ? 1 : 0, cut: 8 });\n    // 冷卻遮罩\n    if (!ready && !slot.ult) {\n      const k = clamp(slot.cd / slot.max, 0, 1);\n      ctx.fillStyle = 'rgba(4,5,9,0.8)';\n      ctx.fillRect(sx, y + h * (1 - k), w, h * k);\n      text(ctx, slot.cd.toFixed(1), sx + w / 2, y + h / 2 + 8, { size: 20, color: '#ffffff', align: 'center' });\n    } else if (!ready) {\n      const k = clamp(f.meter / MAX_METER, 0, 1);\n      ctx.fillStyle = 'rgba(4,5,9,0.8)';\n      ctx.fillRect(sx, y + h * (1 - k), w, h * k);\n      text(ctx, `${Math.floor(k * 100)}%`, sx + w / 2, y + h / 2 + 8, { size: 18, color: '#ffe27a', align: 'center' });\n    }\n    text(ctx, slot.key, sx + 7, y + 17, { size: 12, color: ready ? col : '#6b7599' });\n    const name = slot.s.name;\n    const size = name.length > 4 ? 12 : 13;\n    text(ctx, name, sx + w / 2, y + h - 9, {\n      size, color: ready ? '#e7ecff' : '#767f9f', align: 'center',\n    });\n    if (ready && slot.ult) {\n      ctx.save();\n      ctx.globalCompositeOperation = 'lighter';\n      ctx.globalAlpha = 0.14 + 0.12 * Math.sin(t * 7);\n      ctx.fillStyle = '#ffd76a';\n      ctx.fillRect(sx, y, w, h);\n      ctx.restore();\n    }\n  });\n}\n\nfunction drawBanner(ctx, battle) {\n  const b = battle.banner;\n  if (!b) return;\n  const k = b.t / b.life;\n  const a = clamp(Math.min(b.t * 5, 1) * (1 - Math.max(0, k - 0.72) * 3.6), 0, 1);\n  const pop = 1 + Math.max(0, 0.18 - b.t) * 3;\n  const cx = VIEW / 2, cy = 260;\n  ctx.save();\n  ctx.translate(cx, cy);\n  ctx.scale(pop, pop);\n  ctx.globalAlpha = a;\n  stencil(ctx, b.text, 0, 0, { size: 74, color: b.color, letter: 6 });\n  if (b.sub) text(ctx, b.sub, 0, 40, { size: 20, color: '#dfe6ff', align: 'center' });\n  ctx.restore();\n}\n\nfunction drawCountdown(ctx, battle) {\n  const left = 2.0 - battle.stateT;\n  if (left <= 0) return;\n  const n = Math.ceil(left);\n  const frac = left - Math.floor(left);\n  const pop = 1 + (1 - frac) * 0.5;\n  ctx.save();\n  ctx.translate(VIEW / 2, 300);\n  ctx.scale(pop, pop);\n  ctx.globalAlpha = clamp(frac * 2.2, 0, 1);\n  stencil(ctx, String(n), 0, 0, { size: 124, color: '#e9eef8', letter: 0 });\n  ctx.restore();\n}\n","input.js":"// 輸入層。\n//\n// 不論來源是鍵盤、觸控、AI 還是網路對手，最後都收斂成同一個 InputFrame：\n//   { x: -1|0|1, up, down, edges: 位元遮罩 }\n// 邊緣（按下的那一瞬間）用位元遮罩傳，因為連線時整包只要一個數字。\n\nexport const BTN = {\n  JUMP: 1,\n  LIGHT: 2,\n  HEAVY: 4,\n  S1: 8,\n  S2: 16,\n  ULT: 32,\n  DASH: 64,\n};\n\nexport function emptyFrame() {\n  return { x: 0, up: false, down: false, edges: 0 };\n}\n\n/** 兩套鍵盤配置：同一台電腦就能兩個人打 */\nexport const BINDINGS = [\n  {\n    left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'],\n    jump: ['KeyW', 'Space'], light: ['KeyJ'], heavy: ['KeyK'],\n    s1: ['KeyU'], s2: ['KeyI'], ult: ['KeyO'], dash: ['KeyL', 'ShiftLeft'],\n  },\n  {\n    left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'],\n    jump: ['ArrowUp', 'Numpad0'], light: ['Numpad1'], heavy: ['Numpad2'],\n    s1: ['Numpad4'], s2: ['Numpad5'], ult: ['Numpad6'], dash: ['Numpad3', 'ShiftRight'],\n  },\n];\n\nconst down = new Set();\nconst edges = new Set();      // 這一幀剛按下的鍵，讀完就清空\nconst typed = [];             // 這一幀輸入的文字（大廳打中繼位址用）\nlet touchState = null;        // 觸控層寫入的狀態（見 touch.js）\n\nexport function initInput(target = window) {\n  target.addEventListener('keydown', (e) => {\n    if (e.repeat) return;\n    // 方向鍵與空白鍵會捲動頁面，一律吃掉\n    if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();\n    down.add(e.code);\n    edges.add(e.code);\n    // 可列印字元與退格另外收一份，讓輸入框可以真的打字\n    if (e.key && e.key.length === 1 && !e.ctrlKey && !e.metaKey) typed.push(e.key);\n    else if (e.key === 'Backspace') typed.push('\\b');\n  });\n  target.addEventListener('keyup', (e) => down.delete(e.code));\n  target.addEventListener('blur', () => { down.clear(); edges.clear(); });\n}\n\nexport const isDown = (code) => down.has(code);\nexport const isEdge = (code) => edges.has(code);\n\n/** 任一鍵被按下（選單用） */\nexport function anyEdge(codes) {\n  return codes.some((c) => edges.has(c));\n}\n\nexport function menuNav() {\n  return {\n    up: anyEdge(['KeyW', 'ArrowUp']),\n    down: anyEdge(['KeyS', 'ArrowDown']),\n    left: anyEdge(['KeyA', 'ArrowLeft']),\n    right: anyEdge(['KeyD', 'ArrowRight']),\n    // K 是重攻擊、J 是輕攻擊，所以選單的「返回」只認 Esc —— 不然打一拳就退出對戰了\n    ok: anyEdge(['Enter', 'NumpadEnter', 'Space']),\n    // Backspace 留給大廳刪房號用，所以「返回」只認 Esc\n    back: anyEdge(['Escape']),\n  };\n}\n\n/** 每幀結束後呼叫，清掉邊緣事件 */\nexport function endFrame() {\n  edges.clear();\n  typed.length = 0;\n  if (touchState) touchState.edges = 0;\n}\n\n/** 取走這一幀打的字（含 '\\b' 代表退格） */\nexport function drainTyped() {\n  const out = typed.slice();\n  typed.length = 0;\n  return out;\n}\n\nexport function setTouchState(state) {\n  touchState = state;\n}\n\nconst anyDown = (codes) => codes.some((c) => down.has(c));\nconst anyEdgeOf = (codes) => codes.some((c) => edges.has(c));\n\n/** 讀鍵盤（外加第一位玩家的觸控） */\nexport function readPlayer(index = 0) {\n  const b = BINDINGS[index] || BINDINGS[0];\n  const f = emptyFrame();\n  if (anyDown(b.left)) f.x -= 1;\n  if (anyDown(b.right)) f.x += 1;\n  f.up = anyDown(b.up);\n  f.down = anyDown(b.down);\n  if (anyEdgeOf(b.jump)) f.edges |= BTN.JUMP;\n  if (anyEdgeOf(b.light)) f.edges |= BTN.LIGHT;\n  if (anyEdgeOf(b.heavy)) f.edges |= BTN.HEAVY;\n  if (anyEdgeOf(b.s1)) f.edges |= BTN.S1;\n  if (anyEdgeOf(b.s2)) f.edges |= BTN.S2;\n  if (anyEdgeOf(b.ult)) f.edges |= BTN.ULT;\n  if (anyEdgeOf(b.dash)) f.edges |= BTN.DASH;\n\n  // 觸控只驅動第一位玩家\n  if (index === 0 && touchState) {\n    if (touchState.x) f.x = touchState.x;\n    f.up = f.up || touchState.up;\n    f.down = f.down || touchState.down;\n    f.edges |= touchState.edges;\n  }\n  return f;\n}\n","main.js":"// 進入點：畫布、主迴圈、畫面切換，以及把輸入（鍵盤／觸控／AI／網路）接到戰鬥上。\n\nimport { WORLD } from './render.js';\nimport { Battle, MODE } from './battle.js';\nimport { AI } from './ai.js';\nimport { Audio } from './audio.js';\nimport { Net, packInput, unpackInput } from './net.js';\nimport { drawHud } from './hud.js';\nimport { TitleScreen, SelectScreen, LobbyScreen, ResultScreen } from './screens.js';\nimport { initInput, readPlayer, endFrame, emptyFrame, isEdge, menuNav } from './input.js';\nimport { TouchPad } from './touch.js';\nimport { text, panel } from './gfx.js';\n\n/** 畫面寬度（世界比畫面寬，選單與 HUD 都用畫面座標） */\nconst VIEW = WORLD.view;\n\nconst STEP = 1 / 60;\n\nexport async function boot(canvas) {\n  const game = new Game(canvas);\n  game.start();\n  window.GAME = window.NEON = game;   // 方便在 console 或自動測試裡戳\n  return game;\n}\n\nclass Game {\n  constructor(canvas) {\n    this.canvas = canvas;\n    this.ctx = canvas.getContext('2d', { alpha: false });\n    this.audio = new Audio();\n    this.net = new Net();\n    this.touch = new TouchPad();\n    this.acc = 0;\n    this.last = 0;\n    this.frames = 0;\n    this.fps = 60;\n    this.fpsT = 0;\n    this.errors = [];\n\n    this.scenes = {\n      title: new TitleScreen(this),\n      select: new SelectScreen(this),\n      lobby: new LobbyScreen(this),\n      result: new ResultScreen(this),\n    };\n    this.scene = this.scenes.title;\n    this.scene.onEnter?.();\n\n    initInput(window);\n    this.bindPointer();\n    this.bindNet();\n    this.resize();\n    window.addEventListener('resize', () => this.resize());\n\n    const unlock = () => this.audio.unlock();\n    window.addEventListener('keydown', unlock, { once: true });\n    window.addEventListener('pointerdown', unlock, { once: true });\n  }\n\n  // ---------------------------------------------------------------- 版面\n  resize() {\n    // 手機用滿整個可視範圍（外框留給 CSS 的 safe-area），桌機留一點邊\n    const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;\n    const pad = coarse ? 0 : 8;\n    const sw = window.innerWidth - pad * 2;\n    const sh = window.innerHeight - pad * 2;\n    const scale = Math.min(sw / VIEW, sh / WORLD.h);\n    this.canvas.style.width = `${Math.floor(VIEW * scale)}px`;\n    this.canvas.style.height = `${Math.floor(WORLD.h * scale)}px`;\n    this.scale = scale;\n  }\n\n  toLogical(clientX, clientY) {\n    const r = this.canvas.getBoundingClientRect();\n    return {\n      x: ((clientX - r.left) / r.width) * VIEW,\n      y: ((clientY - r.top) / r.height) * WORLD.h,\n    };\n  }\n\n  bindPointer() {\n    const onDown = (e) => {\n      const p = this.toLogical(e.clientX, e.clientY);\n      if (this.scene === this.battleScene) this.touch.onDown(e.pointerId, p.x, p.y);\n      this.scene?.onPointer?.(p.x, p.y);\n    };\n    const onMove = (e) => {\n      if (this.scene !== this.battleScene) return;\n      const p = this.toLogical(e.clientX, e.clientY);\n      this.touch.onMove(e.pointerId, p.x, p.y);\n    };\n    const onUp = (e) => this.touch.onUp(e.pointerId);\n    this.canvas.addEventListener('pointerdown', onDown);\n    this.canvas.addEventListener('pointermove', onMove);\n    window.addEventListener('pointerup', onUp);\n    window.addEventListener('pointercancel', onUp);\n  }\n\n  // ---------------------------------------------------------------- 連線\n  bindNet() {\n    this.net.on('msg', (m) => {\n      if (m.t === 'lobby') {\n        if (this.scene === this.scenes.select) this.scenes.select.onNetLobby(m);\n        return;\n      }\n      if (m.t === 'start') {\n        this.startBattle({ mode: 'net', chars: m.chars, netRole: 'guest' });\n        return;\n      }\n      this.battleScene?.onNetMessage(m);\n    });\n    this.net.on('peer', (m) => {\n      if (!m.joined && this.scene === this.battleScene) {\n        this.toast = '對手離線了';\n        this.goto('title');\n        this.net.close();\n      }\n    });\n    this.net.on('close', () => {\n      if (this.scene === this.scenes.select && this.scenes.select.mode === 'net') this.goto('title');\n    });\n  }\n\n  async connectNet(address, room) {\n    await this.net.connect(address, room);\n    this.goto('select', { mode: 'net', net: this.net });\n  }\n\n  leaveNet() {\n    this.net.close();\n    this.goto('title');\n  }\n\n  /** 主機檢查雙方都選好也都準備了就開打 */\n  tryStartNet(picks, ready) {\n    if (!this.net.isHost) return;\n    if (!picks[0] || !picks[1] || !ready[0] || !ready[1]) return;\n    this.net.send({ t: 'start', chars: picks });\n    this.startBattle({ mode: 'net', chars: picks, netRole: 'host' });\n  }\n\n  // ---------------------------------------------------------------- 場景\n  goto(name, opts) {\n    this.scene?.onExit?.();\n    this.scene = this.scenes[name];\n    this.scene.onEnter?.(opts);\n  }\n\n  startBattle(opts) {\n    this.audio.unlock();\n    this.battleScene = new BattleScene(this, opts);\n    this.scene?.onExit?.();\n    this.scene = this.battleScene;\n  }\n\n  // ---------------------------------------------------------------- 主迴圈\n  start() {\n    this.last = performance.now();\n    const frame = (ts) => {\n      requestAnimationFrame(frame);\n      let dt = (ts - this.last) / 1000;\n      this.last = ts;\n      if (!Number.isFinite(dt)) dt = STEP;\n      dt = Math.min(dt, 0.25);\n      this.acc += dt;\n      let steps = 0;\n      while (this.acc >= STEP && steps < 5) {\n        this.step(STEP);\n        this.acc -= STEP;\n        steps++;\n      }\n      if (steps === 0) endFrame();      // 沒跑到邏輯也要清掉這一幀的按鍵邊緣\n      this.render();\n      this.fpsT += dt;\n      this.frames++;\n      if (this.fpsT >= 0.5) {\n        this.fps = Math.round(this.frames / this.fpsT);\n        this.frames = 0;\n        this.fpsT = 0;\n      }\n    };\n    requestAnimationFrame(frame);\n  }\n\n  step(dt) {\n    try {\n      if (isEdge('KeyM')) {\n        const muted = this.audio.toggleMute();\n        this.toast = muted ? '靜音' : '取消靜音';\n        this.toastT = 1.2;\n      }\n      this.scene?.update?.(dt);\n      this.net.ping();\n    } catch (err) {\n      this.reportError(err);\n    }\n    if (this.toastT > 0) this.toastT -= dt;\n    endFrame();\n  }\n\n  render() {\n    const ctx = this.ctx;\n    // 每幀先把整塊畫布抹掉：戰鬥有鏡頭縮放，某些縮放下天空不會蓋滿整個畫面，\n    // 沒抹乾淨的話上一個畫面的殘影會留在下緣。\n    ctx.setTransform(1, 0, 0, 1, 0, 0);\n    ctx.fillStyle = '#05060f';\n    ctx.fillRect(0, 0, VIEW, WORLD.h);\n    try {\n      this.scene?.draw?.(ctx);\n    } catch (err) {\n      this.reportError(err);\n      ctx.fillStyle = '#100610';\n      ctx.fillRect(0, 0, VIEW, WORLD.h);\n    }\n    if (this.toastT > 0 && this.toast) {\n      panel(ctx, VIEW / 2 - 110, 16, 220, 38, '#ffd24d', { glow: 0.6 });\n      text(ctx, this.toast, VIEW / 2, 42, { size: 17, color: '#ffffff', align: 'center' });\n    }\n    if (this.errors.length) {\n      text(ctx, `⚠ ${this.errors[this.errors.length - 1]}`, 12, WORLD.h - 10, { size: 13, color: '#ff8095' });\n    }\n  }\n\n  reportError(err) {\n    const msg = err && err.message ? err.message : String(err);\n    if (this.errors[this.errors.length - 1] !== msg) this.errors.push(msg);\n    if (this.errors.length > 5) this.errors.shift();\n    console.error(err);\n  }\n}\n\n// ==================================================================\nclass BattleScene {\n  constructor(game, { mode, chars, netRole, difficulty = 1 }) {\n    this.game = game;\n    this.mode = mode;\n    this.netRole = netRole;\n    this.chars = chars;\n    const battleMode = mode !== 'net' ? (mode === 'local' ? MODE.LOCAL : MODE.SOLO)\n      : (netRole === 'host' ? MODE.NET_HOST : MODE.NET_CLIENT);\n    this.battle = new Battle({\n      chars, mode: battleMode, audio: game.audio, difficulty,\n      onMatchEnd: (winner) => this.onMatchEnd(winner),\n    });\n    this.battle.authoritative = mode !== 'net' || netRole === 'host';\n    this.battle.startRound();\n    this.battle.showBanner('ROUND 1', `${this.battle.fighters[0].char.name}  VS  ${this.battle.fighters[1].char.name}`, '#7ef1ff', 1.6);\n\n    this.ai = mode === 'solo' ? new AI(this.battle.fighters[1], difficulty) : null;\n    this.remote = emptyFrame();\n    this.remoteEdges = 0;\n    this.snapT = 0;\n    this.ended = false;\n\n    // 主機把「誰放了什麼招」轉給客戶端，客戶端在本地重播特效\n    if (mode === 'net' && netRole === 'host') {\n      this.battle.onSkill = (f, kind, params) => {\n        game.net.send({ t: 'cast', side: f.side, kind, params });\n      };\n    }\n    this.localSides = mode === 'local' ? [0, 1] : (mode === 'net' ? [netRole === 'host' ? 0 : 1] : [0]);\n    game.touch.setSide(this.localSides[0]);\n    game.touch.watch(this.battle.fighters[this.localSides[0]]);\n    // 手機沒有 Esc：左上角的暫停鍵走同一條路\n    game.touch.onPause = () => {\n      if (this.ended) return;\n      if (this.mode === 'net') this.game.leaveNet();\n      else this.game.goto('title');\n    };\n  }\n\n  // ---------------------------------------------------------------- 更新\n  update(dt) {\n    const nav = menuNav();\n    if (nav.back && !this.ended) {\n      if (this.mode === 'net') this.game.leaveNet();\n      else this.game.goto('title');\n      return;\n    }\n\n    if (this.mode === 'net' && this.netRole === 'guest') {\n      this.updateGuest(dt);\n      return;\n    }\n\n    const inputs = [emptyFrame(), emptyFrame()];\n    if (this.mode === 'solo') {\n      inputs[0] = readPlayer(0);\n      inputs[1] = this.ai.update(dt, this.battle);\n    } else if (this.mode === 'local') {\n      inputs[0] = readPlayer(0);\n      inputs[1] = readPlayer(1);\n    } else {\n      inputs[0] = readPlayer(0);\n      inputs[1] = { ...this.remote, edges: this.remoteEdges };\n      this.remoteEdges = 0;\n    }\n    this.battle.update(dt, inputs);\n\n    if (this.mode === 'net') {\n      this.snapT += dt;\n      if (this.snapT >= 0.05) {      // 20Hz 快照\n        this.snapT = 0;\n        this.game.net.send({ t: 'snap', s: this.battle.collectSnapshot() });\n      }\n    }\n  }\n\n  updateGuest(dt) {\n    // 客戶端：只送輸入、照著主機的快照畫，不自己算傷害\n    const f = readPlayer(0);\n    this.game.net.send({ t: 'in', f: packInput(f) });\n    this.battle.updateRemote(dt);\n  }\n\n  onNetMessage(m) {\n    if (m.t === 'in' && this.netRole === 'host') {\n      const f = unpackInput(m.f);\n      this.remote.x = f.x;\n      this.remote.up = f.up;\n      this.remote.down = f.down;\n      this.remoteEdges |= f.edges;\n      return;\n    }\n    if (m.t === 'snap' && this.netRole === 'guest') {\n      this.battle.applySnapshot(m.s);\n      return;\n    }\n    if (m.t === 'cast' && this.netRole === 'guest') {\n      this.battle.replayCast(m.side, m.kind, m.params);\n      return;\n    }\n    if (m.t === 'end') {\n      this.ended = true;\n      this.game.goto('result', { winner: m.winner, battle: this.battle, mode: this.mode });\n    }\n  }\n\n  onExit() {\n    this.game.touch.onPause = null;\n    this.game.touch.watch(null);\n  }\n\n  onMatchEnd(winner) {\n    if (this.ended) return;\n    this.ended = true;\n    if (this.mode === 'net' && this.netRole === 'host') {\n      this.game.net.send({ t: 'end', winner });\n    }\n    setTimeout(() => {\n      if (this.game.scene === this) {\n        this.game.goto('result', { winner, battle: this.battle, mode: this.mode });\n      }\n    }, 2200);\n  }\n\n  onPointer(x, y) { /* 觸控由 TouchPad 處理 */ }\n\n  // ---------------------------------------------------------------- 繪製\n  draw(ctx) {\n    this.battle.draw(ctx);\n    drawHud(ctx, this.battle, { localSides: this.localSides });\n    if (this.mode === 'net') {\n      text(ctx, `房 ${this.game.net.room}・${this.netRole === 'host' ? '主機' : '客戶端'}・${this.game.net.rtt}ms`,\n        VIEW - 16, WORLD.h - 12, { size: 12, color: '#6f7aa3', align: 'right' });\n    }\n    this.game.touch.draw(ctx);\n  }\n}\n","material.js":"// 寫實渲染的材質與打光工具。\n//\n// 這一層決定整個遊戲「看起來像不像真的」。作法不是描邊，而是**每一塊形狀都上光**：\n//   1. 形狀本身（多邊形／膠囊）\n//   2. 沿著光線方向的漸層（亮面 → 中間調 → 暗面）\n//   3. 背光側的輪廓光（rim light）—— 讓角色從暗背景裡浮出來\n//   4. 金屬另外加一道窄而亮的高光帶（specular）\n//   5. 接地陰影與遮蔽陰影（ambient occlusion）\n//\n// 全部用 Canvas 2D 的漸層做，不需要任何貼圖。\n\nimport { clamp, lerp, withAlpha } from './util.js';\n\n/** 場景主光源方向（左上打下來），rim 是背後的補光 */\nexport const LIGHT = { x: -0.5, y: -0.86 };\nexport const RIM = { x: 0.62, y: -0.78 };\n\n/** 材質：base 中間調、light 亮面、dark 暗面、spec 高光強度、rough 粗糙度（高光越寬） */\nexport const MAT = {\n  steel: { base: '#a3aec0', light: '#eef3fb', dark: '#5f6a7c', spec: 0.95, rough: 0.12 },\n  iron: { base: '#828d9d', light: '#c2ccda', dark: '#4b5462', spec: 0.55, rough: 0.3 },\n  darkIron: { base: '#5c6573', light: '#939cab', dark: '#343b46', spec: 0.4, rough: 0.35 },\n  brass: { base: '#d4a63f', light: '#f9e59c', dark: '#8a6519', spec: 0.8, rough: 0.2 },\n  rust: { base: '#b06a33', light: '#e39a5d', dark: '#6d3d19', spec: 0.22, rough: 0.6 },\n  leather: { base: '#8f5c33', light: '#c08a58', dark: '#57351a', spec: 0.18, rough: 0.7 },\n  cloth: { base: '#c3c9d4', light: '#f2f5fa', dark: '#7a8492', spec: 0.06, rough: 0.9 },\n  skin: { base: '#e2a877', light: '#f8d6ad', dark: '#ab6c41', spec: 0.2, rough: 0.55 },\n  rubber: { base: '#4e545e', light: '#828a97', dark: '#2b2f36', spec: 0.3, rough: 0.45 },\n  bone: { base: '#e7e1d1', light: '#fcf8f0', dark: '#a89f8a', spec: 0.3, rough: 0.5 },\n};\n\n\n/** 依角色的主題色把材質染一下（同一套盔甲，不同人不同顏色） */\nexport function tint(mat, color, amount = 0.35) {\n  const base = mixColor(mat.base, color, amount);\n  return {\n    ...mat,\n    base,\n    // 亮面＝本色加白，陰影＝本色壓暗並偏冷，整組一起跟著主題色走\n    light: mixColor(base, '#ffffff', 0.34),\n    dark: mixColor(mixColor(base, '#000000', 0.34), '#2a3350', 0.18),\n  };\n}\n\nexport function mixColor(a, b, t) {\n  const pa = parseHex(a), pb = parseHex(b);\n  return `rgb(${Math.round(lerp(pa[0], pb[0], t))},${Math.round(lerp(pa[1], pb[1], t))},${Math.round(lerp(pa[2], pb[2], t))})`;\n}\n\nfunction parseHex(h) {\n  if (h[0] !== '#') {\n    const m = h.match(/(\\d+),\\s*(\\d+),\\s*(\\d+)/);\n    return m ? [+m[1], +m[2], +m[3]] : [128, 128, 128];\n  }\n  const n = parseInt(h.slice(1), 16);\n  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];\n}\n\n// ------------------------------------------------------------------ 形狀\n/** 膠囊：手腳、刀柄、鎖鏈都用它 */\nexport function capsule(ax, ay, bx, by, wa, wb = wa) {\n  const dx = bx - ax, dy = by - ay;\n  const len = Math.hypot(dx, dy) || 1;\n  const ux = dx / len, uy = dy / len;\n  const nx = -uy, ny = ux;\n  const p = new Path2D();\n  p.moveTo(ax + nx * wa, ay + ny * wa);\n  p.lineTo(bx + nx * wb, by + ny * wb);\n  p.arc(bx, by, wb, Math.atan2(ny, nx), Math.atan2(-ny, -nx), false);\n  p.lineTo(ax - nx * wa, ay - ny * wa);\n  p.arc(ax, ay, wa, Math.atan2(-ny, -nx), Math.atan2(ny, nx), false);\n  p.closePath();\n  return p;\n}\n\n/**\n * 平滑封閉曲線：把折線的轉角磨圓。\n * 身體、頭顱、靴子這種有機形狀用它，才不會看起來像疊起來的方塊；\n * round = 1 完全圓滑，0 等於直接連折線。\n */\nexport function smooth(pts, round = 1) {\n  const n = pts.length;\n  if (n < 3) return poly(pts);\n  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });\n  const p = new Path2D();\n  let m0 = mid(pts[n - 1], pts[0]);\n  p.moveTo(m0.x, m0.y);\n  for (let i = 0; i < n; i++) {\n    const c = pts[i];\n    const m1 = mid(c, pts[(i + 1) % n]);\n    const flat = mid(m0, m1);\n    p.quadraticCurveTo(lerp(flat.x, c.x, round), lerp(flat.y, c.y, round), m1.x, m1.y);\n    m0 = m1;\n  }\n  p.closePath();\n  return p;\n}\n\n/** 橢圓形狀（頭顱、護目鏡、肌肉團塊） */\nexport function ovalPath(cx, cy, rx, ry, rot = 0) {\n  const p = new Path2D();\n  p.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2);\n  return p;\n}\n\nexport function poly(pts, close = true) {\n  const p = new Path2D();\n  if (!pts.length) return p;\n  p.moveTo(pts[0].x, pts[0].y);\n  for (let i = 1; i < pts.length; i++) p.lineTo(pts[i].x, pts[i].y);\n  if (close) p.closePath();\n  return p;\n}\n\n/**\n * 一整條四肢（肩→肘→腕 / 髖→膝→踝）畫成單一形狀。\n * 分成兩段膠囊畫的話，關節處會出現一顆球的輪廓，看起來就是玩具人偶；\n * 連成一條有粗細變化的曲線，才有「一隻手臂」的感覺。\n */\nexport function limbPath(a, b, c, w0, w1, w2) {\n  const nrm = (p, q) => {\n    const dx = q.x - p.x, dy = q.y - p.y, l = Math.hypot(dx, dy) || 1;\n    return { x: -dy / l, y: dx / l, ux: dx / l, uy: dy / l };\n  };\n  const d0 = nrm(a, b), d1 = nrm(b, c);\n  const nb = { x: (d0.x + d1.x) / 2, y: (d0.y + d1.y) / 2 };\n  const nl = Math.hypot(nb.x, nb.y) || 1;\n  nb.x /= nl; nb.y /= nl;\n  const off = (p, n, w) => ({ x: p.x + n.x * w, y: p.y + n.y * w });\n  return smooth([\n    off(a, d0, w0),\n    off(b, nb, w1),\n    off(c, d1, w2),\n    { x: c.x + d1.ux * w2 * 0.9, y: c.y + d1.uy * w2 * 0.9 },\n    off(c, d1, -w2),\n    off(b, nb, -w1),\n    off(a, d0, -w0),\n    { x: a.x - d0.ux * w0 * 0.9, y: a.y - d0.uy * w0 * 0.9 },\n  ], 0.85);\n}\n\n/** 有厚度的刃面：從 a 到 b，一側是刃、一側是背 */\nexport function bladeShape(ax, ay, bx, by, w, back = 0.4) {\n  const dx = bx - ax, dy = by - ay;\n  const len = Math.hypot(dx, dy) || 1;\n  const nx = -dy / len, ny = dx / len;\n  return poly([\n    { x: ax + nx * w * back, y: ay + ny * w * back },\n    { x: ax + nx * w, y: ay + ny * w },\n    { x: bx, y: by },\n    { x: ax - nx * w * 0.25, y: ay - ny * w * 0.25 },\n  ]);\n}\n\n// ------------------------------------------------------------------ 上光\n/**\n * 把一個形狀上成有體積的樣子。\n * bounds 給漸層用；沒給就從 center/radius 推。\n */\nexport function shade(ctx, path, mat, opts = {}) {\n  const {\n    cx = 0, cy = 0, r = 30, light = LIGHT, rim = null, rimWidth = 1.5,\n    alpha = 1, spec = true, ao = 0, cel = true,\n  } = opts;\n\n  ctx.save();\n  ctx.globalAlpha = alpha;\n\n  const gx0 = cx - light.x * r, gy0 = cy - light.y * r;\n  const gx1 = cx + light.x * r, gy1 = cy + light.y * r;\n  const g = ctx.createLinearGradient(gx0, gy0, gx1, gy1);\n  if (cel) {\n    // 街機格鬥的上色法：亮面／本色／陰影三塊實色，交界是硬邊不是漸層。\n    // 用同一個位置放兩個色停就能做出硬邊，不必額外裁切。\n    g.addColorStop(0, mat.light);\n    g.addColorStop(0.30, mat.light);\n    g.addColorStop(0.3001, mat.base);\n    g.addColorStop(0.70, mat.base);\n    g.addColorStop(0.7001, mat.dark);\n    g.addColorStop(1, mat.dark);\n  } else {\n    g.addColorStop(0, mat.light);\n    g.addColorStop(0.42, mat.base);\n    g.addColorStop(1, mat.dark);\n  }\n  ctx.fillStyle = g;\n  ctx.fill(path);\n\n  // 金屬的反光：貼著亮面邊緣的一條白\n  if (spec && mat.spec > 0.45) {\n    const sg = ctx.createLinearGradient(gx0, gy0, gx1, gy1);\n    sg.addColorStop(0, `rgba(255,255,255,${0.5 * mat.spec})`);\n    sg.addColorStop(0.14, `rgba(255,255,255,${0.5 * mat.spec})`);\n    sg.addColorStop(0.1401, 'rgba(255,255,255,0)');\n    ctx.fillStyle = sg;\n    ctx.fill(path);\n  }\n\n  // 遮蔽陰影：零件交界處壓深一點\n  if (ao > 0) {\n    const ag = ctx.createLinearGradient(cx, cy - r, cx, cy + r);\n    ag.addColorStop(0, 'rgba(0,0,0,0)');\n    ag.addColorStop(1, `rgba(0,0,0,${0.3 * ao})`);\n    ctx.fillStyle = ag;\n    ctx.fill(path);\n  }\n\n  if (rim) {\n    ctx.save();\n    ctx.clip(path);\n    ctx.lineWidth = rimWidth * 2;\n    ctx.strokeStyle = rim;\n    ctx.globalAlpha = alpha * 0.55;\n    ctx.translate(RIM.x * rimWidth * 0.8, RIM.y * rimWidth * 0.8);\n    ctx.stroke(path);\n    ctx.restore();\n  }\n\n  // 粗黑描邊：街機 sprite 的招牌，每塊形狀都描，合起來就是一圈硬輪廓\n  ctx.globalAlpha = alpha * (opts.outline === undefined ? 1 : opts.outline);\n  ctx.lineWidth = opts.outlineWidth || 2.4;\n  ctx.lineJoin = 'round';\n  ctx.strokeStyle = '#15121a';\n  ctx.stroke(path);\n  ctx.restore();\n}\n\n/** 在已經上好色的形狀裡加一條陰影線（肌肉溝、衣褶、甲片分線） */\nexport function creaseLine(ctx, path, pts, color = 'rgba(0,0,0,0.32)', width = 2) {\n  ctx.save();\n  ctx.clip(path);\n  ctx.strokeStyle = color;\n  ctx.lineWidth = width;\n  ctx.lineCap = 'round';\n  ctx.beginPath();\n  ctx.moveTo(pts[0].x, pts[0].y);\n  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);\n  ctx.stroke();\n  ctx.restore();\n}\n\n/** 手腳：膠囊 + 上光，一行搞定 */\nexport function shadeLimb(ctx, ax, ay, bx, by, wa, wb, mat, opts = {}) {\n  const path = capsule(ax, ay, bx, by, wa, wb);\n  shade(ctx, path, mat, {\n    cx: (ax + bx) / 2, cy: (ay + by) / 2, r: Math.max(wa, wb) * 1.6, ...opts,\n  });\n  return path;\n}\n\n/** 接地陰影：越高越淡越大 */\nexport function groundShadow(ctx, x, groundY, height, scale = 1) {\n  const h = clamp(height, 0, 300);\n  const k = 1 - h / 360;                 // 跳得越高，影子越淡越散\n  const rx = 34 * scale * (1 + h / 420);\n  const ry = Math.max(4, 9 * scale * (1 - h / 900));\n  const g = ctx.createRadialGradient(x, groundY, 0, x, groundY, rx);\n  g.addColorStop(0, `rgba(0,0,0,${0.62 * k})`);\n  g.addColorStop(0.55, `rgba(0,0,0,${0.3 * k})`);\n  g.addColorStop(1, 'rgba(0,0,0,0)');\n  ctx.save();\n  ctx.fillStyle = g;\n  ctx.beginPath();\n  ctx.ellipse(x, groundY, rx, ry, 0, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.restore();\n}\n\n// ------------------------------------------------------------------ 質感\nlet noiseCanvas = null;\n/** 底片顆粒：整個畫面疊一層很淡的雜訊，馬上就沒有「向量圖」的塑膠感 */\nexport function grainPattern(ctx) {\n  if (!noiseCanvas) {\n    noiseCanvas = document.createElement('canvas');\n    noiseCanvas.width = noiseCanvas.height = 128;\n    const c = noiseCanvas.getContext('2d');\n    const img = c.createImageData(128, 128);\n    for (let i = 0; i < img.data.length; i += 4) {\n      const v = 110 + Math.random() * 70;\n      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;\n      img.data[i + 3] = 255;\n    }\n    c.putImageData(img, 0, 0);\n  }\n  return ctx.createPattern(noiseCanvas, 'repeat');\n}\n\n/** 煙霧／塵土：一坨柔邊的徑向漸層 */\nexport function puff(ctx, x, y, r, color, alpha) {\n  const g = ctx.createRadialGradient(x, y, 0, x, y, r);\n  g.addColorStop(0, withAlpha(color, alpha));\n  g.addColorStop(0.55, withAlpha(color, alpha * 0.45));\n  g.addColorStop(1, withAlpha(color, 0));\n  ctx.fillStyle = g;\n  ctx.beginPath();\n  ctx.arc(x, y, r, 0, Math.PI * 2);\n  ctx.fill();\n}\n\n/** 光暈（爆炸、火花、燈光） */\nexport function bloom(ctx, x, y, r, color, alpha = 1) {\n  const g = ctx.createRadialGradient(x, y, 0, x, y, r);\n  g.addColorStop(0, withAlpha('#ffffff', alpha));\n  g.addColorStop(0.25, withAlpha(color, alpha * 0.85));\n  g.addColorStop(1, withAlpha(color, 0));\n  ctx.save();\n  ctx.globalCompositeOperation = 'lighter';\n  ctx.fillStyle = g;\n  ctx.beginPath();\n  ctx.arc(x, y, r, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.restore();\n}\n","net.js":"// 連線對戰的客戶端。\n//\n// 架構刻意選最簡單、也最好維護的一種：\n//   中繼伺服器只做「同一個房號的兩個人互轉封包」，不懂遊戲規則；\n//   先連進房間的人當**主機**，主機跑完整模擬並每秒送 20 次快照，\n//   另一邊只送輸入、照著快照畫。所有傷害判定只有主機算，不會分歧。\n//\n// 房號＝四位數字，兩邊輸入同一組就會配對。\n\nexport class Net {\n  constructor() {\n    this.ws = null;\n    this.role = null;        // 'host' | 'guest'\n    this.room = '';\n    this.peerHere = false;\n    this.status = 'idle';    // idle | connecting | waiting | ready | closed | error\n    this.error = '';\n    this.handlers = new Map();\n    this.lastPing = 0;\n    this.rtt = 0;\n  }\n\n  get isHost() { return this.role === 'host'; }\n  get connected() { return this.ws && this.ws.readyState === WebSocket.OPEN; }\n\n  on(type, fn) {\n    if (!this.handlers.has(type)) this.handlers.set(type, []);\n    this.handlers.get(type).push(fn);\n    return this;\n  }\n\n  emit(type, payload) {\n    const list = this.handlers.get(type);\n    if (list) for (const fn of list) fn(payload);\n  }\n\n  /**\n   * 位址寫法三種都收：\n   *   （空白）          → 和遊戲同一台主機（用 relay 伺服器直接開遊戲時最方便）\n   *   example.com:8787  → ws://example.com:8787\n   *   wss://x.y.z       → 原樣使用（雲端平台都是這種）\n   */\n  static resolveUrl(address) {\n    const a = (address || '').trim();\n    const secure = location.protocol === 'https:';\n    if (!a) {\n      const proto = secure ? 'wss:' : 'ws:';\n      return `${proto}//${location.host}`;\n    }\n    if (a.startsWith('ws://') || a.startsWith('wss://')) return a;\n    const proto = secure ? 'wss:' : 'ws:';\n    return a.includes(':') ? `${proto}//${a}` : `${proto}//${a}:8787`;\n  }\n\n  connect(address, room) {\n    this.close();\n    this.room = room;\n    this.status = 'connecting';\n    this.error = '';\n    let url;\n    try {\n      url = Net.resolveUrl(address);\n    } catch (e) {\n      this.status = 'error';\n      this.error = '位址看不懂';\n      return Promise.reject(e);\n    }\n\n    return new Promise((resolve, reject) => {\n      let ws;\n      try {\n        ws = new WebSocket(url);\n      } catch (e) {\n        this.status = 'error';\n        this.error = '無法建立連線';\n        reject(e);\n        return;\n      }\n      this.ws = ws;\n      const timeout = setTimeout(() => {\n        if (this.status === 'connecting') {\n          this.error = '連不上中繼伺服器';\n          this.status = 'error';\n          try { ws.close(); } catch (e) { /* 已經關了就算了 */ }\n          reject(new Error(this.error));\n        }\n      }, 8000);\n\n      ws.onopen = () => {\n        ws.send(JSON.stringify({ t: 'join', room }));\n      };\n      ws.onmessage = (ev) => {\n        let msg;\n        try { msg = JSON.parse(ev.data); } catch (e) { return; }\n        switch (msg.t) {\n          case 'role':\n            clearTimeout(timeout);\n            this.role = msg.role;\n            this.status = msg.peers >= 2 ? 'ready' : 'waiting';\n            this.peerHere = msg.peers >= 2;\n            this.emit('role', msg);\n            resolve(msg);\n            break;\n          case 'peer':\n            this.peerHere = msg.joined;\n            this.status = msg.joined ? 'ready' : 'waiting';\n            this.emit('peer', msg);\n            break;\n          case 'full':\n            clearTimeout(timeout);\n            this.error = '這個房號已經有兩個人了';\n            this.status = 'error';\n            this.emit('error', this.error);\n            reject(new Error(this.error));\n            break;\n          case 'pong':\n            this.rtt = Math.round(performance.now() - msg.ts);\n            break;\n          default:\n            this.emit('msg', msg);\n            break;\n        }\n      };\n      ws.onerror = () => {\n        if (this.status === 'connecting') {\n          this.error = '連不上中繼伺服器';\n          this.status = 'error';\n          clearTimeout(timeout);\n          reject(new Error(this.error));\n        }\n        this.emit('error', this.error || '連線發生錯誤');\n      };\n      ws.onclose = () => {\n        clearTimeout(timeout);\n        if (this.status !== 'error') this.status = 'closed';\n        this.peerHere = false;\n        this.emit('close');\n      };\n    });\n  }\n\n  send(obj) {\n    if (!this.connected) return;\n    this.ws.send(JSON.stringify(obj));\n  }\n\n  ping() {\n    const now = performance.now();\n    if (now - this.lastPing < 2000) return;\n    this.lastPing = now;\n    this.send({ t: 'ping', ts: now });\n  }\n\n  close() {\n    if (this.ws) {\n      try { this.ws.close(); } catch (e) { /* 忽略 */ }\n      this.ws = null;\n    }\n    this.role = null;\n    this.peerHere = false;\n    if (this.status !== 'error') this.status = 'idle';\n  }\n}\n\n/** 輸入壓成四個數字，一秒 60 次也才幾 KB */\nexport const packInput = (f) => [f.x, f.up ? 1 : 0, f.down ? 1 : 0, f.edges];\nexport const unpackInput = (a) => ({ x: a[0], up: !!a[1], down: !!a[2], edges: a[3] });\n","render.js":"// 繪製層：場景與角色（寫實路線）。\n//\n// 角色不是線條人，而是一塊一塊上了光的body：每根骨頭畫成有體積的膠囊，\n// 盔甲是分片的金屬板，武器有金屬高光，背光側有一道角色色的輪廓光，\n// 腳下有接地陰影、濕地板上有倒影。材質與打光的工具在 material.js。\n//\n// 場景是黃昏的工業廢場：遠景大樓、鐵塔與吊車、探照燈光柱、鐵網圍欄、\n// 積水的水泥地。靜態的部分只畫一次進 offscreen canvas，每幀只疊動態的霧、雨與燈光。\n\nimport {\n  MAT, LIGHT, RIM, tint, mixColor, capsule, poly, smooth, ovalPath, limbPath, bladeShape,\n  shade, shadeLimb, creaseLine, groundShadow, puff, bloom, grainPattern,\n} from './material.js';\nimport { poseFor, blendRig } from './rig.js';\nimport { withAlpha, lerp, clamp, makeRng, rand } from './util.js';\nimport { text } from './gfx.js';\n\nexport const WORLD = { w: 1900, h: 720, ground: 600, left: 40, right: 1860, view: 1280 };\n\n// ==================================================================\n// 場景\n// ==================================================================\nlet backdrop = null;      // 預先畫好的靜態背景\nlet backdropW = 0;\n\nfunction buildBackdrop() {\n  const w = WORLD.w + 200;\n  const h = WORLD.ground + 40;\n  const cv = document.createElement('canvas');\n  cv.width = w;\n  cv.height = h;\n  const c = cv.getContext('2d');\n  const rng = makeRng(88123);\n\n  // --- 天空：黃昏的髒橘到夜藍 ---\n  const sky = c.createLinearGradient(0, 0, 0, h);\n  sky.addColorStop(0, '#2a5c96');\n  sky.addColorStop(0.38, '#5c8fc4');\n  sky.addColorStop(0.66, '#a9c1d8');\n  sky.addColorStop(0.85, '#f0c48a');\n  sky.addColorStop(1, '#f5d9a8');\n  c.fillStyle = sky;\n  c.fillRect(0, 0, w, h);\n\n  // 雲：拉長的柔邊橢圓\n  for (let i = 0; i < 26; i++) {\n    const x = rng() * w;\n    const y = 60 + rng() * (h * 0.5);\n    const rx = 120 + rng() * 260;\n    const ry = 14 + rng() * 26;\n    const a = 0.16 + rng() * 0.2;\n    const g = c.createRadialGradient(x, y, 0, x, y, rx);\n    const col = y > h * 0.4 ? '#fff0d8' : '#eaf1fb';\n    g.addColorStop(0, withAlpha(col, a));\n    g.addColorStop(1, withAlpha(col, 0));\n    c.save();\n    c.translate(x, y);\n    c.scale(1, ry / rx);\n    c.fillStyle = g;\n    c.beginPath();\n    c.arc(0, 0, rx, 0, Math.PI * 2);\n    c.fill();\n    c.restore();\n  }\n\n  // --- 遠景城市（霧化） ---\n  const drawBlocks = (baseY, minH, maxH, col, fog, step) => {\n    let x = -60;\n    while (x < w + 60) {\n      const bw = step * (0.6 + rng() * 0.9);\n      const bh = minH + rng() * (maxH - minH);\n      // 每棟樓自己有明暗：頂端受天光、底部沉進陰影，才不是一塊紙板\n      const bg = c.createLinearGradient(x, baseY - bh, x + bw * 0.6, baseY);\n      bg.addColorStop(0, mixColor(col, '#8fa0c0', 0.3 - fog * 0.2));\n      bg.addColorStop(0.35, col);\n      bg.addColorStop(1, mixColor(col, '#05070c', 0.45));\n      c.fillStyle = bg;\n      c.fillRect(x, baseY - bh, bw, bh);\n      // 受光側的邊緣亮線\n      c.fillStyle = withAlpha('#c9d6ef', 0.1 + (1 - fog) * 0.08);\n      c.fillRect(x, baseY - bh, 1.5, bh);\n      c.fillRect(x, baseY - bh, bw, 1.5);\n      // 屋頂設備\n      c.fillStyle = mixColor(col, '#05070c', 0.3);\n      if (rng() > 0.6) c.fillRect(x + bw * 0.2, baseY - bh - 8 - rng() * 14, bw * 0.25, 14);\n      // 窗光\n      if (fog < 0.5) {\n        for (let wy = baseY - bh + 10; wy < baseY - 8; wy += 13) {\n          for (let wx = x + 5; wx < x + bw - 6; wx += 10) {\n            if (rng() > 0.86) {\n              c.fillStyle = withAlpha(rng() > 0.5 ? '#ffd9a0' : '#9fd8ff', 0.5 + rng() * 0.4);\n              c.fillRect(wx, wy, 3, 5);\n            }\n          }\n        }\n      }\n      x += bw + 4 + rng() * 18;\n    }\n  };\n  drawBlocks(WORLD.ground - 120, 120, 300, '#8fa6c4', 0.55, 90);   // 最遠：被天光洗淡\n  drawBlocks(WORLD.ground - 60, 90, 240, '#647ea3', 0.34, 110);\n  drawBlocks(WORLD.ground - 10, 70, 190, '#42557a', 0.16, 130);    // 最近：顏色最實\n\n  // 大氣透視：靠近地平線越濁，遠景自然退後\n  const haze = c.createLinearGradient(0, WORLD.ground - 340, 0, WORLD.ground);\n  haze.addColorStop(0, 'rgba(230,220,210,0)');\n  haze.addColorStop(0.55, 'rgba(240,215,180,0.2)');\n  haze.addColorStop(1, 'rgba(250,225,185,0.4)');\n  c.fillStyle = haze;\n  c.fillRect(0, WORLD.ground - 340, w, 340);\n\n  // --- 工業結構：吊車與鐵塔 ---\n  const steel = '#3a4560';\n  const drawCrane = (x, baseY, scale) => {\n    c.save();\n    c.translate(x, baseY);\n    c.scale(scale, scale);\n    c.fillStyle = steel;\n    c.fillRect(-9, -260, 18, 260);\n    for (let i = 0; i < 9; i++) {\n      c.fillRect(-9, -250 + i * 28, 18, 3);\n      c.save();\n      c.translate(0, -250 + i * 28);\n      c.rotate(0.5);\n      c.fillRect(-1.5, 0, 3, 30);\n      c.restore();\n    }\n    c.fillRect(-140, -268, 300, 12);           // 吊臂\n    c.fillRect(70, -256, 6, 60);               // 吊索\n    c.fillRect(56, -196, 34, 18);              // 吊鉤\n    c.restore();\n  };\n  drawCrane(250, WORLD.ground - 40, 1);\n  drawCrane(1500, WORLD.ground - 30, 0.85);\n\n  // 煙囪 + 排煙\n  for (const [cx, sc] of [[760, 1], [1180, 0.8]]) {\n    c.fillStyle = '#44506b';\n    c.fillRect(cx - 16 * sc, WORLD.ground - 300 * sc, 32 * sc, 300 * sc);\n    for (let i = 0; i < 6; i++) {\n      const g = c.createRadialGradient(cx, WORLD.ground - 300 * sc - i * 26, 0, cx, WORLD.ground - 300 * sc - i * 26, 40 + i * 12);\n      g.addColorStop(0, `rgba(190,190,200,${0.10 - i * 0.012})`);\n      g.addColorStop(1, 'rgba(190,190,200,0)');\n      c.fillStyle = g;\n      c.beginPath();\n      c.arc(cx, WORLD.ground - 300 * sc - i * 26, 40 + i * 12, 0, Math.PI * 2);\n      c.fill();\n    }\n  }\n\n  // --- 鐵網圍欄（中景）---\n  // 矮一點、淡一點：它是場地的邊界，不該比打架的人還搶眼\n  c.save();\n  c.globalAlpha = 0.34;\n  c.strokeStyle = '#2e3850';\n  c.lineWidth = 1;\n  for (let x = -40; x < w + 40; x += 16) {\n    c.beginPath();\n    c.moveTo(x, WORLD.ground - 104);\n    c.lineTo(x + 16, WORLD.ground);\n    c.moveTo(x + 16, WORLD.ground - 104);\n    c.lineTo(x, WORLD.ground);\n    c.stroke();\n  }\n  c.globalAlpha = 0.85;\n  c.fillStyle = '#2e3850';\n  for (let x = -40; x < w + 60; x += 210) {\n    c.fillRect(x, WORLD.ground - 118, 5, 118);\n    c.fillStyle = 'rgba(190,205,235,0.12)';     // 柱子受光的那一側\n    c.fillRect(x, WORLD.ground - 118, 1.2, 118);\n    c.fillStyle = '#0b0e15';\n  }\n  c.fillRect(0, WORLD.ground - 120, w, 4);\n  c.restore();\n\n  // --- 落在地面前的整體陰影：背景越靠近腳邊越沉，人物才跳得出來 ---\n  const sink = c.createLinearGradient(0, WORLD.ground - 170, 0, WORLD.ground);\n  sink.addColorStop(0, 'rgba(40,52,74,0)');\n  sink.addColorStop(1, 'rgba(40,52,74,0.24)');\n  c.fillStyle = sink;\n  c.fillRect(0, WORLD.ground - 170, w, 170);\n\n  backdrop = cv;\n  backdropW = w;\n  return cv;\n}\n\n/** 探照燈的光柱（動態，每幀畫） */\nfunction drawLightShafts(ctx, t) {\n  const lights = [\n    { x: 340, y: WORLD.ground - 330, a: 0.22, spread: 90, col: '#ffd9a0' },\n    { x: 980, y: WORLD.ground - 380, a: 0.16, spread: 110, col: '#cfe4ff' },\n    { x: 1560, y: WORLD.ground - 320, a: 0.2, spread: 84, col: '#ffc98a' },\n  ];\n  ctx.save();\n  ctx.globalCompositeOperation = 'lighter';\n  // 模糊一下，光柱才不會是一塊硬邊的梯形\n  if (typeof ctx.filter === 'string') ctx.filter = 'blur(16px)';\n  for (const L of lights) {\n    const flick = 0.82 + 0.18 * Math.sin(t * 7.3 + L.x);\n    const g = ctx.createLinearGradient(L.x, L.y, L.x, WORLD.ground);\n    g.addColorStop(0, withAlpha(L.col, 0.12 * L.a * flick));\n    g.addColorStop(1, withAlpha(L.col, 0));\n    ctx.fillStyle = g;\n    ctx.beginPath();\n    ctx.moveTo(L.x - 16, L.y);\n    ctx.lineTo(L.x + 16, L.y);\n    ctx.lineTo(L.x + L.spread, WORLD.ground);\n    ctx.lineTo(L.x - L.spread, WORLD.ground);\n    ctx.closePath();\n    ctx.fill();\n  }\n  if (typeof ctx.filter === 'string') ctx.filter = 'none';\n  for (const L of lights) {\n    const flick = 0.82 + 0.18 * Math.sin(t * 7.3 + L.x);\n    bloom(ctx, L.x, L.y, 14 * flick, L.col, 0.5 * L.a);\n  }\n  ctx.restore();\n}\n\n/**\n * 前景：鏡頭前方那一層失焦的鐵件。\n * 打完人物之後再壓上去，畫面立刻有「前／中／後」三層深度。\n */\nexport function drawForeground(ctx, camX) {\n  // 街機格鬥的舞台不擋視線：前景只留一點點地面的邊緣陰影\n  ctx.save();\n  ctx.translate(-camX * 0.4, 0);\n  const g = ctx.createLinearGradient(0, WORLD.h - 70, 0, WORLD.h + 20);\n  g.addColorStop(0, 'rgba(90,58,30,0)');\n  g.addColorStop(1, 'rgba(90,58,30,0.35)');\n  ctx.fillStyle = g;\n  ctx.fillRect(-600, WORLD.h - 70, WORLD.w + 1200, 120);\n  ctx.restore();\n}\n\n/** 飄動的霧層 */\nfunction drawFog(ctx, t, camX) {\n  ctx.save();\n  for (let i = 0; i < 3; i++) {\n    const y = WORLD.ground - 40 - i * 46;\n    const off = ((t * (9 + i * 7) - camX * 0.1) % (WORLD.w + 600)) - 300;\n    const g = ctx.createLinearGradient(0, y - 60, 0, y + 40);\n    g.addColorStop(0, 'rgba(150,160,180,0)');\n    g.addColorStop(0.5, `rgba(150,160,180,${0.05 + i * 0.015})`);\n    g.addColorStop(1, 'rgba(150,160,180,0)');\n    ctx.fillStyle = g;\n    ctx.fillRect(-400 + off * 0.2, y - 60, WORLD.w + 800, 100);\n  }\n  ctx.restore();\n}\n\n/**\n * 背景。**畫在世界座標裡**（和地面同一個鏡頭變換），\n * 只在水平方向做視差位移 —— 這樣地平線永遠貼齊地面，\n * 鏡頭拉遠拉近都不會出現「天空和地板對不上」的接縫。\n */\nexport function drawSky(ctx, t, tintColor = '#3a2a6b', camX = 0) {\n  if (!backdrop) buildBackdrop();\n  ctx.save();\n  // 鏡頭可能拍到世界上方，先鋪滿夜空底色\n  ctx.fillStyle = '#5c8fc4';\n  ctx.fillRect(-600, -700, WORLD.w + 1200, 1400);\n  ctx.translate(camX * 0.22, 0);\n  ctx.drawImage(backdrop, -100, 0);\n  drawLightShafts(ctx, t);\n  ctx.restore();\n}\n\n/** 地面：濕水泥、裂縫、積水與倒影用的資訊 */\nexport function drawGround(ctx, t) {\n  const { w, ground, h } = WORLD;\n  // 地板本體\n  const g = ctx.createLinearGradient(0, ground, 0, h + 120);\n  g.addColorStop(0, '#c99a62');\n  g.addColorStop(0.3, '#b07f4c');\n  g.addColorStop(1, '#8a5f36');\n  ctx.fillStyle = g;\n  ctx.fillRect(-400, ground, w + 800, h - ground + 400);\n\n  // 地磚縫與裂痕\n  ctx.save();\n  ctx.strokeStyle = 'rgba(70,40,18,0.35)';\n  ctx.lineWidth = 2;\n  for (let x = -400; x < w + 400; x += 160) {\n    ctx.beginPath();\n    ctx.moveTo(x, ground);\n    ctx.lineTo(x - 60, h + 200);\n    ctx.stroke();\n  }\n  ctx.strokeStyle = 'rgba(255,240,215,0.14)';\n  ctx.lineWidth = 1;\n  for (let i = 0; i < 5; i++) {\n    const yy = ground + 18 + i * 34;\n    ctx.beginPath();\n    ctx.moveTo(-400, yy);\n    ctx.lineTo(w + 400, yy + 6);\n    ctx.stroke();\n  }\n  ctx.restore();\n\n  // 濕柏油：地平線附近反射一點天光，越往前越暗\n  const hl = ctx.createLinearGradient(0, ground - 2, 0, ground + 90);\n  hl.addColorStop(0, 'rgba(255,240,210,0.3)');\n  hl.addColorStop(0.35, 'rgba(255,230,190,0.1)');\n  hl.addColorStop(1, 'rgba(0,0,0,0)');\n  ctx.fillStyle = hl;\n  ctx.fillRect(-400, ground - 2, w + 800, 92);\n\n  // 積水\n  const rng = makeRng(4242);\n  ctx.save();\n  for (let i = 0; i < 14; i++) {\n    const px = rng() * w;\n    const py = ground + 20 + rng() * 90;\n    const rx = 40 + rng() * 90;\n    const ry = rx * 0.16;\n    const pg = ctx.createRadialGradient(px, py, 0, px, py, rx);\n    pg.addColorStop(0, 'rgba(255,238,205,0.1)');\n    pg.addColorStop(1, 'rgba(150,180,220,0)');\n    ctx.fillStyle = pg;\n    ctx.beginPath();\n    ctx.ellipse(px, py, rx, ry, 0, 0, Math.PI * 2);\n    ctx.fill();\n  }\n  ctx.restore();\n\n  // 場地邊界：水泥護欄\n  for (const wx of [WORLD.left, WORLD.right]) {\n    const dir = wx === WORLD.left ? 1 : -1;\n    ctx.save();\n    const wall = poly([\n      { x: wx - dir * 40, y: ground + 10 },\n      { x: wx - dir * 40, y: ground - 150 },\n      { x: wx, y: ground - 140 },\n      { x: wx, y: ground + 10 },\n    ]);\n    shade(ctx, wall, MAT.rust, { cx: wx, cy: ground - 70, r: 90, ao: 0.5 });\n    ctx.restore();\n  }\n}\n\nexport function drawPlatform(ctx, p, t) {\n  // 工字鋼平台\n  const body = poly([\n    { x: p.x, y: p.y },\n    { x: p.x + p.w, y: p.y },\n    { x: p.x + p.w - 6, y: p.y + p.h },\n    { x: p.x + 6, y: p.y + p.h },\n  ]);\n  shade(ctx, body, MAT.iron, { cx: p.x + p.w / 2, cy: p.y + p.h / 2, r: p.h * 2, ao: 0.6 });\n  // 表面止滑紋\n  ctx.save();\n  ctx.strokeStyle = 'rgba(255,255,255,0.12)';\n  ctx.lineWidth = 1;\n  for (let x = p.x + 8; x < p.x + p.w - 8; x += 12) {\n    ctx.beginPath();\n    ctx.moveTo(x, p.y + 2);\n    ctx.lineTo(x + 6, p.y + p.h - 3);\n    ctx.stroke();\n  }\n  ctx.restore();\n  // 底下的支撐與陰影\n  ctx.fillStyle = 'rgba(0,0,0,0.35)';\n  ctx.fillRect(p.x + 14, p.y + p.h, p.w - 28, 6);\n}\n\n/** 雨：畫在最前面，帶速度線與地面濺起 */\nexport function drawRain(ctx, t, camX, intensity = 1) {\n  const rng = makeRng(777);\n  ctx.save();\n  ctx.globalCompositeOperation = 'lighter';\n  ctx.strokeStyle = 'rgba(180,205,235,0.30)';\n  ctx.lineWidth = 1.2;\n  const count = Math.floor(150 * intensity);\n  for (let i = 0; i < count; i++) {\n    const sp = 700 + rng() * 500;\n    const x0 = rng() * (WORLD.view + 300) - 150 + camX * 0.9;\n    const y0 = ((rng() * 900 + t * sp) % 900) - 120;\n    ctx.beginPath();\n    ctx.moveTo(x0, y0);\n    ctx.lineTo(x0 - 7, y0 + 26);\n    ctx.stroke();\n  }\n  ctx.restore();\n}\n\nexport function drawArena(ctx, t, tintColor = '#3a2a6b') {\n  ctx.save();\n  ctx.translate(-(WORLD.w - WORLD.view) / 2, 0);\n  drawSky(ctx, t, tintColor, 0);\n  drawGround(ctx, t);\n  drawFog(ctx, t, 0);\n  ctx.restore();\n}\n\nexport { drawFog };\n\n// ==================================================================\n// 角色\n// ==================================================================\n\n/** 依角色資料組出這個人身上所有材質 */\nfunction materials(char) {\n  const c = char.color;\n  const p = char.palette || {};\n  return {\n    skin: p.skin ? tint(MAT.skin, p.skin, 0.4) : MAT.skin,\n    // 主色直接當衣服的顏色：街機格鬥就是靠一件鮮豔的衣服認人\n    cloth: tint(MAT.cloth, c, 0.72),\n    cloth2: tint(MAT.cloth, p.cloth || char.accent, 0.66),\n    armor: tint(p.armorMat ? MAT[p.armorMat] : MAT.iron, p.armor || char.accent, 0.5),\n    metal: p.metalMat ? MAT[p.metalMat] : MAT.steel,\n    iron: MAT.iron,\n    darkIron: MAT.darkIron,\n    bone: MAT.bone,\n    strap: MAT.leather,\n    rubber: MAT.rubber,\n    glove: tint(MAT.rubber, char.accent, 0.62),\n    wrap: { base: '#ded6c4', light: '#f6f1e6', dark: '#9d9482', spec: 0.06, rough: 0.95 },\n    shoe: tint(MAT.leather, p.shoe || '#2b2a2e', 0.6),\n    accent: char.accent,\n    rim: c,\n  };\n}\n\n/**\n * 畫一位角色。\n * f 可以是活的 Fighter，也可以是靜態快照 { char, x, y, facing, pose, poseK, phase, animTime }\n */\nexport function drawFighter(ctx, f, opts = {}) {\n  const { flat = null, alpha = 1, shadow = true, reflection = false, onlyReflection = false } = opts;\n  const char = f.char;\n  let J = poseFor(f.pose, f.poseK, f.phase);\n  // 動作之間做內插，切換時才不會「啪」地跳一下。\n  // 受擊要的是衝擊感，所以直接切；殘影／倒影不需要自己的狀態，也直接用。\n  if (!flat && !onlyReflection && f.pose !== undefined) {\n    const hard = f.pose === 'hurt' || f.pose === 'ko';\n    J = f._rig && !hard ? blendRig(f._rig, J, 0.42) : J;\n    f._rig = J;\n  }\n  const scale = (char.build.scale || 1) * 1.12;\n\n  if (shadow && !flat) {\n    const height = WORLD.ground - f.y;\n    groundShadow(ctx, f.x, WORLD.ground + 4, height, scale * 1.15);\n  }\n\n  if (!onlyReflection) {\n    ctx.save();\n    ctx.translate(f.x, f.y);\n    ctx.scale(f.facing * scale, scale);\n    drawBody(ctx, char, J, f, { flat, alpha });\n    // 受擊白閃：整個人變白一格，不是蓋一塊白方塊\n    const hurt = f.hitFlash || 0;\n    if (hurt > 0.02 && !flat) {\n      ctx.save();\n      ctx.globalAlpha = Math.min(0.8, hurt * 0.8) * alpha;\n      drawBody(ctx, char, J, f, { flat: '#ffffff', alpha: 1 });\n      ctx.restore();\n    }\n    ctx.restore();\n  }\n\n  if (reflection && !flat && f.y >= WORLD.ground - 2) {\n    // 濕地板倒影：上下翻轉、壓扁、淡出\n    ctx.save();\n    ctx.globalAlpha = 0.07 * alpha;\n    ctx.translate(f.x, WORLD.ground + 6);\n    ctx.scale(f.facing * scale, -scale * 0.62);\n    drawBody(ctx, char, J, f, { flat: null, alpha: 1, noRim: true });\n    ctx.restore();\n  }\n}\n\nfunction drawBody(ctx, char, J, f, { flat = null, alpha = 1, noRim = false } = {}) {\n  const M = materials(char);\n  const b = char.build;\n  const bulk = b.bulk || 1;\n  const rim = null;   // 邊光改成整體輪廓一次過（見 drawFighter），不再逐塊描邊\n  const gear = char.gear || {};\n  const t = f.animTime || 0;\n\n  const mat = (m) => (flat ? { base: flat, light: flat, dark: flat, spec: 0, rough: 1 } : m);\n  // outfit: 'gi' 開襟道服／'vest' 無袖背心／'sash' 打赤膊只繫腰帶／'robe' 長袍\n  const outfit = gear.outfit || 'gi';\n  const opt = (cx, cy, r, extra = {}) => ({ cx, cy, r, rim, alpha, ...extra });\n\n  // ---------- 背後的裝備 ----------\n  drawBackGear(ctx, char, J, M, { mat, opt, t, bulk, flat });\n\n  // ---------- 後側手腳（壓暗） ----------\n  const backDim = (m) => (flat ? mat(m) : {\n    ...m, base: mixColor(m.base, '#000000', 0.42), light: mixColor(m.light, '#000000', 0.4),\n    dark: mixColor(m.dark, '#000000', 0.3),\n  });\n  drawLeg(ctx, J.hip, J.kneeB, J.footB, M, {\n    mat: (m) => mat(backDim(m)), opt, bulk, flat,\n    outfit: (char.gear && char.gear.outfit) || 'gi', sway: 0, dim: true, char,\n  });\n  shade(ctx, limbPath(J.shoulderB, J.elbowB, J.handB, 8 * bulk, 6.4 * bulk, 3.8 * bulk),\n    backDim(M.skin), opt(J.elbowB.x, J.elbowB.y, 22));\n  shade(ctx, capsule(J.handB.x, J.handB.y, J.handB.x + 1, J.handB.y + 1, 4.6 * bulk), backDim(M.glove), opt(J.handB.x, J.handB.y, 8));\n\n  // ---------- 軀幹 ----------\n  // 沿著髖→胸的軸線長出來，所以前傾／後仰時身體是整塊轉，不是方塊疊方塊。\n  const hip = J.hip, chest = J.chest;\n  const ux = chest.x - hip.x, uy = chest.y - hip.y;\n  const ul = Math.hypot(ux, uy) || 1;\n  const U = { x: ux / ul, y: uy / ul };\n  const N = { x: -U.y, y: U.x };                 // 指向前方（面朝的一側）\n  const W = bulk;\n  const P = (a, s2) => ({ x: hip.x + U.x * a + N.x * s2, y: hip.y + U.y * a + N.y * s2 });\n\n  // 骨盆 → 腰（收）→ 肋骨 → 胸 → 肩：寬肩細腰的人體輪廓\n  const torsoPath = smooth([\n    P(-7, 10.2 * W), P(8, 8.8 * W), P(20, 12.4 * W), P(30, 15 * W),\n    P(38, 10.6 * W), P(42, 4.6 * W),\n    P(42, -5.6 * W), P(36, -13.2 * W), P(24, -13.4 * W),\n    P(10, -9.6 * W), P(-7, -11 * W),\n  ], 0.92);\n  const bareChest = gear.chest === 'bare';\n  shade(ctx, torsoPath, mat(bareChest ? M.skin : M.cloth), opt(chest.x, (hip.y + chest.y) / 2, 28 * bulk, { ao: 0.2 }));\n  if (!flat) {\n    // 胸肌的下緣、胸口中線、腹肌的橫溝 —— 街機 sprite 的肌肉就是靠這幾條線\n    creaseLine(ctx, torsoPath, [P(36, -10 * W), P(33, 0), P(35, 11 * W)], 'rgba(0,0,0,0.3)', 2.2);\n    creaseLine(ctx, torsoPath, [P(43, 1 * W), P(30, 1.5 * W)], 'rgba(0,0,0,0.26)', 2);\n    if (bareChest) {\n      for (const a of [25, 18, 11]) {\n        creaseLine(ctx, torsoPath, [P(a, -7 * W), P(a, 8 * W)], 'rgba(0,0,0,0.22)', 1.8);\n      }\n    }\n  }\n\n  // ---------- 武術道服 ----------\n  const cloth2 = mat(M.cloth2);\n  const sway = Math.sin(t * 2.4) * 2.2;\n\n  if (outfit !== 'sash') {\n    // 上衣本體：從肩線罩到腰，下襬比腰寬一點（布是垂下來的）\n    const jacket = smooth([\n      P(41, 10.5 * W), P(43, 3 * W),\n      P(37, -1 * W),                       // 前襟的開口往內收\n      P(24, -3 * W), P(9, -4 * W),         // 開襟的邊緣一路往下\n      P(2, -12 * W + sway), P(6, -14.5 * W),\n      P(24, -15 * W), P(37, -13.5 * W),\n      P(43, -6 * W),\n    ], 0.55);\n    shade(ctx, jacket, mat(M.cloth), opt(chest.x, (hip.y + chest.y) / 2, 26 * bulk, { ao: 0.3 }));\n\n    if (outfit === 'gi' || outfit === 'robe') {\n      // 另一側的前襟疊上去：兩片交叉成 V 領，這是道服的招牌\n      const lapel = smooth([\n        P(42, 9 * W), P(38, 2 * W), P(22, 6 * W), P(6, 9.5 * W),\n        P(2, 13 * W - sway), P(10, 14 * W), P(30, 13 * W), P(41, 13.5 * W),\n      ], 0.5);\n      shade(ctx, lapel, cloth2, opt(chest.x, chest.y - 4, 24 * bulk, { ao: 0.25 }));\n      if (!flat) {\n        // 領口的滾邊\n        creaseLine(ctx, lapel, [P(42, 9 * W), P(36, 2.6 * W), P(20, 6.4 * W), P(5, 10 * W)],\n          'rgba(0,0,0,0.34)', 2.4);\n      }\n    }\n    if (!flat) {\n      // 衣褶：斜斜的幾條，布才不是一塊板子\n      creaseLine(ctx, jacket, [P(30, -12 * W), P(20, -6 * W)], 'rgba(0,0,0,0.22)', 2);\n      creaseLine(ctx, jacket, [P(18, -13 * W), P(9, -7 * W)], 'rgba(0,0,0,0.18)', 1.8);\n    }\n  }\n\n  // 下襬：蓋過髖部往下垂的一圈布（長袍垂得更長）\n  if (outfit === 'gi' || outfit === 'robe') {\n    const drop = outfit === 'robe' ? -40 : -24;\n    // 前後各一片垂下來的衣襬，中間開衩 —— 腿才踢得出去\n    for (const s3 of [1, -1]) {\n      const flap = smooth([\n        P(6, s3 * 12.5 * W), P(-4, s3 * 13.5 * W),\n        P(drop, s3 * (11 * W) + sway * s3), P(drop - 2, s3 * 5 * W + sway * s3),\n        P(-2, s3 * 4 * W), P(6, s3 * 5.5 * W),\n      ], 0.35);\n      shade(ctx, flap, mat(M.cloth), opt(hip.x, hip.y + 12, 22 * bulk, { ao: 0.42 }));\n      if (!flat) creaseLine(ctx, flap, [P(2, s3 * 9 * W), P(drop + 2, s3 * 8 * W)], 'rgba(0,0,0,0.26)', 2);\n    }\n  }\n\n  // ---------- 前腿 ----------\n  // 先畫裸露的整條腿，再把寬鬆的道服褲罩上去，褲口束在小腿肚\n  drawLeg(ctx, J.hip, J.kneeF, J.footF, M, { mat, opt, bulk, flat, outfit, sway, dim: false, char });\n\n  // ---------- 腰帶：寬布帶 + 結 + 兩條垂下來的帶尾 ----------\n  const beltMat = {\n    base: char.accent, light: mixColor(char.accent, '#ffffff', 0.32),\n    dark: mixColor(char.accent, '#000000', 0.42), spec: 0.08, rough: 0.9,\n  };\n  shade(ctx, smooth([P(13, 12.8 * W), P(13, -13.2 * W), P(-2, -13.6 * W), P(-2, 13.2 * W)], 0.25),\n    mat(beltMat), opt(hip.x, hip.y + 5, 16, { ao: 0.3 }));\n  if (!flat) {\n    // 結\n    shade(ctx, smooth([P(12, 8.6 * W), P(12, 0.6 * W), P(-1, 0), P(-1, 9.2 * W)], 0.55),\n      beltMat, opt(hip.x, hip.y + 5, 11, { ao: 0.28 }));\n    // 帶尾：從結垂下來的兩條布，用直邊的四邊形才不會糊成一團\n    for (const k of [0, 1]) {\n      const s0 = 4.5 * W - k * 6 * W;\n      const dz = -24 - k * 6;\n      const wob = sway * (k ? -1 : 1);\n      const c0 = P(dz * 0.5, s0 + 0.5 * W);\n      shade(ctx, poly([\n        P(0, s0 + 2.4 * W), P(0, s0 - 1.8 * W),\n        P(dz, s0 - 1.4 * W + wob), P(dz, s0 + 2.8 * W + wob),\n      ]), beltMat, { cx: c0.x, cy: c0.y, r: 30, alpha });\n    }\n  }\n\n\n  // ---------- 頭 ----------\n  drawHead(ctx, char, J, M, { mat, opt, bulk, flat, t });\n\n  // ---------- 前臂 ----------\n  drawShoulderPad(ctx, char, J.shoulderF, M, { mat, opt, bulk, flat });\n  // 裸露的手臂：上臂有二頭肌的鼓起、前臂往手腕收\n  {\n    const bi = { x: lerp(J.shoulderF.x, J.elbowF.x, 0.52), y: lerp(J.shoulderF.y, J.elbowF.y, 0.52) };\n    const armPath = limbPath(J.shoulderF, bi, J.elbowF, 7.6 * bulk, 8.2 * bulk, 5.2 * bulk);\n    shade(ctx, armPath, mat(M.skin), opt(bi.x, bi.y, 20));\n    if (!flat) creaseLine(ctx, armPath, [\n      { x: bi.x - 4 * bulk, y: bi.y - 5 }, { x: bi.x + 2 * bulk, y: bi.y + 4 },\n    ]);\n    const fm = { x: lerp(J.elbowF.x, J.handF.x, 0.42), y: lerp(J.elbowF.y, J.handF.y, 0.42) };\n    shade(ctx, limbPath(J.elbowF, fm, J.handF, 5.3 * bulk, 5.4 * bulk, 3.7 * bulk),\n      mat(M.skin), opt(fm.x, fm.y, 14));\n  }\n  // 拳帶：白布一圈一圈纏到手腕，武術裝扮的標配\n  const fa0 = { x: lerp(J.elbowF.x, J.handF.x, 0.3), y: lerp(J.elbowF.y, J.handF.y, 0.3) };\n  const fa1 = { x: lerp(J.elbowF.x, J.handF.x, 0.94), y: lerp(J.elbowF.y, J.handF.y, 0.94) };\n  const wrapPath = capsule(fa0.x, fa0.y, fa1.x, fa1.y, 5.2 * bulk, 4.4 * bulk);\n  shade(ctx, wrapPath, mat(M.wrap), opt(fa0.x, fa0.y, 12, { ao: 0.3 }));\n  if (!flat) {\n    // 纏繞的縫：三道斜線就看得出是布條不是護具\n    const wn = { x: -(fa1.y - fa0.y), y: fa1.x - fa0.x };\n    const wl = Math.hypot(wn.x, wn.y) || 1;\n    for (const k of [0.25, 0.5, 0.75]) {\n      const c0 = { x: lerp(fa0.x, fa1.x, k), y: lerp(fa0.y, fa1.y, k) };\n      creaseLine(ctx, wrapPath, [\n        { x: c0.x + (wn.x / wl) * 6 * bulk, y: c0.y + (wn.y / wl) * 6 * bulk },\n        { x: c0.x - (wn.x / wl) * 6 * bulk - (fa1.x - fa0.x) * 0.09, y: c0.y - (wn.y / wl) * 6 * bulk - (fa1.y - fa0.y) * 0.09 },\n      ], 'rgba(90,80,64,0.45)', 1.8);\n    }\n  }\n  // 手套\n  shade(ctx, capsule(J.handF.x, J.handF.y, J.handF.x + 2, J.handF.y + 2, 5 * bulk), mat(M.glove), opt(J.handF.x, J.handF.y, 8));\n\n  // ---------- 武器 ----------\n  drawWeapon(ctx, char, J, M, { mat, opt, bulk, flat, t, f });\n\n}\n\n/**\n * 一條腿：裸露的腿 → 寬鬆的道服褲 → 褲口束帶 → 綁腿 → 布鞋。\n * 武術裝扮的重點就在褲子：要寬、要垂、褲口要束起來。\n */\nfunction drawLeg(ctx, hip, knee, foot, M, { mat, opt, bulk, flat, outfit, sway, dim, char }) {\n  const root = { x: hip.x, y: hip.y - 3 };\n  // 1. 腿本身\n  shade(ctx, limbPath(root, knee, foot, 9.4 * bulk, 6.2 * bulk, 4.2 * bulk),\n    mat(M.skin), opt(knee.x, knee.y, 28, { ao: 0.24 }));\n\n  // 2. 褲子：包到小腿肚，外側比內側寬一點（布會被甩出去）\n  const cuff = {\n    x: knee.x + (foot.x - knee.x) * 0.62,\n    y: knee.y + (foot.y - knee.y) * 0.62,\n  };\n  if (outfit !== 'shorts') {\n    const dx = foot.x - knee.x, dy = foot.y - knee.y;\n    const l = Math.hypot(dx, dy) || 1;\n    const nx = -dy / l, ny = dx / l;\n    const pant = smooth([\n      { x: root.x + 10 * bulk, y: root.y - 2 },\n      { x: knee.x + 9.2 * bulk, y: knee.y - 2 },\n      { x: cuff.x + nx * 7 * bulk + sway * 0.4, y: cuff.y + ny * 7 * bulk },\n      { x: cuff.x + nx * 5 * bulk, y: cuff.y + ny * 5 * bulk },\n      { x: cuff.x - nx * 5 * bulk, y: cuff.y - ny * 5 * bulk },\n      { x: knee.x - 8 * bulk, y: knee.y - 2 },\n      { x: root.x - 9.5 * bulk, y: root.y - 2 },\n    ], 0.32);\n    shade(ctx, pant, mat(M.cloth), opt(knee.x, knee.y, 30, { ao: 0.34 }));\n    if (!flat) {\n      creaseLine(ctx, pant, [\n        { x: root.x + 3 * bulk, y: root.y + 4 },\n        { x: knee.x + 2 * bulk, y: knee.y - 2 },\n        { x: cuff.x, y: cuff.y },\n      ], 'rgba(0,0,0,0.24)', 2.2);\n    }\n    // 褲口的束帶\n    shade(ctx, capsule(\n      cuff.x - nx * 5.6 * bulk, cuff.y - ny * 5.6 * bulk,\n      cuff.x + nx * 6.4 * bulk, cuff.y + ny * 6.4 * bulk, 2.6 * bulk,\n    ), mat(M.strap), opt(cuff.x, cuff.y, 8, { ao: 0.3 }));\n  }\n\n  // 3. 腳踝的綁布 + 布鞋\n  shade(ctx, capsule(cuff.x, cuff.y, foot.x, foot.y - 2, 4.4 * bulk, 4 * bulk),\n    mat(M.wrap), opt(foot.x, foot.y, 10, { ao: 0.3 }));\n  drawBoot(ctx, foot, mat(M.shoe), bulk, opt(foot.x, foot.y, 12));\n}\n\nfunction drawBoot(ctx, foot, m, bulk, o) {\n  // 腳踝包住 → 腳背斜下 → 鞋尖 → 鞋底平貼地面\n  const p = smooth([\n    { x: foot.x - 4.6 * bulk, y: foot.y - 8 },\n    { x: foot.x + 4 * bulk, y: foot.y - 7 },\n    { x: foot.x + 9.6 * bulk, y: foot.y + 0.5 },\n    { x: foot.x + 9.2 * bulk, y: foot.y + 6 },\n    { x: foot.x - 5.6 * bulk, y: foot.y + 6.5 },\n    { x: foot.x - 6 * bulk, y: foot.y - 2 },\n  ], 0.55);\n  shade(ctx, p, m, { ...o, ao: 0.6 });\n}\n\nfunction drawShoulderPad(ctx, char, s, M, { mat, opt, bulk, flat }) {\n  const style = (char.gear && char.gear.shoulder) || 'plate';\n  if (style === 'none') return;\n  if (style === 'sleeve') {\n    // 道服的短袖：從肩頭垂下來一小截布\n    const w2 = 11 * bulk, h2 = 13 * bulk;\n    const p2 = smooth([\n      { x: s.x - w2 * 0.95, y: s.y - h2 * 0.42 },\n      { x: s.x - w2 * 0.1, y: s.y - h2 * 0.78 },\n      { x: s.x + w2 * 0.9, y: s.y - h2 * 0.4 },\n      { x: s.x + w2 * 1.0, y: s.y + h2 * 0.75 },\n      { x: s.x - w2 * 0.1, y: s.y + h2 * 0.95 },\n      { x: s.x - w2 * 0.95, y: s.y + h2 * 0.6 },\n    ], 0.8);\n    shade(ctx, p2, mat(M.cloth), { ...opt(s.x, s.y, w2 * 1.6), ao: 0.3 });\n    if (!flat) creaseLine(ctx, p2, [{ x: s.x - w2 * 0.6, y: s.y + h2 * 0.7 }, { x: s.x + w2 * 0.8, y: s.y + h2 * 0.6 }], 'rgba(0,0,0,0.28)', 2.2);\n    return;\n  }\n  const big = style === 'heavy';\n  const w = (big ? 13 : 9.5) * bulk;\n  const h = (big ? 11 : 8.5) * bulk;\n  // 覆在肩頭上的一片甲：上緣貼著肩線，下緣往外翻\n  const p = smooth([\n    { x: s.x - w * 0.9, y: s.y - h * 0.5 },\n    { x: s.x - w * 0.2, y: s.y - h * 1.05 },\n    { x: s.x + w * 0.85, y: s.y - h * 0.7 },\n    { x: s.x + w * 1.05, y: s.y + h * 0.5 },\n    { x: s.x + w * 0.5, y: s.y + h * 0.95 },\n    { x: s.x - w * 0.8, y: s.y + h * 0.7 },\n  ], 0.45);\n  shade(ctx, p, mat(M.armor), { ...opt(s.x, s.y, w * 1.6), ao: 0.35 });\n  if (big && !flat) {\n    // 鉚釘\n    for (let i = -1; i <= 1; i++) {\n      const rx = s.x + i * w * 0.42, ry = s.y - h * 0.2;\n      shade(ctx, capsule(rx, ry, rx + 0.5, ry + 0.5, 1.7 * bulk), mat(M.metal), opt(rx, ry, 4));\n    }\n  }\n}\n\n/**\n * 臉。街機格鬥的角色一定看得到表情 —— 眉毛壓得越低越兇。\n * 本地座標永遠朝右，所以只畫看得見的那隻眼睛（3/4 側臉）。\n */\nfunction drawFace(ctx, h, r, char, flat) {\n  if (flat) return;\n  const ink = '#241a22';\n  const P = (fx, fy) => ({ x: h.x + r * fx, y: h.y + r * fy });\n\n  ctx.save();\n  ctx.lineJoin = 'round';\n  ctx.lineCap = 'round';\n\n  // --- 顴骨與下顎的陰影：臉要有立體感，靠的是這兩塊，不是漸層 ---\n  ctx.fillStyle = 'rgba(120,68,44,0.26)';\n  ctx.beginPath();\n  const cheek = [P(-0.2, -0.06), P(0.5, 0.06), P(0.66, 0.36), P(0.3, 0.66), P(-0.28, 0.52)];\n  ctx.moveTo(cheek[0].x, cheek[0].y);\n  for (const q of cheek.slice(1)) ctx.lineTo(q.x, q.y);\n  ctx.closePath();\n  ctx.fill();\n\n  // --- 眼窩：比膚色深一階的一塊，眼睛坐在裡面 ---\n  ctx.fillStyle = 'rgba(110,60,38,0.3)';\n  ctx.beginPath();\n  ctx.ellipse(h.x + r * 0.46, h.y - r * 0.07, r * 0.32, r * 0.24, -0.14, 0, Math.PI * 2);\n  ctx.fill();\n\n  // --- 眼白 ---\n  const eye = new Path2D();\n  eye.moveTo(h.x + r * 0.24, h.y - r * 0.04);\n  eye.quadraticCurveTo(h.x + r * 0.46, h.y - r * 0.28, h.x + r * 0.7, h.y - r * 0.06);\n  eye.quadraticCurveTo(h.x + r * 0.48, h.y + r * 0.13, h.x + r * 0.24, h.y - r * 0.04);\n  eye.closePath();\n  ctx.fillStyle = '#f7f3ec';\n  ctx.fill(eye);\n\n  // --- 虹膜與瞳孔：靠前，像在瞪著對手 ---\n  ctx.save();\n  ctx.clip(eye);\n  ctx.fillStyle = mixColor(char.accent || '#7a6048', '#4a3524', 0.55);\n  ctx.beginPath();\n  ctx.ellipse(h.x + r * 0.54, h.y - r * 0.03, r * 0.14, r * 0.16, 0, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.fillStyle = ink;\n  ctx.beginPath();\n  ctx.ellipse(h.x + r * 0.57, h.y - r * 0.03, r * 0.08, r * 0.11, 0, 0, Math.PI * 2);\n  ctx.fill();\n  // 眼神光\n  ctx.fillStyle = 'rgba(255,255,255,0.85)';\n  ctx.beginPath();\n  ctx.ellipse(h.x + r * 0.5, h.y - r * 0.1, r * 0.045, r * 0.045, 0, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.restore();\n\n  // --- 上眼瞼：一條粗黑，眼睛的重量全在這裡 ---\n  ctx.strokeStyle = ink;\n  ctx.lineWidth = r * 0.12;\n  ctx.beginPath();\n  ctx.moveTo(h.x + r * 0.23, h.y - r * 0.05);\n  ctx.quadraticCurveTo(h.x + r * 0.46, h.y - r * 0.3, h.x + r * 0.71, h.y - r * 0.07);\n  ctx.stroke();\n  // 下眼瞼：細一點\n  ctx.lineWidth = r * 0.05;\n  ctx.strokeStyle = 'rgba(36,26,34,0.5)';\n  ctx.beginPath();\n  ctx.moveTo(h.x + r * 0.27, h.y + r * 0.01);\n  ctx.quadraticCurveTo(h.x + r * 0.48, h.y + r * 0.12, h.x + r * 0.68, h.y - r * 0.03);\n  ctx.stroke();\n\n  // --- 眉毛：畫成一塊楔形，內側粗外側細，壓得越低越兇 ---\n  ctx.fillStyle = ink;\n  ctx.beginPath();\n  const brow = [P(0.14, -0.46), P(0.74, -0.26), P(0.72, -0.14), P(0.16, -0.3)];\n  ctx.moveTo(brow[0].x, brow[0].y);\n  for (const q of brow.slice(1)) ctx.lineTo(q.x, q.y);\n  ctx.closePath();\n  ctx.fill();\n\n  // --- 鼻子：鼻樑的暗面 + 鼻孔 ---\n  ctx.strokeStyle = 'rgba(120,64,40,0.5)';\n  ctx.lineWidth = r * 0.07;\n  ctx.beginPath();\n  ctx.moveTo(h.x + r * 0.72, h.y - r * 0.12);\n  ctx.lineTo(h.x + r * 0.86, h.y + r * 0.2);\n  ctx.stroke();\n  ctx.fillStyle = 'rgba(60,32,24,0.65)';\n  ctx.beginPath();\n  ctx.ellipse(h.x + r * 0.78, h.y + r * 0.28, r * 0.07, r * 0.05, -0.3, 0, Math.PI * 2);\n  ctx.fill();\n\n  // --- 嘴：上唇一條實線，下唇一道陰影 ---\n  ctx.strokeStyle = 'rgba(96,44,40,0.9)';\n  ctx.lineWidth = r * 0.08;\n  ctx.beginPath();\n  ctx.moveTo(h.x + r * 0.4, h.y + r * 0.52);\n  ctx.quadraticCurveTo(h.x + r * 0.6, h.y + r * 0.56, h.x + r * 0.78, h.y + r * 0.47);\n  ctx.stroke();\n  ctx.strokeStyle = 'rgba(120,64,40,0.34)';\n  ctx.lineWidth = r * 0.06;\n  ctx.beginPath();\n  ctx.moveTo(h.x + r * 0.46, h.y + r * 0.64);\n  ctx.quadraticCurveTo(h.x + r * 0.62, h.y + r * 0.66, h.x + r * 0.74, h.y + r * 0.58);\n  ctx.stroke();\n  ctx.restore();\n\n  // --- 耳朵：外廓 + 內耳的一道線 ---\n  const ear = smooth([\n    P(-0.56, -0.02), P(-0.38, 0.02), P(-0.36, 0.26), P(-0.54, 0.28),\n  ], 0.9);\n  shade(ctx, ear, MAT.skin, {\n    cx: h.x - r * 0.46, cy: h.y + r * 0.12, r: r * 0.3, outline: 0.55, outlineWidth: 1.1,\n  });\n  ctx.save();\n  ctx.strokeStyle = 'rgba(120,64,40,0.45)';\n  ctx.lineWidth = r * 0.05;\n  ctx.beginPath();\n  ctx.moveTo(h.x - r * 0.5, h.y + r * 0.04);\n  ctx.quadraticCurveTo(h.x - r * 0.42, h.y + r * 0.12, h.x - r * 0.46, h.y + r * 0.22);\n  ctx.stroke();\n  ctx.restore();\n}\n\n/** 頭髮：一大塊實色 + 幾撮尖角，用剪影做造型 */\nfunction drawHair(ctx, h, r, style, color, flat) {\n  const hairMat = {\n    base: color, light: mixColor(color, '#ffffff', 0.3),\n    dark: mixColor(color, '#000000', 0.42), spec: 0.25, rough: 0.5,\n  };\n  const o = { cx: h.x, cy: h.y - r * 0.4, r: r * 1.4 };\n  switch (style) {\n    case 'bald': {      // 光頭：頭皮的反光 + 後腦的鬍渣陰影\n      if (flat) break;\n      ctx.save();\n      ctx.fillStyle = 'rgba(255,255,255,0.14)';\n      ctx.beginPath();\n      ctx.ellipse(h.x - r * 0.1, h.y - r * 0.78, r * 0.34, r * 0.16, -0.35, 0, Math.PI * 2);\n      ctx.fill();\n      ctx.fillStyle = 'rgba(40,26,20,0.22)';\n      ctx.beginPath();\n      ctx.ellipse(h.x - r * 0.42, h.y - r * 0.2, r * 0.38, r * 0.48, 0.15, 0, Math.PI * 2);\n      ctx.fill();\n      ctx.restore();\n      break;\n    }\n    case 'wild': {       // 爆炸頭：往後掃的大尖角\n        const pts = [\n          { x: h.x + r * 0.9, y: h.y - r * 0.55 },\n          { x: h.x + r * 0.3, y: h.y - r * 1.3 },\n          { x: h.x - r * 0.1, y: h.y - r * 0.85 },\n          { x: h.x - r * 0.5, y: h.y - r * 1.5 },\n          { x: h.x - r * 0.8, y: h.y - r * 0.8 },\n          { x: h.x - r * 1.5, y: h.y - r * 1.15 },\n          { x: h.x - r * 1.05, y: h.y - r * 0.25 },\n          { x: h.x - r * 1.5, y: h.y + r * 0.2 },\n          { x: h.x - r * 0.85, y: h.y + r * 0.45 },\n          { x: h.x - r * 0.55, y: h.y - r * 0.35 },\n        ];\n        shade(ctx, poly(pts), hairMat, o);\n        break;\n      }\n    case 'ponytail': {   // 束起來的馬尾\n        shade(ctx, poly([\n          { x: h.x - r * 1.05, y: h.y - r * 0.2 },\n          { x: h.x - r * 1.9, y: h.y + r * 0.5 },\n          { x: h.x - r * 1.75, y: h.y + r * 0.95 },\n          { x: h.x - r * 0.9, y: h.y + r * 0.2 },\n        ]), hairMat, o);\n        shade(ctx, smooth([\n          { x: h.x + r * 0.74, y: h.y - r * 0.56 },\n          { x: h.x + r * 0.16, y: h.y - r * 1.16 },\n          { x: h.x - r * 0.7, y: h.y - r * 0.92 },\n          { x: h.x - r * 0.92, y: h.y - r * 0.16 },\n          { x: h.x - r * 0.42, y: h.y - r * 0.56 },\n          { x: h.x + r * 0.44, y: h.y - r * 0.34 },\n        ], 0.75), hairMat, o);\n        break;\n      }\n    case 'short':\n    default: {           // 貼頭皮的短髮，前額留幾撮\n        shade(ctx, poly([\n          { x: h.x + r * 0.78, y: h.y - r * 0.52 },\n          { x: h.x + r * 0.42, y: h.y - r * 0.78 },\n          { x: h.x + r * 0.5, y: h.y - r * 1.02 },\n          { x: h.x + r * 0.02, y: h.y - r * 0.86 },\n          { x: h.x + r * 0.06, y: h.y - r * 1.2 },\n          { x: h.x - r * 0.5, y: h.y - r * 1.06 },\n          { x: h.x - r * 0.95, y: h.y - r * 0.46 },\n          { x: h.x - r * 0.86, y: h.y + r * 0.16 },\n          { x: h.x - r * 0.64, y: h.y - r * 0.42 },\n        ]), hairMat, o);\n        break;\n      }\n  }\n}\n\nfunction drawHead(ctx, char, J, M, { mat, opt, bulk, flat, t }) {\n  const h = J.head;\n  const r = 12.2 * (char.build.headScale || 1) * bulk;\n  const gear = (char.gear && char.gear.head) || 'none';\n  const hair = (char.gear && char.gear.hair) || 'short';\n  const hairColor = (char.palette && char.palette.hair) || '#2b1f1a';\n\n  // 脖子\n  shadeLimb(ctx, J.neck.x, J.neck.y + 3, h.x, h.y + r * 0.66, 6 * bulk, 5 * bulk, mat(M.skin), opt(J.neck.x, J.neck.y, 12, { ao: 0.3 }));\n\n  // 頭顱：額頭 → 眉弓 → 眼窩凹 → 鼻樑 → 鼻尖 → 人中 → 唇 → 下巴 → 下顎角 → 後腦\n  const F = (fx, fy) => ({ x: h.x + r * fx, y: h.y + r * fy });\n  const skull = smooth([\n    F(-0.36, -1.12), F(0.3, -1.08),          // 頭頂\n    F(0.7, -0.74),                            // 額頭\n    F(0.79, -0.36),                           // 眉弓\n    F(0.73, -0.14),                           // 眼窩凹進去\n    F(0.93, 0.08),                            // 鼻樑\n    F(1.05, 0.26),                            // 鼻尖\n    F(0.8, 0.34),                             // 鼻底\n    F(0.88, 0.46),                            // 上唇\n    F(0.84, 0.56),                            // 唇縫\n    F(0.88, 0.64),                            // 下唇\n    F(0.8, 0.82),                             // 下巴\n    F(0.46, 1.0),                             // 下巴底\n    F(-0.12, 0.9),                            // 下顎角\n    F(-0.62, 0.46),                           // 下顎後緣\n    F(-0.84, -0.06), F(-0.76, -0.66),         // 後腦\n  ], 0.38);\n  shade(ctx, skull, mat(M.skin), opt(h.x, h.y, r * 1.7, { ao: 0.18 }));\n\n  switch (gear) {\n    case 'welder': {      // 焊工面罩：一片方形擋板 + 觀察窗\n      const p = smooth([\n        { x: h.x - r * 0.82, y: h.y - r * 0.9 }, { x: h.x + r * 0.2, y: h.y - r * 1.12 },\n        { x: h.x + r * 0.9, y: h.y - r * 0.7 }, { x: h.x + r * 0.95, y: h.y + r * 0.4 },\n        { x: h.x + r * 0.6, y: h.y + r * 0.95 }, { x: h.x - r
