col : '#39405e', { glow: ready ? 0.9 : 0, cut: 8 });\n    // 冷卻遮罩\n    if (!ready && !slot.ult) {\n      const k = clamp(slot.cd / slot.max, 0, 1);\n      ctx.fillStyle = 'rgba(4,6,14,0.72)';\n      ctx.fillRect(sx, y + h * (1 - k), w, h * k);\n      text(ctx, slot.cd.toFixed(1), sx + w / 2, y + h / 2 + 8, { size: 20, color: '#ffffff', align: 'center' });\n    } else if (!ready) {\n      const k = clamp(f.meter / MAX_METER, 0, 1);\n      ctx.fillStyle = 'rgba(4,6,14,0.72)';\n      ctx.fillRect(sx, y + h * (1 - k), w, h * k);\n      text(ctx, `${Math.floor(k * 100)}%`, sx + w / 2, y + h / 2 + 8, { size: 18, color: '#ffe27a', align: 'center' });\n    }\n    text(ctx, slot.key, sx + 8, y + 18, { size: 13, color: ready ? col : '#6b7599' });\n    const name = slot.s.name;\n    const size = name.length > 5 ? 13 : 15;\n    text(ctx, name, sx + w / 2, y + h - 12, {\n      size, color: ready ? '#e7ecff' : '#767f9f', align: 'center',\n    });\n    if (ready && slot.ult) {\n      ctx.save();\n      ctx.globalCompositeOperation = 'lighter';\n      ctx.globalAlpha = 0.25 + 0.2 * Math.sin(t * 7);\n      ctx.fillStyle = '#fff27a';\n      ctx.fillRect(sx, y, w, h);\n      ctx.restore();\n    }\n  });\n}\n\nfunction drawBanner(ctx, battle) {\n  const b = battle.banner;\n  if (!b) return;\n  const k = b.t / b.life;\n  const a = clamp(Math.min(b.t * 5, 1) * (1 - Math.max(0, k - 0.72) * 3.6), 0, 1);\n  const pop = 1 + Math.max(0, 0.18 - b.t) * 3;\n  const cx = VIEW / 2, cy = 260;\n  ctx.save();\n  ctx.translate(cx, cy);\n  ctx.scale(pop, pop);\n  ctx.globalAlpha = a;\n  text(ctx, b.text, 0, 0, { size: 72, color: b.color, align: 'center', weight: 900, glow: 1.4, letter: 4 });\n  if (b.sub) text(ctx, b.sub, 0, 40, { size: 20, color: '#dfe6ff', align: 'center' });\n  ctx.restore();\n}\n\nfunction drawCountdown(ctx, battle) {\n  const left = 2.0 - battle.stateT;\n  if (left <= 0) return;\n  const n = Math.ceil(left);\n  const frac = left - Math.floor(left);\n  const pop = 1 + (1 - frac) * 0.5;\n  ctx.save();\n  ctx.translate(VIEW / 2, 300);\n  ctx.scale(pop, pop);\n  ctx.globalAlpha = clamp(frac * 2.2, 0, 1);\n  text(ctx, String(n), 0, 0, { size: 120, color: '#7ef1ff', align: 'center', weight: 900, glow: 1.6 });\n  ctx.restore();\n}\n","input.js":"// 輸入層。\n//\n// 不論來源是鍵盤、觸控、AI 還是網路對手，最後都收斂成同一個 InputFrame：\n//   { x: -1|0|1, up, down, edges: 位元遮罩 }\n// 邊緣（按下的那一瞬間）用位元遮罩傳，因為連線時整包只要一個數字。\n\nexport const BTN = {\n  JUMP: 1,\n  LIGHT: 2,\n  HEAVY: 4,\n  S1: 8,\n  S2: 16,\n  ULT: 32,\n  DASH: 64,\n};\n\nexport function emptyFrame() {\n  return { x: 0, up: false, down: false, edges: 0 };\n}\n\n/** 兩套鍵盤配置：同一台電腦就能兩個人打 */\nexport const BINDINGS = [\n  {\n    left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'],\n    jump: ['KeyW', 'Space'], light: ['KeyJ'], heavy: ['KeyK'],\n    s1: ['KeyU'], s2: ['KeyI'], ult: ['KeyO'], dash: ['KeyL', 'ShiftLeft'],\n  },\n  {\n    left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'],\n    jump: ['ArrowUp', 'Numpad0'], light: ['Numpad1'], heavy: ['Numpad2'],\n    s1: ['Numpad4'], s2: ['Numpad5'], ult: ['Numpad6'], dash: ['Numpad3', 'ShiftRight'],\n  },\n];\n\nconst down = new Set();\nconst edges = new Set();      // 這一幀剛按下的鍵，讀完就清空\nconst typed = [];             // 這一幀輸入的文字（大廳打中繼位址用）\nlet touchState = null;        // 觸控層寫入的狀態（見 touch.js）\n\nexport function initInput(target = window) {\n  target.addEventListener('keydown', (e) => {\n    if (e.repeat) return;\n    // 方向鍵與空白鍵會捲動頁面，一律吃掉\n    if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();\n    down.add(e.code);\n    edges.add(e.code);\n    // 可列印字元與退格另外收一份，讓輸入框可以真的打字\n    if (e.key && e.key.length === 1 && !e.ctrlKey && !e.metaKey) typed.push(e.key);\n    else if (e.key === 'Backspace') typed.push('\\b');\n  });\n  target.addEventListener('keyup', (e) => down.delete(e.code));\n  target.addEventListener('blur', () => { down.clear(); edges.clear(); });\n}\n\nexport const isDown = (code) => down.has(code);\nexport const isEdge = (code) => edges.has(code);\n\n/** 任一鍵被按下（選單用） */\nexport function anyEdge(codes) {\n  return codes.some((c) => edges.has(c));\n}\n\nexport function menuNav() {\n  return {\n    up: anyEdge(['KeyW', 'ArrowUp']),\n    down: anyEdge(['KeyS', 'ArrowDown']),\n    left: anyEdge(['KeyA', 'ArrowLeft']),\n    right: anyEdge(['KeyD', 'ArrowRight']),\n    // K 是重攻擊、J 是輕攻擊，所以選單的「返回」只認 Esc —— 不然打一拳就退出對戰了\n    ok: anyEdge(['Enter', 'NumpadEnter', 'Space']),\n    // Backspace 留給大廳刪房號用，所以「返回」只認 Esc\n    back: anyEdge(['Escape']),\n  };\n}\n\n/** 每幀結束後呼叫，清掉邊緣事件 */\nexport function endFrame() {\n  edges.clear();\n  typed.length = 0;\n  if (touchState) touchState.edges = 0;\n}\n\n/** 取走這一幀打的字（含 '\\b' 代表退格） */\nexport function drainTyped() {\n  const out = typed.slice();\n  typed.length = 0;\n  return out;\n}\n\nexport function setTouchState(state) {\n  touchState = state;\n}\n\nconst anyDown = (codes) => codes.some((c) => down.has(c));\nconst anyEdgeOf = (codes) => codes.some((c) => edges.has(c));\n\n/** 讀鍵盤（外加第一位玩家的觸控） */\nexport function readPlayer(index = 0) {\n  const b = BINDINGS[index] || BINDINGS[0];\n  const f = emptyFrame();\n  if (anyDown(b.left)) f.x -= 1;\n  if (anyDown(b.right)) f.x += 1;\n  f.up = anyDown(b.up);\n  f.down = anyDown(b.down);\n  if (anyEdgeOf(b.jump)) f.edges |= BTN.JUMP;\n  if (anyEdgeOf(b.light)) f.edges |= BTN.LIGHT;\n  if (anyEdgeOf(b.heavy)) f.edges |= BTN.HEAVY;\n  if (anyEdgeOf(b.s1)) f.edges |= BTN.S1;\n  if (anyEdgeOf(b.s2)) f.edges |= BTN.S2;\n  if (anyEdgeOf(b.ult)) f.edges |= BTN.ULT;\n  if (anyEdgeOf(b.dash)) f.edges |= BTN.DASH;\n\n  // 觸控只驅動第一位玩家\n  if (index === 0 && touchState) {\n    if (touchState.x) f.x = touchState.x;\n    f.up = f.up || touchState.up;\n    f.down = f.down || touchState.down;\n    f.edges |= touchState.edges;\n  }\n  return f;\n}\n","main.js":"// 進入點：畫布、主迴圈、畫面切換，以及把輸入（鍵盤／觸控／AI／網路）接到戰鬥上。\n\nimport { WORLD } from './render.js';\nimport { Battle, MODE } from './battle.js';\nimport { AI } from './ai.js';\nimport { Audio } from './audio.js';\nimport { Net, packInput, unpackInput } from './net.js';\nimport { drawHud } from './hud.js';\nimport { TitleScreen, SelectScreen, LobbyScreen, ResultScreen } from './screens.js';\nimport { initInput, readPlayer, endFrame, emptyFrame, isEdge, menuNav } from './input.js';\nimport { TouchPad } from './touch.js';\nimport { text, panel } from './gfx.js';\n\n/** 畫面寬度（世界比畫面寬，選單與 HUD 都用畫面座標） */\nconst VIEW = WORLD.view;\n\nconst STEP = 1 / 60;\n\nexport async function boot(canvas) {\n  const game = new Game(canvas);\n  game.start();\n  window.NEON = game;            // 方便在 console 或自動測試裡戳\n  return game;\n}\n\nclass Game {\n  constructor(canvas) {\n    this.canvas = canvas;\n    this.ctx = canvas.getContext('2d', { alpha: false });\n    this.audio = new Audio();\n    this.net = new Net();\n    this.touch = new TouchPad();\n    this.acc = 0;\n    this.last = 0;\n    this.frames = 0;\n    this.fps = 60;\n    this.fpsT = 0;\n    this.errors = [];\n\n    this.scenes = {\n      title: new TitleScreen(this),\n      select: new SelectScreen(this),\n      lobby: new LobbyScreen(this),\n      result: new ResultScreen(this),\n    };\n    this.scene = this.scenes.title;\n    this.scene.onEnter?.();\n\n    initInput(window);\n    this.bindPointer();\n    this.bindNet();\n    this.resize();\n    window.addEventListener('resize', () => this.resize());\n\n    const unlock = () => this.audio.unlock();\n    window.addEventListener('keydown', unlock, { once: true });\n    window.addEventListener('pointerdown', unlock, { once: true });\n  }\n\n  // ---------------------------------------------------------------- 版面\n  resize() {\n    const pad = 8;\n    const sw = window.innerWidth - pad * 2;\n    const sh = window.innerHeight - pad * 2;\n    const scale = Math.min(sw / VIEW, sh / WORLD.h);\n    this.canvas.style.width = `${Math.floor(VIEW * scale)}px`;\n    this.canvas.style.height = `${Math.floor(WORLD.h * scale)}px`;\n    this.scale = scale;\n  }\n\n  toLogical(clientX, clientY) {\n    const r = this.canvas.getBoundingClientRect();\n    return {\n      x: ((clientX - r.left) / r.width) * VIEW,\n      y: ((clientY - r.top) / r.height) * WORLD.h,\n    };\n  }\n\n  bindPointer() {\n    const onDown = (e) => {\n      const p = this.toLogical(e.clientX, e.clientY);\n      if (this.scene === this.battleScene) this.touch.onDown(e.pointerId, p.x, p.y);\n      this.scene?.onPointer?.(p.x, p.y);\n    };\n    const onMove = (e) => {\n      if (this.scene !== this.battleScene) return;\n      const p = this.toLogical(e.clientX, e.clientY);\n      this.touch.onMove(e.pointerId, p.x, p.y);\n    };\n    const onUp = (e) => this.touch.onUp(e.pointerId);\n    this.canvas.addEventListener('pointerdown', onDown);\n    this.canvas.addEventListener('pointermove', onMove);\n    window.addEventListener('pointerup', onUp);\n    window.addEventListener('pointercancel', onUp);\n  }\n\n  // ---------------------------------------------------------------- 連線\n  bindNet() {\n    this.net.on('msg', (m) => {\n      if (m.t === 'lobby') {\n        if (this.scene === this.scenes.select) this.scenes.select.onNetLobby(m);\n        return;\n      }\n      if (m.t === 'start') {\n        this.startBattle({ mode: 'net', chars: m.chars, netRole: 'guest' });\n        return;\n      }\n      this.battleScene?.onNetMessage(m);\n    });\n    this.net.on('peer', (m) => {\n      if (!m.joined && this.scene === this.battleScene) {\n        this.toast = '對手離線了';\n        this.goto('title');\n        this.net.close();\n      }\n    });\n    this.net.on('close', () => {\n      if (this.scene === this.scenes.select && this.scenes.select.mode === 'net') this.goto('title');\n    });\n  }\n\n  async connectNet(address, room) {\n    await this.net.connect(address, room);\n    this.goto('select', { mode: 'net', net: this.net });\n  }\n\n  leaveNet() {\n    this.net.close();\n    this.goto('title');\n  }\n\n  /** 主機檢查雙方都選好也都準備了就開打 */\n  tryStartNet(picks, ready) {\n    if (!this.net.isHost) return;\n    if (!picks[0] || !picks[1] || !ready[0] || !ready[1]) return;\n    this.net.send({ t: 'start', chars: picks });\n    this.startBattle({ mode: 'net', chars: picks, netRole: 'host' });\n  }\n\n  // ---------------------------------------------------------------- 場景\n  goto(name, opts) {\n    this.scene?.onExit?.();\n    this.scene = this.scenes[name];\n    this.scene.onEnter?.(opts);\n  }\n\n  startBattle(opts) {\n    this.audio.unlock();\n    this.battleScene = new BattleScene(this, opts);\n    this.scene?.onExit?.();\n    this.scene = this.battleScene;\n  }\n\n  // ---------------------------------------------------------------- 主迴圈\n  start() {\n    this.last = performance.now();\n    const frame = (ts) => {\n      requestAnimationFrame(frame);\n      let dt = (ts - this.last) / 1000;\n      this.last = ts;\n      if (!Number.isFinite(dt)) dt = STEP;\n      dt = Math.min(dt, 0.25);\n      this.acc += dt;\n      let steps = 0;\n      while (this.acc >= STEP && steps < 5) {\n        this.step(STEP);\n        this.acc -= STEP;\n        steps++;\n      }\n      if (steps === 0) endFrame();      // 沒跑到邏輯也要清掉這一幀的按鍵邊緣\n      this.render();\n      this.fpsT += dt;\n      this.frames++;\n      if (this.fpsT >= 0.5) {\n        this.fps = Math.round(this.frames / this.fpsT);\n        this.frames = 0;\n        this.fpsT = 0;\n      }\n    };\n    requestAnimationFrame(frame);\n  }\n\n  step(dt) {\n    try {\n      if (isEdge('KeyM')) {\n        const muted = this.audio.toggleMute();\n        this.toast = muted ? '靜音' : '取消靜音';\n        this.toastT = 1.2;\n      }\n      this.scene?.update?.(dt);\n      this.net.ping();\n    } catch (err) {\n      this.reportError(err);\n    }\n    if (this.toastT > 0) this.toastT -= dt;\n    endFrame();\n  }\n\n  render() {\n    const ctx = this.ctx;\n    // 每幀先把整塊畫布抹掉：戰鬥有鏡頭縮放，某些縮放下天空不會蓋滿整個畫面，\n    // 沒抹乾淨的話上一個畫面的殘影會留在下緣。\n    ctx.setTransform(1, 0, 0, 1, 0, 0);\n    ctx.fillStyle = '#05060f';\n    ctx.fillRect(0, 0, VIEW, WORLD.h);\n    try {\n      this.scene?.draw?.(ctx);\n    } catch (err) {\n      this.reportError(err);\n      ctx.fillStyle = '#100610';\n      ctx.fillRect(0, 0, VIEW, WORLD.h);\n    }\n    if (this.toastT > 0 && this.toast) {\n      panel(ctx, VIEW / 2 - 110, 16, 220, 38, '#ffd24d', { glow: 0.6 });\n      text(ctx, this.toast, VIEW / 2, 42, { size: 17, color: '#ffffff', align: 'center' });\n    }\n    if (this.errors.length) {\n      text(ctx, `⚠ ${this.errors[this.errors.length - 1]}`, 12, WORLD.h - 10, { size: 13, color: '#ff8095' });\n    }\n  }\n\n  reportError(err) {\n    const msg = err && err.message ? err.message : String(err);\n    if (this.errors[this.errors.length - 1] !== msg) this.errors.push(msg);\n    if (this.errors.length > 5) this.errors.shift();\n    console.error(err);\n  }\n}\n\n// ==================================================================\nclass BattleScene {\n  constructor(game, { mode, chars, netRole, difficulty = 1 }) {\n    this.game = game;\n    this.mode = mode;\n    this.netRole = netRole;\n    this.chars = chars;\n    const battleMode = mode !== 'net' ? (mode === 'local' ? MODE.LOCAL : MODE.SOLO)\n      : (netRole === 'host' ? MODE.NET_HOST : MODE.NET_CLIENT);\n    this.battle = new Battle({\n      chars, mode: battleMode, audio: game.audio, difficulty,\n      onMatchEnd: (winner) => this.onMatchEnd(winner),\n    });\n    this.battle.authoritative = mode !== 'net' || netRole === 'host';\n    this.battle.startRound();\n    this.battle.showBanner('ROUND 1', `${this.battle.fighters[0].char.name}  VS  ${this.battle.fighters[1].char.name}`, '#7ef1ff', 1.6);\n\n    this.ai = mode === 'solo' ? new AI(this.battle.fighters[1], difficulty) : null;\n    this.remote = emptyFrame();\n    this.remoteEdges = 0;\n    this.snapT = 0;\n    this.ended = false;\n\n    // 主機把「誰放了什麼招」轉給客戶端，客戶端在本地重播特效\n    if (mode === 'net' && netRole === 'host') {\n      this.battle.onSkill = (f, kind, params) => {\n        game.net.send({ t: 'cast', side: f.side, kind, params });\n      };\n    }\n    this.localSides = mode === 'local' ? [0, 1] : (mode === 'net' ? [netRole === 'host' ? 0 : 1] : [0]);\n    game.touch.setSide(this.localSides[0]);\n  }\n\n  // ---------------------------------------------------------------- 更新\n  update(dt) {\n    const nav = menuNav();\n    if (nav.back && !this.ended) {\n      if (this.mode === 'net') this.game.leaveNet();\n      else this.game.goto('title');\n      return;\n    }\n\n    if (this.mode === 'net' && this.netRole === 'guest') {\n      this.updateGuest(dt);\n      return;\n    }\n\n    const inputs = [emptyFrame(), emptyFrame()];\n    if (this.mode === 'solo') {\n      inputs[0] = readPlayer(0);\n      inputs[1] = this.ai.update(dt, this.battle);\n    } else if (this.mode === 'local') {\n      inputs[0] = readPlayer(0);\n      inputs[1] = readPlayer(1);\n    } else {\n      inputs[0] = readPlayer(0);\n      inputs[1] = { ...this.remote, edges: this.remoteEdges };\n      this.remoteEdges = 0;\n    }\n    this.battle.update(dt, inputs);\n\n    if (this.mode === 'net') {\n      this.snapT += dt;\n      if (this.snapT >= 0.05) {      // 20Hz 快照\n        this.snapT = 0;\n        this.game.net.send({ t: 'snap', s: this.battle.collectSnapshot() });\n      }\n    }\n  }\n\n  updateGuest(dt) {\n    // 客戶端：只送輸入、照著主機的快照畫，不自己算傷害\n    const f = readPlayer(0);\n    this.game.net.send({ t: 'in', f: packInput(f) });\n    this.battle.updateRemote(dt);\n  }\n\n  onNetMessage(m) {\n    if (m.t === 'in' && this.netRole === 'host') {\n      const f = unpackInput(m.f);\n      this.remote.x = f.x;\n      this.remote.up = f.up;\n      this.remote.down = f.down;\n      this.remoteEdges |= f.edges;\n      return;\n    }\n    if (m.t === 'snap' && this.netRole === 'guest') {\n      this.battle.applySnapshot(m.s);\n      return;\n    }\n    if (m.t === 'cast' && this.netRole === 'guest') {\n      this.battle.replayCast(m.side, m.kind, m.params);\n      return;\n    }\n    if (m.t === 'end') {\n      this.ended = true;\n      this.game.goto('result', { winner: m.winner, battle: this.battle, mode: this.mode });\n    }\n  }\n\n  onMatchEnd(winner) {\n    if (this.ended) return;\n    this.ended = true;\n    if (this.mode === 'net' && this.netRole === 'host') {\n      this.game.net.send({ t: 'end', winner });\n    }\n    setTimeout(() => {\n      if (this.game.scene === this) {\n        this.game.goto('result', { winner, battle: this.battle, mode: this.mode });\n      }\n    }, 2200);\n  }\n\n  onPointer(x, y) { /* 觸控由 TouchPad 處理 */ }\n\n  // ---------------------------------------------------------------- 繪製\n  draw(ctx) {\n    this.battle.draw(ctx);\n    drawHud(ctx, this.battle, { localSides: this.localSides });\n    if (this.mode === 'net') {\n      text(ctx, `房 ${this.game.net.room}・${this.netRole === 'host' ? '主機' : '客戶端'}・${this.game.net.rtt}ms`,\n        VIEW - 16, WORLD.h - 12, { size: 12, color: '#6f7aa3', align: 'right' });\n    }\n    this.game.touch.draw(ctx);\n  }\n}\n","net.js":"// 連線對戰的客戶端。\n//\n// 架構刻意選最簡單、也最好維護的一種：\n//   中繼伺服器只做「同一個房號的兩個人互轉封包」，不懂遊戲規則；\n//   先連進房間的人當**主機**，主機跑完整模擬並每秒送 20 次快照，\n//   另一邊只送輸入、照著快照畫。所有傷害判定只有主機算，不會分歧。\n//\n// 房號＝四位數字，兩邊輸入同一組就會配對。\n\nexport class Net {\n  constructor() {\n    this.ws = null;\n    this.role = null;        // 'host' | 'guest'\n    this.room = '';\n    this.peerHere = false;\n    this.status = 'idle';    // idle | connecting | waiting | ready | closed | error\n    this.error = '';\n    this.handlers = new Map();\n    this.lastPing = 0;\n    this.rtt = 0;\n  }\n\n  get isHost() { return this.role === 'host'; }\n  get connected() { return this.ws && this.ws.readyState === WebSocket.OPEN; }\n\n  on(type, fn) {\n    if (!this.handlers.has(type)) this.handlers.set(type, []);\n    this.handlers.get(type).push(fn);\n    return this;\n  }\n\n  emit(type, payload) {\n    const list = this.handlers.get(type);\n    if (list) for (const fn of list) fn(payload);\n  }\n\n  /**\n   * 位址寫法三種都收：\n   *   （空白）          → 和遊戲同一台主機（用 relay 伺服器直接開遊戲時最方便）\n   *   example.com:8787  → ws://example.com:8787\n   *   wss://x.y.z       → 原樣使用（雲端平台都是這種）\n   */\n  static resolveUrl(address) {\n    const a = (address || '').trim();\n    const secure = location.protocol === 'https:';\n    if (!a) {\n      const proto = secure ? 'wss:' : 'ws:';\n      return `${proto}//${location.host}`;\n    }\n    if (a.startsWith('ws://') || a.startsWith('wss://')) return a;\n    const proto = secure ? 'wss:' : 'ws:';\n    return a.includes(':') ? `${proto}//${a}` : `${proto}//${a}:8787`;\n  }\n\n  connect(address, room) {\n    this.close();\n    this.room = room;\n    this.status = 'connecting';\n    this.error = '';\n    let url;\n    try {\n      url = Net.resolveUrl(address);\n    } catch (e) {\n      this.status = 'error';\n      this.error = '位址看不懂';\n      return Promise.reject(e);\n    }\n\n    return new Promise((resolve, reject) => {\n      let ws;\n      try {\n        ws = new WebSocket(url);\n      } catch (e) {\n        this.status = 'error';\n        this.error = '無法建立連線';\n        reject(e);\n        return;\n      }\n      this.ws = ws;\n      const timeout = setTimeout(() => {\n        if (this.status === 'connecting') {\n          this.error = '連不上中繼伺服器';\n          this.status = 'error';\n          try { ws.close(); } catch (e) { /* 已經關了就算了 */ }\n          reject(new Error(this.error));\n        }\n      }, 8000);\n\n      ws.onopen = () => {\n        ws.send(JSON.stringify({ t: 'join', room }));\n      };\n      ws.onmessage = (ev) => {\n        let msg;\n        try { msg = JSON.parse(ev.data); } catch (e) { return; }\n        switch (msg.t) {\n          case 'role':\n            clearTimeout(timeout);\n            this.role = msg.role;\n            this.status = msg.peers >= 2 ? 'ready' : 'waiting';\n            this.peerHere = msg.peers >= 2;\n            this.emit('role', msg);\n            resolve(msg);\n            break;\n          case 'peer':\n            this.peerHere = msg.joined;\n            this.status = msg.joined ? 'ready' : 'waiting';\n            this.emit('peer', msg);\n            break;\n          case 'full':\n            clearTimeout(timeout);\n            this.error = '這個房號已經有兩個人了';\n            this.status = 'error';\n            this.emit('error', this.error);\n            reject(new Error(this.error));\n            break;\n          case 'pong':\n            this.rtt = Math.round(performance.now() - msg.ts);\n            break;\n          default:\n            this.emit('msg', msg);\n            break;\n        }\n      };\n      ws.onerror = () => {\n        if (this.status === 'connecting') {\n          this.error = '連不上中繼伺服器';\n          this.status = 'error';\n          clearTimeout(timeout);\n          reject(new Error(this.error));\n        }\n        this.emit('error', this.error || '連線發生錯誤');\n      };\n      ws.onclose = () => {\n        clearTimeout(timeout);\n        if (this.status !== 'error') this.status = 'closed';\n        this.peerHere = false;\n        this.emit('close');\n      };\n    });\n  }\n\n  send(obj) {\n    if (!this.connected) return;\n    this.ws.send(JSON.stringify(obj));\n  }\n\n  ping() {\n    const now = performance.now();\n    if (now - this.lastPing < 2000) return;\n    this.lastPing = now;\n    this.send({ t: 'ping', ts: now });\n  }\n\n  close() {\n    if (this.ws) {\n      try { this.ws.close(); } catch (e) { /* 忽略 */ }\n      this.ws = null;\n    }\n    this.role = null;\n    this.peerHere = false;\n    if (this.status !== 'error') this.status = 'idle';\n  }\n}\n\n/** 輸入壓成四個數字，一秒 60 次也才幾 KB */\nexport const packInput = (f) => [f.x, f.up ? 1 : 0, f.down ? 1 : 0, f.edges];\nexport const unpackInput = (a) => ({ x: a[0], up: !!a[1], down: !!a[2], edges: a[3] });\n","render.js":"// 繪製層：場景背景與角色。\n//\n// 角色的畫法：骨架（rig.js）→ 每根骨頭畫成「深色實心 + 霓虹描邊」的錐形板子，\n// 再依角色的 look 掛上頭部樣式、背部零件、肩甲與武器。\n// 十個人的剪影不同，靠的就是這些零件加上體型比例，遠看一眼就認得出誰是誰。\n\nimport {\n  TAU, circlePath, ngonPath, polyPath, taperPath, linePath, crescentPath,\n  neonStroke, neonPlate, glowFill, starPath,\n} from './gfx.js';\nimport { poseFor } from './rig.js';\nimport { withAlpha, lerp, mixHex, makeRng } from './util.js';\n\n// 世界比畫面寬：鏡頭會夾著兩位角色跑，寬一點才不會老是被牆卡住\nexport const WORLD = { w: 1900, h: 720, ground: 600, left: 40, right: 1860, view: 1280 };\n\n// ------------------------------------------------------------------ 背景\nconst cityRng = makeRng(20260920);\nconst CITY = [];\nfor (let layer = 0; layer < 2; layer++) {\n  const row = [];\n  let x = -40;\n  while (x < WORLD.w + 80) {\n    const w = 40 + cityRng() * 70;\n    const h = (layer === 0 ? 90 : 160) + cityRng() * (layer === 0 ? 120 : 190);\n    row.push({ x, w, h, lit: cityRng() });\n    x += w + 10 + cityRng() * 26;\n  }\n  CITY.push(row);\n}\n\n/** 選單用：天空與地面一起畫，沒有鏡頭。世界比畫面寬，所以置中裁切。 */\nexport function drawArena(ctx, t, tint = '#3a2a6b') {\n  ctx.save();\n  ctx.translate(-(WORLD.w - WORLD.view) / 2, 0);\n  drawSky(ctx, t, tint, 0);\n  drawGround(ctx, t);\n  ctx.restore();\n}\n\n/** 天空、落日、城市。鏡頭移動時只跟著位移一點點（視差） */\nexport function drawSky(ctx, t, tint = '#3a2a6b', camX = 0) {\n  const { w, h, ground } = WORLD;\n  const par = -camX * 0.25;\n  ctx.save();\n  ctx.translate(par, 0);\n\n  // 夜空\n  const sky = ctx.createLinearGradient(0, 0, 0, ground);\n  sky.addColorStop(0, '#07081a');\n  sky.addColorStop(0.55, '#150e33');\n  sky.addColorStop(1, mixHex('#2a1350', tint, 0.35));\n  ctx.fillStyle = sky;\n  ctx.fillRect(-500, -200, w + 1000, h + 400);\n\n  // 星點\n  ctx.save();\n  ctx.globalCompositeOperation = 'lighter';\n  for (let i = 0; i < 70; i++) {\n    const sx = ((i * 197) % w) + Math.sin(i) * 12;\n    const sy = (i * 83) % (ground - 240);\n    const tw = 0.3 + 0.35 * Math.sin(t * 1.6 + i);\n    ctx.fillStyle = `rgba(200,220,255,${tw * 0.5})`;\n    ctx.fillRect(sx, sy, 2, 2);\n  }\n  ctx.restore();\n\n  // 落日：橫向切線是這個畫風的招牌\n  const sunY = ground - 190;\n  const sunR = 160;\n  ctx.save();\n  ctx.beginPath();\n  ctx.rect(0, 0, w, ground);\n  ctx.clip();\n  const sunGrad = ctx.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);\n  sunGrad.addColorStop(0, '#ffe27a');\n  sunGrad.addColorStop(0.5, '#ff6ba8');\n  sunGrad.addColorStop(1, '#8b2fff');\n  ctx.globalCompositeOperation = 'lighter';\n  ctx.globalAlpha = 0.85;\n  ctx.fillStyle = sunGrad;\n  ctx.fill(circlePath(w / 2, sunY, sunR));\n  ctx.globalAlpha = 1;\n  ctx.globalCompositeOperation = 'source-over';\n  for (let i = 0; i < 9; i++) {\n    const yy = sunY + 16 + i * 17 - ((t * 12) % 17);\n    ctx.fillStyle = 'rgba(7,8,26,0.92)';\n    ctx.fillRect(w / 2 - sunR - 4, yy, sunR * 2 + 8, 5 + i * 1.3);\n  }\n  ctx.restore();\n\n  // 城市剪影（兩層）\n  const cityColors = ['#120b2c', '#0b0720'];\n  const outline = ['#6a3fd0', '#8d5bff'];\n  for (let layer = 1; layer >= 0; layer--) {\n    const base = ground - (layer === 0 ? 0 : 26);\n    ctx.fillStyle = cityColors[layer];\n    for (const b of CITY[layer]) {\n      ctx.fillRect(b.x, base - b.h, b.w, b.h);\n      ctx.strokeStyle = withAlpha(outline[layer], 0.5);\n      ctx.lineWidth = 1.5;\n      ctx.strokeRect(b.x + 0.5, base - b.h + 0.5, b.w - 1, b.h);\n      // 窗光\n      ctx.save();\n      ctx.globalCompositeOperation = 'lighter';\n      for (let wy = base - b.h + 12; wy < base - 10; wy += 16) {\n        for (let wx = b.x + 8; wx < b.x + b.w - 8; wx += 14) {\n          const on = ((wx * 31 + wy * 17 + layer) % 7) < 2;\n          if (!on) continue;\n          const blink = 0.35 + 0.25 * Math.sin(t * 2 + wx * 0.05 + wy * 0.03);\n          ctx.fillStyle = withAlpha(layer === 0 ? '#7ef1ff' : '#ff8fd0', blink);\n          ctx.fillRect(wx, wy, 4, 6);\n        }\n      }\n      ctx.restore();\n    }\n  }\n\n  ctx.restore();\n}\n\n/** 地板：畫在世界座標裡，會跟著鏡頭縮放 */\nexport function drawGround(ctx, t) {\n  const { w, h, ground } = WORLD;\n  ctx.fillStyle = '#080a18';\n  ctx.fillRect(-400, ground, w + 800, h - ground + 400);\n  ctx.save();\n  ctx.globalCompositeOperation = 'lighter';\n  ctx.strokeStyle = withAlpha('#ff4fd8', 0.55);\n  ctx.lineWidth = 2;\n  ctx.beginPath();\n  ctx.moveTo(-400, ground + 1);\n  ctx.lineTo(w + 400, ground + 1);\n  ctx.stroke();\n  ctx.lineWidth = 1;\n  for (let i = -12; i <= 12; i++) {\n    ctx.strokeStyle = withAlpha('#5ad8ff', 0.22);\n    ctx.beginPath();\n    ctx.moveTo(w / 2 + i * 46, ground);\n    ctx.lineTo(w / 2 + i * 300, h);\n    ctx.stroke();\n  }\n  for (let i = 0; i < 7; i++) {\n    const yy = ground + Math.pow(i / 7, 2.1) * (h - ground) + ((t * 26) % 18);\n    if (yy > h) continue;\n    ctx.strokeStyle = withAlpha('#5ad8ff', 0.18);\n    ctx.beginPath();\n    ctx.moveTo(-400, yy);\n    ctx.lineTo(w + 400, yy);\n    ctx.stroke();\n  }\n  ctx.restore();\n\n  // 場地邊界：打到牆的時候要看得出來這裡是牆，而不是畫面剛好切到\n  for (const wx of [WORLD.left, WORLD.right]) {\n    const p = new Path2D();\n    p.moveTo(wx, ground);\n    p.lineTo(wx, ground - 300);\n    ctx.save();\n    ctx.globalCompositeOperation = 'lighter';\n    ctx.strokeStyle = withAlpha('#ff4fd8', 0.30);\n    ctx.lineWidth = 4;\n    ctx.stroke(p);\n    for (let i = 0; i < 10; i++) {\n      const yy = ground - i * 30 - ((t * 40) % 30);\n      ctx.fillStyle = withAlpha('#ff4fd8', 0.22 * (1 - i / 10));\n      ctx.fillRect(wx - 9, yy, 18, 4);\n    }\n    ctx.restore();\n  }\n}\n\nexport function drawPlatform(ctx, p, t) {\n  const glow = 0.6 + 0.2 * Math.sin(t * 2 + p.x * 0.01);\n  const body = polyPath([\n    { x: p.x + 10, y: p.y },\n    { x: p.x + p.w - 10, y: p.y },\n    { x: p.x + p.w, y: p.y + p.h },\n    { x: p.x, y: p.y + p.h },\n  ]);\n  ctx.fillStyle = 'rgba(10,12,26,0.94)';\n  ctx.fill(body);\n  neonStroke(ctx, linePath({ x: p.x + 8, y: p.y + 0.5 }, { x: p.x + p.w - 8, y: p.y + 0.5 }), '#4de2ff', 3, glow);\n  ctx.strokeStyle = withAlpha('#4de2ff', 0.25);\n  ctx.lineWidth = 1.2;\n  ctx.stroke(body);\n}\n\n// ------------------------------------------------------------------ 角色\n/** 把骨架畫成一個人。flat 有值時畫成單色剪影（殘影、虛影用）。 */\nexport function drawRig(ctx, char, joints, opts = {}) {\n  const { flat = null, flash = 0, alpha = 1, t = 0 } = opts;\n  const color = flat || (flash > 0 ? mixHex(char.color, '#ffffff', Math.min(1, flash)) : char.color);\n  const accent = flat || char.accent;\n  const core = flat ? withAlpha(flat, 0.18) : '#0a0c18';\n  const lw = 2.6 * (char.build.limb || 1);\n  const glow = flat ? 1.4 : 1;\n\n  ctx.save();\n  ctx.globalAlpha = alpha;\n\n  const J = joints;\n  const plate = (path, c = color, width = lw) => neonPlate(ctx, path, c, { core, width, glow });\n\n  // --- 背部零件（在身體之前） ---\n  drawBackPiece(ctx, char, J, { color, accent, core, t, flat });\n\n  // --- 後側手腳（較暗） ---\n  const backColor = flat ? flat : withAlpha(char.color, 0.55);\n  plate(taperPath(J.hip.x, J.hip.y, J.kneeB.x, J.kneeB.y, 6.5, 5), backColor, lw * 0.9);\n  plate(taperPath(J.kneeB.x, J.kneeB.y, J.footB.x, J.footB.y, 5, 3.6), backColor, lw * 0.9);\n  plate(taperPath(J.shoulderB.x, J.shoulderB.y, J.elbowB.x, J.elbowB.y, 5.2, 4.2), backColor, lw * 0.85);\n  plate(taperPath(J.elbowB.x, J.elbowB.y, J.handB.x, J.handB.y, 4.2, 3.4), backColor, lw * 0.85);\n\n  // --- 軀幹：六角形板 ---\n  const torso = polyPath([\n    { x: J.hip.x - 9, y: J.hip.y + 2 },\n    { x: J.hip.x + 9, y: J.hip.y + 2 },\n    { x: J.chest.x + 12, y: J.chest.y + 4 },\n    { x: J.chest.x + 10, y: J.chest.y - 6 },\n    { x: J.chest.x - 10, y: J.chest.y - 6 },\n    { x: J.chest.x - 12, y: J.chest.y + 4 },\n  ]);\n  plate(torso, color, lw + 0.6);\n  // 胸口核心\n  glowFill(ctx, ngonPath(lerp(J.hip.x, J.chest.x, 0.55), lerp(J.hip.y, J.chest.y, 0.55), 4.6, 6, t * 1.2), accent, flat ? 0.4 : 0.9);\n\n  // --- 前側手腳 ---\n  plate(taperPath(J.hip.x, J.hip.y, J.kneeF.x, J.kneeF.y, 7, 5.4));\n  plate(taperPath(J.kneeF.x, J.kneeF.y, J.footF.x, J.footF.y, 5.4, 4));\n  drawShoulder(ctx, char, J, { color, accent, core, lw, flat });\n  plate(taperPath(J.shoulderF.x, J.shoulderF.y, J.elbowF.x, J.elbowF.y, 5.6, 4.6));\n  plate(taperPath(J.elbowF.x, J.elbowF.y, J.handF.x, J.handF.y, 4.6, 3.8));\n\n  // --- 頭 ---\n  drawHead(ctx, char, J, { color, accent, core, lw, flat, t });\n\n  // --- 武器（握在前手） ---\n  drawWeapon(ctx, char, J, { color, accent, core, lw, flat, t });\n\n  ctx.restore();\n}\n\nfunction drawShoulder(ctx, char, J, { color, accent, core, lw, flat }) {\n  const s = J.shoulderF;\n  const style = char.look.shoulder || 'slim';\n  if (style === 'slim') {\n    neonPlate(ctx, circlePath(s.x, s.y, 5.4), color, { core, width: lw });\n  } else if (style === 'plate') {\n    neonPlate(ctx, polyPath([\n      { x: s.x - 8, y: s.y - 7 }, { x: s.x + 9, y: s.y - 5 },\n      { x: s.x + 8, y: s.y + 6 }, { x: s.x - 8, y: s.y + 5 },\n    ]), color, { core, width: lw });\n  } else {\n    // bulk：厚重護肩，剪影一眼就是重裝\n    neonPlate(ctx, polyPath([\n      { x: s.x - 12, y: s.y - 10 }, { x: s.x + 13, y: s.y - 8 },\n      { x: s.x + 14, y: s.y + 7 }, { x: s.x - 10, y: s.y + 8 },\n    ]), color, { core, width: lw + 0.4 });\n    if (!flat) glowFill(ctx, circlePath(s.x + 4, s.y - 1, 2.8), accent, 0.9);\n  }\n}\n\nfunction drawHead(ctx, char, J, { color, accent, core, lw, flat, t }) {\n  const h = J.head;\n  const r = 10.5 * (char.build.head || 1);\n  const style = char.look.head;\n  const plate = (p, c = color, w = lw) => neonPlate(ctx, p, c, { core, width: w });\n  // 脖子\n  plate(taperPath(J.neck.x, J.neck.y, h.x, h.y + r * 0.6, 4, 3.4));\n\n  switch (style) {\n    case 'visor':\n      plate(ngonPath(h.x, h.y, r, 6, 0.5));\n      if (!flat) glowFill(ctx, polyPath([\n        { x: h.x - 2, y: h.y - 2 }, { x: h.x + r * 0.95, y: h.y - 4 },\n        { x: h.x + r * 0.95, y: h.y + 2 }, { x: h.x - 2, y: h.y + 3 },\n      ]), accent, 1);\n      break;\n    case 'crown': {\n      plate(circlePath(h.x, h.y, r));\n      const spikes = [];\n      for (let i = 0; i < 4; i++) {\n        const a = -1.5 + i * 0.45;\n        spikes.push(polyPath([\n          { x: h.x + Math.cos(a) * r * 0.7, y: h.y + Math.sin(a) * r * 0.7 },\n          { x: h.x + Math.cos(a - 0.14) * (r + 12 + i * 3), y: h.y + Math.sin(a - 0.14) * (r + 12 + i * 3) },\n          { x: h.x + Math.cos(a + 0.2) * r * 0.9, y: h.y + Math.sin(a + 0.2) * r * 0.9 },\n        ]));\n      }\n      for (const s of spikes) neonPlate(ctx, s, accent, { core, width: lw * 0.8 });\n      if (!flat) glowFill(ctx, circlePath(h.x + 4, h.y - 1, 2.4), accent, 1);\n      break;\n    }\n    case 'mask':\n      plate(polyPath([\n        { x: h.x - r * 0.8, y: h.y - r }, { x: h.x + r, y: h.y - r * 0.7 },\n        { x: h.x + r * 0.9, y: h.y + r * 0.8 }, { x: h.x - r * 0.9, y: h.y + r * 0.6 },\n      ]));\n      if (!flat) {\n        glowFill(ctx, polyPath([\n          { x: h.x + 1, y: h.y - 3 }, { x: h.x + r * 0.95, y: h.y - 5 }, { x: h.x + r * 0.9, y: h.y - 1 },\n        ]), accent, 1);\n      }\n      break;\n    case 'antenna':\n      plate(ngonPath(h.x, h.y, r * 0.95, 5, -0.3));\n      neonStroke(ctx, linePath({ x: h.x - 2, y: h.y - r * 0.7 }, { x: h.x - 12, y: h.y - r - 16 }), accent, 2, 1);\n      if (!flat) glowFill(ctx, circlePath(h.x - 12, h.y - r - 17, 3), accent, 1);\n      break;\n    case 'prism':\n      plate(polyPath([\n        { x: h.x, y: h.y - r * 1.5 }, { x: h.x + r, y: h.y },\n        { x: h.x, y: h.y + r * 1.1 }, { x: h.x - r, y: h.y },\n      ]));\n      if (!flat) glowFill(ctx, circlePath(h.x, h.y, r * 0.35), '#ffffff', 0.9);\n      break;\n    case 'hood': {\n      plate(polyPath([\n        { x: h.x - r * 1.1, y: h.y + r * 0.9 }, { x: h.x - r * 0.9, y: h.y - r * 0.6 },\n        { x: h.x + r * 0.2, y: h.y - r * 1.5 }, { x: h.x + r * 1.1, y: h.y - r * 0.2 },\n        { x: h.x + r * 0.9, y: h.y + r * 0.9 },\n      ]));\n      if (!flat) {\n        glowFill(ctx, circlePath(h.x + 3, h.y + 1, 2.6), accent, 1);\n        glowFill(ctx, circlePath(h.x + 8, h.y + 1, 1.8), accent, 0.8);\n      }\n      break;\n    }\n    case 'horns': {\n      plate(ngonPath(h.x, h.y, r, 6, 0.2));\n      for (const s of [-1, 1]) {\n        neonPlate(ctx, polyPath([\n          { x: h.x + s * r * 0.5, y: h.y - r * 0.6 },\n          { x: h.x + s * (r + 10), y: h.y - r - 12 },\n          { x: h.x + s * r * 0.2, y: h.y - r * 0.2 },\n        ]), accent, { core, width: lw * 0.8 });\n      }\n      if (!flat) glowFill(ctx, polyPath([\n        { x: h.x - 1, y: h.y }, { x: h.x + r * 0.9, y: h.y - 3 }, { x: h.x + r * 0.9, y: h.y + 3 },\n      ]), accent, 1);\n      break;\n    }\n    case 'helm':\n      plate(polyPath([\n        { x: h.x - r, y: h.y + r * 0.7 }, { x: h.x - r * 0.9, y: h.y - r * 0.8 },\n        { x: h.x + r * 0.4, y: h.y - r * 1.2 }, { x: h.x + r * 1.15, y: h.y - r * 0.2 },\n        { x: h.x + r, y: h.y + r * 0.8 },\n      ]));\n      neonPlate(ctx, polyPath([\n        { x: h.x - 2, y: h.y - r * 1.15 }, { x: h.x + 2, y: h.y - r * 2.1 }, { x: h.x + 6, y: h.y - r * 1.05 },\n      ]), accent, { core, width: lw * 0.7 });\n      if (!flat) glowFill(ctx, polyPath([\n        { x: h.x + 1, y: h.y - 2 }, { x: h.x + r * 1.05, y: h.y - 4 }, { x: h.x + r, y: h.y + 1 },\n      ]), accent, 1);\n      break;\n    case 'halo':\n      plate(circlePath(h.x, h.y, r * 0.92));\n      if (!flat) {\n        ctx.save();\n        ctx.translate(h.x, h.y - r - 8);\n        ctx.scale(1, 0.34);\n        neonStroke(ctx, circlePath(0, 0, r + 6), accent, 2.4, 1.4);\n        ctx.restore();\n        glowFill(ctx, circlePath(h.x + 3, h.y, 2.4), accent, 1);\n      }\n      break;\n    case 'oni':\n    default:\n      plate(polyPath([\n        { x: h.x - r * 0.9, y: h.y - r * 0.9 }, { x: h.x + r * 0.95, y: h.y - r * 1.05 },\n        { x: h.x + r * 1.05, y: h.y + r * 0.5 }, { x: h.x - r * 0.2, y: h.y + r * 1.1 },\n        { x: h.x - r, y: h.y + r * 0.3 },\n      ]));\n      if (!flat) {\n        glowFill(ctx, polyPath([\n          { x: h.x - 2, y: h.y - 4 }, { x: h.x + r * 0.95, y: h.y - 6 }, { x: h.x + r * 0.9, y: h.y - 1 },\n        ]), accent, 1);\n      }\n      break;\n  }\n}\n\nfunction drawBackPiece(ctx, char, J, { color, accent, core, t, flat }) {\n  const style = char.look.back;\n  const c = J.chest;\n  const lw = 2.4;\n  const plate = (p, col = color, w = lw) => neonPlate(ctx, p, col, { core, width: w, alpha: flat ? 0.8 : 1 });\n  const flap = Math.sin(t * 3.2) * 0.12;\n\n  switch (style) {\n    case 'wings':\n      for (const s of [0, 1]) {\n        const spread = s === 0 ? 1 : 0.62;\n        plate(polyPath([\n          { x: c.x - 4, y: c.y - 2 },\n          { x: c.x - 34 * spread, y: c.y - 30 * spread - flap * 40 },\n          { x: c.x - 44 * spread, y: c.y + 2 * spread },\n          { x: c.x - 18 * spread, y: c.y + 16 * spread },\n        ]), s === 0 ? color : accent, lw * (s === 0 ? 1 : 0.8));\n      }\n      break;\n    case 'cape': {\n      const sway = Math.sin(t * 2.4) * 8;\n      plate(polyPath([\n        { x: c.x + 2, y: c.y - 6 },\n        { x: c.x - 10, y: c.y - 4 },\n        { x: c.x - 26 - sway, y: c.y + 40 },\n        { x: c.x - 6 - sway * 0.5, y: c.y + 52 },\n        { x: c.x + 8, y: c.y + 30 },\n      ]), color, lw);\n      break;\n    }\n    case 'banner': {\n      const sway = Math.sin(t * 2.0) * 6;\n      neonStroke(ctx, linePath({ x: c.x - 6, y: c.y - 14 }, { x: c.x - 10, y: c.y + 54 }), accent, 2, 1);\n      plate(polyPath([\n        { x: c.x - 8, y: c.y - 10 }, { x: c.x - 30 - sway, y: c.y + 6 },\n        { x: c.x - 26 - sway, y: c.y + 30 }, { x: c.x - 9, y: c.y + 26 },\n      ]), color, lw * 0.9);\n      break;\n    }\n    case 'coil':\n      for (let i = 0; i < 3; i++) {\n        const r = 8 + i * 5;\n        const a = t * (2 + i) + i;\n        ctx.save();\n        ctx.translate(c.x - 12, c.y + 4 + i * 4);\n        ctx.rotate(a * 0.4);\n        ctx.scale(1, 0.4);\n        neonStroke(ctx, circlePath(0, 0, r), i === 1 ? accent : color, 2, 1.2);\n        ctx.restore();\n      }\n      break;\n    case 'drone': {\n      const hover = Math.sin(t * 2.6) * 4;\n      const dx = c.x - 34, dy = c.y - 26 + hover;\n      plate(ngonPath(dx, dy, 9, 6, t * 0.8), accent, lw);\n      if (!flat) {\n        glowFill(ctx, circlePath(dx, dy, 3.4), '#ffffff', 0.9);\n        neonStroke(ctx, linePath({ x: dx, y: dy }, { x: c.x - 8, y: c.y }), accent, 1.2, 0.8);\n      }\n      break;\n    }\n    case 'tail': {\n      const pts = [];\n      for (let i = 0; i <= 5; i++) {\n        const k = i / 5;\n        pts.push({\n          x: c.x - 6 - k * 46,\n          y: c.y + 18 + Math.sin(t * 3 + k * 3) * 10 * k + k * 18,\n        });\n      }\n      for (let i = 0; i < pts.length - 1; i++) {\n        plate(taperPath(pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y, 5.5 - i * 0.8, 4.6 - i * 0.8), color, lw * 0.8);\n      }\n      break;\n    }\n    case 'core': {\n      const r = 11 + Math.sin(t * 4) * 1.5;\n      plate(ngonPath(c.x - 20, c.y + 6, r, 6, t * 0.6), color, lw);\n      if (!flat) glowFill(ctx, circlePath(c.x - 20, c.y + 6, r * 0.5), accent, 1);\n      break;\n    }\n    case 'jets': {\n      for (const s of [-1, 1]) {\n        const jx = c.x - 20, jy = c.y + 2 + s * 9;\n        plate(polyPath([\n          { x: jx - 12, y: jy - 5 }, { x: jx + 4, y: jy - 6 },\n          { x: jx + 4, y: jy + 6 }, { x: jx - 12, y: jy + 5 },\n        ]), color, lw * 0.9);\n        if (!flat) {\n          const len = 10 + Math.sin(t * 18 + s) * 4;\n          glowFill(ctx, polyPath([\n            { x: jx - 12, y: jy - 4 }, { x: jx - 12 - len, y: jy }, { x: jx - 12, y: jy + 4 },\n          ]), accent, 0.85);\n        }\n      }\n      break;\n    }\n    case 'blades':\n      for (const s of [-1, 1]) {\n        plate(polyPath([\n          { x: c.x - 6, y: c.y + 4 },\n          { x: c.x - 30 - s * 6, y: c.y - 24 * s - 6 },\n          { x: c.x - 24 - s * 6, y: c.y - 20 * s - 2 },\n        ]), s > 0 ? accent : color, lw * 0.8);\n      }\n      break;\n    default:\n      break;\n  }\n}\n\nfunction drawWeapon(ctx, char, J, { color, accent, core, lw, flat, t }) {\n  const h = J.handF;\n  const e = J.elbowF;\n  const ang = Math.atan2(h.y - e.y, h.x - e.x);\n  const style = char.look.weapon;\n  const plate = (p, col = color, w = lw) => neonPlate(ctx, p, col, { core, width: w });\n  const along = (d, o = 0) => ({\n    x: h.x + Math.cos(ang) * d - Math.sin(ang) * o,\n    y: h.y + Math.sin(ang) * d + Math.cos(ang) * o,\n  });\n\n  switch (style) {\n    case 'gauntlet':\n      plate(ngonPath(h.x, h.y, 8.5, 6, ang), color, lw + 0.4);\n      if (!flat) glowFill(ctx, circlePath(h.x, h.y, 3.4), accent, 1);\n      break;\n    case 'blade': {\n      const tip = along(56), base = along(6);\n      plate(polyPath([\n        { x: base.x, y: base.y - 3 }, { x: tip.x, y: tip.y },\n        { x: base.x, y: base.y + 5 },\n      ]), accent, lw);\n      plate(circlePath(h.x, h.y, 5.4), color, lw);\n      break;\n    }\n    case 'twin': {\n      for (const s of [-1, 1]) {\n        const tip = along(34 * 1, s * 9);\n        plate(polyPath([\n          { x: h.x, y: h.y - 2 }, { x: tip.x, y: tip.y }, { x: h.x + 3, y: h.y + 4 },\n        ]), s > 0 ? accent : color, lw * 0.9);\n      }\n      plate(circlePath(h.x, h.y, 5), color, lw);\n      break;\n    }\n    case 'spear': {\n      const tip = along(78), tail = along(-34);\n      plate(taperPath(tail.x, tail.y, tip.x, tip.y, 2.6, 2.2), color, lw * 0.8);\n      plate(polyPath([\n        along(52, -6), { x: tip.x, y: tip.y }, along(52, 6),\n      ]), accent, lw * 0.9);\n      break;\n    }\n    case 'claws':\n      for (let i = -1; i <= 1; i++) {\n        const tip = along(26 + Math.abs(i) * -4, i * 7);\n        plate(polyPath([\n          { x: h.x, y: h.y + i * 2 }, { x: tip.x, y: tip.y }, { x: h.x + 2, y: h.y + i * 2 + 3 },\n        ]), i === 0 ? accent : color, lw * 0.8);\n      }\n      break;\n    case 'staff': {\n      const tip = along(48), tail = along(-40);\n      plate(taperPath(tail.x, tail.y, tip.x, tip.y, 2.8, 2.4), color, lw * 0.8);\n      plate(ngonPath(tip.x, tip.y, 8, 6, t), accent, lw * 0.9);\n      if (!flat) glowFill(ctx, circlePath(tip.x, tip.y, 3.6), '#ffffff', 0.85);\n      break;\n    }\n    case 'orbstaff': {\n      const tip = along(46), tail = along(-30);\n      plate(taperPath(tail.x, tail.y, tip.x, tip.y, 2.6, 2.2), color, lw * 0.8);\n      if (!flat) {\n        glowFill(ctx, circlePath(tip.x, tip.y, 9 + Math.sin(t * 5) * 1.5), accent, 0.6);\n        glowFill(ctx, circlePath(tip.x, tip.y, 4), '#ffffff', 0.9);\n      }\n      break;\n    }\n    case 'hammer': {\n      const tip = along(48), tail = along(-14);\n      plate(taperPath(tail.x, tail.y, tip.x, tip.y, 3.4, 3), color, lw * 0.9);\n      plate(polyPath([\n        along(38, -16), along(62, -14), along(62, 14), along(38, 16),\n      ]), accent, lw + 0.4);\n      break;\n    }\n    case 'shield': {\n      const c0 = along(16);\n      plate(polyPath([\n        { x: c0.x - 6, y: c0.y - 26 }, { x: c0.x + 14, y: c0.y - 18 },\n        { x: c0.x + 16, y: c0.y + 16 }, { x: c0.x - 4, y: c0.y + 28 },\n        { x: c0.x - 12, y: c0.y + 2 },\n      ]), color, lw + 0.6);\n      if (!flat) glowFill(ctx, ngonPath(c0.x + 2, c0.y, 6, 6, t * 0.5), accent, 0.9);\n      break;\n    }\n    default:\n      plate(circlePath(h.x, h.y, 5.5), color, lw);\n      break;\n  }\n}\n\n/** 角色完整繪製（含影子）。snap 可以是活著的 fighter，也可以是殘影快照。 */\nexport function drawFighter(ctx, f, opts = {}) {\n  const char = f.char;\n  const joints = poseFor(f.pose, f.poseK, f.phase);\n  const scale = char.build.scale || 1;\n  const { flat = null, alpha = 1, shadow = true } = opts;\n\n  if (shadow && !flat) {\n    ctx.save();\n    ctx.translate(f.x, f.y + 2);\n    ctx.scale(1, 0.26);\n    ctx.fillStyle = 'rgba(0,0,0,0.45)';\n    ctx.fill(circlePath(0, 0, 26 * scale));\n    ctx.restore();\n  }\n\n  ctx.save();\n  ctx.translate(f.x, f.y);\n  ctx.scale(f.facing * scale, scale);\n  drawRig(ctx, char, joints, { flat, alpha, flash: f.hitFlash || 0, t: f.animTime || 0 });\n  ctx.restore();\n\n  // 狀態異常的附著特效\n  if (!flat) drawStatus(ctx, f);\n}\n\nfunction drawStatus(ctx, f) {\n  const cx = f.x, cy = f.y - 56;\n  if (f.freeze > 0) {\n    ctx.save();\n    const p = polyPath([\n      { x: cx - 26, y: cy + 54 }, { x: cx - 30, y: cy - 16 }, { x: cx - 14, y: cy - 56 },\n      { x: cx + 12, y: cy - 60 }, { x: cx + 30, y: cy - 20 }, { x: cx + 26, y: cy + 54 },\n    ]);\n    ctx.fillStyle = 'rgba(155,232,255,0.22)';\n    ctx.fill(p);\n    neonStroke(ctx, p, '#9be8ff', 2, 1.2);\n    ctx.restore();\n  }\n  if (f.burn > 0) {\n    for (let i = 0; i < 3; i++) {\n      const a = f.animTime * 6 + i * 2.1;\n      glowFill(ctx, circlePath(cx + Math.sin(a) * 16, cy - 10 + Math.cos(a * 1.3) * 26, 4 + Math.sin(a * 2) * 2), '#ff7a3c', 0.5);\n    }\n  }\n  if (f.poison > 0) {\n    for (let i = 0; i < Math.min(6, f.poison); i++) {\n      const a = f.animTime * 2 + (TAU * i) / 6;\n      glowFill(ctx, ngonPath(cx + Math.cos(a) * 24, cy + Math.sin(a) * 30, 3, 6, a), '#b46bff', 0.7);\n    }\n  }\n  if (f.shockTime > 0) {\n    for (let i = 0; i < 2; i++) {\n      const a = Math.random() * TAU;\n      glowFill(ctx, starPath(cx + Math.cos(a) * 22, cy + Math.sin(a) * 30, 4, 9, 3, a), '#fff27a', 0.8);\n    }\n  }\n  if (f.dr > 0 && f.drTime > 0) {\n    ctx.save();\n    const r = 58 + Math.sin(f.animTime * 5) * 3;\n    ctx.globalCompositeOperation = 'lighter';\n    ctx.globalAlpha = 0.5;\n    neonStroke(ctx, circlePath(cx, cy - 4, r), f.char.accent, 2, 1.2);\n    for (let i = 0; i < 6; i++) {\n      const a = f.animTime * 0.8 + (TAU * i) / 6;\n      neonStroke(ctx, ngonPath(cx + Math.cos(a) * r * 0.82, cy - 4 + Math.sin(a) * r * 0.82, 9, 6, a), f.char.color, 1.6, 1);\n    }\n    ctx.restore();\n  }\n}\n\n/** 給選角／商店用：把角色畫在指定位置（不需要 fighter 實體） */\nexport function drawPortrait(ctx, char, x, y, scale, t, pose = 'idle') {\n  ctx.save();\n  ctx.translate(x, y);\n  ctx.scale(scale * (char.build.scale || 1), scale * (char.build.scale || 1));\n  drawRig(ctx, char, poseFor(pose, 0.5, t * 3), { t });\n  ctx.restore();\n}\n","rig.js":"// 骨架與姿勢。\n//\n// 角色完全由程式畫出來，沒有任何圖檔：這支檔案負責「骨頭在哪裡」，\n// render.js 負責「骨頭長什麼樣」。座標是角色本地空間 —— 原點在腳底中心，\n// y 軸向上為負；面向由 render.js 用 scale(-1,1) 處理，所以這裡一律朝右。\n//\n// 角度定義：0 = 正下方，正值往前（+x）。dir(a) = (sin a, cos a)。\n\nconst L = {\n  hipY: -54,      // 髖高\n  torso: 26,      // 髖 → 胸\n  neck: 38,       // 髖 → 頸\n  headY: -104,    // 頭心高度\n  thigh: 27,\n  shin: 27,\n  upper: 23,\n  fore: 23,\n  shoulderW: 9,\n};\n\nconst dir = (a) => ({ x: Math.sin(a), y: Math.cos(a) });\n\nfunction chain(root, a1, l1, a2, l2) {\n  const d1 = dir(a1);\n  const mid = { x: root.x + d1.x * l1, y: root.y + d1.y * l1 };\n  const d2 = dir(a1 + a2);\n  const end = { x: mid.x + d2.x * l2, y: mid.y + d2.y * l2 };\n  return { mid, end };\n}\n\n/**\n * 組出一副骨架。\n * spec 用四肢的角度描述姿勢，其他（頭、胸、髖）由 lean / crouch / bob 推出來。\n */\nfunction assemble(spec) {\n  const {\n    lean = 0, crouch = 0, bob = 0, headTilt = 0,\n    armF = [0.4, 0.5], armB = [-0.4, 0.5],\n    legF = [0.25, 0.3], legB = [-0.25, 0.3],\n    armLen = 1, legLen = 1,\n  } = spec;\n\n  const hip = { x: lean * 6, y: L.hipY + crouch + bob };\n  const chestDir = dir(Math.PI + lean * 0.35);      // 往上、隨 lean 前傾\n  const chest = { x: hip.x + chestDir.x * L.torso, y: hip.y + chestDir.y * L.torso };\n  const neck = { x: hip.x + chestDir.x * L.neck, y: hip.y + chestDir.y * L.neck };\n  const head = {\n    x: neck.x + Math.sin(lean * 0.5 + headTilt) * 14,\n    y: neck.y - 14 + Math.abs(bob) * 0.2,\n  };\n\n  const shF = { x: chest.x + L.shoulderW * 0.5, y: chest.y };\n  const shB = { x: chest.x - L.shoulderW * 0.5, y: chest.y + 1 };\n\n  const aF = chain(shF, armF[0], L.upper * armLen, armF[1], L.fore * armLen);\n  const aB = chain(shB, armB[0], L.upper * armLen, armB[1], L.fore * armLen);\n  const lF = chain(hip, legF[0], L.thigh * legLen, legF[1], L.shin * legLen);\n  const lB = chain(hip, legB[0], L.thigh * legLen, legB[1], L.shin * legLen);\n\n  return {\n    hip, chest, neck, head,\n    shoulderF: shF, elbowF: aF.mid, handF: aF.end,\n    shoulderB: shB, elbowB: aB.mid, handB: aB.end,\n    kneeF: lF.mid, footF: lF.end,\n    kneeB: lB.mid, footB: lB.end,\n    lean,\n  };\n}\n\nconst sin = Math.sin;\n\n/**\n * 依狀態取得骨架。\n *   state  動作名稱\n *   k      這個動作的進度 0→1（攻擊類動作用它做出「蓄力→打出→收手」）\n *   phase  持續累加的相位（走路擺動、待機呼吸）\n */\nexport function poseFor(state, k = 0, phase = 0) {\n  switch (state) {\n    case 'run': {\n      const s = sin(phase), c = Math.cos(phase);\n      return assemble({\n        lean: 0.5, bob: -Math.abs(c) * 3,\n        armF: [0.2 - s * 1.1, 0.7], armB: [0.2 + s * 1.1, 0.7],\n        legF: [s * 0.95, 0.55 + Math.max(0, c) * 0.5],\n        legB: [-s * 0.95, 0.55 + Math.max(0, -c) * 0.5],\n      });\n    }\n    case 'jump':\n      return assemble({\n        lean: 0.18, bob: -2,\n        armF: [1.9, 0.5], armB: [2.2, 0.6],\n        legF: [0.9, 1.2], legB: [-0.3, 0.9],\n      });\n    case 'fall':\n      return assemble({\n        lean: -0.12,\n        armF: [2.5, 0.3], armB: [2.7, 0.35],\n        legF: [0.5, 0.35], legB: [-0.6, 0.5],\n      });\n    case 'land':\n      return assemble({\n        crouch: 14, lean: 0.25,\n        armF: [1.2, 0.6], armB: [-1.0, 0.7],\n        legF: [0.7, 1.1], legB: [-0.7, 1.1],\n      });\n    case 'crouch':\n      return assemble({\n        crouch: 18, lean: 0.3,\n        armF: [0.9, 0.8], armB: [-0.5, 0.9],\n        legF: [0.8, 1.3], legB: [-0.8, 1.3],\n      });\n    case 'guard':\n      return assemble({\n        crouch: 6, lean: -0.18,\n        armF: [1.15, 1.5], armB: [1.35, 1.6],\n        legF: [0.45, 0.55], legB: [-0.55, 0.6],\n      });\n    case 'dash':\n      return assemble({\n        lean: 1.0, bob: -4,\n        armF: [-0.5, 0.35], armB: [-1.0, 0.4],\n        legF: [1.25, 0.5], legB: [-0.6, 1.4],\n      });\n    case 'light1': {\n      // 直拳：k<0.35 收手，0.35~0.6 打出去，之後收回\n      const p = k < 0.3 ? -0.5 * (k / 0.3) : k < 0.55 ? -0.5 + 2.3 * ((k - 0.3) / 0.25) : 1.8 - 1.2 * ((k - 0.55) / 0.45);\n      return assemble({\n        lean: 0.3 + Math.min(p, 1.6) * 0.12,\n        armF: [1.55 + (p - 1) * 0.1, Math.max(0.05, 1.5 - p)],\n        armB: [-0.9, 1.0],\n        legF: [0.35, 0.4], legB: [-0.5, 0.55],\n      });\n    }\n    case 'light2': {\n      const p = k < 0.3 ? -0.4 * (k / 0.3) : k < 0.55 ? -0.4 + 2.2 * ((k - 0.3) / 0.25) : 1.8 - 1.4 * ((k - 0.55) / 0.45);\n      return assemble({\n        lean: 0.42,\n        armF: [-0.6, 1.2],\n        armB: [1.5 + (p - 1) * 0.12, Math.max(0.05, 1.5 - p)],\n        legF: [0.5, 0.45], legB: [-0.6, 0.5],\n      });\n    }\n    case 'light3': {\n      // 迴旋踢\n      const p = k < 0.35 ? k / 0.35 : 1 - (k - 0.35) / 0.65;\n      return assemble({\n        lean: 0.2 - p * 0.55, crouch: -p * 6,\n        armF: [-0.9 - p * 0.6, 0.7], armB: [0.9 + p * 0.5, 0.8],\n        legF: [0.3 + p * 1.5, Math.max(0.05, 0.9 - p * 0.85)],\n        legB: [-0.35 - p * 0.2, 0.35],\n      });\n    }\n    case 'heavy': {\n      // 大迴旋斬：後拉 → 劈下\n      const p = k < 0.42 ? -1.0 * (k / 0.42) : Math.min(1, (k - 0.42) / 0.22);\n      const swing = k < 0.42 ? -1.1 + p * 0.5 : -0.6 + p * 3.0;\n      return assemble({\n        lean: k < 0.42 ? -0.35 : 0.55, crouch: k < 0.42 ? -2 : 6,\n        armF: [swing, 0.35], armB: [swing - 0.3, 0.5],\n        legF: [0.55, 0.5], legB: [-0.7, 0.75],\n      });\n    }\n    case 'cast': {\n      const p = Math.sin(Math.min(1, k * 2) * Math.PI * 0.5);\n      return assemble({\n        lean: -0.25 + p * 0.5,\n        armF: [1.35 + p * 0.25, 0.25], armB: [1.1 + p * 0.3, 0.45],\n        legF: [0.4, 0.45], legB: [-0.6, 0.6],\n      });\n    }\n    case 'uppercut': {\n      const p = Math.min(1, k * 2.2);\n      return assemble({\n        lean: -0.25 - p * 0.15, crouch: 8 - p * 18,\n        armF: [3.05 + p * 0.1, -0.25], armB: [-0.6, 0.8],\n        legF: [0.2, 0.25], legB: [-0.9, 1.0],\n      });\n    }\n    case 'dive':\n      return assemble({\n        lean: 0.9,\n        armF: [-1.1, 0.4], armB: [-1.6, 0.5],\n        legF: [1.5, 0.15], legB: [0.6, 0.9],\n      });\n    case 'ult': {\n      const p = Math.min(1, k * 3);\n      return assemble({\n        lean: -0.4 + p * 0.2, crouch: 4 - p * 6, bob: -p * 3,\n        armF: [2.5 - p * 0.6, 0.7], armB: [-2.5 + p * 0.6, 0.7],\n        legF: [0.55, 0.5], legB: [-0.65, 0.6],\n      });\n    }\n    case 'hurt': {\n      const p = 1 - k;\n      return assemble({\n        lean: -0.5 * p, crouch: 4 * p, headTilt: -0.3 * p,\n        armF: [-1.2 * p - 0.2, 0.6], armB: [-1.6 * p - 0.2, 0.7],\n        legF: [0.25 - 0.3 * p, 0.4], legB: [-0.45, 0.5],\n      });\n    }\n    case 'ko':\n      return assemble({\n        lean: -0.9, crouch: 30, headTilt: -0.6,\n        armF: [-2.2, 0.3], armB: [-2.6, 0.4],\n        legF: [1.3, 1.5], legB: [-1.2, 1.5],\n      });\n    case 'idle':\n    default: {\n      const b = sin(phase * 0.9);\n      return assemble({\n        lean: 0.06, bob: b * 1.6,\n        armF: [0.55 + b * 0.08, 0.72], armB: [-0.42 - b * 0.08, 0.66],\n        legF: [0.22, 0.28], legB: [-0.24, 0.3],\n      });\n    }\n  }\n}\n\nexport const RIG_LENGTHS = L;\n","screens.js":"// 選單畫面：主畫面、選角、連線大廳、結算。\n//\n// 每個畫面都是 { update(dt), draw(ctx), onPointer(x,y) }，由 main.js 切換。\n// 滑鼠／觸控靠 Taps：畫的時候順手登記可點區域，點下去就轉成和鍵盤一樣的動作。\n\nimport { ROSTER, IDS, getChar, statRatio, randomId } from './characters.js';\nimport { drawArena, drawPortrait, WORLD } from './render.js';\nimport { panel, text, measure, neonStroke, glowFill, circlePath, ngonPath, polyPath } from './gfx.js';\nimport { menuNav, isEdge, anyEdge, drainTyped } from './input.js';\nimport { clamp, withAlpha, lerp } from './util.js';\nimport { Net } from './net.js';\n\n/** 畫面寬度（世界比畫面寬，選單與 HUD 都用畫面座標） */\nconst VIEW = WORLD.view;\n\nexport class Taps {\n  constructor() { this.zones = []; this.building = []; }\n  begin() { this.building = []; }\n  add(x, y, w, h, action) { this.building.push({ x, y, w, h, action }); }\n  commit() { this.zones = this.building; }\n  hit(px, py) {\n    for (let i = this.zones.length - 1; i >= 0; i--) {\n      const z = this.zones[i];\n      if (px >= z.x && px <= z.x + z.w && py >= z.y && py <= z.y + z.h) return z.action;\n    }\n    return null;\n  }\n}\n\n// ==================================================================\nexport class TitleScreen {\n  constructor(game) {\n    this.game = game;\n    this.t = 0;\n    this.index = 0;\n    this.taps = new Taps();\n    this.showHelp = false;\n    this.items = [\n      { label: '單機對戰', sub: '一個人打 AI', action: 'solo' },\n      { label: '雙人同機', sub: '同一個鍵盤兩個人', action: 'local' },\n      { label: '連線對戰', sub: '四位數房號配對', action: 'online' },\n      { label: '操作說明', sub: '按鍵與規則', action: 'help' },\n    ];\n  }\n\n  onEnter() { this.t = 0; }\n\n  update(dt) {\n    this.t += dt;\n    const nav = menuNav();\n    if (this.showHelp) {\n      if (nav.ok || nav.back) { this.showHelp = false; this.game.audio.play('menu'); }\n      return;\n    }\n    if (nav.up) { this.index = (this.index + this.items.length - 1) % this.items.length; this.game.audio.play('menu'); }\n    if (nav.down) { this.index = (this.index + 1) % this.items.length; this.game.audio.play('menu'); }\n    if (nav.ok) this.choose(this.items[this.index].action);\n  }\n\n  choose(action) {\n    this.game.audio.play('select');\n    if (action === 'help') { this.showHelp = true; return; }\n    if (action === 'online') { this.game.goto('lobby'); return; }\n    this.game.goto('select', { mode: action });\n  }\n\n  onPointer(x, y) {\n    const a = this.taps.hit(x, y);\n    if (this.showHelp) { this.showHelp = false; return; }\n    if (a) this.choose(a);\n  }\n\n  draw(ctx) {\n    this.taps.begin();\n    drawArena(ctx, this.t * 0.6, '#5a2a8b');\n\n    // 背景：兩位角色的剪影在對峙\n    const a = ROSTER[Math.floor(this.t / 3) % ROSTER.length];\n    const b = ROSTER[(Math.floor(this.t / 3) + 5) % ROSTER.length];\n    ctx.save();\n    ctx.globalAlpha = 0.5;\n    drawPortrait(ctx, a, 250, 600, 1.5, this.t, 'idle');\n    ctx.translate(1030, 0);\n    ctx.scale(-1, 1);\n    drawPortrait(ctx, b, 0, 600, 1.5, this.t + 1, 'idle');\n    ctx.restore();\n\n    // 標題\n    const cx = VIEW / 2;\n    const bob = Math.sin(this.t * 1.6) * 4;\n    text(ctx, 'NEON CLASH', cx, 168 + bob, {\n      size: 84, color: '#7ef1ff', align: 'center', weight: 900, letter: 10, glow: 1.5,\n    });\n    text(ctx, '霓　虹　亂　鬥', cx, 216 + bob, {\n      size: 26, color: '#ff5ec4', align: 'center', weight: 700, letter: 8, glow: 1,\n    });\n    text(ctx, '十位鬥士・近戰街機・單機或連線', cx, 248 + bob, {\n      size: 15, color: '#9fb4ff', align: 'center',\n    });\n\n    if (this.showHelp) { this.drawHelp(ctx); this.taps.commit(); return; }\n\n    // 選單\n    this.items.forEach((item, i) => {\n      const w = 340, h = 54;\n      const x = cx - w / 2, y = 300 + i * 66;\n      const on = i === this.index;\n      panel(ctx, x, y, w, h, on ? '#7ef1ff' : '#39405e', { glow: on ? 1 : 0 });\n      if (on) {\n        ctx.save();\n        ctx.globalCompositeOperation = 'lighter';\n        ctx.globalAlpha = 0.12 + 0.06 * Math.sin(this.t * 6);\n        ctx.fillStyle = '#7ef1ff';\n        ctx.fillRect(x, y, w, h);\n        ctx.restore();\n        glowFill(ctx, ngonPath(x + 26, y + h / 2, 7, 6, this.t * 2), '#ff5ec4', 1);\n      }\n      text(ctx, item.label, x + 52, y + 35, { size: 24, color: on ? '#ffffff' : '#aeb7d8' });\n      text(ctx, item.sub, x + w - 16, y + 34, { size: 13, color: '#7b86ad', align: 'right' });\n      this.taps.add(x, y, w, h, item.action);\n    });\n\n    // 角色跑馬燈\n    const stripY = 600;\n    ROSTER.forEach((c, i) => {\n      const x = 90 + i * 122;\n      const wob = Math.sin(this.t * 2 + i) * 3;\n      ctx.save();\n      ctx.globalAlpha = 0.9;\n      drawPortrait(ctx, c, x, stripY + wob, 0.52, this.t + i, 'idle');\n      ctx.restore();\n      text(ctx, c.name, x, stripY + 30, { size: 14, color: c.color, align: 'center' });\n    });\n\n    text(ctx, '↑↓ 選擇　Enter 確定　M 靜音　H 說明', cx, 700, {\n      size: 14, color: '#6f7aa3', align: 'center',\n    });\n    this.taps.commit();\n  }\n\n  drawHelp(ctx) {\n    const w = 900, h = 440, x = (VIEW - w) / 2, y = 180;\n    panel(ctx, x, y, w, h, '#7ef1ff');\n    text(ctx, '操作說明', x + 40, y + 52, { size: 30, color: '#7ef1ff' });\n    const rows = [\n      ['移動 / 跳躍', 'A D / W（空中再按一次＝二段跳，限疾翎）'],\n      ['輕攻擊', 'J　連按三下是連段，第三段打飛'],\n      ['重攻擊', 'K　慢但有霸體，打中直接把人轟開'],\n      ['技能一 / 二', 'U / I　各自有冷卻'],\n      ['必殺', 'O　氣條滿了才能放'],\n      ['衝刺閃避', 'L　有短暫無敵，空中也能用一次'],\n      ['格擋', '往後推（遠離對手的方向）就會自動格擋'],\n      ['第二位玩家', '方向鍵移動、Numpad 1/2/4/5/6/3'],\n    ];\n    rows.forEach((r, i) => {\n      const ry = y + 100 + i * 40;\n      text(ctx, r[0], x + 44, ry, { size: 18, color: '#ffffff' });\n      text(ctx, r[1], x + 240, ry, { size: 16, color: '#9fb4ff' });\n    });\n    text(ctx, '勝負：三回合兩勝，每回合 60 秒，時間到血多的人贏。', x + 44, y + h - 40, {\n      size: 15, color: '#ffd24d',\n    });\n    this.taps.add(x, y, w, h, 'close');\n  }\n}\n\n// ==================================================================\nexport class SelectScreen {\n  constructor(game) {\n    this.game = game;\n    this.taps = new Taps();\n    this.t = 0;\n  }\n\n  onEnter(opts = {}) {\n    this.mode = opts.mode || 'solo';       // solo | local | net\n    this.net = opts.net || null;\n    this.picks = [null, null];\n    this.cursor = [0, 5];\n    this.ready = [false, false];\n    this.phase = 0;                        // solo/local：目前輪到誰選\n    this.t = 0;\n    this.foeReady = false;\n    this.mySide = this.mode === 'net' ? (this.net.isHost ? 0 : 1) : 0;\n    this.status = '';\n  }\n\n  get columns() { return 5; }\n\n  update(dt) {\n    this.t += dt;\n    const nav = menuNav();\n    if (this.mode === 'net') {\n      this.updateNet(nav);\n      return;\n    }\n    const side = this.phase;\n    if (nav.left) this.move(side, -1);\n    if (nav.right) this.move(side, 1);\n    if (nav.up) this.move(side, -this.columns);\n    if (nav.down) this.move(side, this.columns);\n    if (nav.back) {\n      if (this.phase === 1) { this.phase = 0; this.picks[0] = null; }\n      else this.game.goto('title');\n      this.game.audio.play('menu');\n    }\n    if (nav.ok) this.confirm(side);\n\n    // 第二位玩家在雙人同機時用自己的方向鍵（第一位用 WASD）\n    if (this.mode === 'local' && this.phase === 1) {\n      if (anyEdge(['ArrowLeft'])) this.move(1, -1);\n      if (anyEdge(['ArrowRight'])) this.move(1, 1);\n    }\n  }\n\n  updateNet(nav) {\n    const side = this.mySide;\n    if (nav.left) this.move(side, -1);\n    if (nav.right) this.move(side, 1);\n    if (nav.up) this.move(side, -this.columns);\n    if (nav.down) this.move(side, this.columns);\n    if (nav.back) { this.game.leaveNet(); return; }\n    if (nav.ok) {\n      this.ready[side] = !this.ready[side];\n      this.game.audio.play(this.ready[side] ? 'select' : 'menu');\n      this.pushNet();\n    }\n  }\n\n  pushNet() {\n    const side = this.mySide;\n    this.picks[side] = IDS[this.cursor[side]];\n    this.net.send({ t: 'lobby', char: this.picks[side], ready: this.ready[side] });\n    this.game.tryStartNet(this.picks, this.ready);\n  }\n\n  onNetLobby(msg) {\n    const other = this.mySide === 0 ? 1 : 0;\n    this.picks[other] = msg.char;\n    this.cursor[other] = Math.max(0, IDS.indexOf(msg.char));\n    this.ready[other] = !!msg.ready;\n    this.game.tryStartNet(this.picks, this.ready);\n  }\n\n  move(side, delta) {\n    const n = IDS.length;\n    this.cursor[side] = (this.cursor[side] + delta + n * 2) % n;\n    this.game.audio.play('menu');\n    if (this.mode === 'net') {\n      this.ready[side] = false;\n      this.pushNet();\n    }\n  }\n\n  confirm(side) {\n    const id = IDS[this.cursor[side]];\n    this.picks[side] = id;\n    this.game.audio.play('select');\n    if (this.mode === 'solo') {\n      if (this.phase === 0) {\n        this.phase = 1;\n        this.cursor[1] = Math.floor(Math.random() * IDS.length);\n      } else {\n        this.game.startBattle({ mode: 'solo', chars: [this.picks[0], this.picks[1]] });\n      }\n    } else if (this.mode === 'local') {\n      if (this.phase === 0) this.phase = 1;\n      else this.game.startBattle({ mode: 'local', chars: [this.picks[0], this.picks[1]] });\n    }\n  }\n\n  onPointer(x, y) {\n    const a = this.taps.hit(x, y);\n    if (!a) return;\n    if (a === 'back') {\n      if (this.mode === 'net') this.game.leaveNet();\n      else if (this.phase === 1) { this.phase = 0; this.picks[0] = null; }\n      else this.game.goto('title');\n      return;\n    }\n    if (a === 'ok') {\n      if (this.mode === 'net') { this.ready[this.mySide] = !this.ready[this.mySide]; this.pushNet(); }\n      else this.confirm(this.phase);\n      return;\n    }\n    if (a === 'random') {\n      const side = this.mode === 'net' ? this.mySide : this.phase;\n      this.cursor[side] = Math.floor(Math.random() * IDS.length);\n      if (this.mode === 'net') this.pushNet();\n      else this.confirm(side);\n      return;\n    }\n    if (typeof a === 'number') {\n      const side = this.mode === 'net' ? this.mySide : this.phase;\n      if (this.cursor[side] === a) {\n        if (this.mode === 'net') { this.ready[side] = !this.ready[side]; this.pushNet(); }\n        else this.confirm(side);\n      } else {\n        this.cursor[side] = a;\n        this.game.audio.play('menu');\n        if (this.mode === 'net') { this.ready[side] = false; this.pushNet(); }\n      }\n    }\n  }\n\n  draw(ctx) {\n    this.taps.begin();\n    ctx.fillStyle = '#06080f';\n    ctx.fillRect(0, 0, VIEW, WORLD.h);\n    drawArena(ctx, this.t * 0.4, '#3a2a6b');\n    ctx.fillStyle = 'rgba(4,6,14,0.72)';\n    ctx.fillRect(0, 0, VIEW, WORLD.h);\n\n    const title = this.mode === 'net' ? '選擇角色（連線）'\n      : this.mode === 'local' ? (this.phase === 0 ? '玩家 1 選擇角色' : '玩家 2 選擇角色')\n        : (this.phase === 0 ? '選擇你的角色' : '選擇對手');\n    text(ctx, title, 60, 60, { size: 30, color: '#ffffff', glow: 0.5 });\n    const hint = this.mode === 'net'\n      ? '↑↓←→ 選擇　Enter 準備／取消　Esc 離開房間'\n      : '↑↓←→ 選擇　Enter 確定　Esc 返回';\n    text(ctx, hint, 60, 86, { size: 14, color: '#8a93c0' });\n\n    if (this.mode === 'net') {\n      const st = this.net.peerHere ? '對手已連線' : '等待對手加入…';\n      text(ctx, `房號 ${this.net.room}　${st}　延遲 ${this.net.rtt}ms`, VIEW - 60, 60, {\n        size: 16, color: '#7ef1ff', align: 'right',\n      });\n    }\n\n    // 角色卡片\n    const cardW = 200, cardH = 132, gap = 14;\n    const gridW = this.columns * cardW + (this.columns - 1) * gap;\n    const gx = (VIEW - gridW) / 2, gy = 110;\n    ROSTER.forEach((c, i) => {\n      const col = i % this.columns, row = Math.floor(i / this.columns);\n      const x = gx + col * (cardW + gap), y = gy + row * (cardH + gap);\n      const sel0 = this.cursor[0] === i && (this.mode !== 'solo' || this.phase === 0 || this.picks[0] === c.id);\n      const sel1 = this.cursor[1] === i && (this.mode === 'net' || this.phase === 1);\n      this.drawCard(ctx, c, x, y, cardW, cardH, sel0, sel1, i);\n      this.taps.add(x, y, cardW, cardH, i);\n    });\n\n    // 詳細資料\n    const side = this.mode === 'net' ? this.mySide : this.phase;\n    const cur = getChar(IDS[this.cursor[side]]);\n    this.drawDetail(ctx, cur, gx, gy + 2 * (cardH + gap) + 8, gridW);\n\n    // 底部按鈕\n    const okLabel = this.mode === 'net' ? (this.ready[this.mySide] ? '取消準備' : '準備') : '確定';\n    this.button(ctx, VIEW - 260, WORLD.h - 68, 200, 46, okLabel, '#4cff9d', 'ok');\n    this.button(ctx, 60, WORLD.h - 68, 140, 46, '返回', '#8a93c0', 'back');\n    this.button(ctx, 220, WORLD.h - 68, 140, 46, '隨機', '#ffd24d', 'random');\n\n    // 雙方選擇狀態\n    const p0 = this.picks[0] ? getChar(this.picks[0]) : null;\n    const p1 = this.picks[1] ? getChar(this.picks[1]) : null;\n    const label = (p, who, ready) => p ? `${who}：${p.name}${ready ? '（已準備）' : ''}` : `${who}：選擇中…`;\n    text(ctx, label(p0, this.mode === 'solo' ? '你' : 'P1', this.ready[0]), VIEW / 2 - 200, WORLD.h - 92, {\n      size: 16, color: '#7ef1ff', align: 'right',\n    });\n    text(ctx, 'VS', VIEW / 2, WORLD.h - 92, { size: 20, color: '#ffd24d', align: 'center' });\n    text(ctx, label(p1, this.mode === 'solo' ? '對手' : 'P2', this.ready[1]), VIEW / 2 + 200, WORLD.h - 92, {\n      size: 16, color: '#ff5ec4', align: 'left',\n    });\n\n    this.taps.commit();\n  }\n\n  drawCard(ctx, c, x, y, w, h, sel0, sel1, i) {\n    const on = sel0 || sel1;\n    const col = on ? c.color : '#39405e';\n    panel(ctx, x, y, w, h, col, { glow: on ? 1 : 0, cut: 10 });\n    if (on) {\n      ctx.save();\n      ctx.globalCompositeOperation = 'lighter';\n      ctx.globalAlpha = 0.1 + 0.05 * Math.sin(this.t * 6);\n      ctx.fillStyle = c.color;\n      ctx.fillRect(x, y, w, h);\n      ctx.restore();\n    }\n    drawPortrait(ctx, c, x + 54, y + h - 16, 0.62, this.t + i, on ? 'idle' : 'idle');\n    text(ctx, c.name, x + w - 14, y + 34, { size: 22, color: on ? '#ffffff' : c.color, align: 'right' });\n    text(ctx, c.en, x + w - 14, y + 54, { size: 12, color: '#8a93c0', align: 'right' });\n    text(ctx, c.title, x + w - 14, y + h - 16, { size: 13, color: '#9fb4ff', align: 'right' });\n    if (sel0) this.cursorFrame(ctx, x, y, w, h, '#7ef1ff', 'P1');\n    if (sel1) this.cursorFrame(ctx, x, y, w, h, '#ff5ec4', 'P2');\n  }\n\n  cursorFrame(ctx, x, y, w, h, color, tag) {\n    const o = tag === 'P1' ? 0 : 5;\n    const p = polyPath([\n      { x: x - 4 + o, y: y - 4 + o }, { x: x + w + 4 - o, y: y - 4 + o },\n      { x: x + w + 4 - o, y: y + h + 4 - o }, { x: x - 4 + o, y: y + h + 4 - o },\n    ]);\n    neonStroke(ctx, p, color, 2.4, 1.2);\n    text(ctx, tag, x + w - 8 + (tag === 'P1' ? 0 : 0), y - 10, { size: 12, color, align: 'right' });\n  }\n\n  drawDetail(ctx, c, x, y, w) {\n    const h = 196;\n    panel(ctx, x, y, w, h, c.color, { glow: 0.5 });\n    drawPortrait(ctx, c, x + 92, y + h - 22, 1.15, this.t, 'idle');\n\n    text(ctx, c.name, x + 180, y + 44, { size: 30, color: c.color, glow: 0.6 });\n    const nw = measure(ctx, c.name, 30);\n    text(ctx, `${c.en}・${c.title}`, x + 190 + nw, y + 42, { size: 15, color: '#9fb4ff' });\n    text(ctx, c.tagline, x + 180, y + 68, { size: 14, color: '#c3cbe8' });\n\n    // 數值條\n    const stats = [['hp', '血量'], ['speed', '移速'], ['jump', '跳躍'], ['atk', '攻擊'], ['def', '耐打']];\n    stats.forEach((s, i) => {\n      const sy = y + 92 + i * 20;\n      text(ctx, s[1], x + 180, sy + 10, { size: 13, color: '#9fb4ff' });\n      const bx = x + 224, bw = 150;\n      ctx.fillStyle = 'rgba(255,255,255,0.08)';\n      ctx.fillRect(bx, sy, bw, 10);\n      ctx.fillStyle = c.color;\n      ctx.fillRect(bx, sy, bw * statRatio(c, s[0]), 10);\n    });\n\n    // 被動與招式\n    const tx = x + 420;\n    text(ctx, `被動・${c.passive.name}`, tx, y + 44, { size: 17, color: c.accent });\n    text(ctx, c.passive.desc, tx, y + 66, { size: 13, color: '#c3cbe8' });\n    const moves = [['U', c.skills[0]], ['I', c.skills[1]], ['O', c.ult]];\n    moves.forEach((m, i) => {\n      const my = y + 100 + i * 32;\n      const key = m[0];\n      const s = m[1];\n      ctx.fillStyle = withAlpha(c.color, 0.18);\n      ctx.fillRect(tx, my - 14, 26, 22);\n      text(ctx, key, tx + 13, my + 2, { size: 13, color: c.color, align: 'center' });\n      text(ctx, s.name, tx + 36, my + 2, { size: 16, color: '#ffffff' });\n      const nw2 = measure(ctx, s.name, 16);\n      text(ctx, s.desc, tx + 46 + nw2, my + 1, { size: 12.5, color: '#9fb4ff' });\n      if (s.cd) text(ctx, `CD ${s.cd}s`, x + w - 16, my + 2, { size: 12, color: '#7b86ad', align: 'right' });\n      else text(ctx, '需要滿氣', x + w - 16, my + 2, { size: 12, color: '#ffd24d', align: 'right' });\n    });\n  }\n\n  button(ctx, x, y, w, h, label, color, action) {\n    panel(ctx, x, y, w, h, color, { glow: 0.6 });\n    text(ctx, label, x + w / 2, y + h / 2 + 7, { size: 19, color: '#ffffff', align: 'center' });\n    this.taps.add(x, y, w, h, action);\n  }\n}\n\n// ==================================================================\nexport class LobbyScreen {\n  constructor(game) {\n    this.game = game;\n    this.taps = new Taps();\n    this.t = 0;\n    this.field = 'room';                  // room | address\n    this.room = '';\n    this.address = localStorage.getItem('neon.relay') || '';\n    this.status = '';\n    this.busy = false;\n  }\n\n  onEnter() {\n    this.t = 0;\n    this.status = '';\n    this.busy = false;\n    this.room = String(1000 + Math.floor(Math.random() * 9000));\n  }\n\n  update(dt) {\n    this.t += dt;\n    // 這個畫面要打字，所以不吃 WASD 當方向鍵 —— 不然打 wss:// 的 s 會變成切換欄位\n    if (isEdge('Escape')) { this.game.goto('title'); return; }\n    if (isEdge('ArrowUp') || isEdge('ArrowDown') || isEdge('Tab')) {\n      this.field = this.field === 'room' ? 'address' : 'room';\n      this.game.audio.play('menu');\n    }\n    // 位址欄可以打空白（wss:// 網址雖然沒有空白，但別讓空白鍵變成「連線」）\n    if ((isEdge('Enter') || isEdge('NumpadEnter')) && !this.busy) { this.join(); return; }\n\n    // 真正的打字：房號只收數字，位址什麼都收\n    for (const ch of drainTyped()) {\n      if (ch === '\\b') {\n        if (this.field === 'room') this.room = this.room.slice(0, -1);\n        else this.address = this.address.slice(0, -1);\n      } else {\n        this.type(ch);\n      }\n    }\n  }\n\n  type(ch) {\n    if (this.field === 'room') {\n      if (this.room.length < 4 && /\\d/.test(ch)) this.room += ch;\n    } else if (this.address.length < 56 && ch !== ' ') {\n      this.address += ch;\n    }\n  }\n\n  async join() {\n    if (this.room.length !== 4) { this.status = '房號要四位數字'; return; }\n    this.busy = true;\n    this.status = '連線中…';\n    localStorage.setItem('neon.relay', this.address);\n    try {\n      await this.game.connectNet(this.address, this.room);\n    } catch (e) {\n      this.status = this.game.net.error || '連線失敗';\n      this.busy = false;\n    }\n  }\n\n  onPointer(x, y) {\n    const a = this.taps.hit(x, y);\n    if (!a) return;\n    if (a === 'back') { this.game.goto('title'); return; }\n    if (a === 'join') { this.join(); return; }\n    if (a === 'room' || a === 'address') { this.field = a; return; }\n    if (a.startsWith && a.startsWith('k')) {\n      const ch = a.slice(1);\n      if (ch === 'del') {\n        if (this.field === 'room') this.room = this.room.slice(0, -1);\n        else this.address = this.address.slice(0, -1);\n      } else this.type(ch);\n    }\n  }\n\n  draw(ctx) {\n    this.taps.begin();\n    drawArena(ctx, this.t * 0.4, '#2a2a6b');\n    ctx.fillStyle = 'rgba(4,6,14,0.78)';\n    ctx.fillRect(0, 0, VIEW, WORLD.h);\n\n    const cx = VIEW / 2;\n    text(ctx, '連線對戰', cx, 92, { size: 38, color: '#7ef1ff', align: 'center', glow: 1 });\n    text(ctx, '兩邊輸入同一組房號就會配對，先連進來的自動當主機。', cx, 124, {\n      size: 15, color: '#9fb4ff', align: 'center',\n    });\n\n    // 房號\n    const boxW = 92, boxH = 108;\n    const totalW = boxW * 4 + 18 * 3;\n    const bx = cx - totalW / 2;\n    for (let i = 0; i < 4; i++) {\n      const x = bx + i * (boxW + 18);\n      const y = 170;\n      const active = this.field === 'room' && i === this.room.length;\n      panel(ctx, x, y, boxW, boxH, active ? '#ffd24d' : (this.field === 'room' ? '#7ef1ff' : '#39405e'), { glow: active ? 1 : 0.4 });\n      text(ctx, this.room[i] || '_', x + boxW / 2, y + 74, {\n        size: 56, color: this.room[i] ? '#ffffff' : '#39405e', align: 'center', weight: 900,\n      });\n      this.taps.add(x, y, boxW, boxH, 'room');\n    }\n\n    // 中繼位址\n    const ax = cx - 300, ay = 310;\n    text(ctx, '中繼伺服器位址（留空 = 跟遊戲同一台主機）', ax, ay - 12, { size: 14, color: '#9fb4ff' });\n    panel(ctx, ax, ay, 600, 48, this.field === 'address' ? '#7ef1ff' : '#39405e', { glow: this.field === 'address' ? 0.8 : 0 });\n    text(ctx, this.address || 'ws://（本機）', ax + 16, ay + 32, {\n      size: 18, color: this.address ? '#ffffff' : '#6f7aa3',\n    });\n    this.taps.add(ax, ay, 600, 48, 'address');\n\n    // 數字鍵盤（手機用）\n    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', ':'];\n    keys.forEach((k, i) => {\n      const col = i % 3, row = Math.floor(i / 3);\n      const kx = cx - 168 + col * 116, ky = 384 + row * 64;\n      panel(ctx, kx, ky, 104, 54, '#39405e', { glow: 0 });\n      text(ctx, k === 'del' ? '←' : k, kx + 52, ky + 36, { size: 22, color: '#dfe6ff', align: 'center' });\n      this.taps.add(kx, ky, 104, 54, `k${k}`);\n    });\n\n    if (this.status) {\n      text(ctx, this.status, cx, 646, { size: 17, color: '#ffd24d', align: 'center' });\n    }\n    text(ctx, '數字鍵輸入房號　↑↓ 切換欄位　Enter 連線　Esc 返回', cx, 676, {\n      size: 14, color: '#6f7aa3', align: 'center',\n    });\n\n    panel(ctx, cx + 200, 384, 150, 54, '#4cff9d', { glow: 0.8 });\n    text(ctx, '連線', cx + 275, 420, { size: 22, color: '#ffffff', align: 'center' });\n    this.taps.add(cx + 200, 384, 150, 54, 'join');\n\n    panel(ctx, cx - 350, 384, 150, 54, '#8a93c0', { glow: 0 });\n    text(ctx, '返回', cx - 275, 420, { size: 22, color: '#dfe6ff', align: 'center' });\n    this.taps.add(cx - 350, 384, 150, 54, 'back');\n\n    this.taps.commit();\n  }\n}\n\n// ==================================================================\nexport class ResultScreen {\n  constructor(game) {\n    this.game = game;\n    this.taps = new Taps();\n    this.t = 0;\n  }\n\n  onEnter(opts = {}) {\n    this.t = 0;\n    this.winner = opts.winner;\n    this.battle = opts.battle;\n    this.mode = opts.mode;\n  }\n\n  update(dt) {\n    this.t += dt;\n    const nav = menuNav();\n    if (nav.ok) this.again();\n    if (nav.back) this.game.goto('title');\n  }\n\n  again() {\n    this.game.audio.play('select');\n    if (this.mode === 'net') this.game.goto('title');\n    else this.game.goto('select', { mode: this.mode });\n  }\n\n  onPointer(x, y) {\n    const a = this.taps.hit(x, y);\n    if (a === 'again') this.again();\n    if (a === 'title') this.game.goto('title');\n  }\n\n  draw(ctx) {\n    this.taps.begin();\n    this.battle.draw(ctx);\n    ctx.fillStyle = 'rgba(4,6,14,0.78)';\n    ctx.fillRect(0, 0, VIEW, WORLD.h);\n\n    const win = this.battle.fighters[this.winner];\n    const lose = this.battle.fighters[this.winner === 0 ? 1 : 0];\n    const cx = VIEW / 2;\n\n    text(ctx, 'K.O.', cx, 130, { size: 92, color: win.char.color, align: 'center', weight: 900, glow: 1.6, letter: 8 });\n    text(ctx, `${win.char.name} 獲勝`, cx, 180, { size: 30, color: '#ffffff', align: 'center' });\n    text(ctx, `${this.battle.roundWins[0]} - ${this.battle.roundWins[1]}`, cx, 216, {\n      size: 22, color: '#9fb4ff', align: 'center',\n    });\n\n    const bob = Math.sin(this.t * 2) * 6;\n    drawPortrait(ctx, win.char, cx - 240, 480 + bob, 2.0, this.t, 'idle');\n    ctx.save();\n    ctx.globalAlpha = 0.45;\n    drawPortrait(ctx, lose.char, cx + 240, 480, 1.7, this.t, 'ko');\n    ctx.restore();\n\n    const stats = [\n      ['總傷害', `${Math.round(win.dmgDealt)}`, `${Math.round(lose.dmgDealt)}`],\n      ['最高連段', `${win.maxCombo}`, `${lose.maxCombo}`],\n      ['剩餘血量', `${Math.max(0, Math.round(win.hp))}`, `${Math.max(0, Math.round(lose.hp))}`],\n    ];\n    stats.forEach((s, i) => {\n      const y = 300 + i * 40;\n      text(ctx, s[1], cx - 60, y, { size: 22, color: win.char.color, align: 'right' });\n      text(ctx, s[0], cx, y, { size: 15, color: '#9fb4ff', align: 'center' });\n      text(ctx, s[2], cx + 60, y, { size: 22, color: lose.char.color, align: 'left' });\n    });\n\n    panel(ctx, cx - 230, 600, 200, 54, '#4cff9d', { glow: 0.8 });\n    text(ctx, '再打一場', cx - 130, 636, { size: 20, color: '#ffffff', align: 'center' });\n    this.taps.add(cx - 230, 600, 200, 54, 'again');\n\n    panel(ctx, cx + 30, 600, 200, 54, '#8a93c0', { glow: 0 });\n    text(ctx, '回主畫面', cx + 130, 636, { size: 20, color: '#dfe6ff', align: 'center' });\n    this.taps.add(cx + 30, 600, 200, 54, 'title');\n\n    this.taps.commit();\n  }\n}\n","skills.js":"// 招式元件庫。\n//\n// 二十位角色技能 + 十招必殺，如果每一招都從零寫起會又長又不一致，\n// 所以拆成可組合的元件：彈道／場域／地刺／光束／突進／連打／天降／引力…\n// 角色資料只填 kind 與參數，視覺再用自己的顏色與形狀做出辨識度。\n//\n// 兩種元件：\n//   Entity   有自己生命週期的東西（飛行物、場域、光束）\n//   Routine  一段時間內「操控施放者」的腳本（突進、連斬、瞬移）\n\nimport {\n  TAU, circlePath, ngonPath, polyPath, crescentPath, linePath, taperPath,\n  neonStroke, glowFill, joltPath, starPath,\n} from './gfx.js';\nimport { clamp, rand, sign, rect, overlaps, easeOut, withAlpha, dist } from './util.js';\nimport { WORLD } from './render.js';\n\n// ------------------------------------------------------------------ 基底\nclass Entity {\n  constructor(o = {}) {\n    Object.assign(this, { t: 0, life: 1, dead: false, layer: 'front' }, o);\n  }\n  update(dt) {\n    this.t += dt;\n    if (this.t >= this.life) this.dead = true;\n  }\n  draw() {}\n}\n\n/** 一段時間內操控施放者的腳本 */\nclass Routine extends Entity {\n  constructor(o) { super(o); }\n  update(dt, battle) {\n    this.t += dt;\n    if (this.step) this.step(dt, this, battle);\n    if (this.t >= this.life) {\n      if (this.finish) this.finish(this, battle);\n      this.dead = true;\n    }\n  }\n}\n\nconst foeOf = (user) => user.battle.opponentOf(user);\n\n/** 對指定矩形內的敵人造成一次傷害 */\nfunction hitRect(user, r, hit) {\n  const foe = foeOf(user);\n  if (!foe || foe.dead) return false;\n  if (!overlaps(r, foe.bodyRect())) return false;\n  return user.dealDamage(foe, hit);\n}\n\nfunction hitCircle(user, x, y, radius, hit) {\n  const foe = foeOf(user);\n  if (!foe || foe.dead) return false;\n  const b = foe.bodyRect();\n  const cx = clamp(x, b.x, b.x + b.w);\n  const cy = clamp(y, b.y, b.y + b.h);\n  if (dist(x, y, cx, cy) > radius) return false;\n  return user.dealDamage(foe, hit);\n}\n\n// ------------------------------------------------------------------ 飛行物\nexport class Projectile extends Entity {\n  constructor(o) {\n    super({ layer: 'front', radius: 16, gravity: 0, homing: 0, pierce: false, ...o });\n    this.hitIds = new Set();\n    this.trail = [];\n  }\n  update(dt, battle) {\n    this.t += dt;\n    if (this.t >= this.life) { this.explode(battle); return; }\n    const foe = foeOf(this.user);\n    if (this.homing > 0 && foe && !foe.dead) {\n      const c = foe.center();\n      const want = Math.atan2(c.y - this.y, c.x - this.x);\n      const cur = Math.atan2(this.vy, this.vx);\n      let d = ((want - cur + Math.PI * 3) % TAU) - Math.PI;\n      const turn = clamp(d, -this.homing * dt, this.homing * dt);\n      const sp = Math.hypot(this.vx, this.vy);\n      this.vx = Math.cos(cur + turn) * sp;\n      this.vy = Math.sin(cur + turn) * sp;\n    }\n    this.vy += this.gravity * dt;\n    this.x += this.vx * dt;\n    this.y += this.vy * dt;\n    this.trail.unshift({ x: this.x, y: this.y });\n    if (this.trail.length > 10) this.tr
