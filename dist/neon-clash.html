<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>NEON CLASH 霓虹亂鬥</title>
<!-- 內嵌的霓虹六角形圖示，免得瀏覽器去要一個不存在的 favicon -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305060f'/%3E%3Cpath d='M16 4l10 6v12l-10 6-10-6V10z' fill='none' stroke='%237ef1ff' stroke-width='3'/%3E%3Cpath d='M16 11l5 3v6l-5 3-5-3v-6z' fill='%23ff5ec4'/%3E%3C/svg%3E">
<meta name="description" content="瀏覽器上的近戰街機格鬥：十位霓虹鬥士、單機／雙人同機／房號連線對戰。">
<style>
  :root {
    --bg: #05060f;
    --edge: #1b2040;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    overflow: hidden;
    /* 中文介面靠系統字型，不下載任何字檔 —— 開啟即玩 */
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei",
      "Hiragino Sans", "Heiti TC", system-ui, sans-serif;
    color: #dfe6ff;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  /* 畫布用 CSS 等比放大，邏輯解析度固定 1280×720 */
  canvas {
    image-rendering: auto;
    background: #05060f;
    box-shadow: 0 0 0 1px var(--edge), 0 24px 80px rgba(0, 0, 0, .8);
    touch-action: none;
  }
  /* 掃描線與暗角：整個畫面的街機質感，不影響遊戲繪製 */
  #veil {
    position: fixed; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.20) 0 1px, rgba(0,0,0,0) 1px 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%);
    mix-blend-mode: multiply;
  }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: var(--bg); z-index: 5; text-align: center; padding: 24px;
  }
  #boot h1 { font-size: 28px; letter-spacing: .3em; margin: 0; color: #7ef1ff; }
  #boot p { margin: 0; font-size: 14px; color: #8a93c0; line-height: 1.7; }
  #boot code {
    color: #ffb3d9; background: #12162c; padding: 2px 6px; border-radius: 4px;
    font-size: 12px;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="veil"></div>
<div id="boot">
  <h1>NEON CLASH</h1>
  <p>載入中…</p>
</div>
<script type="module">
  const boot = document.getElementById('boot');
  const SOURCES = {"ai.js":"// 單機對手。\n//\n// AI 不碰戰鬥邏輯，只產生和玩家一模一樣的 InputFrame —— 所以它會受同樣的\n// 冷卻、硬直與格擋規則限制，不會作弊。難度只改「反應間隔」與「積極度」。\n\nimport { BTN, emptyFrame } from './input.js';\nimport { sign, clamp, rand } from './util.js';\nimport { MAX_METER } from './combat.js';\n\nexport class AI {\n  constructor(fighter, difficulty = 1) {\n    this.f = fighter;\n    this.difficulty = difficulty;\n    this.think = 0;\n    this.plan = 'approach';\n    this.planT = 0;\n    this.holdX = 0;\n    this.jumpT = 0;\n  }\n\n  get reaction() { return clamp(0.42 - 0.16 * this.difficulty, 0.1, 0.5); }\n  get aggression() { return clamp(0.45 + 0.35 * this.difficulty, 0.3, 0.95); }\n\n  update(dt, battle) {\n    const f = this.f;\n    const frame = emptyFrame();\n    if (f.dead || battle.state !== 'fight') return frame;\n\n    const foe = battle.opponentOf(f);\n    const target = battle.apparentTarget(f.side);\n    const dx = target.x - f.x;\n    const d = Math.abs(dx);\n    const dir = sign(dx) || 1;\n\n    this.planT -= dt;\n    this.think -= dt;\n    this.jumpT -= dt;\n\n    // ---- 決策 ----\n    if (this.think <= 0) {\n      this.think = this.reaction * rand(0.8, 1.3);\n      const hpRatio = f.hp / f.maxHp;\n\n      if (f.meter >= MAX_METER && d < 260 && Math.random() < 0.8) {\n        frame.edges |= BTN.ULT;\n      } else if (foe.attack && d < 150 && Math.random() < 0.45 * this.difficulty) {\n        // 對手在出招 → 往後退＝格擋\n        this.plan = 'block';\n        this.planT = 0.45;\n      } else if (d < 120) {\n        if (Math.random() < this.aggression) {\n          frame.edges |= Math.random() < 0.3 ? BTN.HEAVY : BTN.LIGHT;\n          this.plan = 'attack';\n          this.planT = 0.3;\n        } else if (Math.random() < 0.25) {\n          this.plan = 'retreat';\n          this.planT = 0.5;\n        }\n      } else if (d < 340) {\n        const s = this.pickSkill(d);\n        if (s >= 0 && Math.random() < this.aggression) {\n          frame.edges |= s === 0 ? BTN.S1 : BTN.S2;\n          this.planT = 0.3;\n        } else if (Math.random() < 0.5) {\n          this.plan = 'approach';\n          this.planT = 0.6;\n        } else if (Math.random() < 0.3 && f.dashCd <= 0) {\n          frame.edges |= BTN.DASH;\n          this.plan = 'approach';\n          this.planT = 0.3;\n        }\n      } else {\n        const s = this.pickSkill(d);\n        if (s >= 0 && Math.random() < this.aggression * 0.8) {\n          frame.edges |= s === 0 ? BTN.S1 : BTN.S2;\n        } else {\n          this.plan = 'approach';\n          this.planT = 0.7;\n        }\n      }\n\n      // 血量低時偶爾拉開距離喘口氣\n      if (hpRatio < 0.3 && Math.random() < 0.3) {\n        this.plan = 'retreat';\n        this.planT = 0.7;\n      }\n    }\n\n    if (this.planT <= 0) this.plan = 'approach';\n\n    // ---- 執行 ----\n    switch (this.plan) {\n      case 'block':\n        frame.x = -dir;\n        break;\n      case 'retreat':\n        frame.x = -dir;\n        if (d > 420) this.plan = 'approach';\n        break;\n      case 'attack':\n        frame.x = d > 70 ? dir : 0;\n        break;\n      case 'approach':\n      default:\n        frame.x = d > 64 ? dir : 0;\n        break;\n    }\n\n    // 對手在上面 → 跳上去；掉出平台 → 往回跳\n    if (this.jumpT <= 0 && f.onGround) {\n      const above = target.y < f.y - 70;\n      if ((above && d < 260) || (d < 40 && Math.random() < 0.1)) {\n        frame.edges |= BTN.JUMP;\n        this.jumpT = 0.9;\n      }\n    }\n    frame.up = false;\n    return frame;\n  }\n\n  /** 挑一個冷卻好了、距離也合適的技能 */\n  pickSkill(d) {\n    const f = this.f;\n    const opts = [];\n    for (let i = 0; i < 2; i++) {\n      if (f.cds[i] > 0) continue;\n      const kind = f.char.skills[i].kind;\n      const near = ['burst', 'uppercut', 'blink', 'rushCombo', 'slam', 'divekick'].includes(kind);\n      const far = ['projectile', 'beam', 'rain', 'spikes', 'boomerang', 'gravity', 'supernova'].includes(kind);\n      const any = ['ward', 'zone', 'decoy', 'dashStrike', 'vortex', 'fieldFreeze'].includes(kind);\n      if ((near && d < 170) || (far && d > 150) || any) opts.push(i);\n    }\n    if (!opts.length) return -1;\n    return opts[Math.floor(Math.random() * opts.length)];\n  }\n}\n","audio.js":"// 音效與音樂，全部用 WebAudio 即時合成 —— 專案裡沒有任何音檔。\n//\n// 瀏覽器規定要有使用者互動才能出聲，所以 AudioContext 延到第一次按鍵／點擊才建立。\n\nconst NOTES = { C: 261.63, D: 293.66, E: 329.63, F: 349.23, G: 392.0, A: 440.0, B: 493.88 };\n\nexport class Audio {\n  constructor() {\n    this.ctx = null;\n    this.master = null;\n    this.musicGain = null;\n    this.muted = false;\n    this.musicOn = true;\n    this.step = 0;\n    this.nextNote = 0;\n    this.timer = null;\n  }\n\n  /** 第一次互動時呼叫 */\n  unlock() {\n    if (this.ctx) {\n      if (this.ctx.state === 'suspended') this.ctx.resume();\n      return;\n    }\n    const AC = window.AudioContext || window.webkitAudioContext;\n    if (!AC) return;\n    this.ctx = new AC();\n    this.master = this.ctx.createGain();\n    this.master.gain.value = 0.32;\n    this.master.connect(this.ctx.destination);\n    this.musicGain = this.ctx.createGain();\n    this.musicGain.gain.value = 0.16;\n    this.musicGain.connect(this.master);\n    this.startMusic();\n  }\n\n  toggleMute() {\n    this.muted = !this.muted;\n    if (this.master) this.master.gain.value = this.muted ? 0 : 0.32;\n    return this.muted;\n  }\n\n  // ---------------------------------------------------------------- 合成零件\n  env(node, t, { attack = 0.005, decay = 0.12, peak = 1 }) {\n    const g = node.gain;\n    g.cancelScheduledValues(t);\n    g.setValueAtTime(0.0001, t);\n    g.exponentialRampToValueAtTime(Math.max(0.0001, peak), t + attack);\n    g.exponentialRampToValueAtTime(0.0001, t + attack + decay);\n  }\n\n  tone({ freq = 440, type = 'sine', dur = 0.12, gain = 0.5, slide = 0, delay = 0, dest }) {\n    if (!this.ctx) return;\n    const t = this.ctx.currentTime + delay;\n    const osc = this.ctx.createOscillator();\n    const g = this.ctx.createGain();\n    osc.type = type;\n    osc.frequency.setValueAtTime(freq, t);\n    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);\n    this.env(g, t, { decay: dur, peak: gain });\n    osc.connect(g).connect(dest || this.master);\n    osc.start(t);\n    osc.stop(t + dur + 0.05);\n  }\n\n  noise({ dur = 0.12, gain = 0.4, freq = 1200, q = 1, type = 'bandpass', slide = 0, delay = 0 }) {\n    if (!this.ctx) return;\n    const t = this.ctx.currentTime + delay;\n    const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));\n    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);\n    const d = buf.getChannelData(0);\n    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;\n    const src = this.ctx.createBufferSource();\n    src.buffer = buf;\n    const filt = this.ctx.createBiquadFilter();\n    filt.type = type;\n    filt.frequency.setValueAtTime(freq, t);\n    if (slide) filt.frequency.exponentialRampToValueAtTime(Math.max(60, freq + slide), t + dur);\n    filt.Q.value = q;\n    const g = this.ctx.createGain();\n    this.env(g, t, { decay: dur, peak: gain });\n    src.connect(filt).connect(g).connect(this.master);\n    src.start(t);\n    src.stop(t + dur + 0.05);\n  }\n\n  // ---------------------------------------------------------------- 音效表\n  play(name) {\n    if (!this.ctx || this.muted) return;\n    switch (name) {\n      case 'hit':\n        this.noise({ dur: 0.09, gain: 0.5, freq: 1800, slide: -1400, q: 1.2 });\n        this.tone({ freq: 220, type: 'square', dur: 0.07, gain: 0.25, slide: -120 });\n        break;\n      case 'hitHeavy':\n        this.noise({ dur: 0.18, gain: 0.6, freq: 900, slide: -700, q: 0.8 });\n        this.tone({ freq: 90, type: 'sawtooth', dur: 0.2, gain: 0.4, slide: -50 });\n        break;\n      case 'swing':\n        this.noise({ dur: 0.1, gain: 0.16, freq: 900, slide: 1800, q: 3, type: 'bandpass' });\n        break;\n      case 'jump':\n        this.tone({ freq: 320, type: 'triangle', dur: 0.14, gain: 0.22, slide: 260 });\n        break;\n      case 'land':\n        this.noise({ dur: 0.14, gain: 0.3, freq: 300, slide: -180, q: 0.7, type: 'lowpass' });\n        break;\n      case 'dash':\n        this.noise({ dur: 0.16, gain: 0.22, freq: 600, slide: 2200, q: 2 });\n        break;\n      case 'block':\n        this.tone({ freq: 880, type: 'square', dur: 0.08, gain: 0.2, slide: -300 });\n        this.noise({ dur: 0.06, gain: 0.2, freq: 2600, q: 2 });\n        break;\n      case 'dodge':\n        this.tone({ freq: 1200, type: 'sine', dur: 0.12, gain: 0.18, slide: 600 });\n        break;\n      case 'skill':\n        this.tone({ freq: 300, type: 'sawtooth', dur: 0.22, gain: 0.22, slide: 500 });\n        this.noise({ dur: 0.2, gain: 0.14, freq: 1400, slide: 900, q: 2 });\n        break;\n      case 'ult':\n        [0, 0.09, 0.18].forEach((d, i) => this.tone({\n          freq: 200 * Math.pow(1.5, i), type: 'sawtooth', dur: 0.5, gain: 0.22, delay: d, slide: 120,\n        }));\n        this.noise({ dur: 0.6, gain: 0.2, freq: 400, slide: 3000, q: 1.4 });\n        break;\n      case 'slam':\n      case 'boom':\n        this.tone({ freq: 70, type: 'sine', dur: 0.5, gain: 0.5, slide: -40 });\n        this.noise({ dur: 0.4, gain: 0.4, freq: 500, slide: -420, q: 0.6, type: 'lowpass' });\n        break;\n      case 'ko':\n        [0, 0.12, 0.26].forEach((d, i) => this.tone({\n          freq: 440 / Math.pow(1.35, i), type: 'square', dur: 0.4, gain: 0.26, delay: d, slide: -60,\n        }));\n        break;\n      case 'fight':\n        [0, 0.1].forEach((d, i) => this.tone({\n          freq: i ? NOTES.G * 2 : NOTES.C * 2, type: 'square', dur: 0.26, gain: 0.24, delay: d,\n        }));\n        break;\n      case 'menu':\n        this.tone({ freq: 760, type: 'square', dur: 0.05, gain: 0.14 });\n        break;\n      case 'select':\n        this.tone({ freq: NOTES.E * 2, type: 'square', dur: 0.1, gain: 0.2 });\n        this.tone({ freq: NOTES.G * 2, type: 'square', dur: 0.12, gain: 0.18, delay: 0.07 });\n        break;\n      default:\n        break;\n    }\n  }\n\n  // ---------------------------------------------------------------- 背景音樂\n  /** 16 步的合成器循環：低音線 + 琶音，音量壓得很低當底噪 */\n  startMusic() {\n    if (!this.ctx || this.timer) return;\n    const bass = [0, 0, 3, 0, 5, 0, 3, 0, 7, 0, 5, 0, 3, 0, 1, 0];\n    const arp = [12, 15, 19, 15, 12, 17, 19, 17, 12, 15, 22, 15, 12, 17, 19, 22];\n    const root = 110;\n    const stepDur = 0.15;\n    this.nextNote = this.ctx.currentTime + 0.1;\n    this.timer = setInterval(() => {\n      if (!this.ctx || this.muted || !this.musicOn) return;\n      while (this.nextNote < this.ctx.currentTime + 0.3) {\n        const s = this.step % 16;\n        const t = this.nextNote;\n        const semi = (n) => root * Math.pow(2, n / 12);\n        if (bass[s]) {\n          const o = this.ctx.createOscillator();\n          const g = this.ctx.createGain();\n          o.type = 'sawtooth';\n          o.frequency.setValueAtTime(semi(bass[s]) / 2, t);\n          const f = this.ctx.createBiquadFilter();\n          f.type = 'lowpass';\n          f.frequency.setValueAtTime(420, t);\n          this.env(g, t, { decay: stepDur * 1.6, peak: 0.5 });\n          o.connect(f).connect(g).connect(this.musicGain);\n          o.start(t); o.stop(t + stepDur * 2);\n        }\n        if (s % 2 === 0) {\n          const o = this.ctx.createOscillator();\n          const g = this.ctx.createGain();\n          o.type = 'square';\n          o.frequency.setValueAtTime(semi(arp[s]), t);\n          this.env(g, t, { decay: stepDur * 0.8, peak: 0.12 });\n          o.connect(g).connect(this.musicGain);\n          o.start(t); o.stop(t + stepDur);\n        }\n        this.step++;\n        this.nextNote += stepDur;\n      }\n    }, 60);\n  }\n\n  toggleMusic() {\n    this.musicOn = !this.musicOn;\n    return this.musicOn;\n  }\n}\n","battle.js":"// 一場對戰：兩位角色、一堆招式實體、回合與勝負。\n//\n// 不論單機、雙人同機還是連線，跑的都是這一支 —— 差別只在「輸入從哪裡來」\n// 以及連線時客戶端不自己算傷害（由主機的快照覆蓋）。\n\nimport { Fighter, BODY } from './fighter.js';\nimport { Fx } from './fx.js';\nimport { WORLD, drawSky, drawGround, drawPlatform, drawFighter } from './render.js';\nimport { clamp } from './util.js';\nimport { MAX_METER } from './combat.js';\nimport { runSkill } from './skills.js';\n\nexport const ROUND_TIME = 60;\nexport const WINS_NEEDED = 2;\n\nexport const MODE = { SOLO: 'solo', LOCAL: 'local', NET_HOST: 'host', NET_CLIENT: 'client' };\n\nexport class Battle {\n  constructor(opts) {\n    const { chars, mode = MODE.SOLO, audio, onMatchEnd = () => {}, difficulty = 1 } = opts;\n    this.mode = mode;\n    this.audio = audio;\n    this.difficulty = difficulty;\n    this.onMatchEnd = onMatchEnd;\n\n    this.fx = new Fx();\n    this.entities = [];\n    this.platforms = [\n      { x: 330, y: 432, w: 250, h: 18 },\n      { x: 1320, y: 432, w: 250, h: 18 },\n      { x: 825, y: 296, w: 250, h: 18 },\n    ];\n\n    this.fighters = [new Fighter(chars[0], 0), new Fighter(chars[1], 1)];\n    for (const f of this.fighters) f.battle = this;\n\n    this.time = 0;\n    this.roundWins = [0, 0];\n    this.round = 1;\n    this.timer = ROUND_TIME;\n    this.state = 'intro';           // intro → fight → ko → (下一回合 | over)\n    this.stateT = 0;\n    this.winner = -1;               // 這一回合的勝方\n    this.matchWinner = -1;\n    this.comboSide = -1;\n    this.comboShown = 0;\n    this.comboT = 0;\n    this.banner = null;             // { text, sub, t, life, color }\n    this.slowmo = 1;\n    // 連線的客戶端把這個關掉：傷害一律以主機的快照為準\n    this.authoritative = true;\n    this.onSkill = null;\n  }\n\n  // ---------------------------------------------------------------- 查詢\n  opponentOf(f) {\n    return this.fighters[f.side === 0 ? 1 : 0];\n  }\n\n  spawn(e) {\n    this.entities.push(e);\n    return e;\n  }\n\n  /** AI 會被虛影騙走：回傳該陣營「看起來的目標位置」 */\n  apparentTarget(forSide) {\n    const foe = this.fighters[forSide === 0 ? 1 : 0];\n    const decoy = this.entities.find((e) => e.snap && e.user === foe && !e.dead);\n    if (decoy) return { x: decoy.snap.x, y: decoy.snap.y, decoy: true };\n    return { x: foe.x, y: foe.y, decoy: false };\n  }\n\n  paintFighter(ctx, snap, color) {\n    drawFighter(ctx, snap, { flat: color, shadow: false });\n  }\n\n  // ---------------------------------------------------------------- 回合\n  startRound() {\n    this.state = 'intro';\n    this.stateT = 0;\n    this.timer = ROUND_TIME;\n    this.winner = -1;\n    this.entities.length = 0;\n    this.fx.clear();\n    this.fighters.forEach((f, i) => {\n      f.hp = f.maxHp;\n      f.meter = Math.min(f.meter, MAX_METER * 0.5);\n      f.x = i === 0 ? WORLD.w * 0.34 : WORLD.w * 0.66;\n      f.y = WORLD.ground;\n      f.vx = 0; f.vy = 0;\n      f.dead = false;\n      f.facing = i === 0 ? 1 : -1;\n      f.attack = null;\n      f.hitstun = 0; f.lock = 0; f.freeze = 0; f.shockTime = 0;\n      f.burn = 0; f.poison = 0; f.slow = 0; f.slowMul = 1;\n      f.dr = 0; f.drTime = 0; f.armor = 0; f.invuln = 0;\n      f.cds = [0, 0];\n      f.comboCount = 0;\n    });\n  }\n\n  showBanner(text, sub, color, life = 1.6) {\n    this.banner = { text, sub, color, t: 0, life };\n  }\n\n  onKO(loser) {\n    if (this.state !== 'fight') return;\n    this.state = 'ko';\n    this.stateT = 0;\n    this.winner = loser.side === 0 ? 1 : 0;\n    this.roundWins[this.winner]++;\n    this.slowmo = 0.25;\n    this.audio.play('ko');\n    const champ = this.fighters[this.winner];\n    this.showBanner('K.O.', `${champ.char.name} 拿下這回合`, champ.char.color, 2.2);\n  }\n\n  onCombo(attacker) {\n    if (attacker.comboCount >= 3) {\n      this.comboSide = attacker.side;\n      this.comboShown = attacker.comboCount;\n      this.comboT = 1.2;\n    }\n  }\n\n  onUlt(user) {\n    this.showBanner(user.char.ult.name, `${user.char.name}・必殺`, user.char.accent, 1.3);\n    this.fx.quake(10, 0.4);\n  }\n\n  // ---------------------------------------------------------------- 更新\n  update(dt, inputs) {\n    this.time += dt;\n    if (this.banner) {\n      this.banner.t += dt;\n      if (this.banner.t >= this.banner.life) this.banner = null;\n    }\n    if (this.comboT > 0) this.comboT -= dt;\n\n    // 頓幀：命中瞬間整個世界暫停幾格（特效照跑）\n    if (this.fx.hitstop > 0) {\n      this.fx.hitstop = Math.max(0, this.fx.hitstop - dt);\n      this.fx.update(dt * 0.25);\n      return;\n    }\n\n    const scale = this.state === 'ko' ? this.slowmo : 1;\n    const step = dt * scale;\n\n    switch (this.state) {\n      case 'intro':\n        this.stateT += dt;\n        this.fighters.forEach((f) => f.update(step, EMPTY));\n        if (this.stateT > 2.0) {\n          this.state = 'fight';\n          this.stateT = 0;\n          this.showBanner('FIGHT!', '', '#fff27a', 0.9);\n          this.audio.play('fight');\n        }\n        break;\n      case 'fight': {\n        this.timer = Math.max(0, this.timer - dt);\n        this.fighters.forEach((f, i) => f.update(step, inputs[i] || EMPTY));\n        this.separate();\n        if (this.timer <= 0) this.timeUp();\n        break;\n      }\n      case 'ko':\n        this.stateT += dt;\n        this.slowmo = clamp(0.25 + this.stateT * 0.5, 0.25, 1);\n        this.fighters.forEach((f, i) => f.update(step, EMPTY));\n        if (this.stateT > 2.4) this.afterRound();\n        break;\n      case 'over':\n        this.stateT += dt;\n        this.fighters.forEach((f) => f.update(step * 0.6, EMPTY));\n        break;\n      default:\n        break;\n    }\n\n    for (let i = this.entities.length - 1; i >= 0; i--) {\n      const e = this.entities[i];\n      e.update(step, this);\n      if (e.dead) this.entities.splice(i, 1);\n    }\n    this.fx.update(dt);\n  }\n\n  /** 兩個人不能站在同一格：輕輕推開，避免疊在一起看不出誰是誰 */\n  separate() {\n    const [a, b] = this.fighters;\n    if (a.dead || b.dead) return;\n    const dx = b.x - a.x;\n    const min = BODY.w * 0.82;\n    if (Math.abs(dx) < min) {\n      const push = (min - Math.abs(dx)) / 2;\n      const s = dx >= 0 ? 1 : -1;\n      a.x -= s * push;\n      b.x += s * push;\n      a.x = clamp(a.x, WORLD.left + BODY.w / 2, WORLD.right - BODY.w / 2);\n      b.x = clamp(b.x, WORLD.left + BODY.w / 2, WORLD.right - BODY.w / 2);\n    }\n  }\n\n  timeUp() {\n    const [a, b] = this.fighters;\n    const ra = a.hp / a.maxHp, rb = b.hp / b.maxHp;\n    this.state = 'ko';\n    this.stateT = 0;\n    this.slowmo = 0.5;\n    if (Math.abs(ra - rb) < 0.001) {\n      this.winner = -1;\n      this.showBanner('DRAW', '時間到，雙方血量相同', '#9fb4ff', 2.2);\n    } else {\n      this.winner = ra > rb ? 0 : 1;\n      this.roundWins[this.winner]++;\n      const champ = this.fighters[this.winner];\n      this.showBanner('TIME UP', `${champ.char.name} 血量較高`, champ.char.color, 2.2);\n    }\n    this.audio.play('ko');\n  }\n\n  afterRound() {\n    const done = this.roundWins.some((w) => w >= WINS_NEEDED);\n    if (done) {\n      this.state = 'over';\n      this.stateT = 0;\n      this.matchWinner = this.roundWins[0] >= WINS_NEEDED ? 0 : 1;\n      const champ = this.fighters[this.matchWinner];\n      this.showBanner('WIN', `${champ.char.name}　${this.roundWins[0]} - ${this.roundWins[1]}`, champ.char.accent, 3);\n      this.onMatchEnd(this.matchWinner);\n    } else {\n      this.round++;\n      this.startRound();\n      this.showBanner(`ROUND ${this.round}`, '', '#7ef1ff', 1.4);\n    }\n  }\n\n  // ---------------------------------------------------------------- 連線\n  /** 客戶端的每幀：不跑模擬，只補間位置、跑特效與招式實體 */\n  updateRemote(dt) {\n    this.time += dt;\n    if (this.banner) {\n      this.banner.t += dt;\n      if (this.banner.t >= this.banner.life) this.banner = null;\n    }\n    if (this.comboT > 0) this.comboT -= dt;\n    if (this.state === 'intro') this.stateT += dt;\n    for (const f of this.fighters) f.updateRemote(dt);\n    for (let i = this.entities.length - 1; i >= 0; i--) {\n      const e = this.entities[i];\n      e.update(dt, this);\n      if (e.dead) this.entities.splice(i, 1);\n    }\n    this.fx.update(dt);\n  }\n\n  /** 客戶端收到「對方放招」：在本地重跑同一招，但不造成傷害（authoritative = false） */\n  replayCast(side, kind, params) {\n    const f = this.fighters[side];\n    if (!f) return;\n    runSkill(kind, f, params || {}, {});\n    this.audio.play(params && params.ult ? 'ult' : 'skill');\n  }\n\n  collectSnapshot() {\n    return {\n      f: [this.fighters[0].snapshot(), this.fighters[1].snapshot()],\n      s: this.state,\n      t: Math.round(this.timer * 10) / 10,\n      w: this.roundWins.slice(),\n      r: this.round,\n    };\n  }\n\n  applySnapshot(s) {\n    if (!s || !s.f) return;\n    this.fighters[0].applySnapshot(s.f[0]);\n    this.fighters[1].applySnapshot(s.f[1]);\n    if (s.s !== this.state) {\n      // 主機宣告回合結束／新回合時，客戶端跟著切\n      if (s.s === 'intro' && this.state !== 'intro') {\n        this.entities.length = 0;\n        this.fx.clear();\n      }\n      this.state = s.s;\n      this.stateT = 0;\n    }\n    this.timer = s.t;\n    this.roundWins = s.w;\n    this.round = s.r;\n  }\n\n  // ---------------------------------------------------------------- 鏡頭\n  /**\n   * 格鬥遊戲的鏡頭：夾住兩個人、越近拉越大。\n   * 沒有鏡頭的話角色只佔畫面 15%，看起來像在看螞蟻打架。\n   */\n  camera() {\n    const [a, b] = this.fighters;\n    const mid = (a.x + b.x) / 2;\n    const spread = Math.abs(a.x - b.x);\n    const zoom = clamp(1.85 - spread / 950, 1.12, 1.72);\n    this.zoom = this.zoom ? lerpNum(this.zoom, zoom, 0.06) : zoom;\n    const visW = WORLD.view / this.zoom;\n    const visH = WORLD.h / this.zoom;\n    const focusY = Math.min(a.y, b.y) - 40;\n    let x = clamp(mid - visW / 2, -30, WORLD.w - visW + 30);\n    let y = clamp(focusY - visH * 0.52, -140, WORLD.ground + 74 - visH);\n    this.camX = this.camX === undefined ? x : lerpNum(this.camX, x, 0.12);\n    this.camY = this.camY === undefined ? y : lerpNum(this.camY, y, 0.09);\n    return { x: this.camX, y: this.camY, zoom: this.zoom };\n  }\n\n  // ---------------------------------------------------------------- 繪製\n  draw(ctx) {\n    const shake = this.fx.shakeOffset();\n    const cam = this.camera();\n\n    drawSky(ctx, this.time, this.fighters[0].char.color, cam.x);\n\n    ctx.save();\n    ctx.translate(shake.x, shake.y);\n    ctx.scale(cam.zoom, cam.zoom);\n    ctx.translate(-cam.x, -cam.y);\n\n    drawGround(ctx, this.time);\n    for (const p of this.platforms) drawPlatform(ctx, p, this.time);\n\n    this.fx.draw(ctx, 'back');\n    for (const e of this.entities) if (e.layer === 'back') e.draw(ctx, this);\n\n    // 血量低的人身上會閃紅光，遠遠就看得出誰快倒了\n    for (const f of this.fighters) {\n      if (!f.dead && f.hp / f.maxHp < 0.25) {\n        ctx.save();\n        ctx.globalCompositeOperation = 'lighter';\n        ctx.globalAlpha = 0.25 + 0.15 * Math.sin(this.time * 8);\n        ctx.fillStyle = '#ff2d55';\n        ctx.beginPath();\n        ctx.ellipse(f.x, f.y - 50, 44, 66, 0, 0, Math.PI * 2);\n        ctx.fill();\n        ctx.restore();\n      }\n      drawFighter(ctx, f);\n    }\n\n    for (const e of this.entities) if (e.layer !== 'back') e.draw(ctx, this);\n    this.fx.draw(ctx, 'front');\n    ctx.restore();\n\n    this.fx.drawFlash(ctx, WORLD.w, WORLD.h);\n  }\n}\n\nconst EMPTY = { x: 0, up: false, down: false, edges: 0 };\nconst lerpNum = (a, b, t) => a + (b - a) * t;\n","characters.js":"// 十位霓虹鬥士。\n//\n// 每位角色 = 一組數值 + 一副剪影 + 兩個專屬技能 + 一招必殺 + 一個被動。\n// 這裡只有「資料」，技能的實作在 skills.js（用 kind 對應過去），\n// 身體的畫法在 render.js（用 look 的零件名對應過去）。\n//\n// 平衡基準：血量 100、移速 300、跳躍 880、攻防倍率 1.0。\n// 十位角色都落在基準的 ±25% 之內，沒有純粹的上位相容。\n\nexport const ROSTER = [\n  {\n    id: 'volt',\n    name: '伏特', en: 'VOLT', title: '電光拳手',\n    color: '#5ad8ff', accent: '#fff27a',\n    tagline: '最快的拳，擦到就麻',\n    stats: { hp: 95, speed: 340, jump: 920, weight: 0.95, atk: 0.94, def: 1.06, dash: 1.15 },\n    build: { scale: 0.96, limb: 0.92, head: 1.0, torso: 0.96 },\n    look: { head: 'visor', back: 'coil', weapon: 'gauntlet', shoulder: 'slim', trail: true },\n    passive: { name: '超載', desc: '輕攻擊第三段必定麻痺，普攻節奏全場最快。' },\n    skills: [\n      {\n        name: '閃擊衝拳', desc: '化為電弧向前衝，命中麻痺並穿到對手身後。',\n        cd: 3.2, kind: 'dashStrike',\n        params: { dist: 300, dur: 0.2, dmg: 13, kbx: 260, kby: -180, stun: 0.35, pass: true },\n      },\n      {\n        name: '雷幕', desc: '在身邊炸開電網，把近身的對手彈開並麻痺。',\n        cd: 5.5, kind: 'burst',\n        params: { radius: 130, dmg: 11, kbx: 320, kby: -300, stun: 0.45 },\n      },\n    ],\n    ult: {\n      name: '十萬伏特', desc: '抓住對手連續電擊八下，最後一擊把人轟飛。',\n      kind: 'flurry', params: { hits: 8, dmg: 5, interval: 0.07, radius: 150, finishKb: 620, stun: 0.12 },\n    },\n  },\n  {\n    id: 'ember',\n    name: '燼火', en: 'EMBER', title: '烈焰劍士',\n    color: '#ff7a3c', accent: '#ffd23f',\n    tagline: '四平八穩的起手，越打越燙',\n    stats: { hp: 100, speed: 300, jump: 880, weight: 1.0, atk: 1.0, def: 1.0, dash: 1.0 },\n    build: { scale: 1.0, limb: 1.0, head: 1.0, torso: 1.0 },\n    look: { head: 'crown', back: 'cape', weapon: 'blade', shoulder: 'plate' },\n    passive: { name: '延燒', desc: '所有命中都附帶灼燒；對燃燒中的目標傷害 +15%。' },\n    skills: [\n      {\n        name: '炎斬波', desc: '揮出貼地飛行的火焰新月斬。',\n        cd: 2.6, kind: 'projectile',\n        params: { speed: 620, dmg: 12, kbx: 220, kby: -140, shape: 'crescent', life: 1.1, burn: 2.5 },\n      },\n      {\n        name: '昇龍焰', desc: '帶霸體的上昇斬，把對手高高打飛。',\n        cd: 5.0, kind: 'uppercut',\n        params: { rise: 760, dmg: 16, kbx: 140, kby: -620, armor: 0.35, burn: 3 },\n      },\n    ],\n    ult: {\n      name: '紅蓮亂舞', desc: '瞬間拉近後連斬六刀，最後一刀引爆火柱。',\n      kind: 'rushCombo', params: { hits: 6, dmg: 7, dash: 360, finishDmg: 18, burn: 4 },\n    },\n  },\n  {\n    id: 'azure',\n    name: '蒼瀧', en: 'AZURE', title: '長槍守衛',\n    color: '#4d8bff', accent: '#9df1ff',\n    tagline: '不讓你靠近的那根槍',\n    stats: { hp: 105, speed: 285, jump: 860, weight: 1.05, atk: 1.02, def: 0.95, dash: 0.95 },\n    build: { scale: 1.02, limb: 1.05, head: 0.98, torso: 1.02 },\n    look: { head: 'mask', back: 'banner', weapon: 'spear', shoulder: 'plate' },\n    passive: { name: '間合', desc: '普攻距離最長；對手距離越遠傷害越高（最多 +20%）。' },\n    skills: [\n      {\n        name: '水龍突', desc: '前衝長距離刺擊，貫穿途中的一切。',\n        cd: 3.4, kind: 'dashStrike',\n        params: { dist: 340, dur: 0.24, dmg: 15, kbx: 380, kby: -120, pass: true, slow: 1.2 },\n      },\n      {\n        name: '渦流盾', desc: '展開水渦：減傷 60%，並把貼近的對手推開。',\n        cd: 7.5, kind: 'ward',\n        params: { dur: 3.0, dr: 0.6, push: 340, radius: 120 },\n      },\n    ],\n    ult: {\n      name: '蒼海之槍', desc: '貫穿全場的巨大水柱，把路徑上的一切轟開。',\n      kind: 'beam', params: { dmg: 34, width: 96, dur: 0.6, kbx: 560, kby: -220 },\n    },\n  },\n  {\n    id: 'gale',\n    name: '疾翎', en: 'GALE', title: '風刃遊俠',\n    color: '#5bffa8', accent: '#d8ff6b',\n    tagline: '待在空中的時間比誰都長',\n    stats: { hp: 90, speed: 325, jump: 960, weight: 0.86, atk: 0.95, def: 1.08, dash: 1.1 },\n    build: { scale: 0.95, limb: 0.9, head: 1.02, torso: 0.94 },\n    look: { head: 'antenna', back: 'wings', weapon: 'claws', shoulder: 'slim', trail: true },\n    passive: { name: '輕身', desc: '可在空中再跳一次，下墜速度較慢。' },\n    skills: [\n      {\n        name: '迴旋風刃', desc: '擲出會飛回來的風輪，去程與回程都會打中。',\n        cd: 3.0, kind: 'boomerang',\n        params: { speed: 620, dmg: 10, range: 380, kbx: 180, kby: -120 },\n      },\n      {\n        name: '滯空踢', desc: '空中向斜下俯衝踢擊，落地激起衝擊波。',\n        cd: 4.2, kind: 'divekick',\n        params: { speed: 900, dmg: 14, kbx: 260, kby: -260, quake: 90 },\n      },\n    ],\n    ult: {\n      name: '暴風連斬', desc: '捲起龍捲風把對手吸住，連續割裂十下。',\n      kind: 'vortex', params: { dur: 1.4, dmg: 4, interval: 0.12, radius: 190, pull: 420 },\n    },\n  },\n  {\n    id: 'frost',\n    name: '霜稜', en: 'FROST', title: '冰結術士',\n    color: '#9be8ff', accent: '#ffffff',\n    tagline: '先凍住，再慢慢處理',\n    stats: { hp: 96, speed: 280, jump: 860, weight: 1.0, atk: 1.0, def: 0.98, dash: 0.95 },\n    build: { scale: 1.0, limb: 0.96, head: 1.04, torso: 1.0 },\n    look: { head: 'prism', back: 'drone', weapon: 'staff', shoulder: 'slim', aura: true },\n    passive: { name: '凍甲', desc: '被打中時反噬寒氣，攻擊者移速降為 70%。' },\n    skills: [\n      {\n        name: '冰棘地', desc: '地面竄出一排冰刺，命中者被凍住。',\n        cd: 4.0, kind: 'spikes',\n        params: { count: 5, step: 86, : '射出會追蹤的星核，命中爆散。',\n        cd: 3.2, kind: 'projectile',\n        params: { speed: 420, dmg: 14, kbx: 240, kby: -200, shape: 'star', life: 2.4, homing: 2.6, boom: 90 },\n      },\n      {\n        name: '重力塌縮', desc: '製造引力井把對手吸過來並上浮。',\n        cd: 5.6, kind: 'gravity',\n        params: { radius: 300, dur: 0.9, pull: 560, dmg: 8, lift: -200 },\n      },\n    ],\n    ult: {\n      name: '超新星', desc: '在前方壓縮出一顆星，然後讓它炸開。',\n      kind: 'supernova', params: { charge: 0.55, radius: 320, dmg: 40, kbx: 640, kby: -520 },\n    },\n  },\n  {\n    id: 'shade',\n    name: '夜刃', en: 'SHADE', title: '影狩刺客',\n    color: '#ff5ec4', accent: '#7ef1ff',\n    tagline: '閃掉一拳，從背後回敬',\n    stats: { hp: 93, speed: 320, jump: 900, weight: 0.94, atk: 1.05, def: 1.04, dash: 1.2 },\n    build: { scale: 0.97, limb: 0.94, head: 1.0, torso: 0.97 },\n    look: { head: 'oni', back: 'blades', weapon: 'twin', shoulder: 'slim', trail: true },\n    passive: { name: '殘影', desc: '15% 機率完全閃避；閃過之後 1 秒內移速大增。' },\n    skills: [\n      {\n        name: '影步斬', desc: '瞬移到對手背後斬擊，背刺傷害 +30%。',\n        cd: 3.6, kind: 'blink',\n        params: { dmg: 15, kbx: 300, kby: -220, backstab: 1.3, offset: 66 },\n      },\n      {\n        name: '虛影誘餌', desc: '留下一個假影子：對手的 AI 會被它騙走。',\n        cd: 6.5, kind: 'decoy',\n        params: { dur: 3.5, dr: 0.35 },\n      },\n    ],\n    ult: {\n      name: '千影亂舞', desc: '化為無數殘影往返斬擊，最後一刀收尾。',\n      kind: 'flurry', params: { hits: 10, dmg: 4.5, interval: 0.06, radius: 170, finishKb: 560, teleport: true },\n    },\n  },\n];\n\nexport const BY_ID = Object.fromEntries(ROSTER.map((c) => [c.id, c]));\nexport const IDS = ROSTER.map((c) => c.id);\n\nexport const getChar = (id) => BY_ID[id] || ROSTER[0];\nexport const randomId = () => IDS[Math.floor(Math.random() * IDS.length)];\n\n/** 選角畫面的數值條：回傳 0~1。防禦倍率越低越耐打，所以要反過來。 */\nconst RANGE = {\n  hp: [88, 128], speed: [240, 350], jump: [780, 970],\n  atk: [0.9, 1.25], def: [0.78, 1.14],\n};\nexport function statRatio(char, key) {\n  const [lo, hi] = RANGE[key];\n  const v = char.stats[key];\n  const r = Math.max(0, Math.min(1, (v - lo) / (hi - lo)));\n  return key === 'def' ? 1 - r : r;\n}\n","combat.js":"// 基礎攻擊的招式表（時間制，單位是秒）。\n//\n// 每一招都是「起手 → 判定 → 收招」三段：hit 是判定視窗，reach 是判定框\n// （相對角色，x 會乘上面向）。輕攻擊三段可以接續，最後一段打得最遠。\n//\n// 武器決定攻擊距離與手感：長槍戳得遠、重錘慢而重、爪子快而短。\n\nexport const BASIC = {\n  light1: {\n    pose: 'light1', dur: 0.30, hit: [0.09, 0.15], dmg: 5.5, hitstun: 0.20,\n    kb: [170, -40], reach: [40, -60, 58, 42], next: 'light2', step: 70, meter: 5,\n  },\n  light2: {\n    pose: 'light2', dur: 0.32, hit: [0.10, 0.16], dmg: 6, hitstun: 0.22,\n    kb: [200, -60], reach: [44, -58, 62, 44], next: 'light3', step: 80, meter: 5,\n  },\n  light3: {\n    pose: 'light3', dur: 0.46, hit: [0.14, 0.24], dmg: 10, hitstun: 0.34,\n    kb: [420, -300], reach: [50, -52, 76, 58], next: null, step: 120, meter: 8,\n  },\n  heavy: {\n    pose: 'heavy', dur: 0.62, hit: [0.30, 0.40], dmg: 15, hitstun: 0.42,\n    kb: [520, -340], reach: [54, -56, 92, 70], next: null, step: 150,\n    armorFrom: 0.22, meter: 10, heavy: true,\n  },\n  airLight: {\n    pose: 'light3', dur: 0.36, hit: [0.08, 0.20], dmg: 7, hitstun: 0.24,\n    kb: [240, -180], reach: [42, -46, 70, 60], next: null, step: 0, meter: 5, air: true,\n  },\n  airHeavy: {\n    pose: 'dive', dur: 0.5, hit: [0.10, 0.34], dmg: 12, hitstun: 0.3,\n    kb: [280, -120], reach: [34, -30, 72, 76], next: null, step: 0, meter: 8, air: true,\n  },\n};\n\n/** 武器的攻擊距離倍率 —— 剪影看起來打得到，判定就要真的打得到 */\nexport const WEAPON_REACH = {\n  gauntlet: 0.88, claws: 0.9, twin: 1.0, blade: 1.12, staff: 1.06,\n  orbstaff: 1.04, hammer: 1.16, spear: 1.38, shield: 0.95,\n};\n\nexport const MAX_METER = 100;\n\n/** 受擊者被打飛的距離會被體重吃掉一部分 */\nexport function knockbackScale(fighter) {\n  return 1 / (fighter.char.stats.weight || 1);\n}\n","fighter.js":"// 戰鬥單位。\n//\n// 一位 Fighter 不在乎操作是誰給的 —— 鍵盤、AI、還是網路對手，\n// 通通只是每幀丟進來的一個 InputFrame，所以單機、雙人同機、連線走的是同一條路。\n//\n// 傷害的結算集中在兩個函式：\n//   dealDamage()    我方打出去（攻擊倍率、角色被動的加成都在這）\n//   receiveHit()    對方打進來（閃避、格擋、減傷、擊退、狀態異常都在這）\n// 招式與普攻都呼叫這兩支，所以之後加新招不必重寫任何結算邏輯。\n\nimport { BASIC, WEAPON_REACH, MAX_METER, knockbackScale } from './combat.js';\nimport { getChar } from './characters.js';\nimport { BTN } from './input.js';\nimport { WORLD } from './render.js';\nimport { clamp, sign, rect, overlaps, rand, approach } from './util.js';\nimport { runSkill } from './skills.js';\n\nconst GRAVITY = 2400;\nconst MAX_FALL = 1500;\nexport const BODY = { w: 44, h: 104 };\n\nlet nextId = 1;\n\nexport class Fighter {\n  constructor(charId, side) {\n    this.id = nextId++;\n    this.char = getChar(charId);\n    this.side = side;                  // 0 = 左邊那位，1 = 右邊那位\n    this.team = side;\n    this.battle = null;\n\n    const s = this.char.stats;\n    this.maxHp = s.hp;\n    this.hp = s.hp;\n    this.meter = 0;\n\n    this.x = side === 0 ? WORLD.w * 0.34 : WORLD.w * 0.66;\n    this.y = WORLD.ground;\n    this.vx = 0;\n    this.vy = 0;\n    this.facing = side === 0 ? 1 : -1;\n    this.onGround = true;\n\n    this.pose = 'idle';\n    this.poseK = 0;\n    this.phase = 0;\n    this.animTime = 0;\n    this.hitFlash = 0;\n\n    this.attack = null;                // { def, t, hits:Set, key }\n    this.comboKey = null;              // 可以接的下一段\n    this.comboWindow = 0;\n    this.lock = 0;                     // 不能操作的時間（施法、衝刺）\n    this.poseLock = null;              // { pose, t, dur }\n    this.hitstun = 0;\n    this.hitstunMax = 0.2;\n\n    this.invuln = 0;\n    this.armor = 0;                    // 霸體\n    this.dr = 0;                       // 減傷 0~1\n    this.drTime = 0;\n    this.guarding = false;\n\n    this.burn = 0; this.burnDps = 0;\n    this.freeze = 0;\n    this.shockTime = 0;\n    this.slow = 0; this.slowMul = 1;\n    this.poison = 0; this.poisonTime = 0;\n    this.haste = 0;\n\n    this.cds = [0, 0];\n    this.dashCd = 0;\n    this.airJumps = 0;\n    this.airJumpsMax = this.char.passive.name === '輕身' ? 1 : 0;\n    this.airDashes = 1;\n    this.dead = false;\n    this.trailT = 0;\n    this.carry = null;                 // 盾衝把人壓著跑\n    this.lastHitBy = null;\n    this.comboCount = 0;\n    this.comboTimer = 0;\n    this.wins = 0;\n    this.name = this.char.name;\n    this.dmgDealt = 0;\n    this.maxCombo = 0;\n    this.netX = this.x;\n    this.netY = this.y;\n  }\n\n  // ---------------------------------------------------------------- 查詢\n  get speed() {\n    return this.char.stats.speed * this.slowMul * (this.haste > 0 ? 1.4 : 1);\n  }\n\n  bodyRect() {\n    return rect(this.x - BODY.w / 2, this.y - BODY.h, BODY.w, BODY.h);\n  }\n\n  center() {\n    return { x: this.x, y: this.y - BODY.h * 0.55 };\n  }\n\n  get foe() {\n    return this.battle ? this.battle.opponentOf(this) : null;\n  }\n\n  reachMul() {\n    return (WEAPON_REACH[this.char.look.weapon] || 1) * (this.char.build.scale || 1);\n  }\n\n  atkMul() {\n    return this.char.stats.atk;\n  }\n\n  defMul() {\n    return this.char.stats.def;\n  }\n\n  canAct() {\n    return !this.dead && this.hitstun <= 0 && this.freeze <= 0 && this.shockTime <= 0\n      && this.lock <= 0 && !this.attack;\n  }\n\n  // ---------------------------------------------------------------- 每幀\n  update(dt, input) {\n    this.animTime += dt;\n    this.tickTimers(dt);\n    if (this.dead) {\n      this.physics(dt);\n      this.pose = 'ko';\n      this.poseK = 1;\n      return;\n    }\n    this.tickDots(dt);\n\n    const stunned = this.hitstun > 0 || this.freeze > 0 || this.shockTime > 0;\n    if (stunned) {\n      this.attack = null;\n      this.guarding = false;\n      this.lock = 0;\n    }\n\n    if (this.attack) this.updateAttack(dt);\n    else if (!stunned && this.lock <= 0) this.handleInput(input, dt);\n    else this.guarding = false;\n\n    this.physics(dt);\n    this.updatePose(dt);\n    this.updateTrail(dt);\n  }\n\n  tickTimers(dt) {\n    const dec = (v) => Math.max(0, v - dt);\n    this.lock = dec(this.lock);\n    this.hitstun = dec(this.hitstun);\n    this.invuln = dec(this.invuln);\n    this.armor = dec(this.armor);\n    this.freeze = dec(this.freeze);\n    this.shockTime = dec(this.shockTime);\n    this.haste = dec(this.haste);\n    this.dashCd = dec(this.dashCd);\n    this.comboWindow = dec(this.comboWindow);\n    this.hitFlash = Math.max(0, this.hitFlash - dt * 4);\n    this.drTime = dec(this.drTime);\n    if (this.drTime <= 0) this.dr = 0;\n    this.slow = dec(this.slow);\n    if (this.slow <= 0) this.slowMul = 1;\n    this.cds[0] = dec(this.cds[0]);\n    this.cds[1] = dec(this.cds[1]);\n    this.comboTimer = dec(this.comboTimer);\n    if (this.comboTimer <= 0) this.comboCount = 0;\n    if (this.comboWindow <= 0) this.comboKey = null;\n    if (this.poseLock) {\n      this.poseLock.t += dt;\n      if (this.poseLock.t >= this.poseLock.dur) this.poseLock = null;\n    }\n  }\n\n  tickDots(dt) {\n    if (this.burn > 0) {\n      this.burn -= dt;\n      this.damageOverTime(this.burnDps * dt, '#ff7a3c');\n    }\n    if (this.poison > 0) {\n      this.poisonTime -= dt;\n      this.damageOverTime(this.poison * 1.6 * dt, '#b46bff');\n      if (this.poisonTime <= 0) this.poison = 0;\n    }\n  }\n\n  damageOverTime(amount, color) {\n    if (this.dead || amount <= 0) return;\n    this.hp -= amount;\n    if (Math.random() < 0.08 && this.battle) {\n      this.battle.fx.particle({\n        x: this.x + rand(-16, 16), y: this.y - rand(20, 80),\n        vx: rand(-20, 20), vy: -rand(40, 90), g: -60, life: 0.5,\n        size: 3, color, shape: 'hex',\n      });\n    }\n    if (this.hp <= 0) this.die();\n  }\n\n  // ---------------------------------------------------------------- 操作\n  handleInput(input, dt) {\n    const foe = this.foe;\n    // 自動面向對手（格鬥遊戲的標準行為），衝刺與出招期間不轉身\n    if (foe && !this.dead) {\n      const want = foe.x >= this.x ? 1 : -1;\n      if (this.onGround || Math.abs(this.vx) < 40) this.facing = want;\n    }\n\n    // 往後推＝格擋（不佔一顆按鍵，街機的老規矩）\n    const back = -this.facing;\n    this.guarding = this.onGround && input.x !== 0 && sign(input.x) === back;\n\n    const accel = this.onGround ? 2600 : 1500;\n    if (input.x !== 0 && !this.guarding) {\n      this.vx = approach(this.vx, input.x * this.speed, accel * dt);\n    } else {\n      const fr = this.onGround ? (this.guarding ? 4200 : 2800) : 700;\n      this.vx = approach(this.vx, 0, fr * dt);\n    }\n\n    if (input.edges & BTN.JUMP) this.tryJump();\n    if (input.edges & BTN.DASH) this.tryDash(input);\n    if (input.edges & BTN.LIGHT) this.tryLight();\n    if (input.edges & BTN.HEAVY) this.tryHeavy();\n    if (input.edges & BTN.S1) this.trySkill(0);\n    if (input.edges & BTN.S2) this.trySkill(1);\n    if (input.edges & BTN.ULT) this.tryUlt();\n\n    // 空中按住下 = 快速落地\n    if (!this.onGround && input.down && this.vy > -50) this.vy += 2600 * dt;\n  }\n\n  tryJump() {\n    if (this.onGround) {\n      this.vy = -this.char.stats.jump;\n      this.onGround = false;\n      this.airJumps = this.airJumpsMax;\n      this.airDashes = 1;\n      this.battle?.fx.dust(this.x, this.y, 0, 7, this.char.color);\n      this.battle?.audio.play('jump');\n    } else if (this.airJumps > 0) {\n      this.airJumps--;\n      this.vy = -this.char.stats.jump * 0.92;\n      this.battle?.fx.ring(this.x, this.y - 10, this.char.accent, { r0: 8, r1: 54, life: 0.3, width: 3, squash: 0.4 });\n      this.battle?.audio.play('jump');\n    }\n  }\n\n  tryDash(input) {\n    if (this.dashCd > 0) return;\n    if (!this.onGround && this.airDashes <= 0) return;\n    if (!this.onGround) this.airDashes--;\n    const dir = input.x !== 0 ? sign(input.x) : this.facing;\n    const power = 720 * (this.char.stats.dash || 1);\n    this.vx = dir * power;\n    if (!this.onGround) this.vy = Math.min(this.vy, -60);\n    this.dashCd = 0.62;\n    this.lock = 0.16;\n    this.invuln = Math.max(this.invuln, 0.14);\n    this.setPose('dash', 0.22);\n    this.battle?.fx.dust(this.x - dir * 12, this.y, -dir, 8, this.char.color);\n    this.battle?.audio.play('dash');\n  }\n\n  tryLight() {\n    const key = this.comboWindow > 0 && this.comboKey ? this.comboKey\n      : (this.onGround ? 'light1' : 'airLight');\n    this.startAttack(key);\n  }\n\n  tryHeavy() {\n    this.startAttack(this.onGround ? 'heavy' : 'airHeavy');\n  }\n\n  trySkill(slot) {\n    const skill = this.char.skills[slot];\n    if (!skill || this.cds[slot] > 0) return;\n    this.cds[slot] = skill.cd;\n    runSkill(skill.kind, this, skill.params || {}, { slot, skill });\n    this.battle?.onSkill?.(this, skill.kind, skill.params || {});\n    this.battle?.audio.play('skill');\n  }\n\n  tryUlt() {\n    if (this.meter < MAX_METER) return;\n    this.meter = 0;\n    const ult = this.char.ult;\n    this.battle?.onUlt(this);\n    const params = { ...(ult.params || {}), ult: true };\n    runSkill(ult.kind, this, params, { ult: true, skill: ult });\n    this.battle?.onSkill?.(this, ult.kind, params);\n    this.battle?.audio.play('ult');\n  }\n\n  // ---------------------------------------------------------------- 普攻\n  startAttack(key) {\n    const def = BASIC[key];\n    if (!def) return;\n    if (def.air && this.onGround) return;\n    if (!def.air && !this.onGround) return;\n    this.attack = { def, key, t: 0, hits: new Set() };\n    this.guarding = false;\n    this.comboKey = null;\n    this.comboWindow = 0;\n    // 伏特的被動：出招速度更快\n    if (this.char.passive.name === '超載') this.attack.rate = 1.18;\n    if (def.step && this.onGround) this.vx = this.facing * def.step;\n    this.battle?.audio.play('swing');\n  }\n\n  updateAttack(dt) {\n    const a = this.attack;\n    const rate = a.rate || 1;\n    a.t += dt * rate;\n    const def = a.def;\n    const k = a.t / def.dur;\n\n    if (def.armorFrom && a.t >= def.armorFrom) this.armor = Math.max(this.armor, 0.08);\n\n    if (a.t >= def.hit[0] && a.t <= def.hit[1]) {\n      const r = this.attackRect(def);\n      const foe = this.foe;\n      if (foe && !a.hits.has(foe.id) && overlaps(r, foe.bodyRect())) {\n        a.hits.add(foe.id);\n        const landed = this.dealDamage(foe, {\n          dmg: def.dmg,\n          kbx: def.kb[0], kby: def.kb[1],\n          hitstun: def.hitstun,\n          heavy: def.heavy,\n          shock: this.char.passive.name === '超載' && a.key === 'light3' ? 0.45 : 0,\n        });\n        if (landed) {\n          this.meter = Math.min(MAX_METER, this.meter + (def.meter || 4));\n          this.onAttackLanded(def, r);\n        }\n      }\n    }\n\n    if (a.t >= def.dur) {\n      if (def.next) {\n        this.comboKey = def.next;\n        this.comboWindow = 0.28;\n      }\n      this.attack = null;\n    }\n  }\n\n  attackRect(def) {\n    const m = this.reachMul();\n    const [ox, oy, w, h] = def.reach;\n    const cx = this.x + this.facing * ox * m;\n    const cy = this.y + oy;\n    return rect(cx - (w * m) / 2, cy - h / 2, w * m, h);\n  }\n\n  /** 命中的演出：刀光、火花、頓幀，武器不同刀光也不同 */\n  onAttackLanded(def, r) {\n    const fx = this.battle.fx;\n    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;\n    const face = this.facing;\n    const big = !!def.heavy;\n    fx.slash(this.x + face * 44, this.y - 58, this.char.accent, {\n      r: big ? 96 : 68, width: big ? 22 : 14,\n      a0: face > 0 ? -1.25 : Math.PI + 1.25,\n      a1: face > 0 ? 1.15 : Math.PI - 1.15,\n      life: 0.2,\n    });\n    fx.spark(cx, cy, this.char.color, big ? 1.6 : 1);\n    fx.stop(big ? 0.09 : 0.045);\n    fx.quake(big ? 10 : 4.5, 0.2);\n    this.battle.audio.play(big ? 'hitHeavy' : 'hit');\n  }\n\n  // ---------------------------------------------------------------- 傷害\n  /** 我方造成傷害（所有招式的唯一入口） */\n  dealDamage(target, o) {\n    if (!target || target.dead || this.dead) return false;\n    // 連線的客戶端只負責重播特效，傷害一律由主機算\n    if (this.battle && this.battle.authoritative === false) return false;\n    let dmg = (o.dmg || 0) * this.atkMul();\n\n    // 角色被動的加成\n    const p = this.char.passive.name;\n    if (p === '延燒' && target.burn > 0) dmg *= 1.15;\n    if (p === '毒素共鳴' && target.poison > 0) dmg *= 1.25;\n    if (p === '間合') {\n      const d = Math.abs(target.x - this.x);\n      dmg *= 1 + clamp(d / 520, 0, 1) * 0.2;\n    }\n\n    const hit = { ...o, dmg };\n    if (p === '延燒' && !hit.burn) hit.burn = 1.6;\n\n    const landed = target.receiveHit(this, hit);\n    if (landed) {\n      this.meter = Math.min(MAX_METER, this.meter + dmg * 0.9);\n      this.dmgDealt += dmg;\n      this.comboCount++;\n      this.maxCombo = Math.max(this.maxCombo, this.comboCount);\n      this.comboTimer = 1.2;\n      this.battle?.onCombo(this);\n    }\n    return landed;\n  }\n\n  /** 對方打進來 */\n  receiveHit(from, hit) {\n    if (this.dead) return false;\n    if (this.invuln > 0) return false;\n    const fx = this.battle?.fx;\n\n    // 夜刃的殘影：機率完全閃掉\n    if (this.char.passive.name === '殘影' && Math.random() < 0.15) {\n      this.haste = 1.0;\n      this.invuln = Math.max(this.invuln, 0.12);\n      fx?.floatText(this.x, this.y - 118, '閃避', this.char.color, 20);\n      fx?.afterimage((c, col) => this.paint(c, col), this.char.color, 0.3);\n      this.battle?.audio.play('dodge');\n      return false;\n    }\n\n    let dmg = hit.dmg * this.defMul();\n    if (this.dr > 0) dmg *= 1 - clamp(this.dr, 0, 0.9);\n\n    // 格擋：面向攻擊者且正在後退 → 大幅減傷，不吃硬直\n    const fromFront = sign(from.x - this.x) === this.facing || from.x === this.x;\n    const blocked = this.guarding && fromFront && !hit.unblockable;\n    if (blocked) dmg *= 0.28;\n\n    this.hp -= dmg;\n    this.hitFlash = 1;\n    this.lastHitBy = from;\n\n    // 狀態異常（DoT 類即使霸體或格擋也會附著）\n    if (hit.burn) { this.burn = Math.max(this.burn, hit.burn); this.burnDps = Math.max(this.burnDps, 4.5); }\n    if (hit.poison) { this.poison = Math.min(10, this.poison + hit.poison); this.poisonTime = 5; }\n    if (hit.slow) { this.slow = Math.max(this.slow, hit.slow); this.slowMul = Math.min(this.slowMul, hit.slowMul || 0.7); }\n\n    const armored = this.armor > 0 && !hit.ignoreArmor;\n    if (!armored && !blocked) {\n      if (hit.freeze) { this.freeze = Math.max(this.freeze, hit.freeze); this.attack = null; }\n      if (hit.shock) this.shockTime = Math.max(this.shockTime, hit.shock);\n      const kbs = knockbackScale(this) * (this.char.passive.name === '鋼體' ? 0.6 : 1);\n      const dirX = hit.kbDir !== undefined ? hit.kbDir : sign(this.x - from.x) || from.facing;\n      this.vx = (hit.kbx || 0) * kbs * dirX;\n      this.vy = (hit.kby || 0) * kbs;\n      if (this.vy < 0) this.onGround = false;\n      this.hitstun = Math.max(this.hitstun, hit.hitstun || 0.22);\n      this.hitstunMax = Math.max(0.05, this.hitstun);\n      this.attack = null;\n      this.lock = 0;\n    } else if (blocked) {\n      this.vx = sign(this.x - from.x) * 180;\n      this.meter = Math.min(MAX_METER, this.meter + dmg * 0.6);\n      fx?.floatText(this.x, this.y - 118, '格擋', '#9fb4ff', 18);\n      fx?.ring(this.x + this.facing * 26, this.y - 56, '#9fb4ff', { r0: 10, r1: 46, life: 0.22, width: 3 });\n      this.battle?.audio.play('block');\n    }\n\n    this.meter = Math.min(MAX_METER, this.meter + dmg * 0.7);\n    fx?.damageNumber(this.x, this.y - 118, dmg, blocked ? '#9fb4ff' : (hit.big ? '#fff27a' : '#ffffff'), !!hit.big);\n\n    // 反制型被動\n    this.counterPassives(from, dmg);\n\n    if (this.hp <= 0) this.die();\n    return true;\n  }\n\n  counterPassives(from, dmg) {\n    if (!from || from === this || from.dead) return;\n    const p = this.char.passive.name;\n    if (p === '凍甲') {\n      from.slow = Math.max(from.slow, 1.4);\n      from.slowMul = Math.min(from.slowMul, 0.7);\n      this.battle?.fx.ring(from.x, from.y - 50, '#9be8ff', { r0: 10, r1: 60, life: 0.3, width: 2 });\n    }\n    if (p === '熔岩之軀' && Math.abs(from.x - this.x) < 150) {\n      from.burn = Math.max(from.burn, 2);\n      from.burnDps = Math.max(from.burnDps, 4.5);\n    }\n  }\n\n  heal(v) {\n    this.hp = Math.min(this.maxHp, this.hp + v);\n  }\n\n  die() {\n    if (this.dead) return;\n    this.dead = true;\n    this.hp = 0;\n    this.attack = null;\n    this.vy = -320;\n    this.vx = -this.facing * 220;\n    const fx = this.battle?.fx;\n    if (fx) {\n      fx.burst(this.x, this.y - 60, this.char.color, { count: 30, speed: 460, size: 5, life: 0.8, shape: 'hex' });\n      fx.ring(this.x, this.y - 60, this.char.color, { r0: 20, r1: 260, life: 0.6, width: 6 });\n      fx.flashScreen(0.5, '#ffffff');\n      fx.quake(18, 0.5);\n    }\n    this.battle?.onKO(this);\n  }\n\n  // ---------------------------------------------------------------- 物理\n  physics(dt) {\n    const gmul = this.char.passive.name === '輕身' ? 0.86 : (this.char.stats.weight > 1.1 ? 1.08 : 1);\n    if (!this.onGround) {\n      this.vy = Math.min(this.vy + GRAVITY * gmul * dt, MAX_FALL);\n    }\n    if (this.freeze > 0) this.vx = approach(this.vx, 0, 2000 * dt);\n\n    const prevY = this.y;\n    this.x += this.vx * dt;\n    this.y += this.vy * dt;\n\n    // 牆\n    const half = BODY.w / 2;\n    if (this.x < WORLD.left + half) { this.x = WORLD.left + half; this.vx = Math.max(0, this.vx); }\n    if (this.x > WORLD.right - half) { this.x = WORLD.right - half; this.vx = Math.min(0, this.vx); }\n\n    // 地板\n    let landed = false;\n    if (this.y >= WORLD.ground) {\n      this.y = WORLD.ground;\n      landed = true;\n    } else if (this.vy > 0 && this.battle) {\n      // 單向平台：只有從上面掉下來才會踩到\n      for (const p of this.battle.platforms) {\n        if (this.x < p.x - 6 || this.x > p.x + p.w + 6) continue;\n        if (prevY <= p.y + 2 && this.y >= p.y) {\n          this.y = p.y;\n          landed = true;\n          break;\n        }\n      }\n    }\n\n    if (landed) {\n      if (!this.onGround) this.onLand();\n      this.onGround = true;\n      this.vy = 0;\n      this.airJumps = this.airJumpsMax;\n      this.airDashes = 1;\n    } else if (this.y < WORLD.ground) {\n      this.onGround = false;\n    }\n  }\n\n  onLand() {\n    const heavy = this.vy > 700;\n    this.battle?.fx.dust(this.x, this.y, 0, heavy ? 12 : 6, this.char.color);\n    if (heavy) {\n      this.battle?.fx.ring(this.x, this.y, this.char.color, { r0: 10, r1: 70, life: 0.26, width: 3, squash: 0.35 });\n      this.battle?.audio.play('land');\n    }\n    if (!this.attack && !this.dead && this.hitstun <= 0) this.setPose('land', 0.12);\n  }\n\n  // ---------------------------------------------------------------- 表現\n  setPose(pose, dur) {\n    this.poseLock = { pose, t: 0, dur };\n  }\n\n  updatePose(dt) {\n    if (this.attack) {\n      this.pose = this.attack.def.pose;\n      this.poseK = clamp(this.attack.t / this.attack.def.dur, 0, 1);\n      return;\n    }\n    if (this.poseLock) {\n      this.pose = this.poseLock.pose;\n      this.poseK = clamp(this.poseLock.t / this.poseLock.dur, 0, 1);\n      return;\n    }\n    if (this.freeze > 0 || this.shockTime > 0 || this.hitstun > 0) {\n      this.pose = 'hurt';\n      this.poseK = 1 - clamp(this.hitstun / this.hitstunMax, 0, 1);\n      return;\n    }\n    if (this.guarding) { this.pose = 'guard'; this.poseK = 0; return; }\n    if (!this.onGround) {\n      this.pose = this.vy < 0 ? 'jump' : 'fall';\n      this.poseK = 0;\n      return;\n    }\n    if (Math.abs(this.vx) > 26) {\n      this.pose = 'run';\n      this.phase += dt * (6 + Math.abs(this.vx) * 0.026);\n    } else {\n      this.pose = 'idle';\n      this.phase += dt * 2.4;\n    }\n    this.poseK = 0;\n  }\n\n  updateTrail(dt) {\n    if (!this.char.look.trail || !this.battle) return;\n    if (Math.abs(this.vx) < 320 && Math.abs(this.vy) < 420) return;\n    this.trailT += dt;\n    if (this.trailT < 0.045) return;\n    this.trailT = 0;\n    this.battle.fx.afterimage((c, col) => this.paint(c, col), this.char.color, 0.22);\n  }\n\n  /** 把自己畫成單色剪影（殘影、虛影、瞬移用） */\n  paint(ctx, color) {\n    const snap = {\n      char: this.char, x: this.x, y: this.y, facing: this.facing,\n      pose: this.pose, poseK: this.poseK, phase: this.phase, animTime: this.animTime,\n    };\n    this.battle.paintFighter(ctx, snap, color);\n  }\n\n  /** 連線快照：只帶「畫得出來、判得了勝負」的最小集合 */\n  snapshot() {\n    return [\n      Math.round(this.x), Math.round(this.y), this.facing,\n      Math.round(this.hp * 10) / 10, Math.round(this.meter),\n      this.poseIndex(), Math.round(this.poseK * 100) / 100,\n      Math.round(this.phase * 100) / 100,\n      this.burn > 0 ? 1 : 0, this.freeze > 0 ? 1 : 0,\n      this.poison, this.dr > 0 ? 1 : 0, this.dead ? 1 : 0,\n      Math.round(this.hitFlash * 100) / 100,\n    ];\n  }\n\n  /** 連線客戶端：不跑物理，只把自己補間到主機給的位置並繼續播動畫 */\n  updateRemote(dt) {\n    this.animTime += dt;\n    this.hitFlash = Math.max(0, this.hitFlash - dt * 4);\n    const k = Math.min(1, dt * 18);\n    this.x += (this.netX - this.x) * k;\n    this.y += (this.netY - this.y) * k;\n    if (this.pose === 'run') this.phase += dt * 9;\n    else if (this.pose === 'idle') this.phase += dt * 2.4;\n  }\n\n  applySnapshot(s) {\n    const first = this.netX === undefined;\n    this.netX = s[0]; this.netY = s[1];\n    if (first || Math.hypot(this.netX - this.x, this.netY - this.y) > 260) {\n      this.x = this.netX; this.y = this.netY;\n    }\n    this.facing = s[2];\n    this.hp = s[3]; this.meter = s[4];\n    this.pose = POSE_LIST[s[5]] || 'idle';\n    this.poseK = s[6]; this.phase = s[7];\n    this.burn = s[8] ? 1 : 0; this.freeze = s[9] ? 1 : 0;\n    this.poison = s[10]; this.dr = s[11] ? 0.5 : 0;\n    this.drTime = s[11] ? 1 : 0;\n    this.hitFlash = s[13];\n    if (s[12] && !this.dead) { this.dead = true; this.hp = 0; }\n  }\n\n  poseIndex() {\n    const i = POSE_LIST.indexOf(this.pose);\n    return i < 0 ? 0 : i;\n  }\n}\n\nexport const POSE_LIST = [\n  'idle', 'run', 'jump', 'fall', 'land', 'crouch', 'guard', 'dash',\n  'light1', 'light2', 'light3', 'heavy', 'cast', 'uppercut', 'dive', 'ult', 'hurt', 'ko',\n];\n","fx.js":"// 特效系統：粒子、幾何特效、傷害數字，以及頓幀／震屏／白閃。\n//\n// 兩種東西：\n//   1. 粒子（大量、規格一致）—— 存在扁平陣列裡，一次畫完。\n//   2. 特效（少量、每個長得都不一樣）—— 用 closure 帶自己的 draw()，\n//      這樣招式檔案就能把「它該長什麼樣」寫在招式旁邊，而不是散落在繪圖層。\n\nimport { TAU, circlePath, ngonPath, crescentPath, glowFill, neonStroke, polyPath, text } from './gfx.js';\nimport { rand, randInt, clamp, withAlpha, easeOut } from './util.js';\n\nexport class Fx {\n  constructor() {\n    this.parts = [];\n    this.effects = [];\n    this.texts = [];\n    this.shake = 0;\n    this.shakeDur = 0.001;\n    this.shakeT = 0;\n    this.flash = 0;\n    this.flashColor = '#ffffff';\n    this.hitstop = 0;\n    this.time = 0;\n  }\n\n  clear() {\n    this.parts.length = 0;\n    this.effects.length = 0;\n    this.texts.length = 0;\n    this.shakeT = 0;\n    this.flash = 0;\n    this.hitstop = 0;\n  }\n\n  // ---------------------------------------------------------------- 畫面級\n  quake(amount, dur = 0.24) {\n    // 已經在震、而且震得比較大時不要被小震蓋掉\n    const cur = this.shake * (this.shakeT / this.shakeDur);\n    if (amount < cur) return;\n    this.shake = amount;\n    this.shakeDur = Math.max(0.001, dur);\n    this.shakeT = this.shakeDur;\n  }\n\n  /** 命中瞬間把世界凍住幾格 —— 格鬥遊戲打擊感的一半來自這個 */\n  stop(sec) {\n    this.hitstop = Math.max(this.hitstop, sec);\n  }\n\n  flashScreen(alpha = 0.4, color = '#ffffff') {\n    this.flash = Math.max(this.flash, alpha);\n    this.flashColor = color;\n  }\n\n  shakeOffset() {\n    if (this.shakeT <= 0) return { x: 0, y: 0 };\n    const k = this.shakeT / this.shakeDur;\n    const a = this.shake * k * k;\n    return { x: rand(-a, a), y: rand(-a, a) };\n  }\n\n  // ---------------------------------------------------------------- 粒子\n  particle(o) {\n    if (this.parts.length > 900) this.parts.shift();\n    this.parts.push({\n      x: o.x, y: o.y, vx: o.vx || 0, vy: o.vy || 0,\n      g: o.g === undefined ? 900 : o.g,\n      drag: o.drag === undefined ? 0.94 : o.drag,\n      life: o.life || 0.5, t: 0,\n      size: o.size || 3, color: o.color || '#ffffff',\n      shape: o.shape || 'dot', rot: o.rot || 0, spin: o.spin || 0,\n      layer: o.layer || 'front',\n    });\n  }\n\n  burst(x, y, color, opts = {}) {\n    const {\n      count = 14, speed = 320, spread = TAU, dir = 0, size = 3.5,\n      life = 0.45, g = 900, shape = 'dot', layer = 'front', drag = 0.92,\n    } = opts;\n    for (let i = 0; i < count; i++) {\n      const a = dir + (Math.random() - 0.5) * spread;\n      const s = speed * rand(0.35, 1);\n      this.particle({\n        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g, drag,\n        life: life * rand(0.7, 1.3), size: size * rand(0.6, 1.4),\n        color, shape, spin: rand(-8, 8), layer,\n      });\n    }\n  }\n\n  /** 命中火花：白芯 + 角色色碎片 */\n  spark(x, y, color, power = 1) {\n    this.burst(x, y, '#ffffff', { count: 5 + (power * 4) | 0, speed: 380 * power, size: 3, life: 0.22, g: 200 });\n    this.burst(x, y, color, { count: 8 + (power * 6) | 0, speed: 300 * power, size: 4, life: 0.45, shape: 'hex' });\n    this.effect({\n      life: 0.22, layer: 'front',\n      draw: (ctx, k) => {\n        const r = 14 + 46 * power * easeOut(k);\n        glowFill(ctx, circlePath(x, y, r * 0.35), '#ffffff', (1 - k) * 0.7);\n        neonStroke(ctx, circlePath(x, y, r), color, 3 * (1 - k), 1.2);\n      },\n    });\n  }\n\n  /** 招式命中的放射線（漫畫集中線的霓虹版） */\n  rays(x, y, color, count = 10, len = 80, life = 0.24) {\n    const seed = rand(TAU);\n    this.effect({\n      life, layer: 'back',\n      draw: (ctx, k) => {\n        const a0 = 1 - k;\n        ctx.save();\n        ctx.globalCompositeOperation = 'lighter';\n        for (let i = 0; i < count; i++) {\n          const a = seed + (TAU * i) / count;\n          const r0 = 10 + len * 0.5 * k;\n          const r1 = r0 + len * (0.5 + 0.5 * k);\n          ctx.strokeStyle = withAlpha(color, 0.5 * a0);\n          ctx.lineWidth = 3 * a0;\n          ctx.beginPath();\n          ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0);\n          ctx.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1);\n          ctx.stroke();\n        }\n        ctx.restore();\n      },\n    });\n  }\n\n  ring(x, y, color, opts = {}) {\n    const { r0 = 10, r1 = 120, life = 0.35, width = 4, layer = 'front', squash = 1 } = opts;\n    this.effect({\n      life, layer,\n      draw: (ctx, k) => {\n        const r = r0 + (r1 - r0) * easeOut(k);\n        ctx.save();\n        ctx.translate(x, y);\n        ctx.scale(1, squash);\n        neonStroke(ctx, circlePath(0, 0, r), color, width * (1 - k), 1.3);\n        ctx.restore();\n      },\n    });\n  }\n\n  slash(x, y, color, opts = {}) {\n    const { r = 70, a0 = -1.1, a1 = 1.1, width = 16, life = 0.22, layer = 'front' } = opts;\n    this.effect({\n      life, layer,\n      draw: (ctx, k) => {\n        const rr = r * (0.82 + 0.3 * k);\n        glowFill(ctx, crescentPath(x, y, rr, a0, a1, width * (1 - k * 0.5)), color, 0.9 * (1 - k));\n        glowFill(ctx, crescentPath(x, y, rr, a0 + 0.1, a1 - 0.1, width * 0.3 * (1 - k)), '#ffffff', 0.8 * (1 - k));\n      },\n    });\n  }\n\n  /** 角色殘影：把骨架的一瞬間留在原地淡出 */\n  afterimage(drawFn, color, life = 0.26) {\n    this.effect({\n      life, layer: 'back',\n      draw: (ctx, k) => {\n        ctx.save();\n        ctx.globalAlpha = (1 - k) * 0.55;\n        ctx.globalCompositeOperation = 'lighter';\n        drawFn(ctx, color);\n        ctx.restore();\n      },\n    });\n  }\n\n  dust(x, y, dirX = 0, amount = 8, color = '#9fb4ff') {\n    this.burst(x, y, color, {\n      count: amount, speed: 140, dir: dirX === 0 ? -Math.PI / 2 : (dirX > 0 ? 0 : Math.PI),\n      spread: dirX === 0 ? Math.PI : 1.2, size: 3, life: 0.4, g: 500, layer: 'back',\n    });\n  }\n\n  damageNumber(x, y, value, color = '#ffffff', big = false) {\n    this.texts.push({\n      x: x + rand(-10, 10), y, vx: rand(-24, 24), vy: -150,\n      t: 0, life: 0.7, str: Math.round(value).toString(),\n      color, size: big ? 34 : 22,\n    });\n  }\n\n  floatText(x, y, str, color = '#ffffff', size = 22) {\n    this.texts.push({ x, y, vx: 0, vy: -110, t: 0, life: 0.8, str, color, size });\n  }\n\n  effect(e) {\n    this.effects.push({ t: 0, layer: 'front', ...e });\n  }\n\n  // ---------------------------------------------------------------- 更新\n  update(dt) {\n    this.time += dt;\n    if (this.shakeT > 0) this.shakeT = Math.max(0, this.shakeT - dt);\n    this.flash = Math.max(0, this.flash - dt * 3.2);\n\n    for (let i = this.parts.length - 1; i >= 0; i--) {\n      const p = this.parts[i];\n      p.t += dt;\n      if (p.t >= p.life) { this.parts.splice(i, 1); continue; }\n      p.vy += p.g * dt;\n      p.vx *= Math.pow(p.drag, dt * 60);\n      p.vy *= Math.pow(p.drag, dt * 60);\n      p.x += p.vx * dt;\n      p.y += p.vy * dt;\n      p.rot += p.spin * dt;\n    }\n    for (let i = this.effects.length - 1; i >= 0; i--) {\n      const e = this.effects[i];\n      e.t += dt;\n      if (e.update) e.update(dt, e);\n      if (e.t >= e.life) this.effects.splice(i, 1);\n    }\n    for (let i = this.texts.length - 1; i >= 0; i--) {\n      const s = this.texts[i];\n      s.t += dt;\n      if (s.t >= s.life) { this.texts.splice(i, 1); continue; }\n      s.vy += 300 * dt;\n      s.x += s.vx * dt;\n      s.y += s.vy * dt;\n    }\n  }\n\n  // ---------------------------------------------------------------- 繪製\n  drawParticles(ctx, layer) {\n    ctx.save();\n    ctx.globalCompositeOperation = 'lighter';\n    for (const p of this.parts) {\n      if (p.layer !== layer) continue;\n      const k = p.t / p.life;\n      const a = 1 - k;\n      const s = p.size * (p.shape === 'dot' ? 1 - k * 0.4 : 1);\n      ctx.globalAlpha = a;\n      ctx.fillStyle = p.color;\n      if (p.shape === 'hex') {\n        ctx.fill(ngonPath(p.x, p.y, s, 6, p.rot));\n      } else if (p.shape === 'shard') {\n        ctx.fill(polyPath([\n          { x: p.x + Math.cos(p.rot) * s * 2, y: p.y + Math.sin(p.rot) * s * 2 },\n          { x: p.x + Math.cos(p.rot + 2.4) * s, y: p.y + Math.sin(p.rot + 2.4) * s },\n          { x: p.x + Math.cos(p.rot - 2.4) * s, y: p.y + Math.sin(p.rot - 2.4) * s },\n        ]));\n      } else if (p.shape === 'line') {\n        ctx.strokeStyle = p.color;\n        ctx.lineWidth = s * 0.6;\n        ctx.beginPath();\n        ctx.moveTo(p.x, p.y);\n        ctx.lineTo(p.x - p.vx * 0.02, p.y - p.vy * 0.02);\n        ctx.stroke();\n      } else {\n        ctx.fill(circlePath(p.x, p.y, s));\n      }\n    }\n    ctx.restore();\n  }\n\n  draw(ctx, layer) {\n    for (const e of this.effects) {\n      if (e.layer !== layer) continue;\n      ctx.save();\n      e.draw(ctx, clamp(e.t / e.life, 0, 1), e);\n      ctx.restore();\n    }\n    this.drawParticles(ctx, layer);\n    if (layer === 'front') {\n      for (const s of this.texts) {\n        const a = clamp(1 - (s.t / s.life) * 1.3, 0, 1);\n        text(ctx, s.str, s.x, s.y, {\n          size: s.size, color: withAlpha(s.color[0] === '#' ? s.color : '#ffffff', a),\n          align: 'center', weight: 900, shadow: `rgba(0,0,0,${0.6 * a})`,\n        });\n      }\n    }\n  }\n\n  /** 全畫面白閃，在最後一層蓋上去 */\n  drawFlash(ctx, w, h) {\n    if (this.flash <= 0.01) return;\n    ctx.save();\n    ctx.globalCompositeOperation = 'lighter';\n    ctx.globalAlpha = clamp(this.flash, 0, 1);\n    ctx.fillStyle = this.flashColor;\n    ctx.fillRect(0, 0, w, h);\n    ctx.restore();\n  }\n}\n\nexport const randomSpin = () => rand(-6, 6);\nexport const someInt = randInt;\n","gfx.js":"// 霓虹繪圖工具組。\n//\n// 全遊戲的視覺語言只有一條規則：**深色實心 + 霓虹描邊 + 加法光暈**。\n// 光暈不用 ctx.shadowBlur（在低階裝置上很貴），改成「同一條路徑描三次」：\n// 最外圈粗而淡、中圈中等、最內圈是亮芯，疊出發光管的感覺。\n\nimport { withAlpha } from './util.js';\n\nexport const TAU = Math.PI * 2;\n\n// ------------------------------------------------------------------ 路徑\nexport function polyPath(pts, close = true) {\n  const p = new Path2D();\n  if (!pts.length) return p;\n  p.moveTo(pts[0].x, pts[0].y);\n  for (let i = 1; i < pts.length; i++) p.lineTo(pts[i].x, pts[i].y);\n  if (close) p.closePath();\n  return p;\n}\n\nexport function linePath(...pts) {\n  return polyPath(pts, false);\n}\n\nexport function circlePath(x, y, r) {\n  const p = new Path2D();\n  p.arc(x, y, Math.max(0.01, r), 0, TAU);\n  return p;\n}\n\nexport function arcPath(x, y, r, a0, a1) {\n  const p = new Path2D();\n  p.arc(x, y, Math.max(0.01, r), a0, a1);\n  return p;\n}\n\n/** 錐形肢體：從 a 到 b，兩端寬度可不同，是角色身上所有骨架的基本形 */\nexport function taperPath(ax, ay, bx, by, w1, w2 = w1 * 0.7) {\n  const dx = bx - ax, dy = by - ay;\n  const len = Math.hypot(dx, dy) || 1;\n  const nx = -dy / len, ny = dx / len;\n  return polyPath([\n    { x: ax + nx * w1, y: ay + ny * w1 },\n    { x: bx + nx * w2, y: by + ny * w2 },\n    { x: bx - nx * w2, y: by - ny * w2 },\n    { x: ax - nx * w1, y: ay - ny * w1 },\n  ]);\n}\n\n/** 正多邊形（六角形＝這套美術的招牌形狀） */\nexport function ngonPath(x, y, r, sides = 6, rot = 0) {\n  const pts = [];\n  for (let i = 0; i < sides; i++) {\n    const a = rot + (TAU * i) / sides;\n    pts.push({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r });\n  }\n  return polyPath(pts);\n}\n\nexport function starPath(x, y, points, outer, inner, rot = 0) {\n  const pts = [];\n  for (let i = 0; i < points * 2; i++) {\n    const a = rot + (Math.PI * i) / points;\n    const r = i % 2 === 0 ? outer : inner;\n    pts.push({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r });\n  }\n  return polyPath(pts);\n}\n\n/** 新月形斬擊：沿圓弧鋪一條中間厚、兩端尖的帶子 */\nexport function crescentPath(cx, cy, r, a0, a1, width, steps = 20) {\n  const outer = [], inner = [];\n  for (let i = 0; i <= steps; i++) {\n    const t = i / steps;\n    const a = a0 + (a1 - a0) * t;\n    const w = width * Math.pow(Math.sin(t * Math.PI), 0.6);\n    const c = Math.cos(a), s = Math.sin(a);\n    outer.push({ x: cx + c * (r + w), y: cy + s * (r + w) });\n    inner.push({ x: cx + c * (r - w), y: cy + s * (r - w) });\n  }\n  inner.reverse();\n  return polyPath(outer.concat(inner));\n}\n\n/** 鋸齒線（電流、裂縫） */\nexport function joltPath(ax, ay, bx, by, segs = 8, amp = 10, rng = Math.random) {\n  const pts = [{ x: ax, y: ay }];\n  const dx = bx - ax, dy = by - ay;\n  const len = Math.hypot(dx, dy) || 1;\n  const nx = -dy / len, ny = dx / len;\n  for (let i = 1; i < segs; i++) {\n    const t = i / segs;\n    const o = (rng() * 2 - 1) * amp * Math.sin(t * Math.PI);\n    pts.push({ x: ax + dx * t + nx * o, y: ay + dy * t + ny * o });\n  }\n  pts.push({ x: bx, y: by });\n  return polyPath(pts, false);\n}\n\n// ------------------------------------------------------------------ 上色\n/** 霓虹描邊：外光暈 → 主色 → 亮芯 */\nexport function neonStroke(ctx, path, color, width = 4, glow = 1) {\n  ctx.lineJoin = 'round';\n  ctx.lineCap = 'round';\n  if (glow > 0) {\n    ctx.globalCompositeOperation = 'lighter';\n    ctx.lineWidth = width * 4.2;\n    ctx.strokeStyle = withAlpha(color, 0.07 * glow);\n    ctx.stroke(path);\n    ctx.lineWidth = width * 2.1;\n    ctx.strokeStyle = withAlpha(color, 0.16 * glow);\n    ctx.stroke(path);\n    ctx.globalCompositeOperation = 'source-over';\n  }\n  ctx.lineWidth = width;\n  ctx.strokeStyle = color;\n  ctx.stroke(path);\n  if (width > 2.4) {\n    ctx.lineWidth = width * 0.3;\n    ctx.strokeStyle = 'rgba(255,255,255,0.8)';\n    ctx.stroke(path);\n  }\n}\n\n/** 深色實心 + 霓虹邊：角色身上每一塊板子都用這個 */\nexport function neonPlate(ctx, path, color, opts = {}) {\n  const { core = '#0a0c18', width = 3, glow = 1, alpha = 1 } = opts;\n  ctx.save();\n  ctx.globalAlpha = alpha;\n  ctx.fillStyle = core;\n  ctx.fill(path);\n  neonStroke(ctx, path, color, width, glow);\n  ctx.restore();\n}\n\n/** 純發光填色（特效用，走加法混色） */\nexport function glowFill(ctx, path, color, alpha = 0.8, bloom = 1) {\n  ctx.save();\n  ctx.globalCompositeOperation = 'lighter';\n  if (bloom > 0) {\n    ctx.globalAlpha = alpha * 0.25 * bloom;\n    ctx.fillStyle = color;\n    ctx.fill(path);\n  }\n  ctx.globalAlpha = alpha;\n  ctx.fillStyle = color;\n  ctx.fill(path);\n  ctx.restore();\n}\n\n/** 畫一段文字（街機字重＋陰影），回傳量到的寬度 */\nexport function text(ctx, str, x, y, opts = {}) {\n  const {\n    size = 20, color = '#e7ecff', align = 'left', weight = 700,\n    shadow = 'rgba(0,0,0,.75)', letter = 0, baseline = 'alphabetic', glow = 0,\n  } = opts;\n  ctx.save();\n  ctx.font = `${weight} ${size}px \"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",system-ui,sans-serif`;\n  ctx.textAlign = align;\n  ctx.textBaseline = baseline;\n  if (letter && ctx.letterSpacing !== undefined) ctx.letterSpacing = `${letter}px`;\n  if (glow > 0) {\n    ctx.globalCompositeOperation = 'lighter';\n    ctx.fillStyle = withAlpha(typeof color === 'string' && color[0] === '#' ? color : '#ffffff', 0.25 * glow);\n    ctx.fillText(str, x, y);\n    ctx.globalCompositeOperation = 'source-over';\n  }\n  if (shadow) {\n    ctx.fillStyle = shadow;\n    ctx.fillText(str, x + 2, y + 2);\n  }\n  ctx.fillStyle = color;\n  ctx.fillText(str, x, y);\n  const w = ctx.measureText(str).width;\n  ctx.restore();\n  return w;\n}\n\nexport function measure(ctx, str, size = 20, weight = 700) {\n  ctx.save();\n  ctx.font = `${weight} ${size}px \"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",system-ui,sans-serif`;\n  const w = ctx.measureText(str).width;\n  ctx.restore();\n  return w;\n}\n\n/** 面板：半透明深色底 + 霓虹外框，所有 UI 共用 */\nexport function panel(ctx, x, y, w, h, color = '#4de2ff', opts = {}) {\n  const { fill = 'rgba(8,10,22,0.86)', width = 2, glow = 0.8, cut = 12 } = opts;\n  const p = new Path2D();\n  p.moveTo(x + cut, y);\n  p.lineTo(x + w, y);\n  p.lineTo(x + w, y + h - cut);\n  p.lineTo(x + w - cut, y + h);\n  p.lineTo(x, y + h);\n  p.lineTo(x, y + cut);\n  p.closePath();\n  ctx.fillStyle = fill;\n  ctx.fill(p);\n  neonStroke(ctx, p, color, width, glow);\n  return p;\n}\n","hud.js":"// 對戰 HUD：血條、氣條、計時、回合數、技能冷卻、連段數與大字幕。\n\nimport { panel, text, measure, neonStroke, glowFill, circlePath, ngonPath, polyPath, linePath } from './gfx.js';\nimport { WORLD } from './render.js';\nimport { clamp, withAlpha, lerp } from './util.js';\nimport { MAX_METER } from './combat.js';\nimport { WINS_NEEDED } from './battle.js';\n\n/** 畫面寬度（世界比畫面寬，選單與 HUD 都用畫面座標） */\nconst VIEW = WORLD.view;\n\nconst BAR_W = 470;\nconst BAR_H = 26;\n\nconst ghost = [1, 1];\n\nexport function drawHud(ctx, battle, opts = {}) {\n  const { localSides = [0] } = opts;\n  const t = battle.time;\n\n  battle.fighters.forEach((f, i) => {\n    const ratio = clamp(f.hp / f.maxHp, 0, 1);\n    ghost[i] = ghost[i] < ratio ? ratio : Math.max(ratio, ghost[i] - 0.006);\n    drawFighterBar(ctx, f, i, ratio, ghost[i], battle, t);\n  });\n\n  drawTimer(ctx, battle);\n\n  // 本機玩家的技能格（雙人同機時兩邊都畫）\n  localSides.forEach((side, idx) => {\n    const f = battle.fighters[side];\n    if (!f) return;\n    const x = localSides.length > 1 ? (side === 0 ? 150 : VIEW - 150 - 330) : VIEW / 2 - 165;\n    drawSkillBar(ctx, f, x, WORLD.h - 92, t);\n  });\n\n  if (battle.comboT > 0 && battle.comboShown >= 3) {\n    const side = battle.comboSide;\n    const f = battle.fighters[side];\n    const x = side === 0 ? 210 : VIEW - 210;\n    const a = clamp(battle.comboT, 0, 1);\n    const pop = 1 + Math.max(0, 0.25 - (1.2 - battle.comboT)) * 2;\n    ctx.save();\n    ctx.translate(x, 210);\n    ctx.scale(pop, pop);\n    text(ctx, `${battle.comboShown}`, 0, 0, {\n      size: 54, color: withAlpha(f.char.accent, a), align: 'center', weight: 900, glow: 1,\n    });\n    text(ctx, 'COMBO', 0, 26, { size: 18, color: withAlpha('#ffffff', a * 0.8), align: 'center' });\n    ctx.restore();\n  }\n\n  drawBanner(ctx, battle);\n  if (battle.state === 'intro') drawCountdown(ctx, battle);\n}\n\nfunction drawFighterBar(ctx, f, side, ratio, ghostRatio, battle, t) {\n  const right = side === 1;\n  const x = right ? VIEW - 40 - BAR_W : 40;\n  const y = 42;\n  const c = f.char.color;\n\n  // 外框\n  const frame = polyPath(right ? [\n    { x: x + BAR_W, y }, { x: x + BAR_W, y: y + BAR_H },\n    { x: x + 16, y: y + BAR_H }, { x, y: y + BAR_H / 2 }, { x: x + 16, y },\n  ] : [\n    { x, y }, { x: x + BAR_W - 16, y }, { x: x + BAR_W, y: y + BAR_H / 2 },\n    { x: x + BAR_W - 16, y: y + BAR_H }, { x, y: y + BAR_H },\n  ]);\n  ctx.fillStyle = 'rgba(6,8,18,0.9)';\n  ctx.fill(frame);\n\n  // 血量（受傷後殘影條先退）\n  ctx.save();\n  ctx.clip(frame);\n  const gw = BAR_W * ghostRatio;\n  const hw = BAR_W * ratio;\n  ctx.fillStyle = 'rgba(255,90,120,0.55)';\n  ctx.fillRect(right ? x + BAR_W - gw : x, y, gw, BAR_H);\n  const grad = ctx.createLinearGradient(x, 0, x + BAR_W, 0);\n  grad.addColorStop(0, right ? c : withAlpha(c, 0.75));\n  grad.addColorStop(1, right ? withAlpha(c, 0.75) : c);\n  ctx.fillStyle = grad;\n  ctx.fillRect(right ? x + BAR_W - hw : x, y, hw, BAR_H);\n  // 斜線紋理\n  ctx.globalAlpha = 0.16;\n  ctx.strokeStyle = '#000';\n  ctx.lineWidth = 6;\n  for (let i = -BAR_H; i < BAR_W + BAR_H; i += 16) {\n    ctx.beginPath();\n    ctx.moveTo(x + i, y + BAR_H);\n    ctx.lineTo(x + i + BAR_H, y);\n    ctx.stroke();\n  }\n  ctx.restore();\n  neonStroke(ctx, frame, c, 2, 0.9);\n\n  // 氣條\n  const my = y + BAR_H + 6;\n  const mw = BAR_W * 0.62;\n  const mx = right ? x + BAR_W - mw : x;\n  ctx.fillStyle = 'rgba(6,8,18,0.9)';\n  ctx.fillRect(mx, my, mw, 9);\n  const meter = clamp(f.meter / MAX_METER, 0, 1);\n  const full = meter >= 1;\n  ctx.fillStyle = full ? '#fff27a' : withAlpha(f.char.accent, 0.9);\n  const fw = mw * meter;\n  ctx.fillRect(right ? mx + mw - fw : mx, my, fw, 9);\n  if (full) {\n    ctx.save();\n    ctx.globalCompositeOperation = 'lighter';\n    ctx.globalAlpha = 0.4 + 0.3 * Math.sin(t * 8);\n    ctx.fillStyle = '#fff27a';\n    ctx.fillRect(mx, my - 2, mw, 13);\n    ctx.restore();\n    text(ctx, '必殺 READY', right ? mx + mw : mx, my + 30, {\n      size: 13, color: '#fff27a', align: right ? 'right' : 'left', glow: 1,\n    });\n  }\n\n  // 名牌\n  const label = `${f.char.name}`;\n  const sub = `${f.char.en}・${f.char.title}`;\n  text(ctx, label, right ? x + BAR_W : x, y - 10, {\n    size: 22, color: c, align: right ? 'right' : 'left', glow: 0.6,\n  });\n  const lw = measure(ctx, label, 22);\n  text(ctx, sub, right ? x + BAR_W - lw - 10 : x + lw + 10, y - 11, {\n    size: 12, color: '#93a0cc', align: right ? 'right' : 'left',\n  });\n\n  // 回合勝利點數\n  for (let i = 0; i < WINS_NEEDED; i++) {\n    const px = right ? x + BAR_W - 12 - i * 22 : x + 12 + i * 22;\n    const won = battle.roundWins[side] > i;\n    const p = circlePath(px, y + BAR_H + 30, 7);\n    ctx.fillStyle = won ? c : 'rgba(255,255,255,0.10)';\n    ctx.fill(p);\n    neonStroke(ctx, p, won ? c : '#4a5480', 1.6, won ? 1 : 0);\n  }\n\n  // 狀態圖示\n  const chips = [];\n  if (f.burn > 0) chips.push(['灼燒', '#ff7a3c']);\n  if (f.freeze > 0) chips.push(['凍結', '#9be8ff']);\n  if (f.shockTime > 0) chips.push(['麻痺', '#fff27a']);\n  if (f.poison > 0) chips.push([`毒 ${f.poison}`, '#b46bff']);\n  if (f.slow > 0) chips.push(['減速', '#9fb4ff']);\n  if (f.dr > 0 && f.drTime > 0) chips.push(['護盾', '#7ef1ff']);\n  chips.slice(0, 4).forEach((chip, i) => {\n    const w = 58;\n    const cx = right ? x + BAR_W - w - i * (w + 6) : x + i * (w + 6);\n    const cy = y + BAR_H + 44;\n    ctx.fillStyle = withAlpha(chip[1], 0.18);\n    ctx.fillRect(cx, cy, w, 18);\n    ctx.strokeStyle = withAlpha(chip[1], 0.7);\n    ctx.lineWidth = 1;\n    ctx.strokeRect(cx + 0.5, cy + 0.5, w - 1, 17);\n    text(ctx, chip[0], cx + w / 2, cy + 13, { size: 11, color: chip[1], align: 'center' });\n  });\n}\n\nfunction drawTimer(ctx, battle) {\n  const cx = VIEW / 2;\n  const secs = Math.ceil(battle.timer);\n  const urgent = secs <= 10 && battle.state === 'fight';\n  const hex = ngonPath(cx, 64, 46, 6, Math.PI / 6);\n  ctx.fillStyle = 'rgba(6,8,18,0.92)';\n  ctx.fill(hex);\n  neonStroke(ctx, hex, urgent ? '#ff4d6d' : '#7ef1ff', 2.2, 1);\n  text(ctx, String(secs).padStart(2, '0'), cx, 76, {\n    size: 40, color: urgent ? '#ff8095' : '#ffffff', align: 'center', weight: 900,\n    glow: urgent ? 1.4 : 0.4,\n  });\n  text(ctx, `ROUND ${battle.round}`, cx, 122, { size: 13, color: '#93a0cc', align: 'center' });\n}\n\nfunction drawSkillBar(ctx, f, x, y, t) {\n  const slots = [\n    { key: 'U', s: f.char.skills[0], cd: f.cds[0], max: f.char.skills[0].cd },\n    { key: 'I', s: f.char.skills[1], cd: f.cds[1], max: f.char.skills[1].cd },\n    { key: 'O', s: f.char.ult, cd: 0, max: 0, ult: true },\n  ];\n  slots.forEach((slot, i) => {\n    const sx = x + i * 112;\n    const w = 100, h = 62;\n    const ready = slot.ult ? f.meter >= MAX_METER : slot.cd <= 0;\n    const col = slot.ult ? '#fff27a' : f.char.color;\n    panel(ctx, sx, y, w, h, ready ?
